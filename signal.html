<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F&O Screener Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ===================== PREMIUM ENTRY SCREEN ===================== */

#entryOverlay{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#0f172a 0%,#020617 60%),
linear-gradient(180deg,#020617,#000);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:28px;
z-index:999999;
text-align:center;
}

#entryOverlay h2{
font-size:30px;
font-weight:800;
letter-spacing:.04em;
color:#e5e7eb;
}

.entry-actions{
display:flex;
flex-direction:column;
gap:16px;
width:280px;
}

.entry-btn{
padding:14px 22px;
border-radius:999px;
border:none;
font-weight:700;
font-size:14px;
letter-spacing:.04em;
cursor:pointer;
transition:.18s ease;
}

/* green primary */
.entry-btn.primary{
background:linear-gradient(135deg,#22c55e,#16a34a);
box-shadow:0 14px 30px rgba(34,197,94,.35);
}
.entry-btn.primary:hover{
transform:translateY(-2px);
box-shadow:0 20px 44px rgba(34,197,94,.55);
}

/* dark secondary */
.entry-btn.secondary{
background:linear-gradient(135deg,#1f2937,#020617);
border:1px solid rgba(148,163,184,.45);
color:#e5e7eb;
}
.entry-btn.secondary:hover{
background:#e5e7eb;
color:#020617;
transform:translateY(-2px);
}

/* ================= ORIGINAL FILE BELOW — UNCHANGED ================= */

body {
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background: radial-gradient(circle at top left, #1f2937 0, #020617 55%);
color: #e5e7eb;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.shell {
width: 100%;
max-width: 960px;
background: rgba(15,23,42,0.95);
border-radius: 18px;
box-shadow:
0 18px 45px rgba(0,0,0,0.7),
0 0 0 1px rgba(148,163,184,0.25);
padding: 22px 22px 18px;
backdrop-filter: blur(16px);
}

.shell-header {
display: flex;
justify-content: space-between;
align-items: center;
gap: 16px;
margin-bottom: 18px;
border-bottom: 1px solid rgba(55,65,81,0.7);
padding-bottom: 10px;
}

.title-block{display:flex;flex-direction:column;gap:4px}
.app-title{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.app-sub{font-size:12px;color:#9ca3af}

.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-item{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid rgba(148,163,184,.6);color:#e5e7eb;text-decoration:none;background:rgba(15,23,42,.7)}
.nav-item:hover{background:#e5e7eb;color:#020617}
.nav-active{cursor:default;background:linear-gradient(135deg,#22c55e,#16a34a);color:#020617;font-weight:700;border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:8px}

.card{position:relative;border-radius:14px;padding:14px;background:radial-gradient(circle at top left,rgba(15,118,110,.28),rgba(15,23,42,.95));border:1px solid rgba(148,163,184,.4);display:flex;flex-direction:column;justify-content:space-between;min-height:140px}

.card--accent-1{background:radial-gradient(circle at top left,rgba(22,163,74,.3),rgba(15,23,42,.95));border-color:rgba(34,197,94,.6)}
.card--accent-2{background:radial-gradient(circle at top left,rgba(59,130,246,.3),rgba(15,23,42,.95));border-color:rgba(59,130,246,.6)}
.card--accent-3{background:radial-gradient(circle at top left,rgba(249,115,22,.3),rgba(15,23,42,.95));border-color:rgba(249,115,22,.6)}

.open-btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:6px;
padding:6px 10px;
border-radius:999px;
border:1px solid rgba(148,163,184,.7);
background:rgba(15,23,42,.9);
color:#e5e7eb;
font-size:12px;
font-weight:600;
text-decoration:none;
cursor:pointer;
transition:.12s;
}

.open-btn:hover{
background:#e5e7eb;
color:#020617;
border-color:transparent;
}

/* ================= END ORIGINAL ================= */
</style>
</head>

<body>

<!-- ================= PREMIUM ENTRY SCREEN ================= -->

<div id="entryOverlay">
<h2>Enter Dashboard</h2>

<div class="entry-actions">
<button class="entry-btn primary"
onclick="location.href='index.html'">
Visit Fast Scan Page
</button>

<button class="entry-btn secondary"
onclick="enterPage()">
Stay on Same Page
</button>
</div>
</div>

<!-- ================= ORIGINAL CONTENT ================= -->

<div class="shell">

<header class="shell-header">
<div class="title-block">
<div class="app-title">F&O Screener Hub</div>
<div class="app-sub">Bank / IT | Intraday options | Futures OI spurts</div>
</div>

<div class="nav-links">
<span class="nav-item nav-active">ACTIVE-1</span>
<a class="nav-item"
href="https://screener-git-main-sumantasahoos-projects.vercel.app/index.html">
LINK-2
</a>
<a class="nav-item"
href="https://screener-epd.pages.dev/">
LINK-3
</a>
</div>
</header>

<main class="grid">

<section class="card card--accent-1">
<div>
<h3>Screener 1</h3>
<p>Primary intraday dashboard.</p>
</div>
<a class="open-btn"
href="https://sumantasahoo-screener.github.io/Screener/public/signal.html"
target="_blank">Open ↗</a>
</section>

<section class="card card--accent-2">
<div>
<h3>Screener 2</h3>
<p>Secondary intraday dashboard.</p>
</div>
<a class="open-btn"
href="https://sumantasahoo-screener.github.io/Screener/public/signal2.html"
target="_blank">Open ↗</a>
</section>

<section class="card card--accent-3">
<div>
<h3>Spurt Data</h3>
<p>Futures OI tracker.</p>
</div>
<a class="open-btn"
href="https://sumantasahoo-screener.github.io/Screener/public/SpurtsSignal_Final.html"
target="_blank">Open ↗</a>
</section>

</main>

</div>

<script>
function enterPage(){
document.getElementById("entryOverlay").remove();
}
</script>

</body>
</html>
