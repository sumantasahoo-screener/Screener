<!DOCTYPE html>
<html lang="en" data-theme="teal-dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>F&O Screener Hub | Premium</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ===== PREMIUM THEME VARIABLES (Your Specific Colors) ===== */
html[data-theme="teal-dark"] {
  --bg-primary: #02292E;
  --bg-secondary: #011d21;
  --bg-tertiary: #011a1d;
  --bg-overlay: rgba(2, 41, 46, 0.85);
  --bg-sidebar: rgba(1, 26, 29, 0.9);
  --text-primary: #C5E2E6;
  --text-secondary: rgba(197, 226, 230, 0.8);
  --text-tertiary: rgba(197, 226, 230, 0.5);
  --border-color: rgba(197, 226, 230, 0.15);
  --accent-blue: #026773;
  --accent-green: #34d399;
}

html[data-theme="teal-medium"] {
  --bg-primary: #026773;
  --bg-secondary: #025a65;
  --bg-tertiary: #014d56;
  --bg-overlay: rgba(2, 103, 115, 0.9);
  --bg-sidebar: rgba(1, 77, 86, 0.9);
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.8);
  --text-tertiary: rgba(255, 255, 255, 0.6);
  --border-color: rgba(255, 255, 255, 0.2);
  --accent-blue: #C5E2E6;
}

html[data-theme="light-mist"] {
  --bg-primary: #C5E2E6;
  --bg-secondary: #b0d2d6;
  --bg-tertiary: #a1c4c8;
  --bg-overlay: rgba(197, 226, 230, 0.9);
  --bg-sidebar: rgba(218, 239, 241, 0.9);
  --text-primary: #02292E;
  --text-secondary: #026773;
  --text-tertiary: rgba(2, 41, 46, 0.6);
  --border-color: rgba(2, 41, 46, 0.15);
  --accent-blue: #026773;
}

body{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  transition: background 0.3s ease;
}

/* ===== LAYOUT & NAVBAR ===== */
.main-layout { display: flex; min-height: 100vh; }
.main-layout.fullscreen-mode { flex-direction: column; }

.top-navbar {
  position: fixed; top: 0; left: 0; right: 0; height: 70px;
  background: var(--bg-overlay); backdrop-filter: blur(20px);
  border-bottom: 2px solid var(--accent-blue);
  display: flex; align-items: center; padding: 0 20px; z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.top-navbar.fullscreen-hidden { display: none; }

.navbar-logo { display: flex; align-items: center; gap: 12px; flex: 1; }
.navbar-logo img { height: 50px; }
.navbar-title {
  font-size: 18px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, var(--text-primary), var(--accent-blue));
  -webkit-background-clip: text; color: transparent; text-transform: uppercase;
}

/* ===== SIDEBAR PREMIUM SECTIONS ===== */
.sidebar {
  position: fixed; left: 0; top: 70px; width: 250px;
  height: calc(100vh - 70px); background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  overflow-y: auto; z-index: 99; transition: transform 0.3s ease;
}

.sidebar.fullscreen-hidden { display: none; }

.menu-section {
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 5px;
}

.menu-label {
  font-size: 9px; font-weight: 800; letter-spacing: 2px;
  color: var(--text-tertiary); padding: 15px 20px 5px;
  text-transform: uppercase; display: block;
}

.menu-btn {
  width: 100%; padding: 12px 20px; background: none; border: none;
  text-align: left; font-size: 14px; font-weight: 600;
  color: var(--text-secondary); cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}

.menu-btn:hover { background: rgba(2, 103, 115, 0.2); color: var(--text-primary); }

.menu-arrow { transition: transform 0.3s; font-size: 10px; color: var(--accent-blue); }
.menu-arrow.open { transform: rotate(180deg); }

/* ===== SUBMENU & LINKS (Right Click Ready) ===== */
.submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(0,0,0,0.05); }
.submenu.open { max-height: 800px; }

.submenu-item, .external-item {
  display: block; padding: 10px 20px 10px 40px;
  font-size: 13px; color: var(--text-secondary);
  text-decoration: none; transition: 0.2s;
}

.submenu-item:hover { color: var(--text-primary); background: var(--accent-blue); padding-left: 45px; }

.submenu-item.active {
  color: var(--text-primary); font-weight: 700;
  background: rgba(2, 103, 115, 0.3);
  border-left: 4px solid var(--accent-blue);
}

/* ===== MAIN CONTENT ===== */
.main-content {
  margin-left: 250px; margin-top: 70px; flex: 1;
  width: calc(100% - 250px); transition: all 0.3s ease;
}

.main-content.fullscreen { margin-left: 0; margin-top: 0; width: 100%; height: 100vh; }

.content-wrapper { width: 100%; height: calc(100vh - 70px); display: flex; flex-direction: column; }
.main-content.fullscreen .content-wrapper { height: 100vh; }

.content-frame { flex: 1; width: 100%; border: none; background: #fff; }

/* ===== FLOATING FULLSCREEN BUTTON ===== */
.floating-fullscreen-btn {
  display: none; position: fixed; z-index: 101;
  background: var(--accent-blue); border: none; color: #fff;
  cursor: pointer; border-radius: 12px; padding: 10px 15px;
  font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.floating-fullscreen-btn.visible { display: block; bottom: 20px; right: 20px; }

/* ===== THEME SELECTOR ===== */
.theme-selector { display: flex; gap: 8px; margin-left: auto; margin-right: 15px; }
.theme-dot {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; cursor: pointer;
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.mobile-open { transform: translateX(0); }
  .main-content { margin-left: 0; width: 100%; }
}
</style>
</head>

<body>
<div class="main-layout" id="main-layout">

  <button class="floating-fullscreen-btn" id="floating-btn" title="Toggle Fullscreen">⛶</button>

  <nav class="top-navbar" id="top-navbar">
    <button id="hamburger" style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-primary); margin-right:15px;">☰</button>
    <div class="navbar-logo">
      <img src="https://sumantasahoo-screener.github.io/Screener/LOGO.png" alt="Logo">
      <span class="navbar-title">F&O Screener</span>
    </div>
    
    <div class="theme-selector">
      <div class="theme-dot" style="background:#02292E" onclick="changeTheme('teal-dark')"></div>
      <div class="theme-dot" style="background:#026773" onclick="changeTheme('teal-medium')"></div>
      <div class="theme-dot" style="background:#C5E2E6" onclick="changeTheme('light-mist')"></div>
    </div>

    <div style="background:rgba(52, 211, 153, 0.1); color:#34d399; padding:8px 15px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid rgba(52, 211, 153, 0.3)">LIVE SCAN</div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="menu-section">
      <label class="menu-label">⚡ Scalper</label>
      <button class="menu-btn" onclick="toggleSub(this, 'scalper-sub')">Scalper <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="scalper-sub">
        <a href="https://screener-epd.pages.dev/public/signal" class="submenu-item">Banking Scalper</a>
        <a href="https://screener-epd.pages.dev/public/signal3" class="submenu-item">Nifty Scalper</a>
        <a href="https://screener-epd.pages.dev/public/adv_dec_heatmap" class="submenu-item">Advance Decline</a>
      </div>
    </div>

    <div class="menu-section">
      <label class="menu-label">📊 OI</label>
      <button class="menu-btn" onclick="toggleSub(this, 'oi-sub')">OI <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="oi-sub">
        <a href="https://screener-epd.pages.dev/public/oi" class="submenu-item">OI Change</a>
        <a href="https://screener-epd.pages.dev/public/oi2" class="submenu-item">OI 2.0</a>
      </div>
    </div>

    <div class="menu-section">
      <label class="menu-label">📈 NSE Data</label>
      <button class="menu-btn" onclick="toggleSub(this, 'nse-sub')">NSE Data <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="nse-sub">
        <a href="https://screener-epd.pages.dev/public/Bhavdata" class="submenu-item">Bhav Copy</a>
        <a href="https://screener-epd.pages.dev/public/volatility_dashboard" class="submenu-item">Volatility Dashboard</a>
        <a href="https://screener-epd.pages.dev/public/SpurtsSignal_Final" class="submenu-item">Spurt Data</a>
        <a href="https://screener-epd.pages.dev/public/SpurtsSignal_UL" class="submenu-item">Spurt UL</a>
      </div>
    </div>

    <div class="menu-section">
      <label class="menu-label">🔄 Swing</label>
      <button class="menu-btn" onclick="toggleSub(this, 'swing-sub')">Swing Data <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="swing-sub">
        <a href="https://screener-epd.pages.dev/public/swing_screener" class="submenu-item">Swing F&O</a>
        <a href="https://screener-epd.pages.dev/public/swing_screener2" class="submenu-item">Swing All</a>
      </div>
    </div>

    <div class="menu-section">
      <label class="menu-label">📰 News</label>
      <button class="menu-btn" onclick="toggleSub(this, 'news-sub')">News <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="news-sub">
        <a href="https://screener-epd.pages.dev/public/news" class="submenu-item">News Terminal</a>
      </div>
    </div>

    <div class="menu-section">
      <label class="menu-label">🔗 External</label>
      <button class="menu-btn" onclick="toggleSub(this, 'ext-sub')">External Links <span class="menu-arrow open">▼</span></button>
      <div class="submenu open" id="ext-sub">
        <a href="https://upstox.com/fno-discovery/open-interest-analysis/nifty-pcr/" class="external-item" target="_blank">PCR Data</a>
        <a href="https://groww.in/indices/global-indices" class="external-item" target="_blank">Global Index</a>
        <a href="https://web.quantsapp.com/signin" class="external-item" target="_blank">Quantsapp</a>
        <a href="https://login.dhan.co/?location=DH_WEB" class="external-item" target="_blank">Dhan</a>
        <a href="https://www.nseindia.com/option-chain" class="external-item" target="_blank">Nifty Option Chain</a>
        <a href="https://nifty-pe-ratio.com" class="external-item" target="_blank">Nifty PE Ratio</a>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content">
    <div class="content-wrapper">
      <iframe src="about:blank" id="main-frame" class="content-frame"></iframe>
    </div>
  </main>

</div>

<script>
const frame = document.getElementById('main-frame');
const sidebar = document.getElementById('sidebar');
const topNav = document.getElementById('top-navbar');
const mainLayout = document.getElementById('main-layout');
const mainContent = document.getElementById('main-content');
const floatBtn = document.getElementById('floating-btn');

// 1. THEME MANAGEMENT
function changeTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('selected-theme', theme);
}
const savedTheme = localStorage.getItem('selected-theme') || 'teal-dark';
changeTheme(savedTheme);

// 2. FULLSCREEN LOGIC
let isFullscreen = false;
floatBtn.onclick = () => {
  isFullscreen = !isFullscreen;
  if (isFullscreen) {
    topNav.classList.add('fullscreen-hidden');
    sidebar.classList.add('fullscreen-hidden');
    mainLayout.classList.add('fullscreen-mode');
    mainContent.classList.add('fullscreen');
  } else {
    topNav.classList.remove('fullscreen-hidden');
    sidebar.classList.remove('fullscreen-hidden');
    mainLayout.classList.remove('fullscreen-mode');
    mainContent.classList.remove('fullscreen');
  }
};

// 3. LINK HANDLING (Left click = Iframe, Right click = New Tab)
document.querySelectorAll('.submenu-item').forEach(link => {
  link.addEventListener('click', function(e) {
    // Only intercept normal left-click
    if (!e.ctrlKey && !e.metaKey && e.button === 0) {
      e.preventDefault();
      frame.src = this.href;
      document.querySelectorAll('.submenu-item').forEach(l => l.classList.remove('active'));
      this.classList.add('active');
      floatBtn.classList.add('visible');
      if (window.innerWidth < 768) sidebar.classList.remove('mobile-open');
    }
  });
});

// 4. MENU TOGGLE (Accordion)
function toggleSub(btn, subId) {
  const sub = document.getElementById(subId);
  const arrow = btn.querySelector('.menu-arrow');
  sub.classList.toggle('open');
  arrow.classList.toggle('open');
}

// 5. MOBILE HAMBURGER
document.getElementById('hamburger').onclick = () => {
  sidebar.classList.toggle('mobile-open');
};
</script>

</body>
</html>
