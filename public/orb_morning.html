<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-ORB Dashboard (5M/15M/30M)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --bull: #10b981;
            --bear: #ef4444;
            --text: #f9fafb;
            --text-dim: #9ca3af;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            background-image: radial-gradient(circle at 50% -10%, #1e1b4b, #030712);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .logo span {
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .main-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            text-align: left;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .row-bull {
            background: rgba(16, 185, 129, 0.05);
        }

        .row-bear {
            background: rgba(239, 68, 68, 0.05);
        }

        .sym-cell {
            display: flex;
            flex-direction: column;
        }

        .sym-name {
            font-weight: 800;
            font-size: 15px;
        }

        .pnl-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
        }

        .pnl-plus {
            background: var(--bull);
            color: #000;
        }

        .pnl-minus {
            background: var(--bear);
            color: #fff;
        }

        #snapshotTime {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        #snapshotTime option {
            background: #1e293b;
            color: #f8fafc;
        }

        .orb-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-block;
            margin-right: 4px;
        }

        .tag-bull {
            background: rgba(16, 185, 129, 0.2);
            color: var(--bull);
            border: 1px solid var(--bull);
        }

        .tag-bear {
            background: rgba(239, 68, 68, 0.2);
            color: var(--bear);
            border: 1px solid var(--bear);
        }

        .tag-none {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
        }

        .pd-alert {
            font-size: 10px;
            font-weight: 800;
            margin-top: 2px;
        }

        #pdh-status {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center;
        }

        #raw-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-body {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                border-radius: 16px;
                align-items: flex-start;
            }

            .controls {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
                white-space: nowrap;
                display: block;
            }

            .controls::-webkit-scrollbar {
                display: none;
            }

            .btn {
                padding: 6px 12px;
                font-size: 11px;
                display: inline-block;
            }

            .logo h1 {
                font-size: 20px;
            }

            th,
            td {
                padding: 8px 10px;
                font-size: 12px;
            }

            .sym-name {
                font-size: 13px;
            }

            .ltp {
                font-size: 14px !important;
            }

            .pnl-badge {
                font-size: 10px;
                padding: 3px 6px;
            }

            /* Hide less critical columns on very small mobile */
            @media (max-width: 480px) {
                th:nth-child(3),
                td:nth-child(3),
                /* 15M Range */
                th:nth-child(4),
                td:nth-child(4)

                /* Prev Day H/L */
                    {
                    display: none;
                }
            }
        }

        /* Log Modal Styles */
        #logModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1001;
        }

        .log-modal-content {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
        }

        .log-table th {
            position: sticky;
            top: 0;
            background: #111827;
            padding: 15px;
            text-align: left;
        }

        .log-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>ORB <span>MASTER</span></h1>
                <div style="font-size: 11px; color: var(--text-dim)">5M | 15M | 30M Breakouts</div>
            </div>
            <div class="controls">
                <button class="btn active" onclick="filterData('all', this)">ALL</button>
                <button class="btn" onclick="filterData('bull', this)">BULL</button>
                <button class="btn" onclick="filterData('bear', this)">BEAR</button>
                <button class="btn" onclick="filterData('pd', this)">PDH/PDL</button>
                <button class="btn" onclick="filterData('orb', this)">ORB ONLY</button>
                <button class="btn" style="border-color:var(--accent); color:var(--accent)" onclick="showLog()">📜
                    HISTORY</button>
                <button class="btn" onclick="manualFetchPDH()" id="btn-pdh">🔄 SYNC PDH</button>
                <button class="btn" id="btn-force" style="background:var(--bear)" onclick="forceRefresh()">⚡ FORCE REFRESH</button>
                <div id="market-time" class="status-badge" onclick="showLog()"
                    style="background:var(--accent); color:#fff; padding:8px 12px; border-radius:12px; font-size:12px; font-weight:700; cursor:pointer; min-width:100px; line-height:1.2">
                    --:--:--</div>
                <div style="display:flex; gap:5px; align-items:center; margin-left:10px">
                    <div id="status-s1" title="Source 1 (gsmmunna)" style="width:8px; height:8px; border-radius:50%; background:#666"></div>
                    <div id="status-s2" title="Source 2 (susanta)" style="width:8px; height:8px; border-radius:50%; background:#666"></div>
                </div>
            </div>
        </header>

        <div id="pdh-status">Loading systems...</div>

        <div class="main-content">
            <table id="orb-table">
                <thead>
                    <tr>
                        <th style="width:20%">Symbol</th>
                        <th>STRENGTH</th>
                        <th>RSI TREND</th>
                        <th>ORB Status (5/15/30)</th>
                        <th>15M Range</th>
                        <th>Prev Day (H/L)</th>
                        <th>LTP</th>
                        <th>Change %</th>
                    </tr>
                </thead>
                <tbody id="main-grid"></tbody>
            </table>
        </div>

        <div id="raw-modal">
            <div class="modal-body">
                <button onclick="document.getElementById('raw-modal').style.display='none'"
                    style="position:absolute; right:20px; top:20px; background:none; border:none; color:var(--bear); font-size:24px; cursor:pointer">&times;</button>
                <h2>PDH/PDL Raw Data</h2>
                <div id="raw-content"></div>
            </div>
        </div>

        <!-- Log Modal -->
        <div id="logModal">
            <div class="log-modal-content" style="max-width:1200px; width:95%">
                <div class="log-header">
                    <div style="display:flex; align-items:center; gap:20px">
                        <h2 style="margin:0">Breakout Event Logs</h2>
                    </div>
                    <button class="close-btn" onclick="document.getElementById('logModal').style.display='none'">&times;</button>
                </div>
                <div class="log-body" style="max-height:80vh; overflow-y:auto;">
                    <table class="log-table" style="width:100%; border-collapse:collapse;">
                        <thead style="position:sticky; top:0; background:var(--bg); z-index:10">
                            <tr>
                                <th style="text-align:left; padding:12px">Time</th>
                                <th style="text-align:left">Symbol</th>
                                <th style="text-align:center">Event</th>
                                <th style="text-align:right">Price</th>
                                <th style="text-align:right">Time (Min)</th>
                            </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SOURCES = [
            "https://orb-pro-worker.gsmmunna.workers.dev/data",
            "https://orb-pro-worker.susanta41012.workers.dev/data"
        ];
        const OHLC_API = "https://pd-ohlc-worker.gsmmunna.workers.dev/get-ohlc";

        let pdData = {};
        let liveData = {};
        let currentFilter = 'all';

        function calculateRSI(snaps, period = 14) {
            if (!snaps || !Array.isArray(snaps) || snaps.length < 2) return "--";
            let actualPeriod = Math.min(period, snaps.length - 1);
            let gains = 0, losses = 0;
            const startIdx = Math.max(1, snaps.length - actualPeriod);
            for (let i = startIdx; i < snaps.length; i++) {
                const diff = snaps[i].ltp - snaps[i-1].ltp;
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            if (losses === 0) return 100;
            const rs = gains / losses;
            return Math.round(100 - (100 / (1 + rs)));
        }

        function getStrengthDonutSVG(score, isTrap, trapType) {
            const absScore = Math.min(100, Math.abs(score));
            const circumference = 2 * Math.PI * 16;
            const offset = circumference - (absScore / 100) * circumference;
            let color = score > 0 ? '#10b981' : (score < 0 ? '#ef4444' : '#6b7280');
            let text = `${absScore}%`;
            let textColor = '#fff';
            let glow = '';

            if (isTrap) {
                color = trapType === 'BEAR_TRAP' ? '#f59e0b' : '#f97316'; // Gold/Orange
                text = "REV";
                textColor = color;
                glow = `filter: drop-shadow(0 0 4px ${color})`;
            } else if (absScore >= 95) {
                glow = `filter: drop-shadow(0 0 6px ${color})`;
            }

            return `
            <div style="position:relative; width:44px; height:44px; display:flex; align-items:center; justify-content:center; ${glow}" title="${isTrap ? 'Reversal Detected' : 'Trend Strength'}">
                <svg width="44" height="44" style="transform: rotate(-90deg);">
                    <circle cx="22" cy="22" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"></circle>
                    <circle cx="22" cy="22" r="16" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition: stroke-dashoffset 0.5s ease;"></circle>
                </svg>
                <div style="position:absolute; font-size:10px; font-weight:800; color:${textColor}; text-align:center; line-height:1">${text}</div>
            </div>`;
        }

        async function fetchPDH() {
            try {
                const effectiveDate = getEffectiveDate();
                const response = await fetch(`${OHLC_API}?date=${effectiveDate}&v=${Date.now()}`);
                if (response.ok) {
                    pdData = await response.json();
                    const firstSym = Object.keys(pdData)[0];
                    const dateInfo = pdData[firstSym]?.date || "Latest";
                    document.getElementById('pdh-status').innerHTML = `
                        <span>Session: ${dateInfo}</span> | 
                        <span>Total: ${Object.keys(pdData).length} Stocks</span> | 
                        <a href="#" onclick="showRawData()" style="color:var(--accent); text-decoration:none">🔍 View Table</a>
                    `;
                    renderGrid(); // Initial render with just PDH data
                }
            } catch (e) { console.error(e); }
        }

        async function manualFetchPDH() {
            document.getElementById('btn-pdh').innerText = "⏳ Syncing...";
            await fetch("https://pd-ohlc-worker.gsmmunna.workers.dev/fetch-ohlc");
            await fetchPDH();
            document.getElementById('btn-pdh').innerText = "🔄 SYNC PDH";
        }

        const HOLIDAYS = [
            "2026-01-26", "2026-03-03", "2026-03-26", "2026-03-31",
            "2026-04-03", "2026-04-14", "2026-05-01", "2026-05-28",
            "2026-06-26", "2026-09-14", "2026-10-02", "2026-10-20",
            "2026-11-10", "2026-11-24", "2026-12-25"
        ];
        function getEffectiveDate() {
            let d = new Date(Date.now() + 5.5 * 3600000);
            const mins = d.getUTCHours() * 60 + d.getUTCMinutes();
            if (mins < 555 && d.getUTCDay() >= 1 && d.getUTCDay() <= 5) d.setUTCDate(d.getUTCDate() - 1);
            const istStr = () => d.toISOString().split('T')[0];
            while (d.getUTCDay() === 0 || d.getUTCDay() === 6 || HOLIDAYS.includes(istStr())) {
                d.setUTCDate(d.getUTCDate() - 1);
            }
            return istStr();
        }

        async function forceRefresh() {
            const btn = document.getElementById('btn-force');
            const og = btn.innerHTML;
            btn.innerHTML = "⏳ REFRESHING...";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.7";
            await fetchData(true);
            btn.innerHTML = og;
            btn.style.pointerEvents = "auto";
            btn.style.opacity = "1";
        }

        async function fetchData(isForce = false) {
            if (Object.keys(pdData).length === 0) await fetchPDH();
            try {
                const today = getEffectiveDate();
                const cacheBust = isForce ? Date.now() : Math.floor(Date.now() / 60000); // True bypass on manual refresh
                const fetchPromises = SOURCES.map(url =>
                    fetch(`${url}?path=${today}/orb_pro_data.json&v=${cacheBust}`, { cache: 'no-store' })
                        .then(res => res.ok ? res.json() : null).catch(() => null)
                );

                const datasets = await Promise.all(fetchPromises.map((p, i) => 
                    p.then(d => {
                        document.getElementById(`status-s${i+1}`).style.background = d ? 'var(--bull)' : 'var(--bear)';
                        return d;
                    })
                ));
                const validDatasets = datasets.filter(d => d !== null);
                if (validDatasets.length === 0) return;

                // Deep Merge: Select the latest snapshot
                const mergedData = {};
                validDatasets.forEach(ds => {
                    for (let sym in ds) {
                        if (!mergedData[sym]) {
                            mergedData[sym] = ds[sym];
                        } else {
                            if (ds[sym].t > mergedData[sym].t) {
                                mergedData[sym] = ds[sym];
                            }
                        }
                    }
                });

                liveData = mergedData;
                
                // Find Max T for the Sync badge
                let maxT = 0;
                for (let sym in liveData) {
                    const snap = liveData[sym];
                    if (snap.t > maxT) {
                        maxT = snap.t;
                    }
                }
                const dataTime = new Date(new Date().setHours(9, 15, 0, 0) + maxT * 60000);
                document.getElementById('market-time').innerHTML = `🕒 ${new Date().toLocaleTimeString('en-IN', { hour12: false })} <br> <span style="font-size:10px; opacity:0.8">DATA: ${dataTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })}</span>`;

                renderGrid();
            } catch (error) { console.error(error); }
        }

        function getBreakout(sym, timeframe) {
            if (!liveData[sym]) return null;
            const item = liveData[sym];
            const hKey = 'h' + timeframe;
            const lKey = 'l' + timeframe;
            
            if (!item.orb || item.orb[hKey] === undefined) return null;
            
            const h = item.orb[hKey];
            const l = item.orb[lKey];

            if (item.t <= timeframe) return { type: 'NEUTRAL', h, l };

            if (item.ltp > h) return { type: 'BULL', price: item.ltp, time: item.t, h, l };
            if (item.ltp < l) return { type: 'BEAR', price: item.ltp, time: item.t, h, l };
            return { type: 'NEUTRAL', h, l };
        }

        function renderGrid() {
            const grid = document.getElementById('main-grid');
            const symbols = Object.keys(pdData).length > 0 ? Object.keys(pdData) : Object.keys(liveData);

            if (symbols.length === 0) {
                grid.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-dim)">No data available. Try Syncing PDH.</td></tr>';
                return;
            }

            let stocks = symbols.map(sym => {
                const b5 = getBreakout(sym, 5);
                const b15 = getBreakout(sym, 15);
                const b30 = getBreakout(sym, 30);
                const item = liveData[sym] || null;
                const ltp = item ? item.ltp : 0;
                const lastT = item ? item.t : 0;
                const snaps = item ? item.history : [];
                
                const rsi = calculateRSI(snaps, 14);
                const snaps3MinAgo = snaps.length > 3 ? snaps.slice(0, snaps.length - 3) : snaps;
                const rsiOld = calculateRSI(snaps3MinAgo, 14);
                
                let rsiDir = 'FLAT';
                let rsiIcon = '➡️';
                let rsiColor = 'var(--text-dim)';
                
                if (rsi !== "--" && rsiOld !== "--") {
                    if (rsi > rsiOld + 2) { rsiDir = 'UP'; rsiIcon = '↗️'; rsiColor = 'var(--bull)'; }
                    else if (rsi < rsiOld - 2) { rsiDir = 'DOWN'; rsiIcon = '↘️'; rsiColor = 'var(--bear)'; }
                }

                const pd = pdData[sym] || {};

                let score = 0;
                let activeType = 'NEUTRAL';
                let isTrap = false;
                let trapType = null;

                const isPDHBrk = ltp && pd.pdh && ltp > pd.pdh;
                const isPDLBrk = ltp && pd.pdl && ltp < pd.pdl;

                // Strength Logic (Max 100/-100)
                if (isPDHBrk) score += 30;
                else if (isPDLBrk) score -= 30;

                if (b15 && b15.type === 'BULL') { score += 25; activeType = 'BULL'; }
                else if (b15 && b15.type === 'BEAR') { score -= 25; activeType = 'BEAR'; }

                if (b5 && b5.type === 'BULL') { score += 20; if (activeType === 'NEUTRAL') activeType = 'BULL'; }
                else if (b5 && b5.type === 'BEAR') { score -= 20; if (activeType === 'NEUTRAL') activeType = 'BEAR'; }

                if (b30 && b30.type === 'BULL') { score += 25; if (activeType === 'NEUTRAL') activeType = 'BULL'; }
                else if (b30 && b30.type === 'BEAR') { score -= 25; if (activeType === 'NEUTRAL') activeType = 'BEAR'; }

                // RSI Boost
                if (rsi !== "--") {
                    if (score > 0 && rsi >= 65) score += 10;
                    else if (score < 0 && rsi <= 35) score -= 10;
                }
                
                if (score > 100) score = 100;
                if (score < -100) score = -100;

                // Trap (Reversal) Detection
                if (item && item.orb) {
                    const dayH = item.orb.day_h;
                    const dayL = item.orb.day_l;
                    const h15 = item.orb.h15;
                    const l15 = item.orb.l15;
                    
                    // Bull Trap (Bearish Reversal): Broke high earlier, but now below 15M High and RSI < 60
                    const prevBrokeHigh = (h15 && dayH > h15) || (pd.pdh && dayH > pd.pdh);
                    if (prevBrokeHigh && h15 && ltp < h15 && rsi !== "--" && rsi < 60) {
                        isTrap = true;
                        trapType = 'BULL_TRAP';
                        activeType = 'BEAR';
                        score = score > 0 ? -Math.abs(score) : score; // Flip score
                    }

                    // Bear Trap (Bullish Reversal): Broke low earlier, but now above 15M Low and RSI > 40
                    const prevBrokeLow = (l15 && dayL < l15) || (pd.pdl && dayL < pd.pdl);
                    if (prevBrokeLow && l15 && ltp > l15 && rsi !== "--" && rsi > 40) {
                        isTrap = true;
                        trapType = 'BEAR_TRAP';
                        activeType = 'BULL';
                        score = score < 0 ? Math.abs(score) : score; // Flip score
                    }
                }

                // For sorting magnitude
                const sortScore = Math.abs(score) + (isTrap ? 200 : 0) + (rsiDir === 'UP' ? 10 : 0);

                return { sym, b5, b15, b30, ltp, lastT, pd, score, sortScore, activeType, isPDHBrk, isPDLBrk, isTrap, trapType, rsi, rsiDir, rsiIcon, rsiColor };
            });

            // Apply Filters
            if (currentFilter === 'bull') stocks = stocks.filter(s => s.activeType === 'BULL' || s.isPDHBrk);
            else if (currentFilter === 'bear') stocks = stocks.filter(s => s.activeType === 'BEAR' || s.isPDLBrk);
            else if (currentFilter === 'pd') stocks = stocks.filter(s => s.isPDHBrk || s.isPDLBrk);
            else if (currentFilter === 'orb') stocks = stocks.filter(s => s.activeType !== 'NEUTRAL');

            // Sort by Magnitude of Score (Traps at top), then Symbol
            stocks.sort((a, b) => b.sortScore - a.sortScore || Math.abs(b.score) - Math.abs(a.score) || a.sym.localeCompare(b.sym));

            grid.innerHTML = stocks.map(s => {
                // Dynamic Execution Price for P&L
                let execPrice = 0;
                let direction = 1;

                if (s.isPDHBrk) { execPrice = s.pd.pdh; direction = 1; }
                else if (s.isPDLBrk) { execPrice = s.pd.pdl; direction = -1; }
                else if (s.b15 && s.b15.type !== 'NEUTRAL') { execPrice = s.b15.price; direction = s.b15.type === 'BULL' ? 1 : -1; }
                else if (s.b5 && s.b5.type !== 'NEUTRAL') { execPrice = s.b5.price; direction = s.b5.type === 'BULL' ? 1 : -1; }

                const pnl = s.ltp && execPrice ? ((s.ltp - execPrice) / execPrice * 100 * direction).toFixed(2) : '0.00';

                const pdhAlert = s.isPDHBrk ? `<div class="pd-alert" style="background:var(--bull); color:#000; padding:2px 6px; border-radius:4px; width:fit-content">🔥 PDH BROKEN</div>` : '';
                const pdlAlert = s.isPDLBrk ? `<div class="pd-alert" style="background:var(--bear); color:#fff; padding:2px 6px; border-radius:4px; width:fit-content">🔥 PDL BROKEN</div>` : '';

                const tag5 = s.b5?.type === 'BULL' ? 'tag-bull' : s.b5?.type === 'BEAR' ? 'tag-bear' : 'tag-none';
                const tag15 = s.b15?.type === 'BULL' ? 'tag-bull' : s.b15?.type === 'BEAR' ? 'tag-bear' : 'tag-none';
                const tag30 = s.b30?.type === 'BULL' ? 'tag-bull' : s.b30?.type === 'BEAR' ? 'tag-bear' : 'tag-none';

                const openPrice = s.pd && s.pd.close ? s.pd.close : 0;
                const priceDiff = s.ltp && openPrice ? (s.ltp - openPrice).toFixed(1) : '0.0';
                const diffColor = parseFloat(priceDiff) >= 0 ? 'var(--bull)' : 'var(--bear)';

                return `
                    <tr class="${s.activeType === 'BULL' ? 'row-bull' : s.activeType === 'BEAR' ? 'row-bear' : ''}">
                        <td>
                            <div class="sym-cell">
                                <div style="display:flex; align-items:center; gap:8px">
                                    <span class="sym-name">${s.sym}</span>
                                    <span style="background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text-dim); padding:2px 6px; border-radius:20px; font-size:10px; font-weight:800">${Math.abs(s.score)}%</span>
                                </div>
                                ${pdhAlert} ${pdlAlert}
                            </div>
                        </td>
                        <td>
                            ${getStrengthDonutSVG(s.score, s.isTrap, s.trapType)}
                        </td>
                        <td>
                            <div style="display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.2); padding:4px 8px; border-radius:6px; width:fit-content; border:1px solid rgba(255,255,255,0.05)">
                                <span style="font-size:14px; font-weight:800; color:${s.rsi > 60 ? 'var(--bull)' : (s.rsi < 40 ? 'var(--bear)' : 'var(--text-dim)')}">${s.rsi}</span>
                                <span style="color:${s.rsiColor}; font-size:16px; font-weight:bold" title="3-Min Slope">${s.rsiIcon}</span>
                            </div>
                        </td>
                        <td>
                            <span class="orb-tag ${tag5}">5M</span>
                            <span class="orb-tag ${tag15}">15M</span>
                            <span class="orb-tag ${tag30}">30M</span>
                        </td>
                        <td>
                            <div style="font-size:11px; color:var(--text-dim)">H: ${s.b15?.h?.toFixed(1) || '--'}</div>
                            <div style="font-size:11px; color:var(--text-dim)">L: ${s.b15?.l?.toFixed(1) || '--'}</div>
                        </td>
                        <td>
                            <div style="font-size:11px; color:var(--bull)">H: ${s.pd?.pdh?.toFixed(1) || '--'}</div>
                            <div style="font-size:11px; color:var(--bear)">L: ${s.pd?.pdl?.toFixed(1) || '--'}</div>
                        </td>
                        <td class="ltp" style="font-weight:800; font-size:16px">
                            ${s.ltp?.toFixed(1) || '--'}
                            <div style="font-size:10px; font-weight:400; color:var(--text-dim)">
                                <span style="color:${diffColor}">(${parseFloat(priceDiff) >= 0 ? '+' : ''}${priceDiff})</span>
                                | T:${s.lastT}m
                            </div>
                        </td>
                        <td>
                            ${execPrice > 0 ? `<span class="pnl-badge ${parseFloat(pnl) >= 0 ? 'pnl-plus' : 'pnl-minus'}">${pnl}%</span>` : '--'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterData(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        function showRawData() {
            const modal = document.getElementById('raw-modal');
            const content = document.getElementById('raw-content');
            modal.style.display = 'block';
            let html = `<table style="width:100%; border-collapse:collapse; color:#fff">
                <tr style="color:var(--text-dim); text-align:left; border-bottom:1px solid var(--border)">
                    <th style="padding:10px">Symbol</th><th>PDH</th><th>PDL</th>
                </tr>`;
            Object.keys(pdData).sort().forEach(sym => {
                html += `<tr style="border-bottom:1px solid var(--border)">
                    <td style="padding:10px">${sym}</td>
                    <td style="color:var(--bull)">${pdData[sym].pdh.toFixed(1)}</td>
                    <td style="color:var(--bear)">${pdData[sym].pdl.toFixed(1)}</td>
                </tr>`;
            });
            content.innerHTML = html + `</table>`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('market-time').innerText = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true });
        }

        async function showLog() {
            const modal = document.getElementById('logModal');
            const logBody = document.getElementById('logBody');
            modal.style.display = 'flex';
            logBody.innerHTML = '<tr><td colspan="5" style="padding:40px; text-align:center; color:var(--text-dim)">Loading logs...</td></tr>';

            try {
                const response = await fetch(`https://history-worker.gsmmunna.workers.dev/get-log?v=${Date.now()}`);
                const logs = await response.json();
                
                if (!Array.isArray(logs) || logs.length === 0) {
                    logBody.innerHTML = '<tr><td colspan="5" style="padding:40px; text-align:center; color:var(--text-dim)">No events found today.</td></tr>';
                    return;
                }

                logBody.innerHTML = logs.map(log => {
                    const isBull = log.event.includes('HIGH') || log.event.includes('PDH');
                    const badgeColor = isBull ? 'var(--bull)' : 'var(--bear)';
                    const textColor = isBull ? '#000' : '#fff';
                    return `
                        <tr style="border-bottom:1px solid var(--border)">
                            <td style="padding:10px; color:var(--text-dim)">${log.time}</td>
                            <td style="font-weight:bold">${log.symbol}</td>
                            <td style="text-align:center"><span style="background:${badgeColor}; color:${textColor}; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:800">${log.event}</span></td>
                            <td style="text-align:right; font-weight:800">${log.price.toFixed(1)}</td>
                            <td style="text-align:right; color:var(--text-dim)">${log.t}m</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                logBody.innerHTML = `<tr><td colspan="5" style="padding:40px; text-align:center; color:var(--bear)">Error: ${e.message}</td></tr>`;
            }
        }

        setInterval(updateClock, 1000);
        setInterval(fetchData, 15000);
        fetchPDH();
        fetchData();
    </script>
</body>
</html>
