<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-ORB Dashboard (5M/15M/30M)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --bull: #10b981;
            --bear: #ef4444;
            --text: #f9fafb;
            --text-dim: #9ca3af;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            background-image: radial-gradient(circle at 50% -10%, #1e1b4b, #030712);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .logo span {
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .main-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            text-align: left;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .row-bull {
            background: rgba(16, 185, 129, 0.05);
        }

        .row-bear {
            background: rgba(239, 68, 68, 0.05);
        }

        .sym-cell {
            display: flex;
            flex-direction: column;
        }

        .sym-name {
            font-weight: 800;
            font-size: 15px;
        }

        .pnl-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
        }

        .pnl-plus {
            background: var(--bull);
            color: #000;
        }

        .pnl-minus {
            background: var(--bear);
            color: #fff;
        }

        #snapshotTime {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        #snapshotTime option {
            background: #1e293b;
            color: #f8fafc;
        }

        .orb-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            display: inline-block;
            margin-right: 4px;
        }

        .tag-bull {
            background: rgba(16, 185, 129, 0.2);
            color: var(--bull);
            border: 1px solid var(--bull);
        }

        .tag-bear {
            background: rgba(239, 68, 68, 0.2);
            color: var(--bear);
            border: 1px solid var(--bear);
        }

        .tag-none {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
        }

        .pd-alert {
            font-size: 10px;
            font-weight: 800;
            margin-top: 2px;
        }

        #pdh-status {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center;
        }

        #raw-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-body {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                border-radius: 16px;
                align-items: flex-start;
            }

            .controls {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
                white-space: nowrap;
                display: block;
            }

            .controls::-webkit-scrollbar {
                display: none;
            }

            .btn {
                padding: 6px 12px;
                font-size: 11px;
                display: inline-block;
            }

            .logo h1 {
                font-size: 20px;
            }

            th,
            td {
                padding: 8px 10px;
                font-size: 12px;
            }

            .sym-name {
                font-size: 13px;
            }

            .ltp {
                font-size: 14px !important;
            }

            .pnl-badge {
                font-size: 10px;
                padding: 3px 6px;
            }

            /* Hide less critical columns on very small mobile */
            @media (max-width: 480px) {
                th:nth-child(3),
                td:nth-child(3),
                /* 15M Range */
                th:nth-child(4),
                td:nth-child(4)

                /* Prev Day H/L */
                    {
                    display: none;
                }
            }
        }

        /* Log Modal Styles */
        #logModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1001;
        }

        .log-modal-content {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
        }

        .log-table th {
            position: sticky;
            top: 0;
            background: #111827;
            padding: 15px;
            text-align: left;
        }

        .log-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>ORB <span>MASTER</span></h1>
                <div style="font-size: 11px; color: var(--text-dim)">5M | 15M | 30M Breakouts</div>
            </div>
            <div class="controls">
                <button class="btn active" onclick="filterData('all', this)">ALL</button>
                <button class="btn" onclick="filterData('bull', this)">BULL</button>
                <button class="btn" onclick="filterData('bear', this)">BEAR</button>
                <button class="btn" onclick="filterData('pd', this)">PDH/PDL</button>
                <button class="btn" onclick="filterData('orb', this)">ORB ONLY</button>
                <button class="btn" style="border-color:var(--accent); color:var(--accent)" onclick="showLog()">📜
                    HISTORY</button>
                <button class="btn" onclick="manualFetchPDH()" id="btn-pdh">🔄 SYNC PDH</button>
                <div id="market-time" class="status-badge"
                    style="background:var(--accent); color:#fff; padding:8px 12px; border-radius:12px; font-size:12px; font-weight:700">
                    --:--:--</div>
            </div>
        </header>

        <div id="pdh-status">Loading systems...</div>

        <div class="main-content">
            <table id="orb-table">
                <thead>
                    <tr>
                        <th style="width:20%">Symbol</th>
                        <th>ORB Status (5/15/30)</th>
                        <th>15M Range</th>
                        <th>Prev Day (H/L)</th>
                        <th>LTP</th>
                        <th>Change %</th>
                    </tr>
                </thead>
                <tbody id="main-grid"></tbody>
            </table>
        </div>

        <div id="raw-modal">
            <div class="modal-body">
                <button onclick="document.getElementById('raw-modal').style.display='none'"
                    style="position:absolute; right:20px; top:20px; background:none; border:none; color:var(--bear); font-size:24px; cursor:pointer">&times;</button>
                <h2>PDH/PDL Raw Data</h2>
                <div id="raw-content"></div>
            </div>
        </div>

        <!-- Log Modal -->
        <div id="logModal">
            <div class="log-modal-content" style="max-width:1200px; width:95%">
                <div class="log-header">
                    <div style="display:flex; align-items:center; gap:20px">
                        <h2 style="margin:0">Market Snapshot History</h2>
                        <select id="snapshotTime" onchange="renderSnapshot()" style="padding:8px 16px; border-radius:6px; background:var(--card-bg); color:#fff; border:1px solid var(--primary); font-weight:bold; cursor:pointer; font-size:14px">
                            <option value="">Select Scan Time</option>
                        </select>
                    </div>
                    <button class="close-btn" onclick="document.getElementById('logModal').style.display='none'">&times;</button>
                </div>
                <div class="log-body" style="max-height:80vh; overflow-y:auto;">
                    <table class="log-table" style="width:100%; border-collapse:collapse;">
                        <thead style="position:sticky; top:0; background:var(--bg); z-index:10">
                            <tr>
                                <th style="text-align:left; padding:12px">Symbol</th>
                                <th>5M</th>
                                <th>15M</th>
                                <th>30M</th>
                                <th>PDH</th>
                                <th>PDL</th>
                                <th>LTP</th>
                                <th>Change %</th>
                            </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SOURCES = [
            "https://orb-pro-worker.gsmmunna.workers.dev/data",
            "https://orb-pro-worker.susanta41012.workers.dev/data"
        ];
        const OHLC_API = "https://pd-ohlc-worker.gsmmunna.workers.dev/get-ohlc";

        let pdData = {};
        let liveData = {};
        let currentFilter = 'all';

        async function fetchPDH() {
            try {
                const response = await fetch(`${OHLC_API}?v=${Date.now()}`);
                if (response.ok) {
                    pdData = await response.json();
                    const firstSym = Object.keys(pdData)[0];
                    const dateInfo = pdData[firstSym]?.date || "Latest";
                    document.getElementById('pdh-status').innerHTML = `
                        <span>Session: ${dateInfo}</span> | 
                        <span>Total: ${Object.keys(pdData).length} Stocks</span> | 
                        <a href="#" onclick="showRawData()" style="color:var(--accent); text-decoration:none">🔍 View Table</a>
                    `;
                    renderGrid(); // Initial render with just PDH data
                }
            } catch (e) { console.error(e); }
        }

        async function manualFetchPDH() {
            document.getElementById('btn-pdh').innerText = "⏳ Syncing...";
            await fetch("https://pd-ohlc-worker.gsmmunna.workers.dev/fetch-ohlc");
            await fetchPDH();
            document.getElementById('btn-pdh').innerText = "🔄 SYNC PDH";
        }

        async function fetchData() {
            if (Object.keys(pdData).length === 0) await fetchPDH();
            try {
                const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
                const fetchPromises = SOURCES.map(url =>
                    fetch(`${url}?path=${today}/orb_pro_data.json&v=${Date.now()}`)
                        .then(res => res.ok ? res.json() : null).catch(() => null)
                );

                const datasets = await Promise.all(fetchPromises);
                const validDatasets = datasets.filter(d => d !== null);
                if (validDatasets.length === 0) return;

                // Pick latest dataset
                let latest = validDatasets[0];
                let maxT = -1;
                validDatasets.forEach(ds => {
                    const t = ds["RELIANCE"] ? ds["RELIANCE"][ds["RELIANCE"].length - 1].t : -1;
                    if (t > maxT) { maxT = t; latest = ds; }
                });

                liveData = latest;
                renderGrid();
            } catch (error) { console.error(error); }
        }

        function getBreakout(sym, timeframe) {
            if (!liveData[sym]) return null;
            const snaps = liveData[sym];
            const rangeSnaps = snaps.filter(s => s.t < timeframe);
            if (rangeSnaps.length === 0) return null;

            let h = -Infinity, l = Infinity;
            rangeSnaps.forEach(s => { h = Math.max(h, s.ltp); l = Math.min(l, s.ltp); });

            const last = snaps[snaps.length - 1];
            if (last.ltp > h) return { type: 'BULL', price: last.ltp, time: last.t, h, l };
            if (last.ltp < l) return { type: 'BEAR', price: last.ltp, time: last.t, h, l };
            return { type: 'NEUTRAL', h, l };
        }

        function renderGrid() {
            const grid = document.getElementById('main-grid');
            const symbols = Object.keys(pdData).length > 0 ? Object.keys(pdData) : Object.keys(liveData);

            if (symbols.length === 0) {
                grid.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-dim)">No data available. Try Syncing PDH.</td></tr>';
                return;
            }

            let stocks = symbols.map(sym => {
                const b5 = getBreakout(sym, 5);
                const b15 = getBreakout(sym, 15);
                const b30 = getBreakout(sym, 30);
                const ltp = liveData[sym] ? liveData[sym][liveData[sym].length - 1].ltp : 0;
                const pd = pdData[sym] || {};

                // Cumulative Scoring for sorting: 
                // PDH/PDL = 10, 15M = 5, 5M = 2, 30M = 1
                let score = 0;
                let activeType = 'NEUTRAL';

                const isPDHBrk = ltp && pd.pdh && ltp > pd.pdh;
                const isPDLBrk = ltp && pd.pdl && ltp < pd.pdl;

                if (isPDHBrk || isPDLBrk) score += 10;
                if (b15 && b15.type !== 'NEUTRAL') { score += 5; activeType = b15.type; }
                if (b5 && b5.type !== 'NEUTRAL') { score += 2; if (activeType === 'NEUTRAL') activeType = b5.type; }
                if (b30 && b30.type !== 'NEUTRAL') { score += 1; if (activeType === 'NEUTRAL') activeType = b30.type; }

                return { sym, b5, b15, b30, ltp, pd, score, activeType, isPDHBrk, isPDLBrk };
            });

            // Apply Filters
            if (currentFilter === 'bull') stocks = stocks.filter(s => s.activeType === 'BULL' || s.isPDHBrk);
            else if (currentFilter === 'bear') stocks = stocks.filter(s => s.activeType === 'BEAR' || s.isPDLBrk);
            else if (currentFilter === 'pd') stocks = stocks.filter(s => s.isPDHBrk || s.isPDLBrk);
            else if (currentFilter === 'orb') stocks = stocks.filter(s => s.activeType !== 'NEUTRAL');

            // Sort by Score, then Symbol
            stocks.sort((a, b) => b.score - a.score || a.sym.localeCompare(b.sym));

            grid.innerHTML = stocks.map(s => {
                // Dynamic Execution Price for P&L
                let execPrice = 0;
                let direction = 1;

                if (s.isPDHBrk) { execPrice = s.pd.pdh; direction = 1; }
                else if (s.isPDLBrk) { execPrice = s.pd.pdl; direction = -1; }
                else if (s.b15 && s.b15.type !== 'NEUTRAL') { execPrice = s.b15.price; direction = s.b15.type === 'BULL' ? 1 : -1; }
                else if (s.b5 && s.b5.type !== 'NEUTRAL') { execPrice = s.b5.price; direction = s.b5.type === 'BULL' ? 1 : -1; }

                const pnl = s.ltp && execPrice ? ((s.ltp - execPrice) / execPrice * 100 * direction).toFixed(2) : '0.00';

                const pdhAlert = s.isPDHBrk ? `<div class="pd-alert" style="background:var(--bull); color:#000; padding:2px 6px; border-radius:4px; width:fit-content">🔥 PDH BROKEN</div>` : '';
                const pdlAlert = s.isPDLBrk ? `<div class="pd-alert" style="background:var(--bear); color:#fff; padding:2px 6px; border-radius:4px; width:fit-content">🔥 PDL BROKEN</div>` : '';

                const tag5 = s.b5?.type === 'BULL' ? 'tag-bull' : s.b5?.type === 'BEAR' ? 'tag-bear' : 'tag-none';
                const tag15 = s.b15?.type === 'BULL' ? 'tag-bull' : s.b15?.type === 'BEAR' ? 'tag-bear' : 'tag-none';
                const tag30 = s.b30?.type === 'BULL' ? 'tag-bull' : s.b30?.type === 'BEAR' ? 'tag-bear' : 'tag-none';

                const openPrice = liveData[s.sym] ? liveData[s.sym][0].ltp : 0;
                const priceDiff = s.ltp && openPrice ? (s.ltp - openPrice).toFixed(1) : '0.0';
                const diffColor = parseFloat(priceDiff) >= 0 ? 'var(--bull)' : 'var(--bear)';

                return `
                    <tr class="${s.activeType === 'BULL' ? 'row-bull' : s.activeType === 'BEAR' ? 'row-bear' : ''}">
                        <td>
                            <div class="sym-cell">
                                <div style="display:flex; align-items:center; gap:8px">
                                    <span class="sym-name">${s.sym}</span>
                                    <span style="background:rgba(255,255,255,0.1); border:1px solid var(--border); color:var(--text-dim); padding:2px 6px; border-radius:20px; font-size:10px; font-weight:800">${s.score}</span>
                                </div>
                                ${pdhAlert} ${pdlAlert}
                            </div>
                        </td>
                        <td>
                            <span class="orb-tag ${tag5}">5M</span>
                            <span class="orb-tag ${tag15}">15M</span>
                            <span class="orb-tag ${tag30}">30M</span>
                        </td>
                        <td>
                            <div style="font-size:11px; color:var(--text-dim)">H: ${s.b15?.h?.toFixed(1) || '--'}</div>
                            <div style="font-size:11px; color:var(--text-dim)">L: ${s.b15?.l?.toFixed(1) || '--'}</div>
                        </td>
                        <td>
                            <div style="font-size:11px; color:var(--bull)">H: ${s.pd?.pdh?.toFixed(1) || '--'}</div>
                            <div style="font-size:11px; color:var(--bear)">L: ${s.pd?.pdl?.toFixed(1) || '--'}</div>
                        </td>
                        <td class="ltp" style="font-weight:800; font-size:16px">
                            ${s.ltp?.toFixed(1) || '--'}
                            <span style="font-size:11px; color:${diffColor}; margin-left:4px">(${parseFloat(priceDiff) >= 0 ? '+' : ''}${priceDiff})</span>
                        </td>
                        <td>
                            ${execPrice > 0 ? `<span class="pnl-badge ${parseFloat(pnl) >= 0 ? 'pnl-plus' : 'pnl-minus'}">${pnl}%</span>` : '--'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterData(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        function showRawData() {
            const modal = document.getElementById('raw-modal');
            const content = document.getElementById('raw-content');
            modal.style.display = 'block';
            let html = `<table style="width:100%; border-collapse:collapse; color:#fff">
                <tr style="color:var(--text-dim); text-align:left; border-bottom:1px solid var(--border)">
                    <th style="padding:10px">Symbol</th><th>PDH</th><th>PDL</th>
                </tr>`;
            Object.keys(pdData).sort().forEach(sym => {
                html += `<tr style="border-bottom:1px solid var(--border)">
                    <td style="padding:10px">${sym}</td>
                    <td style="color:var(--bull)">${pdData[sym].pdh.toFixed(1)}</td>
                    <td style="color:var(--bear)">${pdData[sym].pdl.toFixed(1)}</td>
                </tr>`;
            });
            content.innerHTML = html + `</table>`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('market-time').innerText = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true });
        }

        let allSnapshots = {};

        function renderSnapshot() {
            const timeKey = document.getElementById('snapshotTime').value;
            if (!timeKey || !allSnapshots[timeKey]) return;

            const logBody = document.getElementById('logBody');
            const data = allSnapshots[timeKey];
            const symbols = Object.keys(data).sort();
            
            logBody.innerHTML = symbols.map(sym => {
                const s = data[sym];
                const pd = pdData[sym] || {};
                const change = pd.close ? ((s.ltp - pd.close) / pd.close * 100).toFixed(2) : '--';
                const pnlClass = parseFloat(change) >= 0 ? 'pnl-plus' : 'pnl-minus';

                const getBadge = (status, label) => {
                    if (status === 'none') return `<span style="color:rgba(255,255,255,0.1); font-size:10px">${label}</span>`;
                    const color = status === 'bull' ? 'var(--bull)' : 'var(--bear)';
                    return `<span style="background:${color}; color:${status === 'bull' ? '#000' : '#fff'}; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold">${label}</span>`;
                };

                return `
                    <tr style="border-bottom:1px solid var(--border)">
                        <td style="padding:10px; font-weight:bold">${sym}</td>
                        <td style="text-align:center">${getBadge(s.s5, '5M')}</td>
                        <td style="text-align:center">${getBadge(s.s15, '15M')}</td>
                        <td style="text-align:center">${getBadge(s.s30, '30M')}</td>
                        <td style="text-align:center">${getBadge(s.pdh, 'PDH')}</td>
                        <td style="text-align:center">${getBadge(s.pdl, 'PDL')}</td>
                        <td style="text-align:center; font-weight:800">${s.ltp.toFixed(1)}</td>
                        <td style="text-align:center"><span class="pnl-badge ${pnlClass}">${change}%</span></td>
                    </tr>
                `;
            }).join('');
        }

        async function showLog() {
            const modal = document.getElementById('logModal');
            const select = document.getElementById('snapshotTime');
            const logBody = document.getElementById('logBody');
            modal.style.display = 'flex';
            logBody.innerHTML = '<tr><td colspan="8" style="padding:40px; text-align:center; color:var(--text-dim)">Loading snapshots...</td></tr>';

            try {
                const response = await fetch(`https://history-worker.gsmmunna.workers.dev/get-snapshots?v=${Date.now()}`);
                allSnapshots = await response.json();
                
                const times = Object.keys(allSnapshots).sort((a, b) => {
                    const parseTime = (str) => {
                        const [time, period] = str.split(' ');
                        let [h, m] = time.split(':').map(Number);
                        if (period === 'pm' && h !== 12) h += 12;
                        if (period === 'am' && h === 12) h = 0;
                        return h * 60 + m;
                    };
                    return parseTime(b) - parseTime(a);
                });

                if (times.length === 0) {
                    logBody.innerHTML = '<tr><td colspan="8" style="padding:40px; text-align:center; color:var(--text-dim)">No snapshots found. Try manual scan.</td></tr>';
                    return;
                }

                select.innerHTML = times.map(t => `<option value="${t}">${t}</option>`).join('');
                
                // Select latest by default
                select.value = times[0];
                renderSnapshot();
            } catch (e) {
                logBody.innerHTML = `<tr><td colspan="8" style="padding:40px; text-align:center; color:var(--bear)">Error: ${e.message}</td></tr>`;
            }
        }

        setInterval(updateClock, 1000);
        setInterval(fetchData, 60000);
        fetchPDH();
        fetchData();
    </script>
</body>
</html>
