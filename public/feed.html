<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Feed - Premium</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%231e293b%22/><rect x=%2214%22 y=%2218%22 width=%2272%22 height=%228%22 rx=%224%22 fill=%22%23f8fafc%22/><rect x=%2214%22 y=%2232%22 width=%2244%22 height=%226%22 rx=%223%22 fill=%22%2394a3b8%22/><rect x=%2264%22 y=%2232%22 width=%2222%22 height=%2230%22 rx=%224%22 fill=%22%233b82f6%22/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .header-title { display: flex; flex-direction: column; gap: 4px; }
        .header-title h1 { font-size: 1.5rem; font-weight: 600; color: #1e293b; letter-spacing: -0.5px; }
        .header-title p { color: #64748b; font-size: 0.9rem; font-weight: 400; display: flex; align-items: center; gap: 8px; }
        .live-indicator { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }

        .header-actions { display: flex; gap: 15px; }
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary {
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover { background: #f1f5f9; color: #0f172a; }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        table.news-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
            border: 1px solid #e2e8f0;
        }

        table.news-table th, table.news-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #f1f5f9;
        }
        
        table.news-table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 500;
            font-size: 0.8rem;
        }

        table.news-table tr { transition: background 0.15s ease; background: #ffffff; }
        table.news-table tr:hover { background: #f8fafc; }

        .col-time { width: 120px; white-space: nowrap; color: #64748b; }
        .col-source { width: 130px; white-space: nowrap; }
        .col-title { color: #1e293b; font-weight: 500; line-height: 1.4; }
        .col-link { width: 70px; text-align: center; }

        .news-badge {
            background: #f1f5f9;
            color: #475569;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            border: 1px solid #e2e8f0;
            display: inline-block;
        }

        .badge-red {
            background: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
            font-weight: 500;
        }
        
        .badge-orange {
            background: #f97316 !important;
            color: white !important;
            border-color: #f97316 !important;
            font-weight: 500;
        }

        .ai-btn {
            background: #f1f5f9;
            color: #4f46e5;
            border: 1px solid #e2e8f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            margin-left: 8px;
            transition: background 0.2s ease;
            vertical-align: middle;
        }
        .ai-btn:hover { background: #e2e8f0; }
        
        .ai-content {
            display: none;
            margin-top: 8px;
            padding: 10px;
            background: #f8fafc;
            border-left: 2px solid #6366f1;
            font-size: 0.8rem;
            color: #475569;
            line-height: 1.4;
            font-weight: 400;
        }

        .open-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .open-link:hover { color: #2563eb; text-decoration: underline; }

        .loading { padding: 40px; text-align: center; color: #64748b; font-size: 1rem; }
        .error { padding: 20px; text-align: center; color: #ef4444; background: #fef2f2; border-bottom: 1px solid #fecaca; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Market Feed <span style="font-weight:400; color:#94a3b8; font-size:1.1rem;">AI</span></h1>
            <p><span class="live-indicator"></span> Live Updates</p>
        </div>
        <div class="header-actions">
            <a href="https://fnohub.in/" class="btn btn-secondary">
                Dashboard
            </a>
            <button id="notifyBtn" class="btn btn-primary">
                Enable Alerts
            </button>
        </div>
    </div>

    <div class="container" id="newsContainer">
        <div class="loading">
            <div class="spinner"></div>
            Syncing market data...
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 30px; margin-bottom: 30px;">
        <button id="loadMoreBtn" class="btn btn-secondary" style="display:none; margin:0 auto;">Load Older Updates</button>
    </div>

    <script>
        const container = document.getElementById('newsContainer');
        const notifyBtn = document.getElementById('notifyBtn');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const globalSeenTitles = new Set(); 
        let isInitialLoad = true;
        let latestItems = [];
        let showMore = false;

        loadMoreBtn.addEventListener('click', () => { showMore = true; renderNews(); });

        function updateBtnState() {
            if (!("Notification" in window)) {
                notifyBtn.style.display = 'none';
            } else if (Notification.permission === "granted") {
                notifyBtn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Alerts Active`;
                notifyBtn.style.background = "#ecfdf5";
                notifyBtn.style.color = "#059669";
                notifyBtn.style.boxShadow = "none";
                notifyBtn.style.border = "1px solid #10b981";
                notifyBtn.disabled = true;
                notifyBtn.style.cursor = "default";
            }
        }
        
        notifyBtn.addEventListener('click', () => {
            if ("Notification" in window) Notification.requestPermission().then(() => updateBtnState());
        });
        updateBtnState();

        async function fetchNews() {
            try {
                const response = await fetch('https://feed.susanta41012.workers.dev/?t=' + new Date().getTime());
                const items = await response.json();
                
                items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                
                latestItems = items;
                items.forEach(item => checkForResultNotification(item));
                renderNews();
                isInitialLoad = false;
            } catch (error) {
                if (latestItems.length === 0) {
                    container.innerHTML = `<div class="error"><h3>Connection Error</h3><p>Could not load the latest news.</p></div>`;
                }
            }
        }

        function checkForResultNotification(item) {
            if (!isInitialLoad && !globalSeenTitles.has(item.title)) {
                globalSeenTitles.add(item.title);
                const keywords = ['result', 'q1', 'q2', 'q3', 'q4', 'earnings', 'profit', 'dividend'];
                const searchStr = (item.title + " " + (item.aiSummary||"")).toLowerCase();
                const isResultNews = keywords.some(kw => searchStr.includes(kw));
                
                if (isResultNews && "Notification" in window && Notification.permission === "granted") {
                    new Notification("Market Result Update", { body: item.simpleTitle || item.title });
                }
            } else if (isInitialLoad) {
                globalSeenTitles.add(item.title);
            }
        }

        window.toggleAI = function(btn) {
            const content = btn.parentElement.nextElementSibling;
            const isHidden = content.style.display === 'none' || content.style.display === '';
            content.style.display = isHidden ? 'block' : 'none';
        };

        function renderNews() {
            container.innerHTML = `
                <table class="news-table">
                    <thead>
                        <tr>
                            <th class="col-time">Date & Time</th>
                            <th class="col-source">Source</th>
                            <th class="col-title">News Headline</th>
                            <th class="col-link"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            `;
            const tbody = document.getElementById('tableBody');
            
            const now = new Date();
            const limitMs = showMore ? (48 * 60 * 60 * 1000) : (24 * 60 * 60 * 1000);
            let displayedCount = 0;
            let hiddenCount = 0;

            latestItems.forEach((news) => {
                const pubDate = new Date(news.pubDate);
                const ageMs = now - pubDate;
                
                if (ageMs > limitMs) return; 
                if (!showMore && ageMs > (24 * 60 * 60 * 1000) && ageMs <= (48 * 60 * 60 * 1000)) {
                    hiddenCount++;
                    return;
                }
                displayedCount++;

                const formattedTime = pubDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const dateStr = pubDate.toLocaleDateString('en-US');
                const diffMins = Math.max(0, Math.floor(ageMs / 60000));
                let timeAgoText = diffMins === 0 ? "Just now" : diffMins < 60 ? `${diffMins}m ago` : `${Math.floor(diffMins/60)}h ago`;

                const sourceName = news.sourceName || "Live News";
                const titleLower = news.title.toLowerCase();
                const resultRegex = /\b(result|q1|q2|q3|q4|earnings|profit|dividend)\b/i;
                const isResultNews = resultRegex.test(titleLower);

                const commodityRegex = /\b(mcx|commodity|crude|oil|natural gas|gold|silver|bullion|metal|copper|zinc|aluminium)\b/i;
                const isCommodityNews = commodityRegex.test(titleLower);

                const displayTitle = news.simpleTitle ? news.simpleTitle.replace(/&amp;/g, '&') : news.title.replace(/&amp;/g, '&');
                
                let aiBtnHtml = '';
                let aiContentHtml = '';
                if (news.aiSummary) {
                    const summaryHtml = news.aiSummary.replace(/\n/g, '<br/>');
                    aiBtnHtml = `<button class="ai-btn" onclick="toggleAI(this)">✨ AI SUMMARY</button>`;
                    aiContentHtml = `<div class="ai-content">${summaryHtml}</div>`;
                }

                const row = document.createElement('tr');
                if (isResultNews) {
                    row.style.backgroundColor = '#fff5f5';
                } else if (isCommodityNews) {
                    row.style.backgroundColor = '#fffbeb';
                }
                
                let sourceBadgeClass = '';
                if (isResultNews) sourceBadgeClass = 'badge-red';
                else if (isCommodityNews) sourceBadgeClass = 'badge-orange';

                let extraTag = '';
                if (isResultNews) {
                    extraTag = '<span class="news-badge badge-red" style="margin-left: 10px;">⚡ RESULT</span>';
                } else if (isCommodityNews) {
                    extraTag = '<span class="news-badge badge-orange" style="margin-left: 10px;">📦 COMMODITY</span>';
                }
                
                row.innerHTML = `
                    <td class="col-time">
                        <div style="font-size: 0.95rem; font-weight: 400; color: #334155; margin-bottom: 2px;">${formattedTime}</div>
                        <div style="font-size: 0.75rem; color: #64748b;">${dateStr} &bull; ${timeAgoText}</div>
                    </td>
                    <td class="col-source">
                        <span class="news-badge ${sourceBadgeClass}">${sourceName}</span>
                    </td>
                    <td class="col-title">
                        <div>
                            ${displayTitle}
                            ${extraTag}
                            ${aiBtnHtml}
                        </div>
                        ${aiContentHtml}
                    </td>
                    <td class="col-link">
                        <a href="${news.link}" target="_blank" class="open-link">Open ↗</a>
                    </td>
                `;
                tbody.appendChild(row);
            });

            if (displayedCount === 0) {
                container.innerHTML = `<div class="loading" style="padding:60px;">No Recent Updates Found</div>`;
            }

            if (hiddenCount > 0 && !showMore) {
                loadMoreBtn.style.display = 'inline-flex';
                loadMoreBtn.innerText = `Load ${hiddenCount} Older Updates`;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        function scheduleNextFetch() {
            setTimeout(() => fetchNews().finally(() => scheduleNextFetch()), 60000);
        }
        fetchNews().finally(() => scheduleNextFetch());
    </script>
</body>
</html>
