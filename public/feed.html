<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Flash - Live Stock Updates</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%231e293b%22/><rect x=%2214%22 y=%2218%22 width=%2272%22 height=%228%22 rx=%224%22 fill=%22%23f8fafc%22/><rect x=%2214%22 y=%2232%22 width=%2244%22 height=%226%22 rx=%223%22 fill=%22%2394a3b8%22/><rect x=%2214%22 y=%2244%22 width=%2250%22 height=%226%22 rx=%223%22 fill=%22%2394a3b8%22/><rect x=%2214%22 y=%2256%22 width=%2238%22 height=%226%22 rx=%223%22 fill=%22%2394a3b8%22/><rect x=%2264%22 y=%2232%22 width=%2222%22 height=%2230%22 rx=%224%22 fill=%22%233b82f6%22/></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
            min-height: 100vh;
            padding: 15px 20px;
        }

        .header {
            text-align: left;
            margin-bottom: 15px;
            max-width: 1400px;
            width: 95%;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .header p {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
        }

        .container {
            max-width: 1400px;
            width: 95%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-x: auto;
        }

        table.news-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
            border: 1px solid #e2e8f0;
        }

        table.news-table th, table.news-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #f1f5f9;
        }

        table.news-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #cbd5e1;
            white-space: nowrap;
        }

        table.news-table tr {
            transition: background 0.15s ease;
        }

        table.news-table tr:hover {
            background: #f1f5f9;
        }

        .col-time {
            width: 120px;
            white-space: nowrap;
            color: #64748b;
        }

        .col-source {
            width: 130px;
            white-space: nowrap;
        }
        
        .col-title {
            color: #1e293b;
            font-weight: 500;
            line-height: 1.4;
        }
        
        .col-link {
            width: 70px;
            text-align: center;
        }

        .news-badge {
            background: #f1f5f9;
            color: #475569;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            border: 1px solid #e2e8f0;
            display: inline-block;
        }

        .news-link {
            display: inline-block;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .news-link:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .result-row {
            background: #fef2f2 !important;
        }
        
        .result-row td {
            border-bottom-color: #fca5a5;
            border-right-color: #fee2e2;
        }
        
        .commodity-row {
            background: #fffbeb !important;
        }
        
        .commodity-row td {
            border-bottom-color: #fde68a;
            border-right-color: #fef3c7;
        }
 }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.5rem;
            color: #94a3b8;
            padding: 50px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            grid-column: 1 / -1;
            text-align: center;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 20px;
            border-radius: 12px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { padding: 10px 10px; }
            .container { width: 100%; }
            .header { flex-direction: column; align-items: flex-start; gap: 5px; }
            .news-row { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 14px; }
            .news-right { width: 100%; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 8px; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Market Feed</h1>
            <p>Latest India Updates</p>
        </div>
        <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
            <a href="https://fnohub.in/" style="background:#f8fafc; color:#475569; border:1px solid #cbd5e1; padding:8px 12px; border-radius:6px; text-decoration:none; font-weight:600; font-size:0.85rem; transition:0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">⬅ Back to Dashboard</a>
            <button id="notifyBtn" style="background:#3b82f6; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.85rem; transition:0.2s;">🔔 Enable Alerts</button>
        </div>
    </div>

    <div class="container" id="newsContainer">
        <div class="loading">
            <div class="spinner"></div>
            Fetching latest market news...
        </div>
    </div>

    <script>
        const RSS_URLS = [
            'https://economictimes.indiatimes.com/markets/rssfeeds/2146842.cms',
            'https://www.moneycontrol.com/rss/MCtopnews.xml',
            'https://www.moneycontrol.com/rss/brokerageresearch.xml',
            'https://www.livemint.com/rss/markets',
            'https://www.livemint.com/rss/companies',
            'https://in.investing.com/rss/news_301.rss',
            'https://www.business-standard.com/rss/markets-106.rss',
            'https://www.financialexpress.com/market/feed/'
        ];

        const RESULT_RSS_URLS = [
            'https://www.moneycontrol.com/rss/results.xml',
            'https://news.google.com/rss/search?q=Indian+Stock+Market+Results&hl=en-IN&gl=IN&ceid=IN:en'
        ];

        const container = document.getElementById('newsContainer');
        const notifyBtn = document.getElementById('notifyBtn');
        const allCachedNews = new Map(); 
        const globalSeenTitles = new Set(); 
        let isInitialLoad = true;

        function updateBtnState() {
            if (!("Notification" in window)) {
                notifyBtn.style.display = 'none';
            } else if (Notification.permission === "granted") {
                notifyBtn.innerText = "🔔 Alerts Active";
                notifyBtn.style.background = "#10b981";
                notifyBtn.disabled = true;
                notifyBtn.style.cursor = "default";
            } else if (Notification.permission === "denied") {
                notifyBtn.innerText = "🔕 Alerts Blocked";
                notifyBtn.style.background = "#ef4444";
                notifyBtn.disabled = true;
                notifyBtn.style.cursor = "default";
            }
        }
        
        notifyBtn.addEventListener('click', () => {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    updateBtnState();
                });
            }
        });
        updateBtnState();

        function isRelevantNews(item) {
            const titleLower = item.title.toLowerCase();
            
            // Exclude Global/Crypto
            const excludeKeywords = [
                'bitcoin', 'crypto', 'cryptocurrency', 'ethereum', 'binance', 'xrp', 'dogecoin', 
                'nasdaq', 'dow jones', 's&p 500', 'wall street', 'us market', 'us stocks', 
                'federal reserve', 'fed rate', 'powell', 'european market', 'asian market', 'hang seng', 'nikkei'
            ];
            
            if (excludeKeywords.some(kw => titleLower.includes(kw))) {
                return false; 
            }

            // MCX & Commodity Filter
            const commodityKeywords = ['mcx', 'commodity', 'commodities', 'metal', 'bullion'];
            const otherMetals = ['copper', 'zinc', 'lead', 'aluminium', 'nickel', 'cotton', 'mentha'];
            const allowedCommodities = ['crude', 'natural gas', 'gold', 'silver'];
            
            const isCommodityNews = commodityKeywords.some(kw => titleLower.includes(kw)) || 
                                    otherMetals.some(kw => titleLower.includes(kw)) ||
                                    allowedCommodities.some(kw => titleLower.includes(kw));
                                    
            if (isCommodityNews) {
                const hasAllowed = allowedCommodities.some(kw => titleLower.includes(kw));
                // Agar commodity/MCX ki news hai aur usme gold/silver/crude/natural gas mention nahi hai, toh discard karein
                if (!hasAllowed) {
                    return false; 
                }
            }

            return true; 
        }

        async function fetchNews(urls) {
            try {
                const fetchPromises = urls.map(url => {
                    const apiLink = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&_t=${new Date().getTime()}`; // Adding timestamp to avoid browser cache
                    return fetch(apiLink).then(res => res.json());
                });

                const responses = await Promise.allSettled(fetchPromises);
                
                responses.forEach(response => {
                    if (response.status === 'fulfilled' && response.value.status === 'ok') {
                        response.value.items.forEach(item => {
                            if (!allCachedNews.has(item.title) && isRelevantNews(item)) {
                                allCachedNews.set(item.title, item);
                                checkForResultNotification(item);
                            }
                        });
                    }
                });

                renderNews();
                isInitialLoad = false;
            } catch (error) {
                if (allCachedNews.size === 0) {
                    container.innerHTML = `<div class="error"><h3>Connection Error</h3><p>Could not load the latest news. Please try again later.</p></div>`;
                }
            }
        }

        function checkForResultNotification(item) {
            if (!isInitialLoad && !globalSeenTitles.has(item.title)) {
                globalSeenTitles.add(item.title);
                
                const keywords = ['result', 'q1', 'q2', 'q3', 'q4', 'earnings', 'profit', 'loss', 'dividend'];
                const titleLower = item.title.toLowerCase();
                
                const isResultNews = keywords.some(kw => titleLower.includes(kw));
                
                if (isResultNews && "Notification" in window && Notification.permission === "granted") {
                    new Notification("Market Result Update", {
                        body: item.title,
                        icon: "https://cdn-icons-png.flaticon.com/512/2950/2950938.png"
                    });
                }
            }
        }

        function renderNews() {
            container.innerHTML = `
                <table class="news-table">
                    <thead>
                        <tr>
                            <th class="col-time">Date & Time</th>
                            <th class="col-source">Source</th>
                            <th class="col-title">News Headline</th>
                            <th class="col-link">Link</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            `;
            const tbody = document.getElementById('tableBody');
            
            const now = new Date();
            const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;
            let displayedCount = 0;

            let items = Array.from(allCachedNews.values());
            items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            items.forEach((news) => {
                const pubDate = new Date(news.pubDate);
                if ((now - pubDate) > TWENTY_FOUR_HOURS_MS) return;
                displayedCount++;

                const timeStr = pubDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const dateStr = pubDate.toLocaleDateString();
                const diffMs = now - pubDate;
                const diffMins = Math.max(0, Math.floor(diffMs / 60000));
                const diffHours = Math.floor(diffMins / 60);
                let timeAgoText = diffMins === 0 ? "Just now" : diffMins < 60 ? `${diffMins}m ago` : `${diffHours}h ago`;

                let sourceName = "Live News";
                if (news.link.includes('economictimes')) sourceName = "Economic Times";
                else if (news.link.includes('moneycontrol')) sourceName = "Moneycontrol";
                else if (news.link.includes('livemint')) sourceName = "LiveMint";
                else if (news.link.includes('google')) sourceName = "Google News";
                else if (news.link.includes('investing.com')) sourceName = "Investing.com";
                else if (news.link.includes('business-standard')) sourceName = "Business Standard";
                else if (news.link.includes('financialexpress')) sourceName = "Financial Express";

                const row = document.createElement('tr');
                
                const titleLower = news.title.toLowerCase();
                const isResult = ['result', 'q1', 'q2', 'q3', 'q4', 'earnings', 'profit', 'dividend'].some(kw => titleLower.includes(kw));
                const isCommodity = ['mcx', 'commodity', 'crude', 'natural gas', 'gold', 'silver', 'bullion'].some(kw => titleLower.includes(kw));
                
                if (isResult) {
                    row.className = 'result-row';
                } else if (isCommodity) {
                    row.className = 'commodity-row';
                }

                const animDelay = Math.min(displayedCount * 0.02, 1.5);
                row.style.animation = `fadeUp 0.3s ease forwards ${animDelay}s`;
                row.style.opacity = '0';
                
                row.innerHTML = `
                    <td class="col-time">
                        <div style="color:#1e293b;font-weight:500;">${timeStr}</div>
                        <div style="font-size:0.75rem;">${dateStr} • ${timeAgoText}</div>
                    </td>
                    <td class="col-source"><span class="news-badge" ${isResult ? 'style="background:#ef4444;color:white;border-color:#dc2626;"' : (isCommodity ? 'style="background:#f59e0b;color:white;border-color:#d97706;"' : '')}>${sourceName}</span></td>
                    <td class="col-title">
                        ${news.title.replace(/&amp;/g, '&')}
                        ${isResult ? '<span style="color:#dc2626;font-weight:700;font-size:0.7rem;margin-left:8px;background:#fee2e2;border:1px solid #fca5a5;padding:2px 6px;border-radius:3px;">🚨 RESULT</span>' : ''}
                        ${isCommodity && !isResult ? '<span style="color:#d97706;font-weight:700;font-size:0.7rem;margin-left:8px;background:#fef3c7;border:1px solid #fde68a;padding:2px 6px;border-radius:3px;">🛢️ COMMODITY</span>' : ''}
                    </td>
                    <td class="col-link"><a href="${news.link}" target="_blank" class="news-link">Open ↗</a></td>
                `;
                tbody.appendChild(row);
            });

            if (displayedCount === 0) {
                container.innerHTML = `<div class="error" style="background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.2);color:#0f172a"><h3>No Recent Updates</h3><p>No new updates in the last 24 hours.</p></div>`;
            }
        }

        function isMarketHours() {
            const now = new Date();
            const istOptions = { timeZone: 'Asia/Kolkata', hour12: false, hour: 'numeric', minute: 'numeric', weekday: 'short' };
            const formatter = new Intl.DateTimeFormat('en-US', istOptions);
            const parts = formatter.formatToParts(now);
            
            let hour = 0, minute = 0, weekday = '';
            parts.forEach(part => {
                if (part.type === 'hour') hour = parseInt(part.value, 10);
                if (part.type === 'minute') minute = parseInt(part.value, 10);
                if (part.type === 'weekday') weekday = part.value; 
            });

            // Market is closed on Saturday and Sunday
            if (weekday === 'Sat' || weekday === 'Sun') return false;

            const timeInMinutes = hour * 60 + minute;
            const marketOpen = 9 * 60 + 15; // 9:15 AM IST
            const marketClose = 15 * 60 + 30; // 3:30 PM IST
            
            return timeInMinutes >= marketOpen && timeInMinutes <= marketClose;
        }

        const ALL_FEEDS = [...RSS_URLS, ...RESULT_RSS_URLS];

        function scheduleNextFetch() {
            const marketOpen = isMarketHours();
            const delayMinutes = marketOpen ? 1 : 5;
            
            setTimeout(() => {
                fetchNews(ALL_FEEDS).finally(() => {
                    scheduleNextFetch();
                });
            }, delayMinutes * 60 * 1000);
        }

        fetchNews(ALL_FEEDS).finally(() => {
            scheduleNextFetch();
        });
    </script>
</body>
</html>
