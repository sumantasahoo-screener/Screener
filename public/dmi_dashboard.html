<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMI Smart Scanner (+DI / -DI)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%236366f1'/><path d='M30 50 l40 0 m-20 -20 l0 40' stroke='white' stroke-width='10' fill='none' stroke-linecap='round'/></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap');

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #4f46e5;
            --text: #0f172a;
            --text-dim: #64748b;
            --bull: #059669;
            --bear: #e11d48;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-box h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text);
        }

        .logo-box span {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .scan-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scan-btn:hover {
            opacity: 0.9;
        }

        .status {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .dmi-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 800px;
        }

        .dmi-table th {
            background: #f8fafc;
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px 20px;
            text-align: left;
            font-weight: 800;
            border-bottom: 1px solid var(--border);
        }

        .dmi-table td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .dmi-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        .sym {
            font-weight: 800;
        }

        .trend-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            min-width: 40px;
        }

        .bullish-badge { background: rgba(5, 150, 105, 0.15); color: var(--bull); border: 1px solid rgba(5, 150, 105, 0.3); }
        .bearish-badge { background: rgba(225, 29, 72, 0.15); color: var(--bear); border: 1px solid rgba(225, 29, 72, 0.3); }
        .neutral-badge { background: rgba(0, 0, 0, 0.05); color: var(--text-dim); border: 1px solid rgba(0, 0, 0, 0.1); }

        .val-pdi { color: var(--bull); font-weight: 800; }
        .val-mdi { color: var(--bear); font-weight: 800; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-box">
                <h1>DMI ENGINE</h1>
                <span>+DI / -DI Trend Scanner</span>
            </div>
            <div class="controls">
                <select id="cross-filter" class="scan-btn" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 12px 15px;">
                    <option value="all">ALL SIGNALS</option>
                    <option value="bullish" style="color: var(--bull); font-weight: bold;">BULLISH CROSS</option>
                    <option value="bearish" style="color: var(--bear); font-weight: bold;">BEARISH CROSS</option>
                </select>

                <select id="mode-select" class="scan-btn" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 12px 15px;">
                    <option value="smooth">SMOOTH MODE</option>
                    <option value="fast">FAST MODE</option>
                </select>

                <label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; color:var(--text-dim); cursor:pointer; background: var(--surface); padding: 12px 15px; border-radius:8px; border: 1px solid var(--border);">
                    <input type="checkbox" id="auto-scan-toggle" style="width:16px; height:16px; accent-color:var(--accent); cursor:pointer;">
                    AUTO SCAN
                </label>

                <div id="conn-status" style="font-size: 12px; font-weight: 800; padding: 12px 15px; border-radius: 8px; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); display: flex; align-items: center;">
                    <span id="conn-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b; margin-right:6px;"></span>
                    <span id="conn-text">WAITING</span>
                </div>
                <div id="status" class="status">Idle</div>
                <button class="scan-btn" onclick="fetchDMI()">
                    <div class="spinner" id="btn-spinner" style="display:none; width:14px; height:14px; border-width:2px"></div>
                    <span id="btn-text">SCAN MARKET</span>
                </button>
            </div>
        </header>

        <div id="loading" class="loading" style="display:none; text-align:center; padding: 40px; color: var(--text-dim);">
            Computing DMI for 200+ Stocks...
        </div>

        <div id="table-container" class="table-container"></div>
    </div>

    <script>
        const DMI_WORKER_URL = 'https://dmi-worker.gsmmunna.workers.dev/scan';

        async function fetchDMI() {
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('table-container');
            const status = document.getElementById('status');

            btnText.innerText = "SCANNING...";
            spinner.style.display = "inline-block";
            tableContainer.innerHTML = "";
            loading.style.display = "block";
            status.innerText = "Fetching data...";

            try {
                const mode = document.getElementById('mode-select').value;
                const res = await fetch(`${DMI_WORKER_URL}?mode=${mode}`); 
                
                if (!res.ok) throw new Error("Failed to fetch DMI data");
                
                const data = await res.json();
                
                let stocks = Object.keys(data).map(sym => ({
                    sym, 
                    ...data[sym],
                    diff: Math.abs(data[sym].pdi - data[sym].mdi)
                })).filter(s => {
                    if (s.candles < 3) return false;  // Need at least 3 candles
                    if (s.sym === 'NIFTY 50' || s.sym === 'NIFTY BANK') return true;
                    if (s.sym.includes('NIFTY') || s.sym.includes('SENSEX') || s.sym.includes('VIX')) return false;
                    return true;
                });

                const crossFilter = document.getElementById('cross-filter').value;
                if (crossFilter === 'bullish') {
                    stocks = stocks.filter(s => s.crossover === 'BULLISH');
                } else if (crossFilter === 'bearish') {
                    stocks = stocks.filter(s => s.crossover === 'BEARISH');
                }

                if (typeof currentTrendFilter !== 'undefined' && currentTrendFilter !== 'all') {
                    stocks = stocks.filter(s => s.trend === currentTrendFilter);
                }
                if (typeof currentStrengthFilter !== 'undefined' && currentStrengthFilter !== 'all') {
                    if (currentStrengthFilter === 'sideways') stocks = stocks.filter(s => s.strength < 20);
                    if (currentStrengthFilter === 'trending') stocks = stocks.filter(s => s.strength >= 20 && s.strength <= 40);
                    if (currentStrengthFilter === 'volatile') stocks = stocks.filter(s => s.strength > 40);
                }

                stocks.sort((a, b) => {
                    const getPriority = (s) => {
                        if (s.sym === 'NIFTY 50') return 4;
                        if (s.sym === 'NIFTY BANK') return 3;
                        if (s.crossover !== 'NONE') return 2;
                        return 1;
                    };
                    const prioA = getPriority(a);
                    const prioB = getPriority(b);
                    if (prioA !== prioB) return prioB - prioA;
                    return b.diff - a.diff;
                });

                loading.style.display = "none";
                
                if (stocks.length > 0) {
                    const dataTimeStr = stocks[0].time; // e.g. "15:55"
                    const parts = dataTimeStr.split(':');
                    const dataMins = parseInt(parts[0]) * 60 + parseInt(parts[1]);
                    
                    const now = new Date();
                    const istTime = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + (5.5 * 60 * 60 * 1000));
                    const currentMins = istTime.getHours() * 60 + istTime.getMinutes();
                    
                    const diff = currentMins - dataMins;
                    const isOnline = diff >= 0 && diff <= 5;
                    
                    const connDot = document.getElementById('conn-dot');
                    const connText = document.getElementById('conn-text');
                    
                    if (isOnline) {
                        connDot.style.background = '#10b981';
                        connDot.style.boxShadow = '0 0 8px #10b981';
                        connText.innerText = 'ONLINE';
                        connText.style.color = '#10b981';
                    } else {
                        connDot.style.background = '#ef4444';
                        connDot.style.boxShadow = 'none';
                        connText.innerText = 'OFFLINE';
                        connText.style.color = '#ef4444';
                    }
                    
                    status.innerText = `Scanned ${stocks.length} (Last: ${dataTimeStr})`;
                } else {
                    status.innerText = `Scanned 0 Stocks`;
                }
                renderTable(stocks);

            } catch (err) {
                console.error(err);
                loading.style.display = "none";
                status.innerText = "Error scanning market";
            } finally {
                btnText.innerText = "SCAN MARKET";
                spinner.style.display = "none";
            }
        }

        let currentTrendFilter = 'all';
        let currentStrengthFilter = 'all';

        function updateInlineFilters() {
            currentTrendFilter = document.getElementById('trend-filter').value;
            currentStrengthFilter = document.getElementById('strength-filter').value;
            fetchDMI();
        }

        function renderTable(stocks) {
            const container = document.getElementById('table-container');
            const mode = document.getElementById('mode-select').value;
            const strengthTitle = mode === 'fast' ? 'DX (Instant)' : 'ADX (Smooth)';
            
            let html = `
            <table class="dmi-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Time</th>
                        <th>Trend
                            <select id="trend-filter" onchange="updateInlineFilters()" style="background:transparent; color:var(--text); border:none; margin-left:5px; font-size:10px; cursor:pointer;">
                                <option value="all" ${currentTrendFilter === 'all' ? 'selected' : ''}>All</option>
                                <option value="BULLISH" ${currentTrendFilter === 'BULLISH' ? 'selected' : ''}>Bullish</option>
                                <option value="BEARISH" ${currentTrendFilter === 'BEARISH' ? 'selected' : ''}>Bearish</option>
                            </select>
                        </th>
                        <th>${strengthTitle}
                            <select id="strength-filter" onchange="updateInlineFilters()" style="background:transparent; color:var(--text); border:none; margin-left:5px; font-size:10px; cursor:pointer;">
                                <option value="all" ${currentStrengthFilter === 'all' ? 'selected' : ''}>All</option>
                                <option value="sideways" ${currentStrengthFilter === 'sideways' ? 'selected' : ''}>Sideways</option>
                                <option value="trending" ${currentStrengthFilter === 'trending' ? 'selected' : ''}>Trending</option>
                                <option value="volatile" ${currentStrengthFilter === 'volatile' ? 'selected' : ''}>Volatile</option>
                            </select>
                        </th>
                        <th>+DI (Bulls)</th>
                        <th>-DI (Bears)</th>
                        <th>LTP</th>
                        <th>Candles</th>
                    </tr>
                </thead>
                <tbody>
            `;

            stocks.forEach(s => {
                let badgeClass = 'neutral-badge';
                let displayTrend = s.trend;
                
                const upArrowSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L22 20 L12 16 L2 20 Z"/></svg>`;
                const downArrowSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22 L22 4 L12 8 L2 4 Z"/></svg>`;
                const sidewaysSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5 L2 12 L8 19 L8 15 L16 15 L16 19 L22 12 L16 5 L16 9 L8 9 Z"/></svg>`;
                
                // Override Trend Logic Based on Strength
                if (s.strength < 20) {
                    badgeClass = 'neutral-badge';
                    displayTrend = sidewaysSvg;
                } else {
                    if (s.trend === 'BULLISH') {
                        badgeClass = 'bullish-badge';
                        displayTrend = upArrowSvg;
                    }
                    if (s.trend === 'BEARISH') {
                        badgeClass = 'bearish-badge';
                        displayTrend = downArrowSvg;
                    }
                }

                let crossAlert = '';
                if (s.crossover === 'BULLISH') {
                    crossAlert = ' <span style="font-size:10px; background:var(--bull); color:#fff; padding:2px 5px; border-radius:4px; font-weight:800; animation:pulse 1.5s infinite">🚀 BULLISH CROSS</span>';
                } else if (s.crossover === 'BEARISH') {
                    crossAlert = ' <span style="font-size:10px; background:var(--bear); color:#fff; padding:2px 5px; border-radius:4px; font-weight:800; animation:pulse 1.5s infinite">🔻 BEARISH CROSS</span>';
                }

                let strengthLabel = '';
                if (s.strength < 20) {
                    strengthLabel = '<span style="font-size:10px; color:#64748b; background:rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); padding:2px 5px; border-radius:4px; margin-left:6px;">SIDEWAYS</span>';
                } else if (s.strength >= 20 && s.strength <= 40) {
                    strengthLabel = '<span style="font-size:10px; color:#0284c7; background:rgba(2, 132, 199, 0.1); border: 1px solid rgba(2, 132, 199, 0.3); padding:2px 5px; border-radius:4px; margin-left:6px; font-weight:800;">TRENDING</span>';
                } else {
                    strengthLabel = '<span style="font-size:10px; color:#ea580c; background:rgba(234, 88, 12, 0.1); border: 1px solid rgba(234, 88, 12, 0.3); padding:2px 5px; border-radius:4px; margin-left:6px; font-weight:800;">VOLATILE ⚡</span>';
                }

                html += `
                <tr>
                    <td class="sym">${s.sym}${crossAlert}</td>
                    <td style="color:#8b5cf6; font-weight:800; font-size:12px;">${s.time}</td>
                    <td><span class="trend-badge ${badgeClass}">${displayTrend}</span></td>
                    <td style="font-weight:900; color:var(--text);">${s.strength} ${strengthLabel}</td>
                    <td class="val-pdi">${s.pdi}</td>
                    <td class="val-mdi">${s.mdi}</td>
                    <td>${s.ltp.toFixed(1)}</td>
                    <td style="color:var(--text-dim)">${s.candles}${s.partial ? ' <span style="font-size:9px; background:#f97316; color:#fff; padding:1px 4px; border-radius:3px; font-weight:800;">PARTIAL</span>' : ''}</td>
                </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Auto-Scan Logic
        let autoScanInterval = null;
        document.getElementById('auto-scan-toggle').addEventListener('change', function(e) {
            if(e.target.checked) {
                fetchDMI(); // Fetch immediately when turned on
                autoScanInterval = setInterval(fetchDMI, 60000); // 60 seconds interval
                document.getElementById('status').innerText = "Auto-Scan ON";
                document.getElementById('status').style.color = "var(--bull)";
                document.getElementById('status').style.borderColor = "var(--bull)";
            } else {
                clearInterval(autoScanInterval);
                document.getElementById('status').innerText = "Auto-Scan OFF";
                document.getElementById('status').style.color = "var(--text-dim)";
                document.getElementById('status').style.borderColor = "var(--border)";
            }
        });
    </script>
</body>
</html>
