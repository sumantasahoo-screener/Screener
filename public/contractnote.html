<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Note Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans text-gray-800 p-4">
    <div class="bg-white p-5 md:p-6 rounded-2xl shadow-xl w-full max-w-xl border border-gray-200">
        <h1 class="text-2xl md:text-3xl font-black mb-5 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">Contract Note Analyzer</h1>
        
        <div class="flex flex-col items-center justify-center mb-5 border-2 border-dashed border-blue-300 hover:border-blue-500 transition-colors duration-300 p-5 rounded-xl bg-gradient-to-b from-blue-50 to-white">
            <label for="pdf-upload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 text-sm md:text-base">
                Upload PDF
            </label>
            <input id="pdf-upload" type="file" accept="application/pdf" class="hidden" />
            <p id="file-name" class="mt-3 text-xs md:text-sm font-medium text-slate-500 break-all text-center px-2">No file chosen</p>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center my-6">
            <svg class="animate-spin h-8 w-8 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-blue-600 text-sm font-semibold tracking-wide">Processing Document...</p>
        </div>

        <div id="results" class="hidden animate-fade-in space-y-4">
            
            <div class="bg-slate-50 p-3 md:p-4 rounded-xl border border-slate-200 text-xs md:text-sm shadow-sm">
                <h2 class="font-bold text-slate-600 mb-2 border-b border-slate-200 pb-1 uppercase tracking-wider text-[11px] md:text-xs">Account Details</h2>
                <div class="grid grid-cols-2 gap-y-2 gap-x-4">
                    <div class="flex flex-col"><span class="text-slate-400 text-[10px] uppercase font-semibold">UCC / Client ID</span> <span id="acc-ucc" class="font-bold text-slate-800 truncate">-</span></div>
                    <div class="flex flex-col"><span class="text-slate-400 text-[10px] uppercase font-semibold">PAN</span> <span id="acc-pan" class="font-bold text-slate-800 truncate">-</span></div>
                    <div class="flex flex-col"><span class="text-slate-400 text-[10px] uppercase font-semibold">Trade Date</span> <span id="acc-date" class="font-bold text-slate-800 truncate">-</span></div>
                    <div class="flex flex-col"><span class="text-slate-400 text-[10px] uppercase font-semibold">Contract No</span> <span id="acc-contract" class="font-bold text-slate-800 truncate">-</span></div>
                </div>
            </div>

            <div class="bg-indigo-50 p-3 md:p-4 rounded-xl border border-indigo-100 text-xs md:text-sm shadow-sm">
                <div class="grid grid-cols-2 gap-y-2 gap-x-4">
                    <div class="flex flex-col border-r border-indigo-200"><span class="text-indigo-500 text-[10px] uppercase font-bold">Total Scrips/Contracts</span> <span id="scrip-count" class="font-black text-indigo-700 text-lg md:text-xl">-</span></div>
                    <div class="flex flex-col pl-2"><span class="text-indigo-500 text-[10px] uppercase font-bold">Est. Delivery Turnover</span> <span id="turnover-val" class="font-black text-indigo-700 text-lg md:text-xl">-</span></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-br from-green-50 to-emerald-100 p-3 md:p-4 rounded-xl border border-green-200 shadow-sm flex flex-col justify-center items-center text-center">
                    <p class="text-[10px] md:text-xs font-bold text-green-700 uppercase tracking-wider">Gross Obligation</p>
                    <p id="gross-val" class="text-lg md:text-2xl font-black text-green-800 mt-1 drop-shadow-sm">₹ 0.00</p>
                </div>
                <div class="bg-gradient-to-br from-blue-50 to-indigo-100 p-3 md:p-4 rounded-xl border border-blue-200 shadow-sm flex flex-col justify-center items-center text-center">
                    <p class="text-[10px] md:text-xs font-bold text-blue-700 uppercase tracking-wider">Net Amount</p>
                    <p id="net-val" class="text-lg md:text-2xl font-black text-blue-800 mt-1 drop-shadow-sm">₹ 0.00</p>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid
