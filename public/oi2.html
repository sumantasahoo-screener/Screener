
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="oi-scan-time" content="2026-03-09 09:41:44">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== PREMIUM TERMINAL THEME ===== */
:root{
  --mid:       80px;

  /* Core palette — deep navy, slightly lighter for readability */
  --bg:        #0d1e2e;
  --bg2:       #112333;
  --bg3:       #162a3a;
  --bg4:       #0f2030;
  --panel:     #132535;

  /* Borders */
  --border:    #1e3a50;
  --border2:   #284a60;

  /* Accents */
  --gold:      #c8a84b;
  --gold-dim:  #7a6228;
  --cyan:      #29d8e0;
  --cyan-dim:  #155f63;

  /* Data colors */
  --ce:        #1ed97a;
  --ce-deep:   #0fa854;
  --pe:        #e8404a;
  --pe-deep:   #9e1e26;
  --chg-ce:    #22e882;
  --chg-pe:    #f03545;

  /* Text */
  --text:      #d8e8f4;
  --text-dim:  #6a8898;
  --text-mid:  #9ab4c4;

  /* Font */
  --font-ui:   'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

/* ===== RESET ===== */
html,body{
  margin:0; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  box-sizing:border-box;
}
*,*::before,*::after{ box-sizing:inherit; }

/* Subtle grid texture on body */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(29,216,224,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29,216,224,0.02) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ===== SCREEN CONTAINER ===== */
#screen{
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:10px 16px 6px;
  position:relative;
  z-index:1;
}

/* ===== TOPBAR ===== */
.topbar{
  padding:5px 0 8px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  flex-shrink:0;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  gap:10px;
}

#symbolButtons{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:visible;
  padding-left:2px;
  min-width:0;
}

#symbolButtons > div{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

#symbolDivider{
  width:1px;
  align-self:stretch;
  background:var(--border);
  flex-shrink:0;
  margin:0 4px;
}

#dropdownWrap{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ===== SYMBOL BUTTONS ===== */
#symbolButtons button{
  font-family:var(--font-mono);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0.03em;
  padding:4px 10px;
  border:1px solid var(--border2);
  background:var(--bg3);
  color:var(--text-mid);
  cursor:pointer;
  border-radius:2px;
  min-width:80px;
  text-align:center;
  transition:all 0.15s ease;
  position:relative;
  overflow:hidden;
  white-space:nowrap;
}

#symbolButtons button::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events:none;
}

#symbolButtons button:hover{
  border-color:var(--cyan-dim);
  color:var(--cyan);
  background:rgba(29,216,224,0.06);
  box-shadow:0 0 8px rgba(29,216,224,0.08);
}

/* Active / selected button */
.activeSymbol{
  border-color:var(--gold) !important;
  color:var(--gold) !important;
  background:rgba(200,168,75,0.1) !important;
  font-weight:600 !important;
  transform:none !important;
  box-shadow:0 0 0 1px var(--gold-dim),
             0 0 12px rgba(200,168,75,0.15) !important;
  z-index:5;
}

/* ===== DROPDOWNS ===== */
select{
  font-family:var(--font-mono);
  font-size:12px;
  background:var(--bg3);
  color:var(--text);
  border:1px solid var(--border2);
  border-radius:2px;
  padding:4px 8px;
  cursor:pointer;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}
select:focus{ border-color:var(--cyan-dim); }
#dropdownWrap select{ width:104px; }

/* ===== THEME SWITCH BUTTON ===== */
#themeSwitch {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 2px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: all 0.2s;
  white-space: nowrap;
}

#themeSwitch:hover {
  background: #45a049;
  box-shadow: 0 2px 6px rgba(76,175,80,0.3);
}

/* ===== HEADER ROW ===== */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1400px;
  width:100%;
  margin:7px auto 5px;
  border:1px solid var(--border);
  border-radius:3px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:0 1px 0 rgba(29,216,224,0.06),
             inset 0 1px 0 rgba(255,255,255,0.02);
}

.outerBoxTitle{
  text-align:center;
  font-size:13px;
  font-family:var(--font-mono);
  letter-spacing:0.04em;
  padding:7px 6px;
  background:var(--panel);
  border-right:1px solid var(--border);
  line-height:1.7;
  color:var(--text-mid);
}
.outerBoxTitle:last-child{ border-right:none; }

/* LTP middle cell */
#midHeader{
  background:var(--bg4);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:500;
  color:var(--text-dim);
  line-height:1.5;
  letter-spacing:0.05em;
}

/* ===== GRID ===== */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  position:relative;
  min-height:0;
  overflow-y:auto;
}

/* Outer border frames */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:0; bottom:0;
  width:calc((100% - var(--mid)) / 2);
  border:1px solid var(--border);
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* ===== ROWS ===== */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0; gap:0;
  transition:background 0.08s;
}
.row:hover{
  background:rgba(29,216,224,0.025);
}
.row.atm{
  border-top:1px solid rgba(200,168,75,0.45);
  border-bottom:1px solid rgba(200,168,75,0.45);
  background:rgba(200,168,75,0.04);
}

/* hover crosshair */
.hoverLine{
  position:absolute;
  left:0; right:0;
  height:1px;
  background:rgba(200,168,75,0.55);
  pointer-events:none;
  z-index:50;
  display:none;
}

/* ===== MID STRIKE COLUMN ===== */
#midCol{
  position:absolute;
  left:50%; top:0; bottom:0;
  width:var(--mid);
  transform:translateX(-50%);
  pointer-events:none;
}

.strike{
  text-align:center;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:500;
  letter-spacing:0.02em;
  color:var(--text-mid);
  margin-top:12px;
  position:relative;
  z-index:500;
}

/* ===== BARS ===== */
.stack{ display:flex; flex-direction:column; gap:0; }

.box{
  border:none; padding:2px;
  display:flex; flex-direction:column;
  justify-content:center; width:100%;
}

.totWrap,
.chgWrap{
  height:100%; display:flex;
  align-items:center; padding:1px;
}

.chgInner{
  position:relative; width:100%;
  height:40px; overflow:hidden;
}
.chgInner .bar{ position:absolute; height:15px; border-radius:1px; }

.bar{
  height:17px;
  border:none;
  box-sizing:border-box;
  border-radius:1px;
}

.ce      { background:var(--ce); }
.pe      { background:var(--pe); }
.deep.ce { background:var(--ce-deep); }
.deep.pe { background:var(--pe-deep); }
.chg-ce  { background:var(--chg-ce); }
.chg-pe  { background:var(--chg-pe); }

.r{ margin-left:auto; }
.l{ margin-right:auto; }

/* ===================================================================
   RESPONSIVE
=================================================================== */

/* ── TABLET (<=900px) ── */
@media (max-width:900px){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:8px;
  }
  #grid{
    max-width:100%; justify-content:flex-start;
    flex:none; overflow-y:visible;
  }
  .outerRowHeader{ max-width:100%; margin:6px 0; }
  .outerBoxTitle{ font-size:10px; padding:4px 2px; }
  .topbar{ flex-wrap:wrap; height:auto; }
  select{ font-size:10px; }
  .row{ min-height:16px; }
}

/* ── LANDSCAPE PHONE (height <= 480px) ── */
@media (max-height:480px) and (orientation:landscape){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:3px 8px;
  }
  .topbar{
    flex-direction:row; flex-wrap:nowrap;
    padding-bottom:3px; gap:6px;
  }
  #symbolButtons{ gap:3px; }
  #symbolButtons button{ font-size:8.5px; padding:2px 5px; min-width:48px; }
  .outerRowHeader{ margin:3px 0; }
  .outerBoxTitle{ font-size:8.5px; padding:2px 1px; }
  #midHeader{ font-size:8.5px; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }
  .row{ min-height:13px; }
  .bar{ height:12px; }
  .chgInner{ height:25px; }
  .strike{ font-size:9px; margin-top:3px; }
}

/* ── PORTRAIT PHONE (<=600px) ── */
@media (max-width:600px){
  :root{ --mid:56px; }

  body{ padding-top:env(safe-area-inset-top); }

  #screen{
    height:auto; min-height:100svh; overflow-y:auto;
    padding:6px;
    padding-top:calc(6px + env(safe-area-inset-top));
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }

  .topbar{
    flex-direction:column; align-items:stretch;
    gap:6px; padding-bottom:8px; height:auto;
  }

  #symbolButtons{ width:100%; }
  #symbolButtons > div{ 
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  #symbolButtons button{ font-size:10px; padding:5px 6px; min-width: auto; }

  #symbolDivider{ display:none; }

  #dropdownWrap{ 
    width:100%; 
    display: flex;
    gap: 6px;
  }
  #dropdownWrap select{ 
    flex: 1;
    font-size: 11px;
  }
  
  #themeSwitch {
    font-size: 11px;
    padding: 5px 8px;
  }

  #grid::before, #grid::after, #midCol{ display:none; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }

  .row{ grid-template-columns:1fr var(--mid) 1fr; min-height:20px; }
  .strike{ font-size:10px; margin-top:6px; }
  .chgInner{ height:32px; }
  .bar{ height:16px; }
  
  /* COMPACT 2-COLUMN HEADER */
  .outerRowHeader{
    grid-template-columns: 1fr 1fr;
    margin: 6px 0;
    gap: 0;
  }
  
  .outerBoxTitle{ 
    font-size:10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    line-height: 1.4;
  }
  
  .outerBoxTitle:nth-child(2n) {
    border-right: none;
  }
  
  .outerBoxTitle:nth-child(n+3) {
    border-bottom: none;
  }
  
  #midHeader{ 
    display: none;
  }
}

/* ── VERY SMALL (<=420px) ── */
@media (max-width:420px){
  :root{ --mid:48px; }
  #symbolButtons button{ min-width:50px; font-size:8.5px; }
  select{ font-size:9.5px; }
  .strike{ font-size:9.5px; }
  .row{ min-height:15px; }
}
</style>




</head>

const ulSel = document.getElementById("ul");
const expSel = document.getElementById("exp");
const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");
const themeSwitch = document.getElementById("themeSwitch");
const hoverLine = document.getElementById("hoverLine");

// ===== THEME SWITCH BUTTON =====
if (themeSwitch) {
  themeSwitch.addEventListener("click", function(e) {
    e.preventDefault();
    
    let currentUrl = window.location.href.split("?")[0].split("#")[0];
    let newUrl = "";
    
    // Check what file we're currently on
    if (currentUrl.endsWith("oi2.html")) {
      // On oi2.html → go to oi.html
      newUrl = currentUrl.substring(0, currentUrl.lastIndexOf("/")) + "/oi.html";
    } else if (currentUrl.endsWith("oi.html")) {
      // On oi.html → go to oi2.html
      newUrl = currentUrl.substring(0, currentUrl.lastIndexOf("/")) + "/oi2.html";
    } else if (currentUrl.includes("oi2")) {
      // Fallback for oi2 anywhere in path
      newUrl = currentUrl.replace(/oi2/, "oi").replace(/oi\.html/, "oi.html");
    } else if (currentUrl.includes("oi")) {
      // Fallback for oi anywhere in path
      newUrl = currentUrl.replace(/oi\.html/, "oi2.html");
    }
    
    if (newUrl) {
      window.location.href = newUrl;
    }
  });
}

var keys = Object.keys(DATA);

// --- Move INDEX symbols to front ---
var indexSymbols = ["NIFTY","BANKNIFTY"];
var indexList = [];
var normalList = [];

keys.forEach(function(k){
  if(indexSymbols.includes(k)){
    indexList.push(k);
  }else{
    normalList.push(k);
  }
});

keys = indexList.concat(normalList);

var topRow = document.createElement("div");
var bottomRow = document.createElement("div");

topRow.style.display = "flex";
bottomRow.style.display = "flex";

topRow.style.gap = "10px";
bottomRow.style.gap = "10px";

topRow.style.width = "100%";
bottomRow.style.width = "100%";

var splitIndex = Math.ceil(keys.length / 2);

keys.forEach(function(k, i){

  var o=document.createElement("option");
  o.text=k; 
  o.value=k;
  ulSel.add(o);

  var btn=document.createElement("button");
  btn.innerText=k;

  // ✅ Stable identifier for reliable matching
  btn.dataset.symbol = k;

  // --- Highlight index buttons ---
  if(indexSymbols.includes(k)){
    btn.style.background = "linear-gradient(135deg,#2d004d,#6a0dad)";
    btn.style.border = "1px solid #4aa3ff";
    btn.style.fontWeight = "bold";
  }

  btn.onclick = function(){

    ulSel.value = k;

    // Do not touch button styles here
    // render() will handle active + spike styling

    ulSel.onchange();

  };



  if(i < splitIndex){
    topRow.appendChild(btn);
  }else{
    bottomRow.appendChild(btn);
  }

});


var container = document.getElementById("symbolButtons");
container.innerHTML = "";
container.style.display = "flex";
container.style.flexDirection = "column";
container.style.justifyContent = "flex-start";
container.style.alignItems = "flex-start";
container.style.gap = "8px";

container.appendChild(topRow);
container.appendChild(bottomRow);

// cache buttons once
window.symbolButtons = Array.from(
  document.querySelectorAll("#symbolButtons button")
);




ulSel.onchange = function(){
  expSel.innerHTML="";
  Object.keys(DATA[ulSel.value]).forEach(function(e){
    var o=document.createElement("option");
    o.text=e; 
    o.value=e;
    expSel.add(o);
  });

  expSel.selectedIndex=0;

  render();

  // force spike color apply after DOM settles
  setTimeout(function(){
    render();
  }, 0);
};



expSel.onchange = render;

const st=JSON.parse(localStorage.getItem("oi_state")||"{}");
if(st.ul && DATA[st.ul]){
  ulSel.value=st.ul;
  ulSel.onchange();
  if(st.exp) expSel.value=st.exp;
}else{
  ulSel.selectedIndex=0;
  ulSel.onchange();
}

(function(){

  const originalUL  = ulSel.value;
  const originalEXP = expSel.value;

  window.symbolButtons.forEach(btn => {

    const symbol = btn.dataset.symbol;

    if (!DATA[symbol]) return;

    const expiries = Object.keys(DATA[symbol]);
    if (!expiries.length) return;

    const exp = expiries[0];   // first expiry only

    const obj = DATA[symbol][exp];
    const rows = obj.table;
    const atm = obj.atm;
    const ltp = obj.ltp;

    const idx = rows.findIndex(r => r.STRIKE_TXT === atm);
    if (idx === -1) return;

    const half = Math.floor(15/2);
    const win = rows.slice(Math.max(0, idx-half), idx+half+1);

    let chCE = 0, chPE = 0;

    win.forEach(r=>{
      chCE += Number(r["Change In OI_CE"]||0);
      chPE += Number(r["Change In OI_PE"]||0);
    });

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    let spikeColor = null;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    if (spikeColor === "ADDITION_UP") {
      btn.dataset.spikeColor = "ADDITION_UP";
      btn.style.background = "#F59767";
      btn.style.color = "#1a0a00";
      btn.style.borderColor = "#d07040";
    }
    else if (spikeColor === "ADDITION_DOWN") {
      btn.dataset.spikeColor = "ADDITION_DOWN";
      btn.style.background = "#3AEDF2";
      btn.style.color = "#001a1c";
      btn.style.borderColor = "#20c0c8";
    }
    else if (spikeColor === "BOTH") {
      btn.dataset.spikeColor = "BOTH";
      btn.style.background = "#4E5454";
      btn.style.color = "#e0e8e8";
      btn.style.borderColor = "#6a7878";
    }
    else {
      btn.dataset.spikeColor = "";
    }


  });

  ulSel.value = originalUL;
  expSel.value = originalEXP;

})();

<script>
// ── AUTO-REFRESH (localStorage + reload — guaranteed kaam karta hai) ──
// Har 10 sec mein naya HTML fetch karo
// Agar scan time badli → state save karo → page reload karo
// Page load pe state restore karo (already handled above via st variable)

const scanMeta = document.querySelector('meta[name="oi-scan-time"]');
let lastScanTime = scanMeta ? scanMeta.content.trim() : "";

function getFileUrl(){
  const base = location.href.split("?")[0];
  return base.endsWith(".html") ? base : base + ".html";
}

async function checkUpdate(){
  try{
    const url = getFileUrl() + "?_t=" + Date.now();
    const res = await fetch(url, {
      cache: "no-store",
      headers: { "pragma": "no-cache", "cache-control": "no-cache" }
    });
    if(!res.ok) return;
    const html = await res.text();

    // Scan time check karo
    const metaMatch = html.match(/<meta name="oi-scan-time" content="([^"]+)"/);
    if(!metaMatch) return;
    const newScanTime = metaMatch[1].trim();

    if(newScanTime === lastScanTime){
      // Same data — kuch nahi karo
      return;
    }

    // ── Naya data aaya — state save karo aur reload karo ──
    localStorage.setItem("oi_state", JSON.stringify({
      ul:  ulSel.value,
      exp: expSel.value
    }));

    location.replace(location.href.split("?")[0]);

  }catch(e){ /* silent fail — retry next cycle */ }
}

setInterval(checkUpdate, 10000);
</script>
