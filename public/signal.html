<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCALPER-BANK-IT</title>
<style>
:root{
  /* Updated to Light Green Theme */
  --bg:#f0f4f2;
  --card:#fafdfc;
  --panel:#eff7f3;
  --panel2:#e8f5ee;
  --border:rgba(4,120,87,0.22);
  --text:#062d1f;
  --muted:#059669;
  --green:#047857;
  --red:#be123c;
  --blue:#059669;
  --cyan:#10b981;
  --indigo:#047857;
  --amber:#92400e;
  --glow-blue:rgba(4,120,87,0.18);
  --glow-cyan:rgba(16,185,129,0.15);
  --glow-green:rgba(4,120,87,0.18);
  --glow-red:rgba(190,18,60,0.18);
  --glass-bg:rgba(240,244,242,0.88);
  --glass-border:rgba(4,120,87,0.22);
}
*{box-sizing:border-box}

/* ══ BODY — Green themed radial pulse ══ */
body{
  margin:0;padding:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(4,120,87,0.10) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(16,185,129,0.07) 0%, transparent 60%),
    linear-gradient(rgba(4,120,87,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(4,120,87,0.04) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 36px 36px, 36px 36px;
  font-family:system-ui;
  color:var(--text);
  overflow:hidden;
}

.scroll-wrap{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;}
.page-block{
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  gap:6px;scroll-snap-align:start;height:100vh;padding:5px;
}

/* ══ TRADE CARD — Mint glass ══ */
.trade-card{
  background:linear-gradient(145deg,
    rgba(250,253,252,0.96) 0%,
    rgba(239,247,243,0.97) 60%,
    rgba(242,250,246,0.96) 100%);
  backdrop-filter:blur(24px) saturate(140%) brightness(1.02);
  -webkit-backdrop-filter:blur(24px) saturate(140%) brightness(1.02);
  border-radius:20px;
  padding:6px;
  border:1px solid var(--border);
  box-shadow:
    0 0 0 1px rgba(16,185,129,0.06),
    0 0 24px rgba(4,120,87,0.08),
    0 0 60px rgba(0,0,0,0.06),
    0 1px 0 rgba(255,255,255,0.95) inset,
    0 0 40px rgba(4,120,87,0.04) inset;
  display:flex;flex-direction:column;gap:6px;height:100%;overflow:visible;margin:0;
  position:relative;
}
/* top shimmer line - green */
.trade-card::before{
  content:"";
  position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,
    transparent,
    rgba(4,120,87,0.50) 40%,
    rgba(16,185,129,0.70) 50%,
    rgba(4,120,87,0.50) 60%,
    transparent);
  border-radius:50%;
  filter:blur(0.5px);
}
/* corner accent - green */
.trade-card::after{
  content:"";
  position:absolute;bottom:0;right:0;
  width:60px;height:60px;
  background:radial-gradient(circle at bottom right, rgba(4,120,87,0.10), transparent 70%);
  border-radius:0 0 20px 0;
  pointer-events:none;
}

.card-head.split-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:6px;min-height:32px;}
.head-right{justify-self:end;}

/* ══ BADGES ══ */
.badge-buy,.badge-sell,.badge-nt{padding:3px 9px;border-radius:7px;font-weight:800;font-size:12px;letter-spacing:0.3px;}
.badge-buy{
  background:linear-gradient(135deg,rgba(4,120,87,0.12),rgba(4,100,75,0.08));
  color:#047857;
  border:1px solid rgba(4,120,87,0.45);
  box-shadow:0 0 8px rgba(4,120,87,0.15), inset 0 1px 0 rgba(6,160,110,0.10);
  text-shadow:none;
}
.badge-sell{
  background:linear-gradient(135deg,rgba(190,18,60,0.12),rgba(160,10,45,0.08));
  color:#be123c;
  border:1px solid rgba(190,18,60,0.45);
  box-shadow:0 0 8px rgba(190,18,60,0.15), inset 0 1px 0 rgba(220,50,80,0.10);
  text-shadow:none;
}
.badge-nt{
  background:rgba(4,120,87,0.10);
  color:#047857;
  border:1px solid rgba(4,120,87,0.28);
}

.indicator-stack.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;flex:1;min-height:0;}

/* ══ CHART AREA ══ */
.chart-part{
  background:rgba(240,244,242,0.95);
  border-radius:12px;overflow:hidden;padding:3px;
  border:1px solid rgba(4,120,87,0.13);
  box-shadow:inset 0 0 16px rgba(0,0,0,0.04), inset 0 0 6px rgba(4,120,87,0.04);
}
.mini-chart{width:100%;height:100%;display:flex;align-items:stretch;}

.right-col{display:flex;flex-direction:column;gap:6px;height:100%;}
.right-col .oi-panel{flex:1;min-height:0;}
.right-col .indicator-grid{flex-shrink:0;}
.indicator-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

/* ══ OI ══ */
.oi-title{font-size:12px;color:var(--muted);}
.oi-box{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding-top:4px;}
.oi-row{height:16px;margin:0;border-radius:3px;background:rgba(180,205,190,0.45);position:relative;overflow:hidden;}
.oi-call{
  background:linear-gradient(90deg,#065f46,#047857);
  box-shadow:0 0 6px rgba(4,120,87,0.22);
}
.oi-put{
  background:linear-gradient(90deg,#9f1239,#be123c);
  box-shadow:0 0 6px rgba(190,18,60,0.22);
}
.oi-row::after{content:"";position:absolute;right:0;top:0;height:100%;width:0%;background:transparent;}
.oi-row.pos-change.ce::after{width:var(--chg-pct);background:#064e3b;}
.oi-row.pos-change.pe::after{width:var(--chg-pct);background:#881337;}
.oi-row.neg-change.ce::after{width:var(--chg-pct);background:#1a3528;outline:2px solid #064e3b;}
.oi-row.neg-change.pe::after{width:var(--chg-pct);background:#2d1020;outline:2px solid #881337;}
.oi-atm-float-wrap{position:absolute;right:-5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;}
.oi-atm-float{
  color:var(--text);font-weight:900;font-size:12px;padding:2px 6px;border-radius:4px;
  text-shadow:none;
}
.atm-arrow{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;}
.atm-arrow.up{border-bottom:10px solid #10b981;filter:drop-shadow(0 0 3px rgba(16,185,129,0.5));}
.atm-arrow.down{border-top:10px solid #10b981;filter:drop-shadow(0 0 3px rgba(16,185,129,0.5));}

/* ══ INNER BLOCKS ══ */
.inner-block{
  background:linear-gradient(160deg,rgba(250,253,252,0.94),rgba(239,247,243,0.96));
  backdrop-filter:blur(12px);
  border-radius:14px;padding:4px 6px;
  border:1px solid rgba(4,120,87,0.16);
  box-shadow:inset 0 0 10px rgba(0,0,0,0.02), inset 0 1px 0 rgba(255,255,255,0.9);
  display:flex;flex-direction:column;gap:2px;
}
.tall-chart{height:110px;}
.sub-block{
  background:linear-gradient(160deg,rgba(248,252,250,0.96),rgba(238,247,242,0.97));
  backdrop-filter:blur(8px);
  border-radius:10px;padding:0;font-size:12px;
  border:1px solid rgba(4,120,87,0.13);
  min-height:30px;
  box-shadow:inset 0 0 6px rgba(0,0,0,0.02);
}
.sub-block:nth-of-type(2){min-height:70px;}
.dual-slot{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mini-box{
  background:linear-gradient(160deg,rgba(248,252,250,0.96),rgba(238,247,242,0.97));
  backdrop-filter:blur(8px);
  border-radius:12px;padding:2px;font-size:13px;text-align:center;
  border:1px solid rgba(4,120,87,0.14);
  min-height:60px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 6px rgba(0,0,0,0.02);
}

.pa-row{display:flex;gap:4px;}
.pa-up{width:9px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--green);filter:drop-shadow(0 0 4px var(--green));}
.pa-down{width:9px;height:9px;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--red);filter:drop-shadow(0 0 4px var(--red));}
.candle-block{flex:1;min-height:0;}
.chart-part.tall-chart{height:140px !important;flex-shrink:0;}
.split-bu-qcp,.oi-imb-row{min-height:20px;}

/* ══ OHLC ══ */
.ohlc-top,.ohlc-mid,.ohlc-bottom{
  background:linear-gradient(160deg,rgba(248,252,250,0.96),rgba(238,247,242,0.97));
  backdrop-filter:blur(8px);
  border-radius:8px;padding:6px;
  border:1px solid rgba(4,120,87,0.13);
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 0 6px rgba(0,0,0,0.02);
}
.ohlc-bottom{overflow:visible;height:80px;min-height:80px;}
.ohlc-title{
  font-size:12px;color:#047857;margin-bottom:2px;
  text-align:center;position:relative;padding-bottom:1px;
}
.ohlc-title::after{
  content:"";position:absolute;left:50%;bottom:0;width:55%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(4,120,87,0.30),transparent);
  transform:translateX(-50%);
}
.ohlc-row{display:flex;gap:8px;font-weight:700;}
.day-candle-slot{flex:0;height:100px;background:rgba(222,235,228,0.8);border-radius:6px;display:flex;align-items:center;justify-content:center;}

.sub-block.split-ohlc > div{min-height:0 !important;}
.split-ohlc{display:grid;grid-template-columns:38% 40% 18%;grid-template-rows:1fr;min-height:50px;height:auto;column-gap:6px;row-gap:0;}
.split-ohlc .ohlc-top{grid-column:1;grid-row:1;}
.split-ohlc .ohlc-mid{grid-column:2;grid-row:1;}
.split-ohlc .ohlc-bottom{grid-column:3;grid-row:1;}

/* ══ BU / QCP ══ */
.split-bu-qcp{display:grid !important;grid-template-columns:1fr 1fr;align-items:center;}
.split-bu-qcp .bu-right{text-align:right;}
.bu-box{min-width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;}
.bu-box.lu{background:rgba(4,120,87,0.10);color:#047857;border:1px solid rgba(4,120,87,0.35);}
.bu-box.s{
  background:rgba(190,18,60,0.11);color:#be123c;
  border:1px solid rgba(190,18,60,0.42);
  box-shadow:0 0 5px rgba(190,18,60,0.18);
}
.bu-box.sc{
  background:rgba(4,120,87,0.10);color:#047857;
  border:1px solid rgba(4,120,87,0.35);
}
.bu-box.l{
  background:rgba(4,120,87,0.12);color:#047857;
  border:1px solid rgba(4,120,87,0.42);
  box-shadow:0 0 5px rgba(4,120,87,0.18);
}
.bu-box.n{background:rgba(4,120,87,0.08);color:#047857;border:1px solid rgba(4,120,87,0.25);}
.split-bu-qcp .center{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.qcp-box{
  background:linear-gradient(135deg,rgba(250,253,252,0.92),rgba(239,247,243,0.96));
  backdrop-filter:blur(6px);
  border:1px solid rgba(4,120,87,0.28);
  padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800;
  box-shadow:0 0 6px rgba(4,120,87,0.10), inset 0 1px 0 rgba(255,255,255,0.8);
  color:#065f46;
}

/* ══ OI IMBALANCE ══ */
.oi-imb-dotbar{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;width:70%;justify-content:start;}
.oi-dot{height:16px;background:rgba(168,195,180,0.40);border-radius:1px;}
.oi-dot.buy{background:var(--green);box-shadow:0 0 3px var(--glow-green);}
.oi-dot.sell{background:var(--red);box-shadow:0 0 3px var(--glow-red);}
.oi-dot.neutral{background:rgba(4,120,87,0.30);}
.oi-imb-text{font-size:12px;font-weight:800;color:var(--text);}
.oi-imb-bar-wrap{width:100%;height:12px;background:rgba(4,120,87,0.08);border-radius:0;overflow:hidden;}
.oi-imb-bar{height:100%;width:calc(var(--pct) * 1%);border-radius:0;}

/* ══ EXPIRY ══ */
.expiry-box{align-items:center;justify-content:center;text-align:center;}
.expiry-box .expiry-title{font-weight:700;color:#047857;}
.expiry-box .expiry-date{font-weight:800;font-size:13px;color:var(--text);}

/* ══ HEAD ══ */
.header-right-stack{display:flex;align-items:center;gap:8px;}
.head-left{
  font-size:14px;font-weight:700;
  color:#047857;
  text-shadow:none;
}
.head-center{font-size:12px;font-weight:800;color:var(--text);}
.signal-badge{padding:2px 6px;border-radius:5px;font-weight:800;font-size:11px;}

/* ══ DIVIDERS ══ */
.with-divider{grid-template-columns:1fr auto 1fr !important;}
.bu-divider{width:1px;height:60%;background:rgba(4,120,87,0.22);justify-self:center;}

/* ══ OPT STRIKE ══ */
.opt-strike-box{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;}
.os-divider{width:1px;height:60%;background:rgba(4,120,87,0.22);}
.os-title{font-size:11px;opacity:.75;color:#047857;}
.os-val{font-size:13px;font-weight:800;color:var(--text);}

/* ══ VOLUME ══ */
.vol-blue-light{color:#047857;}
.vol-blue-dark{color:#065f46;text-shadow:none;}
.vol-pink-light{color:#9f1239;}
.vol-pink-dark{color:#881337;}
.vol-flat{color:#059669;}

/* ══ ZONE ══ */
.zone-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;}
.zone-box{
  background:linear-gradient(160deg,rgba(248,252,250,0.96),rgba(238,247,242,0.97));
  backdrop-filter:blur(8px);
  border:1px solid rgba(4,120,87,0.13);
  border-radius:8px;height:72px;
}
.zone-title{
  background:transparent;
  color:#047857;font-weight:600;font-size:11px;padding:10px;text-align:center;
}
.zone-values{display:grid;grid-template-columns:1fr 1fr;align-items:center;text-align:center;padding:10px;font-size:12px;font-weight:600;}

/* ══ PRICE TREND ══ */
.price-trend-box{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;}
.pt-left{width:65%;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.pt-divider{width:1px;height:70%;background:rgba(4,120,87,0.22);}
.pt-right{width:30%;display:flex;align-items:center;justify-content:center;}
.pt-title{font-size:11px;font-weight:800;opacity:.9;color:#047857;}
.pt-bar-wrap{width:100%;height:6px;background:rgba(168,195,180,0.35);border-radius:6px;overflow:hidden;}
.pt-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#059669,#10b981);
  border-radius:6px;transition:width .3s ease;
  box-shadow:none;
}
.pt-text{font-size:12px;font-weight:800;color:var(--text);}

.zone-ce{color:#047857;text-shadow:none;}
.zone-pe{color:#be123c;text-shadow:none;}

/* ══ OI IMB BARS ══ */
.oi-imb-bar.buy{
  background:linear-gradient(90deg,#065f46,#047857);
  box-shadow:none;
}
.oi-imb-bar.sell{
  background:linear-gradient(90deg,#9f1239,#be123c);
  box-shadow:none;
}
.oi-imb-bar.neutral{background:rgba(4,120,87,0.30);}

.oi-imb-row{display:grid;grid-template-columns:65% 5% 30%;align-items:center;min-height:20px;}
.oi-imb-main{display:flex;flex-direction:column;gap:4px;}
.oi-imb-divider{width:1px;height:60%;background:rgba(4,120,87,0.20);justify-self:center;}

/* ══ SCROLLBAR ══ */
.scroll-wrap::-webkit-scrollbar{width:3px;}
.scroll-wrap::-webkit-scrollbar-track{background:transparent;}
.scroll-wrap::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#059669,#10b981);
  border-radius:4px;
}

/* ══ MOBILE ══ */
@media screen and (max-width:768px){
  body{overflow:auto !important;}
  .scroll-wrap{height:auto;scroll-snap-type:none;max-width:100vw;box-sizing:border-box;}
  .page-block{display:block;height:auto;min-height:auto !important;}
  .page-block > .trade-card{margin-bottom:2px !important;}
  .indicator-stack.two-col{grid-template-columns:1fr;}
  .trade-card{width:100%;max-width:100%;margin:0 auto;}
  .chart-part.tall-chart{height:160px !important;}
  .split-ohlc{grid-template-columns:1fr;grid-template-rows:auto auto auto;}
  .oi-imb-dotbar{width:100% !important;}
  .inner-block{border-radius:8px;}
  .sub-block{border-radius:6px;}
}
@media screen and (max-width:768px) and (orientation:landscape){
  .scroll-wrap{display:flex;flex-direction:row;overflow-x:auto !important;overflow-y:hidden !important;}
  .page-block{width:100%;min-width:100%;}
}
</style>
</head>
<body>
<script>
(function(){
  // ── Global tooltip div ──────────────────────────────────────
  var tip = document.createElement('div');
  tip.id = 'global-tip';
  tip.style.cssText = [
    'display:none',
    'position:fixed',
    'z-index:999999',
    'background:rgba(239,247,243,0.98)',
    'color:#062d1f',
    'font-size:11px',
    'font-family:system-ui,sans-serif',
    'padding:5px 10px',
    'border-radius:6px',
    'border:1px solid rgba(4,120,87,0.38)',
    'pointer-events:none',
    'white-space:nowrap',
    'box-shadow:0 2px 14px rgba(0,0,0,0.12)'
  ].join(';');
  document.body.appendChild(tip);

  // ── Event delegation — one listener for ALL data-tip elements ──
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(!el) return;
    var raw = el.getAttribute('data-tip');
    if(!raw) return;

    if(raw.indexOf('|') !== -1){
      var d = raw.split('|');
      var cc = d[5]==='g' ? '#047857' : '#be123c';
      tip.innerHTML =
        '<span style="color:#92400e;font-weight:700;">[' + d[0] + ']</span> ' +
        '<span style="color:#059669;">O:</span><span style="color:#062d1f;">' + d[1] + '</span> ' +
        '<span style="color:#059669;">H:</span><span style="color:#047857;">' + d[2] + '</span> ' +
        '<span style="color:#059669;">L:</span><span style="color:#be123c;">' + d[3] + '</span> ' +
        '<span style="color:#059669;">C:</span><span style="color:' + cc + ';font-weight:700;">' + d[4] + '</span>';
    } else {
      tip.innerHTML = '<span style="color:#062d1f;">' + raw + '</span>';
    }

    tip.style.left  = (e.clientX + 14) + 'px';
    tip.style.top   = (e.clientY - 32) + 'px';
    tip.style.display = 'block';
  });

  document.addEventListener('mousemove', function(e){
    if(tip.style.display === 'none') return;
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 32) + 'px';
  });

  document.addEventListener('mouseout', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el){
      var to = e.relatedTarget;
      if(to && el.contains(to)) return;
      tip.style.display = 'none';
    }
  });

  // ── Auto-reload on file change ──────────────────────────────
  var lastTag = null;
  function updateScanTimeFromCards(){
    var first = document.querySelector('.trade-card');
    if(!first) return;
    var t = first.getAttribute('data-scan-time');
    if(!t) return;
    var el = document.getElementById('scanTimeValue');
    if(el) el.textContent = t;
  }
  async function checkForUpdate(){
    try{
      var r = await fetch(location.href,{method:'HEAD',cache:'no-store'});
      var tag = r.headers.get('etag') || r.headers.get('last-modified');
      if(tag && lastTag && tag !== lastTag){ location.reload(); }
      lastTag = tag;
    }catch(e){}
  }
  window.addEventListener('load', function(){
    updateScanTimeFromCards();
    checkForUpdate();
    setInterval(checkForUpdate, 10000);
    setInterval(updateScanTimeFromCards, 4000);
  });
})();
</script>
