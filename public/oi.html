
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;
  height:100%;
  background:#012A40;
  color:white;
  font-family:Arial, sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{
  box-sizing:inherit;
}

/* ===== DESKTOP BASE LAYOUT (UNCHANGED) ===== */

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}

/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1350px;        /* desktop canvas width */
  width:100%;
  margin:0 auto;
  position:relative;
}

.hoverLine{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:#ffd000;
  pointer-events:none;
  z-index:50;
  display:none;
}

/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:40px;
  bottom:40px;
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0;
  box-sizing:border-box;
}

/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}

/* topbar */
.topbar{
  height:100px;
  padding:6px 0;
  border-bottom:1px solid #444;
  display:flex;
  align-items:center;

  max-width:1350px;
  width:100%;
  margin:0 auto;
}


#symbolButtons{
  flex:1;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  gap:10px;
  height:70px;
  overflow:hidden;
  padding-left:6px;
}

#symbolDivider{
  width:1px;
  height:70px;
  background:#2a5a6a;
  margin:0 12px;
  flex-shrink:0;
}

#dropdownWrap{
  display:flex;
  gap:6px;
  flex-shrink:0;
  margin-right:12px;
}

#dropdownDivider{
  width:1px;
  height:70px;
  background:#2a5a6a;
  margin-right:12px;
  flex-shrink:0;
}



#dropdownWrap select{
  width:85px;
}

#symbolButtons button{
  font-size:12px;
  padding:4px 10px;
  border:1px solid #555;
  background:#012A40;
  color:white;
  cursor:pointer;
  border-radius:4px;
  min-width:75px;
  text-align:center;
}


#symbolButtons button:hover{
  background:#0a3a55;
}



select{
  background:#012A40;
  color:white;
  border:1px solid #555;
}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1350px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;

  border:1px solid #666;
  padding:6px 0;
}

/* MIDDLE GAP VISUAL DEBUG */
.midBox{
  border:2px dashed yellow !important;
}

#midCol{
  position:absolute;
  left:50%;
  top:40px;
  bottom:40px;
  width:var(--mid);
  transform:translateX(-50%);
  border:2px dashed yellow;
  pointer-events:none;
}

/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{
  text-align:center;
  font-size:12px;
  margin-bottom:4px;

}

.totWrap,
.chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{
  width:100%;
  border:1px solid #666;
}

.chgInner{
  position:relative;
  width:100%;
  height:40px;
  overflow:hidden;
  padding:0;
}
.chgInner .bar{
  position:absolute;
  height:16px;
}

.activeSymbol{
  border:1px solid #ffffff !important;
  font-weight:bold;
  transform:scale(1.22);
  box-shadow:0 0 12px rgba(255,255,255,0.9);
  z-index:5;
}




/* bars */
.bar{
  height:18px;
  border:none;
  box-sizing:border-box;
}

.ce{ background:#00ff6a; }      /* base CE = green */
.pe{ background:#ff4040; }      /* base PE = red   */

.deep.ce{ background:#00aa55; } /* CE increase     */
.deep.pe{ background:#aa0000; } /* PE increase     */

/* CHANGE IN OI ONLY COLORS */
.chg-ce{
  background:#17D16B;
}
.chg-pe{
  background:#D11743;
}

.r{ margin-left:auto; }
.l{ margin-right:auto; }

.strike{
  text-align:center;
  font-weight:normal;

  color:#fff;
  margin-top:14px;   /* pushes it slightly downward */
  position:relative;
  z-index:500;
}

/* compact spacing */
.stack { gap:0 !important; }
.box   { padding:2px !important; }
.totWrap,
.chgWrap { padding:1px !important; }

/* ===== MOBILE / TABLET TWEAKS (NO DESKTOP CHANGE) ===== */

/* Tablets + phones */
@media (max-width: 900px){

  /* Screen: allow scroll, reduce padding */
  #screen{
    height:auto;
    min-height:100vh;
    padding:10px;
  }

  /* Grid: full width, top aligned */
  #grid{
    max-width:100%;
    width:100%;
    margin:0;
    justify-content:flex-start;
    overflow-x:hidden;
  }

  /* Headers full width */
  .outerRowHeader{
    max-width:100%;
    width:100%;
    margin:6px 0 8px 0;
  }

  .outerBoxTitle{
    font-size:12px;
    padding:4px 2px;
  }

  .topbar{
    padding:4px 4px;
    gap:8px;
  }

  select{
    font-size:12px;
    padding:3px 6px;
  }

  .row{
    min-height:16px;
  }
}

/* Phones */
@media (max-width: 600px){

  :root{
    --mid:56px;   /* narrower middle ladder, more space for bars */
  }

  /* Decorative frames hide on phones */
  #grid::before,
  #grid::after,
  #midCol{
    display:none;
  }

  .row{
    grid-template-columns:1fr var(--mid) 1fr;
    min-height:18px;
  }

  .strike{
    font-size:11px;
    margin-top:6px;
  }

  .chgInner{
    height:32px;
  }

  .bar{
    height:16px;
  }

  /* Safe-area for notch */
  body{
    padding-top:env(safe-area-inset-top);
  }

  .topbar{
    padding-top:calc(4px + env(safe-area-inset-top));
    margin-top:0;
  }
}

/* Very small phones */
@media (max-width: 420px){

  :root{
    --mid:48px;
  }

  select{
    font-size:11px;
    padding:2px 4px;
  }

  .outerBoxTitle{
    font-size:11px;
  }

  .row{
    min-height:16px;
  }

  .strike{
    font-size:10px;
  }
}
</style>




</head>

<div class="topbar">

  }else{
    bottomRow.appendChild(btn);
  }

});


var container = document.getElementById("symbolButtons");
container.innerHTML = "";
container.style.display = "flex";
container.style.flexDirection = "column";
container.style.justifyContent = "flex-start";
container.style.alignItems = "flex-start";
container.style.gap = "8px";

container.appendChild(topRow);
container.appendChild(bottomRow);

// cache buttons once
window.symbolButtons = Array.from(
  document.querySelectorAll("#symbolButtons button")
);




ulSel.onchange = function(){
  expSel.innerHTML="";
  Object.keys(DATA[ulSel.value]).forEach(function(e){
    var o=document.createElement("option");
    o.text=e; 
    o.value=e;
    expSel.add(o);
  });

  expSel.selectedIndex=0;

  render();

  // force spike color apply after DOM settles
  setTimeout(function(){
    render();
  }, 0);
};



expSel.onchange = render;

const st=JSON.parse(localStorage.getItem("oi_state")||"{}");
if(st.ul && DATA[st.ul]){
  ulSel.value=st.ul;
  ulSel.onchange();
  if(st.exp) expSel.value=st.exp;
}else{
  ulSel.selectedIndex=0;
  ulSel.onchange();
}

/* ---- INITIAL SPIKE EVALUATION FOR ALL SYMBOLS ---- */

(function(){

  const originalUL  = ulSel.value;
  const originalEXP = expSel.value;

  window.symbolButtons.forEach(btn => {

    const symbol = btn.dataset.symbol;

    if (!DATA[symbol]) return;

    const expiries = Object.keys(DATA[symbol]);
    if (!expiries.length) return;

    const exp = expiries[0];   // first expiry only

    const obj = DATA[symbol][exp];
    const rows = obj.table;
    const atm = obj.atm;
    const ltp = obj.ltp;

    const idx = rows.findIndex(r => r.STRIKE_TXT === atm);
    if (idx === -1) return;

    const half = Math.floor(15/2);
    const win = rows.slice(Math.max(0, idx-half), idx+half+1);

    let chCE = 0, chPE = 0;

    win.forEach(r=>{
      chCE += Number(r["Change In OI_CE"]||0);
      chPE += Number(r["Change In OI_PE"]||0);
    });

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    let spikeColor = null;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    if (spikeColor === "ADDITION_UP") {
      btn.style.background = "#F59767";
    }
    else if (spikeColor === "ADDITION_DOWN") {
      btn.style.background = "#3AEDF2";
    }
    else if (spikeColor === "BOTH") {
      btn.style.background = "#4E5454";
    }


  });

  ulSel.value = originalUL;
  expSel.value = originalEXP;

})();



function render(){
  leftCol.innerHTML="";
  rightCol.innerHTML="";

  var ul=ulSel.value, exp=expSel.value;
  var obj=DATA[ul][exp];
  document.getElementById("midHeader").innerHTML =
    "LTP<br>" + obj.ltp.toFixed(2);

  var rows=obj.table;
  var atm=obj.atm;
  var ltp=obj.ltp;

  var ltpStrike = rows.reduce((a,b)=>
    Math.abs(b.STRIKE_TXT-ltp) < Math.abs(a.STRIKE_TXT-ltp) ? b : a
  );

  var idx = rows.findIndex(r=>r.STRIKE_TXT===atm);
  var half = Math.floor(15/2);
  var win = rows.slice(Math.max(0,idx-half), idx+half+1);

  /* ---- HEADER PCR CALC ---- */

  let totCE = 0, totPE = 0;
  let chCE = 0, chPE = 0;

  win.forEach(r=>{
    const ceOI = Number(r["OI_CE"]||0);
    const peOI = Number(r["OI_PE"]||0);
    const ceCh = Number(r["Change In OI_CE"]||0);
    const peCh = Number(r["Change In OI_PE"]||0);

    totCE += ceOI + ceCh;
    totPE += peOI + peCh;

    chCE += ceCh;
    chPE += peCh;

  });


  const pcrTot = totCE ? (totPE/totCE).toFixed(2) : "0.00";
  const pcrCh  = chCE  ? (chPE/chCE).toFixed(2)  : "0.00";

    let mBiasLabel = "BALANCED";
    let mBiasColor = "white";

    if (Number(pcrTot) > 1.2) {
      mBiasLabel = "LONG BIAS";
      mBiasColor = "#00ff6a";
    } else if (Number(pcrTot) < 0.8) {
      mBiasLabel = "SHORT BIAS";
      mBiasColor = "#C21A0E";
    }

    document.getElementById("pcrTotal").innerHTML =
      "mPCR: " + pcrTot +
      " | <span style='color:" + mBiasColor + ";font-weight:bold'>" + mBiasLabel + "</span>" +
      " | prev1: " + obj.prev1_mPCR +
      " | prev2: " + obj.prev2_mPCR;


    let biasLabel = "BALANCED";
    let biasColor = "white";

    if (Number(pcrCh) > 1.2) {
      biasLabel = "LONG PRESSURE";
      biasColor = "#00ff6a";
    } else if (Number(pcrCh) < 0.8) {
      biasLabel = "SHORT PRESSURE";
      biasColor = "#C21A0E";
    }

    document.getElementById("pcrChange").innerHTML =
      "cPCR: " + pcrCh +
      " | <span style='color:" + biasColor + ";font-weight:bold'>" + biasLabel + "</span>" +
      " | prev1: " + obj.prev1_cPCR +
      " | prev2: " + obj.prev2_cPCR;
      
    // ---- ATTENTION SPIKE LOGIC ----

    let spikeColor = null;

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    window.currentSpike = spikeColor;

    // ---- APPLY SPIKE COLOR (PERSISTENT PER SYMBOL) ----

    window.symbolButtons.forEach(b => {
      b.classList.remove("activeSymbol");
    });

    const activeBtn = window.symbolButtons
      .find(b => b.dataset.symbol === ul);

    if (activeBtn) {

      activeBtn.classList.add("activeSymbol");

      if (spikeColor === "ADDITION_UP") {
        activeBtn.style.background = "#F59767";
      }
      else if (spikeColor === "ADDITION_DOWN") {
        activeBtn.style.background = "#3AEDF2";
      }
      else if (spikeColor === "BOTH") {
        activeBtn.style.background = "#4E5454";
      }
      else {
        if (!["NIFTY","BANKNIFTY"].includes(activeBtn.dataset.symbol)) {
          activeBtn.style.background = "";
        }
      }
    }




  

  

  

  // ---- SCALE ONLY WINDOW ----
  // ---- SCALE ONLY WINDOW ----
  var maxTot = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["OI_CE"]||0) + Math.abs(x["Change In OI_CE"]||0),
      Math.abs(x["OI_PE"]||0) + Math.abs(x["Change In OI_PE"]||0)
    )
  ));



  var maxCh = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["DELTA_FROM_LAST4_CE"]||0),
      Math.abs(x["DELTA_FROM_LAST4_PE"]||0)
    )
  ));


  win.slice().reverse().forEach(function(r){

    var ceOI = Number(r["OI_CE"]||0);
    var peOI = Number(r["OI_PE"]||0);
    var ceCh = Number(r["DELTA_FROM_LAST4_CE"]||0);
    var peCh = Number(r["DELTA_FROM_LAST4_PE"]||0);

    var ceRaw = Number(r["Change In OI_CE"]||0);
    var peRaw = Number(r["Change In OI_PE"]||0);

    // ---- TOTAL = OI + Change In OI (RAW) ----
    var ceTot = ceOI + ceRaw;
    var peTot = peOI + peRaw;

    function pct(v){ return (Math.abs(v) / maxTot) * 100; }

    var ceBasePct = pct(ceOI);
    var peBasePct = pct(peOI);

    var ceTotPct  = pct(ceTot);
    var peTotPct  = pct(peTot);

    var ceAddPct = ceRaw>0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peAddPct = peRaw>0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    var ceCutPct = ceRaw<0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peCutPct = peRaw<0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    function clamp(x){ return Math.max(0,Math.min(100,x)); }

    ceBasePct=clamp(ceBasePct); peBasePct=clamp(peBasePct);
    ceTotPct =clamp(ceTotPct);  peTotPct =clamp(peTotPct);
    ceAddPct =clamp(ceAddPct);  peAddPct =clamp(peAddPct);
    ceCutPct =clamp(ceCutPct);  peCutPct =clamp(peCutPct);

    var row=document.createElement("div");
    row.className="row"+(r.STRIKE_TXT===atm?" atm":"");

    var strikeHTML =
      '<div class="strike">'+
        '<div class="stkPrice">'+r.STRIKE_TXT+'</div>'+
        '<div class="stkInfo" style="display:none;font-size:11px;margin-top:4px;line-height:1.3;">'+
          'CE: '+ceOI+' ('+(ceCh>=0?'+':'')+ceCh+')<br>'+
          'PE: '+peOI+' ('+(peCh>=0?'+':'')+peCh+')<br>'+
          'ΔCE: '+(ceCh>=0?'+':'')+ceCh+
          ' &nbsp; ΔPE: '+(peCh>=0?'+':'')+peCh+
        '</div>'+
      '</div>';

    row.onmouseenter=function(e){
      const rbox=row.getBoundingClientRect();
      const strikeBox=row.querySelector(".strike").getBoundingClientRect();
      const gridBox=document.getElementById("grid").getBoundingClientRect();

      const topLine=document.getElementById("hoverLineTop");
      const botLine=document.getElementById("hoverLineBottom");

      const topPos = rbox.top - gridBox.top;
      const botPos = rbox.bottom - gridBox.top;

      topLine.style.top = topPos + "px";
      botLine.style.top = botPos + "px";

      topLine.style.display="block";
      botLine.style.display="block";

      let tipL=document.getElementById("strikeTipLeft");
      let tipR=document.getElementById("strikeTipRight");

      if(!tipL){
        tipL=document.createElement("div");
        tipL.id="strikeTipLeft";
        tipL.style.position="absolute";
        tipL.style.background="#102018";
        tipL.style.border="2px solid #00ff6a";
        tipL.style.padding="6px 8px";
        tipL.style.fontSize="11px";
        tipL.style.lineHeight="1.4";
        tipL.style.color="white";
        tipL.style.pointerEvents="none";
        tipL.style.zIndex="300";
        tipL.style.minWidth="160px";
        document.body.appendChild(tipL);
      }

      if(!tipR){
        tipR=document.createElement("div");
        tipR.id="strikeTipRight";
        tipR.style.position="absolute";
        tipR.style.background="#1a1020";
        tipR.style.border="2px solid #ff00ff";
        tipR.style.padding="6px 8px";
        tipR.style.fontSize="11px";
        tipR.style.lineHeight="1.4";
        tipR.style.color="white";
        tipR.style.pointerEvents="none";
        tipR.style.zIndex="300";
        tipR.style.minWidth="160px";
        document.body.appendChild(tipR);
      }

      tipL.innerHTML=
        r.STRIKE_TXT+'<br>'+
        'CE: '+ceOI+' ('+(ceRaw>=0?'+':'')+ceRaw+')<br>'+
        'PE: '+peOI+' ('+(peRaw>=0?'+':'')+peRaw+')';

      tipR.innerHTML=
        'CHANGE IN OI<br>'+
        'CE: '+(ceCh>=0?'+':'')+ceCh+'<br>'+
        'PE: '+(peCh>=0?'+':'')+peCh;

      const strikeLeft  = strikeBox.left;
      const strikeRight = strikeBox.right;

      const gap = 8;
      const leftExtra = 160;

      const rowCenterY = rbox.top + rbox.height / 2;
      const upShift = 30;

      tipL.style.top = (rowCenterY - tipL.offsetHeight / 2 - upShift) + "px";
      tipR.style.top = (rowCenterY - tipR.offsetHeight / 2 - upShift) + "px";

      tipL.style.left =
        (strikeLeft - tipL.offsetWidth - gap - leftExtra) + "px";

      tipR.style.left =
        (strikeRight + gap) + "px";

      tipL.style.display="block";
      tipR.style.display="block";
    };

    row.onmouseleave=function(){
      const topLine=document.getElementById("hoverLineTop");
      const botLine=document.getElementById("hoverLineBottom");

      if(topLine) topLine.style.display="none";
      if(botLine) botLine.style.display="none";

      const tipL=document.getElementById("strikeTipLeft");
      const tipR=document.getElementById("strikeTipRight");

      if(tipL) tipL.style.display="none";
      if(tipR) tipR.style.display="none";
    };

    // simple mobile flag
    var isMobile = window.innerWidth <= 600;

    if(!isMobile){

      // ===== DESKTOP MARKUP (unchanged) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

          '<div style="position:relative;height:18px;width:100%;">'+
            '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
            (ceRaw>0
              ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:white;border:2px solid white"></div>')+
          '</div>'+

          '<div style="position:relative;height:18px;width:100%;margin-top:4px;">'+
            '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
            (peRaw>0
              ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:white;border:2px solid white"></div>')+
          '</div>'+

        '</div></div></div>'+

        strikeHTML+

        '<div class="box">'+
          '<div class="chgInner">'+
            '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#666"></div>'+
            '<div class="bar chg-ce" style="left:50%;top:0px;width:'+((Math.abs(ceCh)/maxCh)*45)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
            '<div class="bar chg-pe" style="left:50%;top:20px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '</div>'+
        '</div>';

    } else {

      // ===== MOBILE MARKUP (more compact, stacked text inside same grid) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

          '<div style="position:relative;height:16px;width:100%;">'+
            '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
            (ceRaw>0
              ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:white;border:1px solid white"></div>')+
          '</div>'+

          '<div style="position:relative;height:16px;width:100%;margin-top:2px;">'+
            '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
            (peRaw>0
              ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:white;border:1px solid white"></div>')+
          '</div>'+

        '</div></div></div>'+

        strikeHTML+

        '<div class="box">'+
          '<div class="chgInner" style="height:30px;">'+
            '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#666"></div>'+
            '<div class="bar chg-ce" style="left:50%;top:2px;width:'+((Math.abs(ceCh)/maxCh)*45)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
            '<div class="bar chg-pe" style="left:50%;top:16px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '</div>'+
        '</div>';
    }

    leftCol.appendChild(row);

    if(r.STRIKE_TXT===ltpStrike.STRIKE_TXT){
      row.style.position="relative";

      const ltpLine=document.createElement("div");
      ltpLine.style.position="absolute";
      ltpLine.style.left="0";
      ltpLine.style.width="100%";
      ltpLine.style.top="50%";
      ltpLine.style.borderTop="2px solid #A6AEB3";

      ltpLine.style.pointerEvents="none";
      ltpLine.style.zIndex="20";

      const ltpLbl=document.createElement("div");
      ltpLbl.innerText="LTP "+ltp.toFixed(2);
      ltpLbl.style.position="absolute";
      ltpLbl.style.left="42%";
      ltpLbl.style.top="50%";
      ltpLbl.style.transform="translate(-50%,-50%)";
      ltpLbl.style.color="white";
      ltpLbl.style.fontWeight="normal";
      ltpLbl.style.fontSize="12px";
      ltpLbl.style.background="#012A40";
      ltpLbl.style.padding="2px 6px";
      ltpLbl.style.zIndex="25";

      row.appendChild(ltpLine);
      row.appendChild(ltpLbl);
    }

  });

}
</script>
<script>
let lastScanText =
  document.querySelector("#chgHeader span").innerText;

async function checkUpdate(){
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/Scan:\s*([0-9\-: ]+)/);

    if(m && m[1] !== lastScanText){

      localStorage.setItem("oi_state",
        JSON.stringify({ul:ulSel.value,exp:expSel.value})
      );

      location.replace(location.href);
      return;
    }

    // If no reload, still re-render to refresh spike detection
    render();

  }catch(e){}
}


setInterval(checkUpdate, 10000);
</script>
