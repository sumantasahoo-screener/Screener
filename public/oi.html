
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="oi-scan-time" content="2026-03-04 15:10:23">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== LIGHT THEME ===== */
:root{
  --mid:       80px;

  /* Light palette */
  --bg:        #ffffff;
  --bg2:       #f8f9fa;
  --bg3:       #f0f0f0;
  --bg4:       #fafafa;
  --panel:     #f5f5f5;

  /* Borders */
  --border:    #e0e0e0;
  --border2:   #d0d0d0;

  /* Accents */
  --gold:      #ffc107;
  --gold-dim:  #ff9800;
  --cyan:      #2196F3;
  --cyan-dim:  #1976d2;

  /* Data colors */
  --ce:        #1ed97a;
  --ce-deep:   #0fa854;
  --pe:        #e8404a;
  --pe-deep:   #9e1e26;
  --chg-ce:    #22e882;
  --chg-pe:    #f03545;

  /* Text - DARK for light background */
  --text:      #333333;
  --text-dim:  #333333;
  --text-mid:  #333333;

  /* Font */
  --font-ui:   'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

/* ===== RESET ===== */
html,body{
  margin:0; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  box-sizing:border-box;
}
*,*::before,*::after{ box-sizing:inherit; }

/* Subtle grid texture on body */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(29,216,224,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29,216,224,0.02) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ===== SCREEN CONTAINER ===== */
#screen{
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:10px 16px 6px;
  position:relative;
  z-index:1;
}

/* ===== TOPBAR ===== */
.topbar{
  padding:5px 0 8px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  flex-shrink:0;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  gap:10px;
}

#symbolButtons{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:visible;
  padding-left:2px;
  min-width:0;
}

#symbolButtons > div{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

#symbolDivider{
  width:1px;
  align-self:stretch;
  background:var(--border);
  flex-shrink:0;
  margin:0 4px;
}

#dropdownWrap{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ===== SYMBOL BUTTONS ===== */
#symbolButtons button{
  font-family:var(--font-mono);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0.03em;
  padding:4px 10px;
  border:1px solid var(--border2);
  background:var(--bg3);
  color:var(--text-mid);
  cursor:pointer;
  border-radius:2px;
  min-width:80px;
  text-align:center;
  transition:all 0.15s ease;
  position:relative;
  overflow:hidden;
  white-space:nowrap;
}

#symbolButtons button::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events:none;
}

#symbolButtons button:hover{
  border-color:var(--cyan-dim);
  color:var(--cyan);
  background:rgba(29,216,224,0.06);
  box-shadow:0 0 8px rgba(29,216,224,0.08);
}

/* Active / selected button */
.activeSymbol{
  border-color:var(--gold) !important;
  color:var(--gold) !important;
  background:rgba(200,168,75,0.1) !important;
  font-weight:600 !important;
  transform:none !important;
  box-shadow:0 0 0 1px var(--gold-dim),
             0 0 12px rgba(200,168,75,0.15) !important;
  z-index:5;
}

/* ===== DROPDOWNS ===== */
select{
  font-family:var(--font-mono);
  font-size:12px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border2);
  border-radius:2px;
  padding:4px 8px;
  cursor:pointer;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}
select:focus{ border-color:var(--cyan-dim); }
#dropdownWrap select{ width:104px; }

/* ===== THEME SWITCH BUTTON ===== */
#themeSwitch {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 2px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: all 0.2s;
  white-space: nowrap;
}

#themeSwitch:hover {
  background: #45a049;
  box-shadow: 0 2px 6px rgba(76,175,80,0.3);
}

/* ===== HEADER ROW ===== */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1400px;
  width:100%;
  margin:7px auto 5px;
  border:1px solid var(--border);
  border-radius:3px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:0 1px 0 rgba(29,216,224,0.06),
             inset 0 1px 0 rgba(255,255,255,0.02);
}

.outerBoxTitle{
  text-align:center;
  font-size:13px;
  font-family:var(--font-mono);
  letter-spacing:0.04em;
  padding:7px 6px;
  background:var(--panel);
  border-right:1px solid var(--border);
  line-height:1.7;
  color:var(--text-mid);
}
.outerBoxTitle:last-child{ border-right:none; }

/* LTP middle cell */
#midHeader{
  background:var(--bg4);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:500;
  color:var(--text-dim);
  line-height:1.5;
  letter-spacing:0.05em;
}

/* ===== GRID ===== */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  position:relative;
  min-height:0;
  overflow-y:auto;
}

/* Outer border frames */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:0; bottom:0;
  width:calc((100% - var(--mid)) / 2);
  border:1px solid var(--border);
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* ===== ROWS ===== */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0; gap:0;
  transition:background 0.08s;
}
.row:hover{
  background:rgba(29,216,224,0.025);
}
.row.atm{
  border-top:1px solid rgba(200,168,75,0.45);
  border-bottom:1px solid rgba(200,168,75,0.45);
  background:rgba(200,168,75,0.04);
}

/* hover crosshair */
.hoverLine{
  position:absolute;
  left:0; right:0;
  height:1px;
  background:rgba(200,168,75,0.55);
  pointer-events:none;
  z-index:50;
  display:none;
}

/* ===== MID STRIKE COLUMN ===== */
#midCol{
  position:absolute;
  left:50%; top:0; bottom:0;
  width:var(--mid);
  transform:translateX(-50%);
  pointer-events:none;
}

.strike{
  text-align:center;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:500;
  letter-spacing:0.02em;
  color:var(--text-mid);
  margin-top:12px;
  position:relative;
  z-index:500;
}

/* ===== BARS ===== */
.stack{ display:flex; flex-direction:column; gap:0; }

.box{
  border:none; padding:2px;
  display:flex; flex-direction:column;
  justify-content:center; width:100%;
}

.totWrap,
.chgWrap{
  height:100%; display:flex;
  align-items:center; padding:1px;
}

.chgInner{
  position:relative; width:100%;
  height:40px; overflow:hidden;
}
.chgInner .bar{ position:absolute; height:15px; border-radius:1px; }

.bar{
  height:17px;
  border:none;
  box-sizing:border-box;
  border-radius:1px;
}

.ce      { background:var(--ce); }
.pe      { background:var(--pe); }
.deep.ce { background:var(--ce-deep); }
.deep.pe { background:var(--pe-deep); }
.chg-ce  { background:var(--chg-ce); }
.chg-pe  { background:var(--chg-pe); }

.r{ margin-left:auto; }
.l{ margin-right:auto; }

/* ===================================================================
   RESPONSIVE
=================================================================== */

/* ── TABLET (<=900px) ── */
@media (max-width:900px){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:8px;
  }
  #grid{
    max-width:100%; justify-content:flex-start;
    flex:none; overflow-y:visible;
  }
  .outerRowHeader{ max-width:100%; margin:6px 0; }
  .outerBoxTitle{ font-size:10px; padding:4px 2px; }
  .topbar{ flex-wrap:wrap; height:auto; }
  select{ font-size:10px; }
  .row{ min-height:16px; }
}

/* ── LANDSCAPE PHONE (height <= 480px) ── */
@media (max-height:480px) and (orientation:landscape){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:3px 8px;
  }
  .topbar{
    flex-direction:row; flex-wrap:nowrap;
    padding-bottom:3px; gap:6px;
  }
  #symbolButtons{ gap:3px; }
  #symbolButtons button{ font-size:8.5px; padding:2px 5px; min-width:48px; }
  .outerRowHeader{ margin:3px 0; }
  .outerBoxTitle{ font-size:8.5px; padding:2px 1px; }
  #midHeader{ font-size:8.5px; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }
  .row{ min-height:13px; }
  .bar{ height:12px; }
  .chgInner{ height:25px; }
  .strike{ font-size:9px; margin-top:3px; }
}

/* ── PORTRAIT PHONE (<=600px) ── */
@media (max-width:600px){
  :root{ --mid:56px; }

  body{ padding-top:env(safe-area-inset-top); }

  #screen{
    height:auto; min-height:100svh; overflow-y:auto;
    padding:6px;
    padding-top:calc(6px + env(safe-area-inset-top));
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }

  .topbar{
    flex-direction:column; align-items:stretch;
    gap:6px; padding-bottom:8px; height:auto;
  }

  #symbolButtons{ width:100%; }
  #symbolButtons > div{ 
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  #symbolButtons button{ font-size:10px; padding:5px 6px; min-width: auto; }

  #symbolDivider{ display:none; }

  #dropdownWrap{ 
    width:100%; 
    display: flex;
    gap: 6px;
  }
  #dropdownWrap select{ 
    flex: 1;
    font-size: 11px;
  }
  
  #themeSwitch {
    font-size: 11px;
    padding: 5px 8px;
  }

  #grid::before, #grid::after, #midCol{ display:none; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }

  .row{ grid-template-columns:1fr var(--mid) 1fr; min-height:20px; }
  .strike{ font-size:10px; margin-top:6px; }
  .chgInner{ height:32px; }
  .bar{ height:16px; }
  
  /* COMPACT 2-COLUMN HEADER */
  .outerRowHeader{
    grid-template-columns: 1fr 1fr;
    margin: 6px 0;
    gap: 0;
  }
  
  .outerBoxTitle{ 
    font-size:10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    line-height: 1.4;
  }
  
  .outerBoxTitle:nth-child(2n) {
    border-right: none;
  }
  
  .outerBoxTitle:nth-child(n+3) {
    border-bottom: none;
  }
  
  #midHeader{ 
    display: none;
  }
}

/* ── VERY SMALL (<=420px) ── */
@media (max-width:420px){
  :root{ --mid:48px; }
  #symbolButtons button{ min-width:50px; font-size:8.5px; }
  select{ font-size:9.5px; }
  .strike{ font-size:9.5px; }
  .row{ min-height:15px; }
}
</style>




</head>

// ===== THEME SWITCH BUTTON =====
if (themeSwitch) {
  themeSwitch.addEventListener("click", function(e) {
    e.preventDefault();
    
    let currentUrl = window.location.href.split("?")[0].split("#")[0];
    let newUrl = "";
    
    // Remove trailing slash if present
    if (currentUrl.endsWith("/")) {
      currentUrl = currentUrl.slice(0, -1);
    }
    
    // Check what file we're currently on
    if (currentUrl.endsWith("oi2.html")) {
      // oi2.html → oi.html
      newUrl = currentUrl.replace("oi2.html", "oi.html");
    } else if (currentUrl.endsWith("oi.html")) {
      // oi.html → oi2.html
      newUrl = currentUrl.replace("oi.html", "oi2.html");
    } else if (currentUrl.endsWith("/oi2") || currentUrl.endsWith("oi2")) {
      // /oi2 → /oi.html
      newUrl = currentUrl.replace(/oi2\/?$/, "oi.html");
    } else if (currentUrl.endsWith("/oi") || currentUrl.endsWith("oi")) {
      // /oi → /oi2.html
      newUrl = currentUrl.replace(/oi\/?$/, "oi2.html");
    } else {
      // Last resort: toggle oi and oi2 in path
      if (currentUrl.includes("oi2")) {
        newUrl = currentUrl.replace(/oi2/g, "oi");
      } else if (currentUrl.includes("oi")) {
        newUrl = currentUrl.replace(/oi([^l]|$)/g, "oi2$1");
      }
    }
    
    if (newUrl && newUrl !== currentUrl) {
      console.log("Navigating from:", currentUrl, "to:", newUrl);
      window.location.href = newUrl;
    } else {
      console.log("Could not determine target URL");
    }
  });
}

/* ---- INITIAL SPIKE EVALUATION FOR ALL SYMBOLS ---- */

(function(){

  const originalUL  = ulSel.value;
  const originalEXP = expSel.value;

  window.symbolButtons.forEach(btn => {

    const symbol = btn.dataset.symbol;

    if (!DATA[symbol]) return;

    const expiries = Object.keys(DATA[symbol]);
    if (!expiries.length) return;

    const exp = expiries[0];   // first expiry only

    const obj = DATA[symbol][exp];
    const rows = obj.table;
    const atm = obj.atm;
    const ltp = obj.ltp;

    const idx = rows.findIndex(r => r.STRIKE_TXT === atm);
    if (idx === -1) return;

    const half = Math.floor(15/2);
    const win = rows.slice(Math.max(0, idx-half), idx+half+1);

    let chCE = 0, chPE = 0;

    win.forEach(r=>{
      chCE += Number(r["Change In OI_CE"]||0);
      chPE += Number(r["Change In OI_PE"]||0);
    });

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    let spikeColor = null;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    if (spikeColor === "ADDITION_UP") {
      btn.dataset.spikeColor = "ADDITION_UP";
      btn.style.background = "#F59767";
      btn.style.color = "#1a0a00";
      btn.style.borderColor = "#d07040";
    }
    else if (spikeColor === "ADDITION_DOWN") {
      btn.dataset.spikeColor = "ADDITION_DOWN";
      btn.style.background = "#3AEDF2";
      btn.style.color = "#001a1c";
      btn.style.borderColor = "#20c0c8";
    }
    else if (spikeColor === "BOTH") {
      btn.dataset.spikeColor = "BOTH";
      btn.style.background = "#4E5454";
      btn.style.color = "#e0e8e8";
      btn.style.borderColor = "#6a7878";
    }
    else {
      btn.dataset.spikeColor = "";
    }


  });

  ulSel.value = originalUL;
  expSel.value = originalEXP;

})();

    document.getElementById("pcrChange").innerHTML =
      "<span style='color:#000;font-size:13px;'>cPCR:</span> <span style='color:#000;font-size:14px;font-weight:600;'>" + pcrCh + "</span>" +
      " <span style='color:#ddd;'>|</span> <span style='color:" + biasColor + ";font-weight:600;letter-spacing:0.05em;font-size:14px;'>" + biasLabel + "</span>" +
      "&nbsp;&nbsp;<span style='color:#000;font-size:12px;'>p1:" + obj.prev1_cPCR + " p2:" + obj.prev2_cPCR + "</span>";
      
    // ---- ATTENTION SPIKE LOGIC ----

    let spikeColor = null;

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    window.currentSpike = spikeColor;

    // ---- APPLY SPIKE COLOR (PERSISTENT PER SYMBOL) ----
    // Reset activeSymbol class on all buttons first
    window.symbolButtons.forEach(b => {
      b.classList.remove("activeSymbol");
      // Re-apply stored spike color for non-active buttons
      // (initial scan stored it in btn.dataset.spikeColor)
      const sc = b.dataset.spikeColor || "";
      if(sc === "ADDITION_UP"){
        b.style.background = "#F59767";
        b.style.color = "#1a0a00";
        b.style.borderColor = "#d07040";
      } else if(sc === "ADDITION_DOWN"){
        b.style.background = "#3AEDF2";
        b.style.color = "#001a1c";
        b.style.borderColor = "#20c0c8";
      } else if(sc === "BOTH"){
        b.style.background = "#4E5454";
        b.style.color = "#e0e8e8";
        b.style.borderColor = "#6a7878";
      } else if(indexSymbols.includes(b.dataset.symbol)){
        // Restore index button style
        b.style.background = "linear-gradient(135deg,#2d004d,#6a0dad)";
        b.style.color = "";
        b.style.borderColor = "#4aa3ff";
      } else {
        b.style.background = "";
        b.style.color = "";
        b.style.borderColor = "";
      }
    });

    const activeBtn = window.symbolButtons
      .find(b => b.dataset.symbol === ul);

    if (activeBtn) {

      activeBtn.classList.add("activeSymbol");

      // Store current spike color on active button too
      activeBtn.dataset.spikeColor = spikeColor || "";

      if (spikeColor === "ADDITION_UP") {
        activeBtn.style.background = "#F59767";
        activeBtn.style.color = "#1a0a00";
        activeBtn.style.borderColor = "#d07040";
      }
      else if (spikeColor === "ADDITION_DOWN") {
        activeBtn.style.background = "#3AEDF2";
        activeBtn.style.color = "#001a1c";
        activeBtn.style.borderColor = "#20c0c8";
      }
      else if (spikeColor === "BOTH") {
        activeBtn.style.background = "#4E5454";
        activeBtn.style.color = "#e0e8e8";
        activeBtn.style.borderColor = "#6a7878";
      }
      else {
        activeBtn.style.color = "";
        activeBtn.style.borderColor = "";
        if (!indexSymbols.includes(activeBtn.dataset.symbol)) {
          activeBtn.style.background = "";
        }
      }
    }




  

  

  

  // ---- SCALE ONLY WINDOW ----
  // ---- SCALE ONLY WINDOW ----
  var maxTot = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["OI_CE"]||0) + Math.abs(x["Change In OI_CE"]||0),
      Math.abs(x["OI_PE"]||0) + Math.abs(x["Change In OI_PE"]||0)
    )
  ));



  var maxCh = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["DELTA_FROM_LAST4_CE"]||0),
      Math.abs(x["DELTA_FROM_LAST4_PE"]||0)
    )
  ));


  win.slice().reverse().forEach(function(r){

    var ceOI = Number(r["OI_CE"]||0);
    var peOI = Number(r["OI_PE"]||0);
    var ceCh = Number(r["DELTA_FROM_LAST4_CE"]||0);
    var peCh = Number(r["DELTA_FROM_LAST4_PE"]||0);

    var ceRaw = Number(r["Change In OI_CE"]||0);
    var peRaw = Number(r["Change In OI_PE"]||0);

    // ---- TOTAL = OI + Change In OI (RAW) ----
    var ceTot = ceOI + ceRaw;
    var peTot = peOI + peRaw;

    function pct(v){ return (Math.abs(v) / maxTot) * 100; }

    var ceBasePct = pct(ceOI);
    var peBasePct = pct(peOI);

    var ceTotPct  = pct(ceTot);
    var peTotPct  = pct(peTot);

    var ceAddPct = ceRaw>0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peAddPct = peRaw>0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    var ceCutPct = ceRaw<0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peCutPct = peRaw<0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    function clamp(x){ return Math.max(0,Math.min(100,x)); }

    ceBasePct=clamp(ceBasePct); peBasePct=clamp(peBasePct);
    ceTotPct =clamp(ceTotPct);  peTotPct =clamp(peTotPct);
    ceAddPct =clamp(ceAddPct);  peAddPct =clamp(peAddPct);
    ceCutPct =clamp(ceCutPct);  peCutPct =clamp(peCutPct);

    var row=document.createElement("div");
    row.className="row"+(r.STRIKE_TXT===atm?" atm":"");

    var strikeHTML =
      '<div class="strike">'+
        '<div class="stkPrice">'+r.STRIKE_TXT+'</div>'+
        '<div class="stkInfo" style="display:none;font-size:11px;margin-top:4px;line-height:1.3;">'+
          'CE: '+ceOI+' ('+(ceCh>=0?'+':'')+ceCh+')<br>'+
          'PE: '+peOI+' ('+(peCh>=0?'+':'')+peCh+')<br>'+
          'ΔCE: '+(ceCh>=0?'+':'')+ceCh+
          ' &nbsp; ΔPE: '+(peCh>=0?'+':'')+peCh+
        '</div>'+
      '</div>';

    row.onmouseenter=function(e){
      const rbox=row.getBoundingClientRect();
      const strikeBox=row.querySelector(".strike").getBoundingClientRect();
      const gridBox=document.getElementById("grid").getBoundingClientRect();

      const topLine=document.getElementById("hoverLineTop");
      const botLine=document.getElementById("hoverLineBottom");

      const topPos = rbox.top - gridBox.top;
      const botPos = rbox.bottom - gridBox.top;

      topLine.style.top = topPos + "px";
      botLine.style.top = botPos + "px";

      topLine.style.display="block";
      botLine.style.display="block";

      let tipL=document.getElementById("strikeTipLeft");
      let tipR=document.getElementById("strikeTipRight");

      if(!tipL){
        tipL=document.createElement("div");
        tipL.id="strikeTipLeft";
        tipL.style.position="absolute";
        tipL.style.background="#f5f5f5";
        tipL.style.border="2px solid #333";
        tipL.style.padding="6px 8px";
        tipL.style.fontSize="11px";
        tipL.style.lineHeight="1.4";
        tipL.style.color="#333";
        tipL.style.pointerEvents="none";
        tipL.style.zIndex="300";
        tipL.style.minWidth="160px";
        document.body.appendChild(tipL);
      }

      if(!tipR){
        tipR=document.createElement("div");
        tipR.id="strikeTipRight";
        tipR.style.position="absolute";
        tipR.style.background="#f0f0f0";
        tipR.style.border="2px solid #333";
        tipR.style.padding="6px 8px";
        tipR.style.fontSize="11px";
        tipR.style.lineHeight="1.4";
        tipR.style.color="#333";
        tipR.style.pointerEvents="none";
        tipR.style.zIndex="300";
        tipR.style.minWidth="160px";
        document.body.appendChild(tipR);
      }

      tipL.innerHTML=
        r.STRIKE_TXT+'<br>'+
        'CE: '+ceOI+' ('+(ceRaw>=0?'+':'')+ceRaw+')<br>'+
        'PE: '+peOI+' ('+(peRaw>=0?'+':'')+peRaw+')';

      tipR.innerHTML=
        'CHANGE IN OI<br>'+
        'CE: '+(ceCh>=0?'+':'')+ceCh+'<br>'+
        'PE: '+(peCh>=0?'+':'')+peCh;

      const strikeLeft  = strikeBox.left;
      const strikeRight = strikeBox.right;

      const gap = 8;
      const leftExtra = 160;

      const rowCenterY = rbox.top + rbox.height / 2;
      const upShift = 30;

      tipL.style.top = (rowCenterY - tipL.offsetHeight / 2 - upShift) + "px";
      tipR.style.top = (rowCenterY - tipR.offsetHeight / 2 - upShift) + "px";

      tipL.style.left =
        (strikeLeft - tipL.offsetWidth - gap - leftExtra) + "px";

      tipR.style.left =
        (strikeRight + gap) + "px";

      tipL.style.display="block";
      tipR.style.display="block";
    };

    row.onmouseleave=function(){
      const topLine=document.getElementById("hoverLineTop");
      const botLine=document.getElementById("hoverLineBottom");

      if(topLine) topLine.style.display="none";
      if(botLine) botLine.style.display="none";

      const tipL=document.getElementById("strikeTipLeft");
      const tipR=document.getElementById("strikeTipRight");

      if(tipL) tipL.style.display="none";
      if(tipR) tipR.style.display="none";
    };

    // simple mobile flag
    var isMobile = window.innerWidth <= 600;

    if(!isMobile){

      // ===== DESKTOP MARKUP (unchanged) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

          '<div style="position:relative;height:18px;width:100%;">'+
            '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
            (ceRaw>0
              ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 4px, transparent 4px, transparent 8px);border:1px solid #bbb;box-sizing:border-box"></div>')+
          '</div>'+

          '<div style="position:relative;height:18px;width:100%;margin-top:4px;">'+
            '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
            (peRaw>0
              ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 4px, transparent 4px, transparent 8px);border:1px solid #bbb;box-sizing:border-box"></div>')+
          '</div>'+

        '</div></div></div>'+

        strikeHTML+

        '<div class="box">'+
          '<div class="chgInner">'+
            '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ccc"></div>'+
            '<div class="bar chg-ce" style="left:50%;top:0px;width:'+((Math.abs(ceCh)/maxCh)*45)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
            '<div class="bar chg-pe" style="left:50%;top:20px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '</div>'+
        '</div>';

    } else {

      // ===== MOBILE MARKUP (more compact, stacked text inside same grid) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

          '<div style="position:relative;height:16px;width:100%;">'+
            '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
            (ceRaw>0
              ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 4px, transparent 4px, transparent 8px);border:1px solid #bbb;box-sizing:border-box"></div>')+
          '</div>'+

          '<div style="position:relative;height:16px;width:100%;margin-top:2px;">'+
            '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
            (peRaw>0
              ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:repeating-linear-gradient(45deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 4px, transparent 4px, transparent 8px);border:1px solid #bbb;box-sizing:border-box"></div>')+
          '</div>'+

        '</div></div></div>'+

        strikeHTML+

        '<div class="box">'+
          '<div class="chgInner" style="height:30px;">'+
            '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ccc"></div>'+
            '<div class="bar chg-ce" style="left:50%;top:2px;width:'+((Math.abs(ceCh)/maxCh)*45)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
            '<div class="bar chg-pe" style="left:50%;top:16px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '</div>'+
        '</div>';
    }

    leftCol.appendChild(row);

    if(r.STRIKE_TXT===ltpStrike.STRIKE_TXT){
      row.style.position="relative";

      const ltpLine=document.createElement("div");
      ltpLine.style.position="absolute";
      ltpLine.style.left="0";
      ltpLine.style.width="100%";
      ltpLine.style.top="50%";
      ltpLine.style.borderTop="2px solid #999";

      ltpLine.style.pointerEvents="none";
      ltpLine.style.zIndex="20";

      const ltpLbl=document.createElement("div");
      ltpLbl.innerText="LTP "+ltp.toFixed(2);
      ltpLbl.style.position="absolute";
      ltpLbl.style.left="42%";
      ltpLbl.style.top="50%";
      ltpLbl.style.transform="translate(-50%,-50%)";
      ltpLbl.style.color="#333";
      ltpLbl.style.fontWeight="normal";
      ltpLbl.style.fontSize="12px";
      ltpLbl.style.background="#ffffff";
      ltpLbl.style.padding="2px 6px";
      ltpLbl.style.zIndex="25";
      ltpLbl.style.border="1px solid #ccc";

      row.appendChild(ltpLine);
      row.appendChild(ltpLbl);
    }

  });

}
</script>
<script>
// ── AUTO-REFRESH (localStorage + reload — guaranteed kaam karta hai) ──
// Har 10 sec mein naya HTML fetch karo
// Agar scan time badli → state save karo → page reload karo
// Page load pe state restore karo (already handled above via st variable)

const scanMeta = document.querySelector('meta[name="oi-scan-time"]');
let lastScanTime = scanMeta ? scanMeta.content.trim() : "";

function getFileUrl(){
  const base = location.href.split("?")[0];
  return base.endsWith(".html") ? base : base + ".html";
}

async function checkUpdate(){
  try{
    const url = getFileUrl() + "?_t=" + Date.now();
    const res = await fetch(url, {
      cache: "no-store",
      headers: { "pragma": "no-cache", "cache-control": "no-cache" }
    });
    if(!res.ok) return;
    const html = await res.text();

    // Scan time check karo
    const metaMatch = html.match(/<meta name="oi-scan-time" content="([^"]+)"/);
    if(!metaMatch) return;
    const newScanTime = metaMatch[1].trim();

    if(newScanTime === lastScanTime){
      // Same data — kuch nahi karo
      return;
    }

    // ── Naya data aaya — state save karo aur reload karo ──
    localStorage.setItem("oi_state", JSON.stringify({
      ul:  ulSel.value,
      exp: expSel.value
    }));

    location.replace(location.href.split("?")[0]);

  }catch(e){ /* silent fail — retry next cycle */ }
}

setInterval(checkUpdate, 10000);
</script>
