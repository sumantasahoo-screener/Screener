
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;height:100%;background:#0b0f14;color:white;font-family:Arial;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}
/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1200px; /* keep centered width */
  width:100%;
  margin:0 auto;
  position:relative;
}

.hoverLine{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:#ffd000;
  pointer-events:none;
  z-index:50;
  display:none;
}

/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:40px;        /* was 100px */
  bottom:40px;     /* was 100px */
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}

#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0px;
  box-sizing:border-box;
}
/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}


/* topbar */
.topbar{
  padding:6px;
  border-bottom:1px solid #444;
  display:flex;
  gap:12px;
  justify-content:center;
}

select{background:#111;color:white;border:1px solid #555}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1200px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;
  opacity:.8;
  border:1px solid #666;
  padding:6px 0;
}
/* MIDDLE GAP VISUAL DEBUG */
.midBox{
  border:2px dashed yellow !important;
}

#midCol{
  position:absolute;
  left:50%;
  top:40px;
  bottom:40px;
  width:var(--mid);
  transform:translateX(-50%);
  border:2px dashed yellow;
  pointer-events:none;
}


/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{ text-align:center; font-size:12px; margin-bottom:4px; opacity:.8; }

.totWrap, .chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{ width:100%; border:1px solid #666; }

.chgInner{
  position:relative;
  width:100%;
  height:40px;
  overflow:hidden;
  padding:0;
}

.chgInner .bar{
  position:absolute;
  height:16px;
}


/* bars */
.bar{
  height:18px;
  border:none;
  box-sizing:border-box;
}

.ce{ background:#00ff6a; }      /* base CE = green */
.pe{ background:#ff4040; }      /* base PE = red  */

.deep.ce{ background:#00aa55 }  /* CE increase */
.deep.pe{ background:#aa0000 }  /* PE increase */

/* CHANGE IN OI ONLY COLORS */
.chg-ce{
  background:#17D16B;   /* blue */
}

.chg-pe{
  background:#D11743;   /* magenta */
}



.r{ margin-left:auto }
.l{ margin-right:auto }

.strike{
  text-align:center;
  font-weight:bold;
  color:#fff;
  margin-top:14px;   /* pushes it slightly downward */
}



.stack { gap:0px !important; }
.box { padding:2px !important; }
.totWrap, .chgWrap { padding:1px !important; }

.strike{
  position:relative;
  z-index:500;
}

/* ================= MOBILE ONLY ADDITIONS ================= */

@media (max-width: 900px){

  #screen{
    padding:10px;
  }

  #grid{
    max-width:100%;
    overflow-x:auto;
  }

  .outerRowHeader{
    max-width:100%;
  }

  .row{
    min-height:16px;
  }

}

/* PHONE SIZE */
@media (max-width: 600px){

  :root{
    --mid:60px;
  }

  #grid::before,
  #grid::after,
  #midCol{
    display:none;
  }

  .row{
    grid-template-columns:1fr var(--mid) 1fr;
    min-height:14px;
  }

  .outerBoxTitle{
    font-size:11px;
    padding:4px 0;
  }

  .strike{
    font-size:10px;
    margin-top:6px;
  }

  .chgInner{
    height:28px;
  }

  .bar{
    height:14px;
  }

}
/* ===== MOBILE FIX: SAFE TOP AREA FOR NOTCH + STATUS BAR ===== */

@media (max-width: 600px){

  .topbar{
    padding-top: calc(10px + env(safe-area-inset-top));
    margin-top: env(safe-area-inset-top);
  }

  body{
    padding-top: env(safe-area-inset-top);
  }

}


/* ===== MOBILE FIX: REMOVE VERTICAL CENTER GAP ===== */

@media (max-width: 600px){

  #screen{
    height:auto;
    min-height:100vh;
    padding:8px;
  }

  #grid{
    justify-content:flex-start;
  }

}

/* VERY SMALL */
@media (max-width: 420px){

  :root{
    --mid:48px;
  }

  select{
    font-size:11px;
  }

  .row{
    min-height:12px;
  }

}
/* ===== MOBILE FIX: REDUCE ROW + BOX HEIGHT ===== */

@media (max-width: 600px){

  .row{
    min-height:12px;
  }

  .box{
    padding:2px;
  }

  .totWrap,
  .chgWrap{
    padding:1px;
  }

  .chgInner{
    height:24px;
  }

  .bar{
    height:12px;
  }

}


</style>

</head>

const ulSel = document.getElementById("ul");
const expSel = document.getElementById("exp");
const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");
const hoverLine = document.getElementById("hoverLine");

Object.keys(DATA).forEach(function(k){
  var o=document.createElement("option");
  o.text=k; o.value=k;
  ulSel.add(o);
});

ulSel.onchange = function(){
  expSel.innerHTML="";
  Object.keys(DATA[ulSel.value]).forEach(function(e){
    var o=document.createElement("option");
    o.text=e; o.value=e;
    expSel.add(o);
  });
  expSel.selectedIndex=0;
  render();
};

expSel.onchange = render;

const st=JSON.parse(localStorage.getItem("oi_state")||"{}");
if(st.ul && DATA[st.ul]){
  ulSel.value=st.ul;
  ulSel.onchange();
  if(st.exp) expSel.value=st.exp;
  render();
}else{
  ulSel.selectedIndex=0;
  ulSel.onchange();
}


function render(){
  leftCol.innerHTML="";
  rightCol.innerHTML="";

  var ul=ulSel.value, exp=expSel.value;
  var obj=DATA[ul][exp];
  document.getElementById("midHeader").innerHTML =
    "LTP<br>" + obj.ltp.toFixed(2);

  var rows=obj.table;
  var atm=obj.atm;
  var ltp=obj.ltp;

  var ltpStrike = rows.reduce((a,b)=>
    Math.abs(b.STRIKE_TXT-ltp) < Math.abs(a.STRIKE_TXT-ltp) ? b : a
  );

  var idx = rows.findIndex(r=>r.STRIKE_TXT===atm);
  var half = Math.floor(15/2);
  var win = rows.slice(Math.max(0,idx-half), idx+half+1);

  /* ---- HEADER PCR CALC ---- */

  let totCE = 0, totPE = 0;
  let chCE = 0, chPE = 0;

  win.forEach(r=>{
    const ceOI = Number(r["OI_CE"]||0);
    const peOI = Number(r["OI_PE"]||0);
    const ceCh = Number(r["Change In OI_CE"]||0);
    const peCh = Number(r["Change In OI_PE"]||0);

    totCE += ceOI + Math.abs(ceCh);
    totPE += peOI + Math.abs(peCh);

    chCE += Math.abs(ceCh);
    chPE += Math.abs(peCh);
  });

  const pcrTot = totCE ? (totPE/totCE).toFixed(2) : "0.00";
  const pcrCh  = chCE  ? (chPE/chCE).toFixed(2)  : "0.00";

  document.getElementById("pcrTotal").innerText =
    "mPCR: " + pcrTot +
    " | prev1: " + obj.prev1_mPCR +
    " | prev2: " + obj.prev2_mPCR;

  document.getElementById("pcrChange").innerText =
    "cPCR: " + pcrCh +
    " | prev1: " + obj.prev1_cPCR +
    " | prev2: " + obj.prev2_cPCR;


  

  // ---- SCALE ONLY WINDOW ----
  var maxTot = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["OI_CE"]||0) + Math.abs(x["Change In OI_CE"]||0),
      Math.abs(x["OI_PE"]||0) + Math.abs(x["Change In OI_PE"]||0)
    )
  ));

  var maxCh = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["Change In OI_CE"]||0),
      Math.abs(x["Change In OI_PE"]||0)
    )
  ));

  win.slice().reverse().forEach(function(r){


    var ceOI = Number(r["OI_CE"]||0);
    var peOI = Number(r["OI_PE"]||0);
    var ceCh = Number(r["Change In OI_CE"]||0);
    var peCh = Number(r["Change In OI_PE"]||0);

    // ---- TOTAL ALWAYS = OI + |CHANGE| ----
    var ceTot = ceOI + Math.abs(ceCh);
    var peTot = peOI + Math.abs(peCh);

    function pct(v){ return (Math.abs(v) / maxTot) * 100; }

    var ceBasePct = pct(ceOI);
    var peBasePct = pct(peOI);

    var ceTotPct  = pct(ceTot);
    var peTotPct  = pct(peTot);

    var ceAddPct = ceCh>0 ? (ceTotPct-ceBasePct) : 0;
    var peAddPct = peCh>0 ? (peTotPct-peBasePct) : 0;

    // ---- WHITE PART = TOTAL - OI ----
    var ceCutPct = ceCh<0 ? (ceTotPct-ceBasePct) : 0;
    var peCutPct = peCh<0 ? (peTotPct-peBasePct) : 0;

    function clamp(x){ return Math.max(0,Math.min(100,x)); }

    ceBasePct=clamp(ceBasePct); peBasePct=clamp(peBasePct);
    ceTotPct =clamp(ceTotPct);  peTotPct =clamp(peTotPct);
    ceAddPct =clamp(ceAddPct);  peAddPct =clamp(peAddPct);
    ceCutPct =clamp(ceCutPct);  peCutPct =clamp(peCutPct);

    var row=document.createElement("div");
    row.className="row"+(r.STRIKE_TXT===atm?" atm":"");

      botLine.style.display="block";

      let tipL=document.getElementById("strikeTipLeft");
      let tipR=document.getElementById("strikeTipRight");

      if(!tipL){
        tipL=document.createElement("div");
        tipL.id="strikeTipLeft";
        tipL.style.position="absolute";
        tipL.style.background="#102018";
        tipL.style.border="2px solid #00ff6a";
        tipL.style.padding="6px 8px";
        tipL.style.fontSize="11px";
        tipL.style.lineHeight="1.4";
        tipL.style.color="white";
        tipL.style.pointerEvents="none";
        tipL.style.zIndex="300";
        tipL.style.minWidth="160px";
        document.body.appendChild(tipL);
      }

      if(!tipR){
        tipR=document.createElement("div");
        tipR.id="strikeTipRight";
        tipR.style.position="absolute";
        tipR.style.background="#1a1020";
        tipR.style.border="2px solid #ff00ff";
        tipR.style.padding="6px 8px";
        tipR.style.fontSize="11px";
        tipR.style.lineHeight="1.4";
        tipR.style.color="white";
        tipR.style.pointerEvents="none";
        tipR.style.zIndex="300";
        tipR.style.minWidth="160px";
        document.body.appendChild(tipR);
      }

    tipL.innerHTML=
      r.STRIKE_TXT+'<br>'+
      'CE: '+ceOI+' ('+(ceCh>=0?'+':'')+ceCh+')<br>'+
      'PE: '+peOI+' ('+(peCh>=0?'+':'')+peCh+')';


      tipR.innerHTML=
        'CHANGE IN OI<br>'+
        'CE: '+(ceCh>=0?'+':'')+ceCh+'<br>'+
        'PE: '+(peCh>=0?'+':'')+peCh;

    const strikeLeft  = strikeBox.left;
    const strikeRight = strikeBox.right;

    /* STRICT: stick to strike edges, never overlap */
    const gap = 8;
    const leftExtra = 160;

    /* vertical center minus small upward offset */
    const rowCenterY = rbox.top + rbox.height / 2;
    const upShift = 30;

    tipL.style.top = (rowCenterY - tipL.offsetHeight / 2 - upShift) + "px";
    tipR.style.top = (rowCenterY - tipR.offsetHeight / 2 - upShift) + "px";

    tipL.style.left =
      (strikeLeft - tipL.offsetWidth - gap - leftExtra) + "px";

    tipR.style.left =
      (strikeRight + gap) + "px";





      tipL.style.display="block";
      tipR.style.display="block";
    };

    row.onmouseleave=function(){
      const topLine=document.getElementById("hoverLineTop");
      const botLine=document.getElementById("hoverLineBottom");

      if(topLine) topLine.style.display="none";
      if(botLine) botLine.style.display="none";

      const tipL=document.getElementById("strikeTipLeft");
      const tipR=document.getElementById("strikeTipRight");

      if(tipL) tipL.style.display="none";
      if(tipR) tipR.style.display="none";
    };






    row.innerHTML=
      '<div class="totWrap"><div class="box"><div class="stack">'+

        '<div style="position:relative;height:18px;width:100%;">'+
          '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
          (ceCh>0
            ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
            : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:white;border:2px solid white"></div>')+
        '</div>'+

        '<div style="position:relative;height:18px;width:100%;margin-top:4px;">'+
          '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
          (peCh>0
            ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
            : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:white;border:2px solid white"></div>')+
        '</div>'+

      '</div></div></div>'+

      strikeHTML+

      '<div class="box">'+
        '<div class="chgInner">'+
          '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#666"></div>'+
          '<div class="bar chg-ce" style="left:50%;top:0px;width:'+((Math.abs(ceCh)/maxCh)*80)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '<div class="bar chg-pe" style="left:50%;top:20px;width:'+((Math.abs(peCh)/maxCh)*80)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
        '</div>'+
      '</div>';

    leftCol.appendChild(row);

    if(r.STRIKE_TXT===ltpStrike.STRIKE_TXT){
      row.style.position="relative";

      const ltpLine=document.createElement("div");
      ltpLine.style.position="absolute";
      ltpLine.style.left="0";
      ltpLine.style.width="100%";
      ltpLine.style.top="50%";
      ltpLine.style.borderTop="2px solid blue";
      ltpLine.style.pointerEvents="none";
      ltpLine.style.zIndex="20";

      const ltpLbl=document.createElement("div");
      ltpLbl.innerText="LTP "+ltp.toFixed(2);
      ltpLbl.style.position="absolute";
      ltpLbl.style.left="42%";
      ltpLbl.style.top="50%";
      ltpLbl.style.transform="translate(-50%,-50%)";
      ltpLbl.style.color="white";
      ltpLbl.style.fontWeight="bold";
      ltpLbl.style.fontSize="12px";
      ltpLbl.style.background="#0b0f14";
      ltpLbl.style.padding="2px 6px";
      ltpLbl.style.zIndex="25";




      row.appendChild(ltpLine);
      row.appendChild(ltpLbl);
    }




  });
}
</script>
<script>
let lastScanText =
  document.querySelector("#chgHeader span").innerText;

async function checkUpdate(){
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/Scan:\s*([0-9\-: ]+)/);


    if(m && m[1] !== lastScanText){
      localStorage.setItem("oi_state",
        JSON.stringify({ul:ulSel.value,exp:expSel.value})
      );
      location.replace(location.href);
    }

  }catch(e){}
}

setInterval(checkUpdate, 10000);
</script>
