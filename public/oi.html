
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;height:100%;background:#0b0f14;color:white;font-family:Arial;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}
/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1200px; /* keep centered width */
  width:100%;
  margin:0 auto;
  position:relative;
}

.hoverLine{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:#ffd000;
  pointer-events:none;
  z-index:50;
  display:none;
}

/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:40px;        /* was 100px */
  bottom:40px;     /* was 100px */
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}

#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0px;
  box-sizing:border-box;
}
/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}


/* topbar */
.topbar{
  padding:6px;
  border-bottom:1px solid #444;
  display:flex;
  gap:12px;
  justify-content:center;
}

select{background:#111;color:white;border:1px solid #555}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1200px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;
  opacity:.8;
  border:1px solid #666;
  padding:6px 0;
}
/* MIDDLE GAP VISUAL DEBUG */
.midBox{
  border:2px dashed yellow !important;
}

#midCol{
  position:absolute;
  left:50%;
  top:40px;
  bottom:40px;
  width:var(--mid);
  transform:translateX(-50%);
  border:2px dashed yellow;
  pointer-events:none;
}


/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{ text-align:center; font-size:12px; margin-bottom:4px; opacity:.8; }

.totWrap, .chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{ width:100%; border:1px solid #666; }

.chgInner{
  position:relative;
  width:100%;
  height:40px;
  overflow:hidden;
  padding:0;
}

.chgInner .bar{
  position:absolute;
  height:16px;
}


/* bars */
.bar{
  height:18px;
  border:none;
  box-sizing:border-box;
}

.ce{ background:#00ff6a; }      /* base CE = green */
.pe{ background:#ff4040; }      /* base PE = red  */

.deep.ce{ background:#00aa55 }  /* CE increase */
.deep.pe{ background:#aa0000 }  /* PE increase */

/* CHANGE IN OI ONLY COLORS */
.chg-ce{
  background:#17D16B;   /* blue */
}

.chg-pe{
  background:#D11743;   /* magenta */
}



.r{ margin-left:auto }
.l{ margin-right:auto }

.strike{
  text-align:center;
  font-weight:bold;
  color:#fff;
  margin-top:14px;   /* pushes it slightly downward */
}



.stack { gap:0px !important; }
.box { padding:2px !important; }
.totWrap, .chgWrap { padding:1px !important; }

.strike{
  position:relative;
  z-index:500;
}



</style>

</head>

<body>
<div id="screen">

<div class="topbar">

    const peOI = Number(r["OI_PE"]||0);
    const ceCh = Number(r["Change In OI_CE"]||0);
    const peCh = Number(r["Change In OI_PE"]||0);

    totPE += peOI + Math.abs(peCh);

    chPE += Math.abs(peCh);
  });

      '<div class="totWrap"><div class="box"><div class="stack">'+

        '<div style="position:relative;height:18px;width:100%;">'+
          '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
          (ceCh>0
            ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
            : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:white;border:2px solid white"></div>')+
        '</div>'+

        '<div style="position:relative;height:18px;width:100%;margin-top:4px;">'+
          '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
          (peCh>0
            ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
            : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:white;border:2px solid white"></div>')+
        '</div>'+

      '</div></div></div>'+

      strikeHTML+

      '<div class="box">'+
        '<div class="chgInner">'+
          '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#666"></div>'+
          '<div class="bar chg-ce" style="left:50%;top:0px;width:'+((Math.abs(ceCh)/maxCh)*80)+'%;transform:'+(ceCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
          '<div class="bar chg-pe" style="left:50%;top:20px;width:'+((Math.abs(peCh)/maxCh)*80)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+
        '</div>'+
      '</div>';

    leftCol.appendChild(row);

    if(r.STRIKE_TXT===ltpStrike.STRIKE_TXT){
      row.style.position="relative";

      const ltpLine=document.createElement("div");
      ltpLine.style.position="absolute";
      ltpLine.style.left="0";
      ltpLine.style.width="100%";
      ltpLine.style.top="50%";
      ltpLine.style.borderTop="2px solid blue";
      ltpLine.style.pointerEvents="none";
      ltpLine.style.zIndex="20";

      const ltpLbl=document.createElement("div");
      ltpLbl.innerText="LTP "+ltp.toFixed(2);
      ltpLbl.style.position="absolute";
      ltpLbl.style.left="42%";
      ltpLbl.style.top="50%";
      ltpLbl.style.transform="translate(-50%,-50%)";
      ltpLbl.style.color="white";
      ltpLbl.style.fontWeight="bold";
      ltpLbl.style.fontSize="12px";
      ltpLbl.style.background="#0b0f14";
      ltpLbl.style.padding="2px 6px";
      ltpLbl.style.zIndex="25";




      row.appendChild(ltpLine);
      row.appendChild(ltpLbl);
    }




  });
}
</script>
<script>
let lastScanText =
  document.querySelector("#chgHeader span").innerText;

async function checkUpdate(){
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/Scan:\s*([0-9\-: ]+)/);


    if(m && m[1] !== lastScanText){
      localStorage.setItem("oi_state",
        JSON.stringify({ul:ulSel.value,exp:expSel.value})
      );
      location.replace(location.href);
    }

  }catch(e){}
}

setInterval(checkUpdate, 10000);
</script>
