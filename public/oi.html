<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== PREMIUM TERMINAL THEME ===== */
:root{
  --mid:       80px;

  /* Core palette — deep navy, slightly lighter for readability */
  --bg:        #0d1e2e;
  --bg2:       #112333;
  --bg3:       #162a3a;
  --bg4:       #0f2030;
  --panel:     #132535;

  /* Borders */
  --border:    #1e3a50;
  --border2:   #284a60;

  /* Accents */
  --gold:      #c8a84b;
  --gold-dim:  #7a6228;
  --cyan:      #29d8e0;
  --cyan-dim:  #155f63;

  /* Data colors */
  --ce:        #1ed97a;
  --ce-deep:   #0fa854;
  --pe:        #e8404a;
  --pe-deep:   #9e1e26;
  --chg-ce:    #22e882;
  --chg-pe:    #f03545;

  /* Text */
  --text:      #d8e8f4;
  --text-dim:  #6a8898;
  --text-mid:  #9ab4c4;

  /* Font */
  --font-ui:   'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

/* ===== RESET ===== */
html,body{
  margin:0; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  box-sizing:border-box;
}
*,*::before,*::after{ box-sizing:inherit; }

/* Subtle grid texture on body */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(29,216,224,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29,216,224,0.02) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ===== SCREEN CONTAINER ===== */
#screen{
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:10px 16px 6px;
  position:relative;
  z-index:1;
}

/* ===== TOPBAR ===== */
.topbar{
  padding:5px 0 8px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  flex-shrink:0;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  gap:10px;
}

#symbolButtons{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:visible;
  padding-left:2px;
  min-width:0;
}

#symbolButtons > div{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

#symbolDivider{
  width:1px;
  align-self:stretch;
  background:var(--border);
  flex-shrink:0;
  margin:0 4px;
}

#dropdownWrap{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

/* ===== SYMBOL BUTTONS ===== */
#symbolButtons button{
  font-family:var(--font-mono);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0.03em;
  padding:4px 10px;
  border:1px solid var(--border2);
  background:var(--bg3);
  color:var(--text-mid);
  cursor:pointer;
  border-radius:2px;
  min-width:80px;
  text-align:center;
  transition:all 0.15s ease;
  position:relative;
  overflow:hidden;
  white-space:nowrap;
}

#symbolButtons button::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events:none;
}

#symbolButtons button:hover{
  border-color:var(--cyan-dim);
  color:var(--cyan);
  background:rgba(29,216,224,0.06);
  box-shadow:0 0 8px rgba(29,216,224,0.08);
}

/* Active / selected button */
.activeSymbol{
  border-color:var(--gold) !important;
  color:var(--gold) !important;
  background:rgba(200,168,75,0.1) !important;
  font-weight:600 !important;
  transform:none !important;
  box-shadow:0 0 0 1px var(--gold-dim),
             0 0 12px rgba(200,168,75,0.15) !important;
  z-index:5;
}

/* ===== DROPDOWNS ===== */
select{
  font-family:var(--font-mono);
  font-size:12px;
  background:var(--bg3);
  color:var(--text);
  border:1px solid var(--border2);
  border-radius:2px;
  padding:4px 8px;
  cursor:pointer;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}
select:focus{ border-color:var(--cyan-dim); }
#dropdownWrap select{ width:104px; }

/* ===== HEADER ROW ===== */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1400px;
  width:100%;
  margin:7px auto 5px;
  border:1px solid var(--border);
  border-radius:3px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:0 1px 0 rgba(29,216,224,0.06),
             inset 0 1px 0 rgba(255,255,255,0.02);
}

.outerBoxTitle{
  text-align:center;
  font-size:13px;
  font-family:var(--font-mono);
  letter-spacing:0.04em;
  padding:7px 6px;
  background:var(--panel);
  border-right:1px solid var(--border);
  line-height:1.7;
  color:var(--text-mid);
}
.outerBoxTitle:last-child{ border-right:none; }

/* LTP middle cell */
#midHeader{
  background:var(--bg4);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:500;
  color:var(--text-dim);
  line-height:1.5;
  letter-spacing:0.05em;
}

/* ===== GRID ===== */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1400px;
  width:100%;
  margin:0 auto;
  position:relative;
  min-height:0;
  overflow-y:auto;
}

/* Outer border frames */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:0; bottom:0;
  width:calc((100% - var(--mid)) / 2);
  border:1px solid var(--border);
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* ===== ROWS ===== */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0; gap:0;
  transition:background 0.08s;
}
.row:hover{
  background:rgba(29,216,224,0.025);
}
.row.atm{
  border-top:1px solid rgba(200,168,75,0.45);
  border-bottom:1px solid rgba(200,168,75,0.45);
  background:rgba(200,168,75,0.04);
}

/* hover crosshair */
.hoverLine{
  position:absolute;
  left:0; right:0;
  height:1px;
  background:rgba(200,168,75,0.55);
  pointer-events:none;
  z-index:50;
  display:none;
}

/* ===== MID STRIKE COLUMN ===== */
#midCol{
  position:absolute;
  left:50%; top:0; bottom:0;
  width:var(--mid);
  transform:translateX(-50%);
  pointer-events:none;
}

.strike{
  text-align:center;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:500;
  letter-spacing:0.02em;
  color:var(--text-mid);
  margin-top:12px;
  position:relative;
  z-index:500;
}

/* ===== BARS ===== */
.stack{ display:flex; flex-direction:column; gap:0; }

.box{
  border:none; padding:2px;
  display:flex; flex-direction:column;
  justify-content:center; width:100%;
}

.totWrap,
.chgWrap{
  height:100%; display:flex;
  align-items:center; padding:1px;
}

.chgInner{
  position:relative; width:100%;
  height:40px; overflow:hidden;
}
.chgInner .bar{ position:absolute; height:15px; border-radius:1px; }

.bar{
  height:17px;
  border:none;
  box-sizing:border-box;
  border-radius:1px;
}

.ce      { background:var(--ce); }
.pe      { background:var(--pe); }
.deep.ce { background:var(--ce-deep); }
.deep.pe { background:var(--pe-deep); }
.chg-ce  { background:var(--chg-ce); }
.chg-pe  { background:var(--chg-pe); }

.r{ margin-left:auto; }
.l{ margin-right:auto; }

/* ===================================================================
   RESPONSIVE
=================================================================== */

/* ── TABLET (<=900px) ── */
@media (max-width:900px){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:8px;
  }
  #grid{
    max-width:100%; justify-content:flex-start;
    flex:none; overflow-y:visible;
  }
  .outerRowHeader{ max-width:100%; margin:6px 0; }
  .outerBoxTitle{ font-size:10px; padding:4px 2px; }
  .topbar{ flex-wrap:wrap; height:auto; }
  select{ font-size:10px; }
  .row{ min-height:16px; }
}

/* ── LANDSCAPE PHONE (height <= 480px) ── */
@media (max-height:480px) and (orientation:landscape){
  #screen{
    height:auto; min-height:100svh;
    overflow-y:auto; padding:3px 8px;
  }
  .topbar{
    flex-direction:row; flex-wrap:nowrap;
    padding-bottom:3px; gap:6px;
  }
  #symbolButtons{ gap:3px; }
  #symbolButtons button{ font-size:8.5px; padding:2px 5px; min-width:48px; }
  .outerRowHeader{ margin:3px 0; }
  .outerBoxTitle{ font-size:8.5px; padding:2px 1px; }
  #midHeader{ font-size:8.5px; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }
  .row{ min-height:13px; }
  .bar{ height:12px; }
  .chgInner{ height:25px; }
  .strike{ font-size:9px; margin-top:3px; }
}

/* ── PORTRAIT PHONE (<=600px) ── */
@media (max-width:600px){
  :root{ --mid:56px; }

  body{ padding-top:env(safe-area-inset-top); }

  #screen{
    height:auto; min-height:100svh; overflow-y:auto;
    padding:6px;
    padding-top:calc(6px + env(safe-area-inset-top));
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }

  .topbar{
    flex-direction:column; align-items:flex-start;
    gap:6px; padding-bottom:8px; height:auto;
  }

  #symbolButtons{ width:100%; }
  #symbolButtons > div{ flex-wrap:wrap; }
  #symbolButtons button{ font-size:9.5px; padding:3px 6px; min-width:58px; }

  #symbolDivider{ display:none; }

  #dropdownWrap{ width:100%; justify-content:flex-start; }
  #dropdownWrap select{ width:80px; }

  #grid::before, #grid::after, #midCol{ display:none; }
  #grid{ justify-content:flex-start; flex:none; overflow-y:visible; }

  .row{ grid-template-columns:1fr var(--mid) 1fr; min-height:18px; }
  .strike{ font-size:10px; margin-top:6px; }
  .chgInner{ height:32px; }
  .bar{ height:15px; }
  .outerBoxTitle{ font-size:9.5px; padding:3px 2px; }
  #midHeader{ font-size:9.5px; }
}

/* ── VERY SMALL (<=420px) ── */
@media (max-width:420px){
  :root{ --mid:48px; }
  #symbolButtons button{ min-width:50px; font-size:8.5px; }
  select{ font-size:9.5px; }
  .strike{ font-size:9.5px; }
  .row{ min-height:15px; }
}
</style>




</head>

(function(){

  const originalUL  = ulSel.value;
  const originalEXP = expSel.value;

  window.symbolButtons.forEach(btn => {

    const symbol = btn.dataset.symbol;

    if (!DATA[symbol]) return;

    const expiries = Object.keys(DATA[symbol]);
    if (!expiries.length) return;

    const exp = expiries[0];   // first expiry only

    const obj = DATA[symbol][exp];
    const rows = obj.table;
    const atm = obj.atm;
    const ltp = obj.ltp;

    const idx = rows.findIndex(r => r.STRIKE_TXT === atm);
    if (idx === -1) return;

    const half = Math.floor(15/2);
    const win = rows.slice(Math.max(0, idx-half), idx+half+1);

    let chCE = 0, chPE = 0;

    win.forEach(r=>{
      chCE += Number(r["Change In OI_CE"]||0);
      chPE += Number(r["Change In OI_PE"]||0);
    });

    let currCE = chCE;
    let currPE = chPE;

    let prevCE = Number(obj.prev1_totalCE || 0);
    let prevPE = Number(obj.prev1_totalPE || 0);

    let ceBig = prevCE !== 0 && Math.abs(currCE) > Math.abs(prevCE) * 1.4;
    let peBig = prevPE !== 0 && Math.abs(currPE) > Math.abs(prevPE) * 1.4;

    let spikeColor = null;

    if (ceBig && peBig) {
      spikeColor = "BOTH";
    }
    else if (
      (ceBig && currCE > 0) ||
      (peBig && currPE < 0)
    ) {
      spikeColor = "ADDITION_UP";
    }
    else if (
      (ceBig && currCE < 0) ||
      (peBig && currPE > 0)
    ) {
      spikeColor = "ADDITION_DOWN";
    }

    if (spikeColor === "ADDITION_UP") {
      btn.dataset.spikeColor = "ADDITION_UP";
      btn.style.background = "#F59767";
      btn.style.color = "#1a0a00";
      btn.style.borderColor = "#d07040";
    }
    else if (spikeColor === "ADDITION_DOWN") {
      btn.dataset.spikeColor = "ADDITION_DOWN";
      btn.style.background = "#3AEDF2";
      btn.style.color = "#001a1c";
      btn.style.borderColor = "#20c0c8";
    }
    else if (spikeColor === "BOTH") {
      btn.dataset.spikeColor = "BOTH";
      btn.style.background = "#4E5454";
      btn.style.color = "#e0e8e8";
      btn.style.borderColor = "#6a7878";
    }
    else {
      btn.dataset.spikeColor = "";
    }


  });

  ulSel.value = originalUL;
  expSel.value = originalEXP;

})();

      const strikeLeft  = strikeBox.left;

        (strikeRight + gap) + "px";

      tipL.style.display="block";

    };

    row.onmouseleave=function(){
      const topLine=document.getElementById("hoverLineTop");

    };

    // simple mobile flag
    var isMobile = window.innerWidth <= 600;

    if(!isMobile){

      // ===== DESKTOP MARKUP (unchanged) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

          '<div style="position:relative;height:18px;width:100%;">'+
            '<div class="bar ce" style="position:absolute;left:0;width:'+ceBasePct+'%"></div>'+
            (ceRaw>0
              ? '<div class="bar ce deep" style="position:absolute;left:'+ceBasePct+'%;width:'+ceAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+ceBasePct+'%;width:'+ceCutPct+'%;background:white;border:2px solid white"></div>')+
          '</div>'+

          '<div style="position:relative;height:18px;width:100%;margin-top:4px;">'+
            '<div class="bar pe" style="position:absolute;left:0;width:'+peBasePct+'%"></div>'+
            (peRaw>0
              ? '<div class="bar pe deep" style="position:absolute;left:'+peBasePct+'%;width:'+peAddPct+'%"></div>'
              : '<div class="bar" style="position:absolute;left:'+peBasePct+'%;width:'+peCutPct+'%;background:white;border:2px solid white"></div>')+

            '<div class="bar chg-pe" style="left:50%;top:20px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+

    } else {

      // ===== MOBILE MARKUP (more compact, stacked text inside same grid) =====
      row.innerHTML=
        '<div class="totWrap"><div class="box"><div class="stack">'+

            '<div class="bar chg-pe" style="left:50%;top:16px;width:'+((Math.abs(peCh)/maxCh)*45)+'%;transform:'+(peCh>=0?'translateX(0)':'translateX(-100%)')+'"></div>'+

    leftCol.appendChild(row);

<script>
// ── SEAMLESS AUTO-REFRESH (Cloudflare Pages compatible) ──
// Cloudflare CDN caches aggressively. We bypass it by:
// 1. Appending ?t=<timestamp> to bust the CDN cache
// 2. Using DOMParser to extract new DATA silently
// 3. Never doing location.reload() — zero blink

const scanMeta = document.querySelector('meta[name="oi-scan-time"]');
let lastScanTime = scanMeta ? scanMeta.content.trim() : "";

// Detect the actual HTML file URL (works for both /oi and /oi.html)
function getFileUrl(){
  const base = location.href.split("?")[0]; // strip any existing params
  // Ensure we fetch the raw .html file to get full JS payload
  if(!base.endsWith(".html")){
    return base + ".html";
  }
  return base;
}

async function checkUpdate(){
  try{
    // Cache-bust: unique timestamp query param forces Cloudflare to re-fetch origin
    const url = getFileUrl() + "?_t=" + Date.now();
    const res = await fetch(url, {
      cache: "no-store",
      headers: { "pragma": "no-cache", "cache-control": "no-cache" }
    });
    if(!res.ok) return;
    const html = await res.text();

    // ── Step 1: check meta scan time ──
    const metaMatch = html.match(/<meta name="oi-scan-time" content="([^"]+)"/);
    if(!metaMatch) return;
    const newScanTime = metaMatch[1].trim();

    if(newScanTime === lastScanTime){
      render(); // same data — just refresh spike colours
      return;
    }

    // ── Step 2: extract new DATA via DOMParser ──
    const doc = new DOMParser().parseFromString(html, "text/html");
    let newData = null;

    for(const s of doc.querySelectorAll("script")){
      const txt = s.textContent || "";
      const idx = txt.indexOf("const DATA = ");
      if(idx === -1) continue;

      const after = txt.slice(idx + "const DATA = ".length).trimStart();
      let depth = 0, end = -1;
      for(let i = 0; i < after.length; i++){
        const c = after[i];
        if(c === "{" || c === "[") depth++;
        else if(c === "}" || c === "]"){ depth--; if(depth === 0){ end = i; break; } }
      }
      if(end !== -1){
        try{ newData = JSON.parse(after.slice(0, end + 1)); }catch(e){ newData = null; }
      }
      break;
    }

    if(!newData) return; // parse failed, retry next cycle

    // ── Step 3: update DATA in-place + re-render (zero blink) ──
    Object.keys(newData).forEach(k => { DATA[k] = newData[k]; });
    lastScanTime = newScanTime;

    // Update scan clock shown in header
    const clockPart = newScanTime.split(" ")[1] || "";
    const scanSpan = document.querySelector("#chgHeader span:nth-child(3) span");
    if(scanSpan && clockPart) scanSpan.innerText = clockPart;

    // Re-run spike evaluation for ALL buttons with fresh data
    window.symbolButtons.forEach(btn => {
      const symbol = btn.dataset.symbol;
      if(!DATA[symbol]) return;
      const expiries = Object.keys(DATA[symbol]);
      if(!expiries.length) return;
      const obj2 = DATA[symbol][expiries[0]];
      const rows2 = obj2.table;
      const atm2  = obj2.atm;
      const idx2  = rows2.findIndex(r => r.STRIKE_TXT === atm2);
      if(idx2 === -1) return;
      const win2  = rows2.slice(Math.max(0, idx2 - 7), idx2 + 8);
      let chCE2 = 0, chPE2 = 0;
      win2.forEach(r => {
        chCE2 += Number(r["Change In OI_CE"] || 0);
        chPE2 += Number(r["Change In OI_PE"] || 0);
      });
      const prev2CE = Number(obj2.prev1_totalCE || 0);
      const prev2PE = Number(obj2.prev1_totalPE || 0);
      const ceBig2  = prev2CE !== 0 && Math.abs(chCE2) > Math.abs(prev2CE) * 1.4;
      const peBig2  = prev2PE !== 0 && Math.abs(chPE2) > Math.abs(prev2PE) * 1.4;
      let sc2 = "";
      if(ceBig2 && peBig2) sc2 = "BOTH";
      else if((ceBig2 && chCE2 > 0) || (peBig2 && chPE2 < 0)) sc2 = "ADDITION_UP";
      else if((ceBig2 && chCE2 < 0) || (peBig2 && chPE2 > 0)) sc2 = "ADDITION_DOWN";
      btn.dataset.spikeColor = sc2;
      if(sc2 === "ADDITION_UP"){
        btn.style.background = "#F59767"; btn.style.color = "#1a0a00"; btn.style.borderColor = "#d07040";
      } else if(sc2 === "ADDITION_DOWN"){
        btn.style.background = "#3AEDF2"; btn.style.color = "#001a1c"; btn.style.borderColor = "#20c0c8";
      } else if(sc2 === "BOTH"){
        btn.style.background = "#4E5454"; btn.style.color = "#e0e8e8"; btn.style.borderColor = "#6a7878";
      } else if(indexSymbols.includes(symbol)){
        btn.style.background = "linear-gradient(135deg,#2d004d,#6a0dad)";
        btn.style.color = ""; btn.style.borderColor = "#4aa3ff";
      } else {
        btn.style.background = ""; btn.style.color = ""; btn.style.borderColor = "";
      }
    });

    // Preserve user selection
    const curUL  = ulSel.value;
    const curEXP = expSel.value;
    if(DATA[curUL] && DATA[curUL][curEXP]){
      ulSel.value  = curUL;
      expSel.value = curEXP;
    }

    render();

  }catch(e){ /* silent fail — retry in next cycle */ }
}

setInterval(checkUpdate, 15000); // 15 sec — enough for Cloudflare to propagate
</script>
