
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;
  height:100%;
  background:#012A40;
  color:white;
  font-family:Arial, sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{
  box-sizing:inherit;
}

/* ===== DESKTOP BASE LAYOUT (UNCHANGED) ===== */

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}

/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1200px;        /* desktop canvas width */
  width:100%;
  margin:0 auto;
  position:relative;
}

.hoverLine{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:#ffd000;
  pointer-events:none;
  z-index:50;
  display:none;
}

/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:40px;
  bottom:40px;
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0;
  box-sizing:border-box;
}

/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}

/* topbar */
.topbar{
  padding:6px;
  border-bottom:1px solid #444;
  display:flex;
  gap:12px;
  justify-content:center;
}

select{
  background:#012A40;
  color:white;
  border:1px solid #555;
}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1200px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;

  border:1px solid #666;
  padding:6px 0;
}

/* MIDDLE GAP VISUAL DEBUG */
.midBox{
  border:2px dashed yellow !important;
}

#midCol{
  position:absolute;
  left:50%;
  top:40px;
  bottom:40px;
  width:var(--mid);
  transform:translateX(-50%);
  border:2px dashed yellow;
  pointer-events:none;
}

/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{
  text-align:center;
  font-size:12px;
  margin-bottom:4px;

}

.totWrap,
.chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{
  width:100%;
  border:1px solid #666;
}

.chgInner{
  position:relative;
  width:100%;
  height:40px;
  overflow:hidden;
  padding:0;
}
.chgInner .bar{
  position:absolute;
  height:16px;
}

/* bars */
.bar{
  height:18px;
  border:none;
  box-sizing:border-box;
}

.ce{ background:#00ff6a; }      /* base CE = green */
.pe{ background:#ff4040; }      /* base PE = red   */

.deep.ce{ background:#00aa55; } /* CE increase     */
.deep.pe{ background:#aa0000; } /* PE increase     */

/* CHANGE IN OI ONLY COLORS */
.chg-ce{
  background:#17D16B;
}
.chg-pe{
  background:#D11743;
}

.r{ margin-left:auto; }
.l{ margin-right:auto; }

.strike{
  text-align:center;
  font-weight:normal;

  color:#fff;
  margin-top:14px;   /* pushes it slightly downward */
  position:relative;
  z-index:500;
}

/* compact spacing */
.stack { gap:0 !important; }
.box   { padding:2px !important; }
.totWrap,
.chgWrap { padding:1px !important; }

/* ===== MOBILE / TABLET TWEAKS (NO DESKTOP CHANGE) ===== */

/* Tablets + phones */
@media (max-width: 900px){

  /* Screen: allow scroll, reduce padding */
  #screen{
    height:auto;
    min-height:100vh;
    padding:10px;
  }

  /* Grid: full width, top aligned */
  #grid{
    max-width:100%;
    width:100%;
    margin:0;
    justify-content:flex-start;
    overflow-x:hidden;
  }

  /* Headers full width */
  .outerRowHeader{
    max-width:100%;
    width:100%;
    margin:6px 0 8px 0;
  }

  .outerBoxTitle{
    font-size:12px;
    padding:4px 2px;
  }

  .topbar{
    padding:4px 4px;
    gap:8px;
  }

  select{
    font-size:12px;
    padding:3px 6px;
  }

  .row{
    min-height:16px;
  }
}

/* Phones */
@media (max-width: 600px){

  :root{
    --mid:56px;   /* narrower middle ladder, more space for bars */
  }

  /* Decorative frames hide on phones */
  #grid::before,
  #grid::after,
  #midCol{
    display:none;
  }

  .row{
    grid-template-columns:1fr var(--mid) 1fr;
    min-height:18px;
  }

  .strike{
    font-size:11px;
    margin-top:6px;
  }

  .chgInner{
    height:32px;
  }

  .bar{
    height:16px;
  }

  /* Safe-area for notch */
  body{
    padding-top:env(safe-area-inset-top);
  }

  .topbar{
    padding-top:calc(4px + env(safe-area-inset-top));
    margin-top:0;
  }
}

/* Very small phones */
@media (max-width: 420px){

  :root{
    --mid:48px;
  }

  select{
    font-size:11px;
    padding:2px 4px;
  }

  .outerBoxTitle{
    font-size:11px;
  }

  .row{
    min-height:16px;
  }

  .strike{
    font-size:10px;
  }
}
</style>




</head>

<script>
let lastScanText =
  document.querySelector("#chgHeader span").innerText;

async function checkUpdate(){
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/Scan:\s*([0-9\-: ]+)/);


    if(m && m[1] !== lastScanText){
      localStorage.setItem("oi_state",
        JSON.stringify({ul:ulSel.value,exp:expSel.value})
      );
      location.replace(location.href);
    }

  }catch(e){}
}

setInterval(checkUpdate, 10000);
</script>


</body>
