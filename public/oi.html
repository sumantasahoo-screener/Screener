
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;height:100%;background:#0b0f14;color:white;font-family:Arial;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}
/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1200px; /* keep centered width */
  width:100%;
  margin:0 auto;
  position:relative;
}
/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:100px;
  bottom:100px;
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0px;
  box-sizing:border-box;
}
/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}


/* topbar */
.topbar{
  padding:6px;
  border-bottom:1px solid #444;
  display:flex;
  gap:12px;
  justify-content:center;
}

select{background:#111;color:white;border:1px solid #555}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1200px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;
  opacity:.8;
  border:1px solid #666;
  padding:6px 0;
}

/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{ text-align:center; font-size:12px; margin-bottom:4px; opacity:.8; }

.totWrap, .chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{ width:100%; border:1px solid #666; }

.chgInner{
  position:relative;
  width:100%;
  height:48px;
  overflow:hidden;
  padding:0;
}

.chgInner .bar{
  position:absolute;
  height:16px;
}


/* bars */
.bar{ height:18px; border:2px solid; background:white; box-sizing:border-box; }
.ce{ border-color:#00ff6a; }
.pe{ border-color:#ff4040; }
.deep.ce{ background:#00aa55 }
.deep.pe{ background:#aa0000 }

.r{ margin-left:auto }
.l{ margin-right:auto }

.strike{ text-align:center; font-weight:bold; color:#fff; }


.stack { gap:0px !important; }
.box { padding:2px !important; }
.totWrap, .chgWrap { padding:1px !important; }




</style>

</head>

<body>
