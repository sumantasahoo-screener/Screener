
<!DOCTYPE html>
<html>
<head>
<style>
:root{ --mid:80px; } /* central column width - change once if needed */

html,body{
  margin:0;
  height:100%;
  background:#012A40;
  color:white;
  font-family:Arial, sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{
  box-sizing:inherit;
}

/* ===== DESKTOP BASE LAYOUT (UNCHANGED) ===== */

/* screen container */
#screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}

/* centered grid with controlled width */
#grid{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  max-width:1350px;        /* desktop canvas width */
  width:100%;
  margin:0 auto;
  position:relative;
}

.hoverLine{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:#ffd000;
  pointer-events:none;
  z-index:50;
  display:none;
}

/* outline frames that follow exact same math as grid columns */
#grid::before,
#grid::after{
  content:"";
  position:absolute;
  top:40px;
  bottom:40px;
  width:calc((100% - var(--mid)) / 2);
  border:2px solid white;
  pointer-events:none;
}
#grid::before{ left:0; }
#grid::after { right:0; }

/* each visual row: left column | center strike | right column */
.row{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  min-height:18px;
  padding:0;
  gap:0;
  box-sizing:border-box;
}

/* ATM row visual markers */
.row.atm{
  border-top:2px dotted orange;
  border-bottom:2px dotted orange;
}

/* topbar */
.topbar{
  height:100px;
  padding:6px 0;
  border-bottom:1px solid #444;
  display:flex;
  align-items:center;

  max-width:1350px;
  width:100%;
  margin:0 auto;
}


#symbolButtons{
  flex:1;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  gap:10px;
  height:70px;
  overflow:hidden;
  padding-left:6px;
}

#symbolDivider{
  width:1px;
  height:70px;
  background:#2a5a6a;
  margin:0 12px;
  flex-shrink:0;
}

#dropdownWrap{
  display:flex;
  gap:6px;
  flex-shrink:0;
  margin-right:12px;
}

#dropdownDivider{
  width:1px;
  height:70px;
  background:#2a5a6a;
  margin-right:12px;
  flex-shrink:0;
}



#dropdownWrap select{
  width:85px;
}

#symbolButtons button{
  font-size:12px;
  padding:4px 10px;
  border:1px solid #555;
  background:#012A40;
  color:white;
  cursor:pointer;
  border-radius:4px;
  min-width:75px;
  text-align:center;
}


#symbolButtons button:hover{
  background:#0a3a55;
}



select{
  background:#012A40;
  color:white;
  border:1px solid #555;
}

/* header titles above the grid (keeps same container width and columns) */
.outerRowHeader{
  display:grid;
  grid-template-columns:1fr var(--mid) 1fr;
  max-width:1350px;
  width:100%;
  margin:0 auto 8px auto;
}
.outerBoxTitle{
  text-align:center;
  font-size:13px;

  border:1px solid #666;
  padding:6px 0;
}

/* MIDDLE GAP VISUAL DEBUG */
.midBox{
  border:2px dashed yellow !important;
}

#midCol{
  position:absolute;
  left:50%;
  top:40px;
  bottom:40px;
  width:var(--mid);
  transform:translateX(-50%);
  border:2px dashed yellow;
  pointer-events:none;
}

/* stacking & boxes */
.stack{
  display:flex;
  flex-direction:column;
  gap:1px;
}

.box{
  border:none;
  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
}
.boxTitle{
  text-align:center;
  font-size:12px;
  margin-bottom:4px;

}

.totWrap,
.chgWrap{
  height:100%;
  display:flex;
  align-items:center;
  padding:4px;
  box-sizing:border-box;
}
.chgWrap{
  width:100%;
  border:1px solid #666;
}

.chgInner{
  position:relative;
  width:100%;
  height:40px;
  overflow:hidden;
  padding:0;
}
.chgInner .bar{
  position:absolute;
  height:16px;
}

.activeSymbol{
  background:linear-gradient(45deg,#00c6ff,#0072ff) !important;
  border:1px solid #ffffff !important;
  color:#000 !important;
  font-weight:bold;
}


/* bars */
.bar{
  height:18px;
  border:none;
  box-sizing:border-box;
}

.ce{ background:#00ff6a; }      /* base CE = green */
.pe{ background:#ff4040; }      /* base PE = red   */

.deep.ce{ background:#00aa55; } /* CE increase     */
.deep.pe{ background:#aa0000; } /* PE increase     */

/* CHANGE IN OI ONLY COLORS */
.chg-ce{
  background:#17D16B;
}
.chg-pe{
  background:#D11743;
}

.r{ margin-left:auto; }
.l{ margin-right:auto; }

.strike{
  text-align:center;
  font-weight:normal;

  color:#fff;
  margin-top:14px;   /* pushes it slightly downward */
  position:relative;
  z-index:500;
}

/* compact spacing */
.stack { gap:0 !important; }
.box   { padding:2px !important; }
.totWrap,
.chgWrap { padding:1px !important; }

/* ===== MOBILE / TABLET TWEAKS (NO DESKTOP CHANGE) ===== */

/* Tablets + phones */
@media (max-width: 900px){

  /* Screen: allow scroll, reduce padding */
  #screen{
    height:auto;
    min-height:100vh;
    padding:10px;
  }

  /* Grid: full width, top aligned */
  #grid{
    max-width:100%;
    width:100%;
    margin:0;
    justify-content:flex-start;
    overflow-x:hidden;
  }

  /* Headers full width */
  .outerRowHeader{
    max-width:100%;
    width:100%;
    margin:6px 0 8px 0;
  }

  .outerBoxTitle{
    font-size:12px;
    padding:4px 2px;
  }

  .topbar{
    padding:4px 4px;
    gap:8px;
  }

  select{
    font-size:12px;
    padding:3px 6px;
  }

  .row{
    min-height:16px;
  }
}

/* Phones */
@media (max-width: 600px){

  :root{
    --mid:56px;   /* narrower middle ladder, more space for bars */
  }

  /* Decorative frames hide on phones */
  #grid::before,
  #grid::after,
  #midCol{
    display:none;
  }

  .row{
    grid-template-columns:1fr var(--mid) 1fr;
    min-height:18px;
  }

  .strike{
    font-size:11px;
    margin-top:6px;
  }

  .chgInner{
    height:32px;
  }

  .bar{
    height:16px;
  }

  /* Safe-area for notch */
  body{
    padding-top:env(safe-area-inset-top);
  }

  .topbar{
    padding-top:calc(4px + env(safe-area-inset-top));
    margin-top:0;
  }
}

/* Very small phones */
@media (max-width: 420px){

  :root{
    --mid:48px;
  }

  select{
    font-size:11px;
    padding:2px 4px;
  }

  .outerBoxTitle{
    font-size:11px;
  }

  .row{
    min-height:16px;
  }

  .strike{
    font-size:10px;
  }
}
</style>




</head>

// --- Move INDEX symbols to front ---
var indexSymbols = ["NIFTY","BANKNIFTY"];

var normalList = [];

keys.forEach(function(k){
  if(indexSymbols.includes(k)){
    indexList.push(k);
  }else{
    normalList.push(k);
  }
});

keys = indexList.concat(normalList);

var topRow = document.createElement("div");
var bottomRow = document.createElement("div");

topRow.style.display = "flex";
bottomRow.style.display = "flex";

topRow.style.gap = "10px";
bottomRow.style.gap = "10px";

topRow.style.width = "100%";
bottomRow.style.width = "100%";

var splitIndex = Math.ceil(keys.length / 2);

keys.forEach(function(k, i){

  var o=document.createElement("option");
  o.text=k; o.value=k;
  ulSel.add(o);

  var btn=document.createElement("button");
  btn.innerText=k;

  // --- Highlight index buttons ---
  if(indexSymbols.includes(k)){
    btn.style.background = "linear-gradient(135deg,#2d004d,#6a0dad)";





    btn.style.border = "1px solid #4aa3ff";
    btn.style.fontWeight = "bold";
  }

    btn.onclick=function(){

    document.querySelectorAll("#symbolButtons button")
      .forEach(b=>{
        b.classList.remove("activeSymbol");
        b.style.background = "";
      });

    const btn = this;   // FIX: store reference

    btn.classList.add("activeSymbol");

    ulSel.value = k;
    ulSel.onchange();

    // ---- APPLY OI SIGNAL COLOR ----
    setTimeout(function () {

      if (window.currentSpike === "CE") {
        btn.style.background = "#00c6ff";   // Call side spike
      }

      else if (window.currentSpike === "PE") {
        btn.style.background = "#ff9f00";   // Put side spike
      }

      else if (window.currentSpike === "BOTH") {
        btn.style.background = "#ffd000";   // Both side spike
      }

      else {
        btn.style.background = "";          // No spike → normal
      }

    }, 50);

};


  if(i < splitIndex){
    topRow.appendChild(btn);
  }else{
    bottomRow.appendChild(btn);
  }

});

    expSel.add(o);
  });
  expSel.selectedIndex=0;

  .forEach(b=>{

  });

  
  
  render();
};

if(st.ul && DATA[st.ul]){

  if(st.exp) expSel.value=st.exp;
  render();
}else{
  ulSel.selectedIndex=0;
  ulSel.onchange();
}


function render(){
  leftCol.innerHTML="";
  rightCol.innerHTML="";

  var ul=ulSel.value, exp=expSel.value;
  var obj=DATA[ul][exp];
  document.getElementById("midHeader").innerHTML =
    "LTP<br>" + obj.ltp.toFixed(2);

  var rows=obj.table;
  var atm=obj.atm;
  var ltp=obj.ltp;

  var ltpStrike = rows.reduce((a,b)=>
    Math.abs(b.STRIKE_TXT-ltp) < Math.abs(a.STRIKE_TXT-ltp) ? b : a
  );

  var idx = rows.findIndex(r=>r.STRIKE_TXT===atm);
  var half = Math.floor(15/2);
  var win = rows.slice(Math.max(0,idx-half), idx+half+1);

  /* ---- HEADER PCR CALC ---- */

  let totCE = 0, totPE = 0;
  let chCE = 0, chPE = 0;

  win.forEach(r=>{
    const ceOI = Number(r["OI_CE"]||0);
    const peOI = Number(r["OI_PE"]||0);
    const ceCh = Number(r["Change In OI_CE"]||0);
    const peCh = Number(r["Change In OI_PE"]||0);

    totCE += ceOI + ceCh;
    totPE += peOI + peCh;

    chCE += ceCh;
    chPE += peCh;

  });


  const pcrTot = totCE ? (totPE/totCE).toFixed(2) : "0.00";
  const pcrCh  = chCE  ? (chPE/chCE).toFixed(2)  : "0.00";

    let mBiasLabel = "BALANCED";
    let mBiasColor = "white";

    if (Number(pcrTot) > 1.2) {
      mBiasLabel = "LONG BIAS";
      mBiasColor = "#00ff6a";
    } else if (Number(pcrTot) < 0.8) {
      mBiasLabel = "SHORT BIAS";
      mBiasColor = "#C21A0E";
    }

    document.getElementById("pcrTotal").innerHTML =
      "mPCR: " + pcrTot +
      " | <span style='color:" + mBiasColor + ";font-weight:bold'>" + mBiasLabel + "</span>" +
      " | prev1: " + obj.prev1_mPCR +
      " | prev2: " + obj.prev2_mPCR;


    let biasLabel = "BALANCED";
    let biasColor = "white";

    if (Number(pcrCh) > 1.2) {
      biasLabel = "LONG PRESSURE";
      biasColor = "#00ff6a";
    } else if (Number(pcrCh) < 0.8) {
      biasLabel = "SHORT PRESSURE";
      biasColor = "#C21A0E";
    }

    document.getElementById("pcrChange").innerHTML =
      "cPCR: " + pcrCh +
      " | <span style='color:" + biasColor + ";font-weight:bold'>" + biasLabel + "</span>" +
      " | prev1: " + obj.prev1_cPCR +
      " | prev2: " + obj.prev2_cPCR;
      
      
    // ---- CHANGE IN OI DOMINANCE SIGNAL ----
    let signalType = null;

    // SHORT: CE writing dominant over PE unwinding
    if (
      chCE > 0 &&
      chPE < 0 &&
      Math.abs(chCE) > Math.abs(chPE) * 0.6
    ) {
      signalType = "SHORT";
    }

    // LONG: PE writing dominant over CE unwinding
    if (
      chPE > 0 &&
      chCE < 0 &&
      Math.abs(chPE) > Math.abs(chCE) * 0.6
    ) {
      signalType = "LONG";
    }

    // store in window for next step
    window.currentOISignal = signalType;


  

  // ---- SCALE ONLY WINDOW ----
  // ---- SCALE ONLY WINDOW ----
  var maxTot = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["OI_CE"]||0) + Math.abs(x["Change In OI_CE"]||0),
      Math.abs(x["OI_PE"]||0) + Math.abs(x["Change In OI_PE"]||0)
    )
  ));



  var maxCh = Math.max(1, ...win.map(x =>
    Math.max(
      Math.abs(x["DELTA_FROM_LAST4_CE"]||0),
      Math.abs(x["DELTA_FROM_LAST4_PE"]||0)
    )
  ));

    var peCh = Number(r["DELTA_FROM_LAST4_PE"]||0);

    var ceRaw = Number(r["Change In OI_CE"]||0);
    var peRaw = Number(r["Change In OI_PE"]||0);

    // ---- TOTAL = OI + Change In OI (RAW) ----
    var ceTot = ceOI + ceRaw;
    var peTot = peOI + peRaw;

    function pct(v){ return (Math.abs(v) / maxTot) * 100; }

    var ceBasePct = pct(ceOI);
    var peBasePct = pct(peOI);

    var ceTotPct  = pct(ceTot);
    var peTotPct  = pct(peTot);

    var ceAddPct = ceRaw>0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peAddPct = peRaw>0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    var ceCutPct = ceRaw<0 ? (Math.abs(ceRaw) / maxTot) * 100 : 0;
    var peCutPct = peRaw<0 ? (Math.abs(peRaw) / maxTot) * 100 : 0;

    function clamp(x){ return Math.max(0,Math.min(100,x)); }

    ceBasePct=clamp(ceBasePct); peBasePct=clamp(peBasePct);
    ceTotPct =clamp(ceTotPct);  peTotPct =clamp(peTotPct);

      row.appendChild(ltpLbl);
    }

  });

}
</script>
<script>
let lastScanText =
  document.querySelector("#chgHeader span").innerText;

async function checkUpdate(){
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    const t = await r.text();
    const m = t.match(/Scan:\s*([0-9\-: ]+)/);


    if(m && m[1] !== lastScanText){
      localStorage.setItem("oi_state",
        JSON.stringify({ul:ulSel.value,exp:expSel.value})
      );
      location.replace(location.href);
    }

  }catch(e){}
}

setInterval(checkUpdate, 10000);
</script>
