<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>NSE F&O — Advance / Decline</title>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:#0a0a0a;color:#e0e0e0;
  display:flex;flex-direction:column;
  padding:5px 7px;gap:4px;
}

/* ── HEADER ── */
.hdr{
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:12px;
  background:#141414;border:1px solid #222;
  border-radius:10px;padding:7px 14px;flex-shrink:0;
}
.hdr-left{display:flex;align-items:center;gap:10px;}
.logo{font-size:14px;font-weight:700;color:#4fc3f7;letter-spacing:.05em;}
.logo small{display:block;font-size:9px;color:#444;letter-spacing:.1em;margin-top:1px;}
.sep{width:1px;height:24px;background:#222;}
.ts{font-size:10px;color:#444;}
.ts b{color:#4fc3f7;}
.sw{position:relative;}
.sw input{
  background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;
  color:#ccc;font-family:inherit;font-size:10px;
  padding:4px 8px 4px 20px;outline:none;width:120px;transition:border-color .2s;
}
.sw input:focus{border-color:#4fc3f7;}
.sw::before{content:'⌕';position:absolute;left:5px;top:50%;transform:translateY(-50%);font-size:13px;color:#444;pointer-events:none;}
.breadth{display:flex;flex-direction:column;gap:3px;}
.bar-row{display:flex;height:20px;border-radius:10px;overflow:hidden;border:1px solid #1e1e1e;background:#080808;}
.b-adv{display:flex;align-items:center;padding:0 8px;background:linear-gradient(90deg,#0a5c1e,#00aa33);font-size:10px;font-weight:700;color:#fff;white-space:nowrap;transition:width .9s cubic-bezier(.4,0,.2,1);}
.b-dec{display:flex;align-items:center;justify-content:flex-end;padding:0 8px;background:linear-gradient(90deg,#7a0a0a,#cc1111);font-size:10px;font-weight:700;color:#fff;white-space:nowrap;transition:width .9s cubic-bezier(.4,0,.2,1);}
.bstats{display:flex;gap:12px;font-size:10px;color:#888;font-weight:600;}
.bstats .g{color:#00dd55;}
.bstats .r{color:#ff3333;}
.bstats .n{color:#ffbb00;}
.bstats b{color:#ccc;}
.hdr-right{display:flex;gap:6px;align-items:center;}
.fb{font-family:inherit;font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid #2a2a2a;background:transparent;color:#444;cursor:pointer;transition:all .18s;white-space:nowrap;}
.fb:hover{color:#ccc;border-color:#555;}
.fb.on-all{background:#0f2535;border-color:#4fc3f7;color:#4fc3f7;}
.fb.on-n50{background:#1e1030;border-color:#9575cd;color:#9575cd;}
.fb.on-graph{background:#1a2800;border-color:#76ff03;color:#76ff03;}

/* ── MAIN LAYOUT ── */
.main{flex:1;display:flex;gap:4px;overflow:hidden;min-height:0;}

/* ── TOP5 PANEL ── */
.top5{
  width:130px;flex-shrink:0;
  display:flex;flex-direction:column;gap:4px;
  overflow:hidden;
}
.top5-box{
  flex:1;background:#111;border:1px solid #1e1e1e;
  border-radius:8px;padding:6px 7px;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;
}
.top5-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;padding-bottom:4px;border-bottom:1px solid #1e1e1e;}
.top5-title.g{color:#00aa33;}
.top5-title.r{color:#cc1111;}
.top5-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:3px 5px;border-radius:5px;cursor:pointer;
  transition:background .15s;
  border:1px solid transparent;
}
.top5-row:hover{background:#1a1a1a;border-color:#2a2a2a;}
.top5-sym{font-size:10px;font-weight:700;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;}
.top5-pct{font-size:10px;font-weight:700;white-space:nowrap;}
.top5-pct.g{color:#00dd55;}
.top5-pct.r{color:#ff4444;}

/* ── HEATMAP GRID ── */
.grid{
  flex:1;display:grid;
  grid-template-columns:repeat(21,1fr);
  grid-auto-rows:1fr;
  gap:3px;overflow:hidden;
}

/* ── CARDS ── */
.card{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;transition:transform .13s,box-shadow .15s;min-height:0;}
.card:hover{transform:scale(1.04);z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.6);}
.card.adv{background:#0a2810;border:1px solid #1a5022;}
.card.adv:hover{box-shadow:0 4px 14px rgba(0,180,50,.25);}
.card.dec{background:#280a0a;border:1px solid #501a1a;}
.card.dec:hover{box-shadow:0 4px 14px rgba(200,20,20,.2);}
.card.nt{background:#262000;border:1px solid #584800;}
.cf{position:absolute;bottom:0;left:0;right:0;pointer-events:none;border-radius:0 0 5px 5px;}
.card.adv .cf{background:#00cc44;}
.card.dec .cf{background:#dd1111;}
.card.nt  .cf{background:#cc8800;}
.card.top-gain{border:2px solid #ffd700!important;box-shadow:0 0 8px rgba(255,215,0,.4);}
.card.top-loss{border:2px solid #ff6600!important;box-shadow:0 0 8px rgba(255,100,0,.35);}
.ct{position:relative;z-index:2;display:flex;flex-direction:column;padding:4px 5px 3px;height:100%;gap:2px;}
.ndot{width:4px;height:4px;border-radius:50%;background:#4fc3f7;flex-shrink:0;display:inline-block;margin-right:3px;vertical-align:middle;}
.cs{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;}
.card.adv .cs{color:#bbffcc;}
.card.dec .cs{color:#ffbbbb;}
.card.nt  .cs{color:#ffe066;}
.cp{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,1);}
.cl{font-size:11px;font-weight:700;line-height:1.2;margin-top:auto;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,1);}

/* ── GRAPH VIEW ── */
.graph-view{
  flex:1;display:none;flex-direction:column;gap:6px;
  overflow:hidden;
}
.graph-view.active{display:flex;}
.graph-panel{
  flex:1;background:#0e0e0e;border:1px solid #1e1e1e;
  border-radius:10px;padding:12px 16px;
  display:flex;flex-direction:column;gap:8px;
  overflow:hidden;
}
.graph-title{font-size:11px;font-weight:700;color:#666;letter-spacing:.1em;text-transform:uppercase;}
.graph-legend{display:flex;gap:14px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#888;}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.leg-dot.adv{background:#00cc44;}
.leg-dot.dec{background:#dd1111;}
.leg-dot.neu{background:#cc8800;}
#graphCanvas{flex:1;width:100%;min-height:0;}

/* ── MINI CHART MODAL ── */
#miniOverlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:9000;
  backdrop-filter:blur(3px);
  align-items:center;justify-content:center;
}
#miniOverlay.show{display:flex;}
#miniModal{
  background:#141414;border:1px solid #2a2a2a;
  border-radius:14px;padding:16px;
  width:420px;max-width:94vw;
  box-shadow:0 12px 60px rgba(0,0,0,.9);
  animation:popIn .18s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.mini-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.mini-sym{font-size:14px;font-weight:700;color:#4fc3f7;}
.mini-info{display:flex;gap:10px;align-items:center;}
.mini-ltp{font-size:13px;font-weight:700;color:#fff;}
.mini-pct{font-size:12px;font-weight:700;}
.mini-pct.g{color:#00dd55;}
.mini-pct.r{color:#ff4444;}
.mini-close{
  background:transparent;border:1px solid #333;border-radius:6px;
  color:#666;font-size:14px;padding:2px 8px;cursor:pointer;
  transition:all .15s;
}
.mini-close:hover{border-color:#555;color:#ccc;}
#miniCanvas{width:100%;height:160px;display:block;}
.mini-footer{font-size:9px;color:#333;text-align:right;margin-top:6px;}

/* ── TV POPUP (desktop) ── */
#deskPopup{
  display:none;position:fixed;z-index:9999;
  background:#161616;border:1px solid #2a2a2a;
  border-radius:12px;padding:12px 14px 14px;
  box-shadow:0 8px 40px rgba(0,0,0,.9);
  animation:popIn .15s ease;min-width:240px;
}
#deskPopup .dp-sym{font-size:12px;font-weight:700;color:#4fc3f7;margin-bottom:1px;}
#deskPopup .dp-sub{font-size:9px;color:#333;margin-bottom:10px;}
#deskPopup .dp-div{height:1px;background:#1e1e1e;margin-bottom:10px;}
#deskPopup .dp-btns{display:flex;gap:5px;}
#deskPopup .dp-btn{
  flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#666;font-family:inherit;font-size:10px;font-weight:700;
  padding:7px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:all .15s;
}
#deskPopup .dp-btn:hover{border-color:#4fc3f7;color:#fff;background:#0f2030;}
#deskPopup .dp-chart-btn{
  width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#76ff03;font-family:inherit;font-size:10px;font-weight:700;
  padding:6px;cursor:pointer;margin-bottom:8px;
  transition:all .15s;
}
#deskPopup .dp-chart-btn:hover{background:#1a2800;border-color:#76ff03;}

/* ── MOBILE BOTTOM SHEET ── */
#tvOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;backdrop-filter:blur(2px);}
#tvSheet{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:#161616;border-radius:18px 18px 0 0;
  border-top:1px solid #2a2a2a;
  padding:0 18px 32px;
  box-shadow:0 -8px 40px rgba(0,0,0,.8);
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#tvSheet.open{transform:translateY(0);}
#sheetDrag{width:36px;height:4px;background:#333;border-radius:2px;margin:10px auto 14px;}
#sheetSym{font-size:14px;font-weight:700;color:#4fc3f7;margin-bottom:4px;}
#sheetChart{
  width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;
  color:#76ff03;font-family:inherit;font-size:11px;font-weight:700;
  padding:8px;cursor:pointer;margin-bottom:10px;
}
#sheetBtns{display:flex;flex-wrap:wrap;gap:6px;}
.stf{
  flex:1;min-width:60px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;
  color:#666;font-family:inherit;font-size:11px;font-weight:700;
  padding:10px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.stf.active{border-color:#4fc3f7;color:#4fc3f7;background:#0f2030;}

/* ── LOADING ── */
#loader{
  position:fixed;inset:0;background:#0a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;z-index:99999;
}
.spin{
  width:32px;height:32px;border:3px solid #1e1e1e;
  border-top-color:#4fc3f7;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:11px;color:#444;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loader">
  <div class="spin"></div>
  <p>Loading market data...</p>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">NSE F&amp;O<small>ADVANCE / DECLINE</small></div>
    <div class="sep"></div>
    <div class="ts">Scanned <b id="sct" data-scan-time="">—</b></div>
    <div class="sep"></div>
    <div class="sw"><input id="srch" placeholder="Search..." oninput="doFilter()"></div>
  </div>

  <div class="breadth">
    <div class="bar-row">
      <div class="b-adv" id="bA" style="width:50%">—</div>
      <div class="b-dec" id="bD" style="width:50%">—</div>
    </div>
    <div class="bstats">
      Total <b id="stTotal">—</b>
      &nbsp;Adv <b class="g" id="stAdv">—</b>
      &nbsp;Dec <b class="r" id="stDec">—</b>
      &nbsp;Neutral <b class="n" id="stNeu">—</b>
    </div>
  </div>

  <div class="hdr-right">
    <button class="fb on-all" id="bAll" onclick="setF('all')">All F&amp;O</button>
    <button class="fb" id="bN50" onclick="setF('nifty')">Nifty 50</button>
    <button class="fb" id="bGraph" onclick="toggleGraph()">📈 Graph</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- TOP 5 PANEL -->
  <div class="top5" id="top5Panel">
    <div class="top5-box" id="gainBox">
      <div class="top5-title g">▲ Top 5 Gainers</div>
    </div>
    <div class="top5-box" id="lossBox">
      <div class="top5-title r">▼ Top 5 Losers</div>
    </div>
  </div>

  <!-- HEATMAP -->
  <div class="grid" id="grid"></div>

  <!-- GRAPH VIEW -->
  <div class="graph-view" id="graphView">
    <div class="graph-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="graph-title">Advance / Decline — Intraday History</div>
        <div class="graph-legend">
          <div class="leg-item"><div class="leg-dot adv"></div>Advance</div>
          <div class="leg-item"><div class="leg-dot dec"></div>Decline</div>
          <div class="leg-item"><div class="leg-dot neu"></div>Neutral</div>
        </div>
      </div>
      <canvas id="graphCanvas"></canvas>
    </div>
  </div>
</div>

<!-- MINI CHART MODAL -->
<div id="miniOverlay" onclick="closeMini(event)">
  <div id="miniModal">
    <div class="mini-hdr">
      <div class="mini-sym" id="miniSym">—</div>
      <div class="mini-info">
        <div class="mini-ltp" id="miniLtp">—</div>
        <div class="mini-pct" id="miniPct">—</div>
        <button class="mini-close" onclick="closeMiniBtn()">✕</button>
      </div>
    </div>
    <canvas id="miniCanvas"></canvas>
    <div class="mini-footer">1-min candles · Today</div>
  </div>
</div>

<!-- TV POPUP (desktop) -->
<div id="deskPopup">
  <div class="dp-sym" id="dpSym">—</div>
  <div class="dp-sub">Open in TradingView</div>
  <button class="dp-chart-btn" id="dpChart" onclick="openMiniFromPopup()">📊 Mini Chart</button>
  <div class="dp-div"></div>
  <div class="dp-btns" id="dpBtns"></div>
</div>

<!-- MOBILE BOTTOM SHEET -->
<div id="tvOverlay" onclick="closeSheet()"></div>
<div id="tvSheet">
  <div id="sheetDrag"></div>
  <div id="sheetSym">—</div>
  <button id="sheetChart" onclick="openMiniFromSheet()">📊 Mini Chart</button>
  <div id="sheetBtns"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
// CONFIG — R2 Public URL
// ══════════════════════════════════════════════════════
const R2_BASE = "https://pub-0135f1f5b268481b9b92e79b3870ebf6.r2.dev";
const BUCKET    = "adv-dec";

// Helper: today string
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function r2url(path){
  return `${R2_BASE}/${path}?t=${Date.now()}`;
}

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let allStocks     = [];
let nifty50Set    = new Set();
let currentFilter = 'all';
let graphMode     = false;
let currentSym    = null;
let graphData     = [];
let lastScanTime  = '';

const TFS = [
  {id:'1',  label:'1m',  tv:'1'},
  {id:'5',  label:'5m',  tv:'5'},
  {id:'15', label:'15m', tv:'15'},
  {id:'60', label:'1H',  tv:'60'},
  {id:'D',  label:'D',   tv:'D'},
];
let lastTf = localStorage.getItem('lastTf') || '5';
function getLastTf(){return lastTf;}
function setLastTf(id){lastTf=id;localStorage.setItem('lastTf',id);}

// ══════════════════════════════════════════════════════
// FETCH DATA
// ══════════════════════════════════════════════════════
async function fetchLatest(){
  const r = await fetch(r2url('latest.json'));
  if(!r.ok) throw new Error('latest.json fetch failed');
  return r.json();
}

async function fetchGraph(){
  try{
    const r = await fetch(r2url(`${todayStr()}/graph.json`));
    if(!r.ok) return [];
    return r.json();
  }catch(e){return [];}
}

async function fetchSymbolHistory(sym){
  try{
    const r = await fetch(r2url(`${todayStr()}/symbols/${sym}.json`));
    if(!r.ok) return [];
    return r.json();
  }catch(e){return [];}
}

// ══════════════════════════════════════════════════════
// RENDER HEATMAP
// ══════════════════════════════════════════════════════
function renderHeatmap(data){
  const grid = document.getElementById('grid');

  // Extract nifty50 from data if present
  if(data.nifty50) nifty50Set = new Set(data.nifty50);

  allStocks = data.stocks || [];

  // Sort: gainers first, then neutral, then losers
  allStocks.sort((a,b) => (b['Change %']||0) - (a['Change %']||0));

  // Update header
  const st = data.scan_time || '';
  document.getElementById('sct').textContent = st;
  document.getElementById('sct').setAttribute('data-scan-time', st);
  lastScanTime = st;

  // Update breadth
  const total = data.total || 0;
  const adv   = data.adv   || 0;
  const dec   = data.dec   || 0;
  const neu   = data.neutral || 0;
  const ap    = total ? +(adv/total*100).toFixed(1) : 0;
  const dp    = total ? +(dec/total*100).toFixed(1) : 0;

  document.getElementById('bA').style.width = Math.max(ap, adv>0?3:0)+'%';
  document.getElementById('bA').innerHTML   = '&#9650; '+adv+' ('+ap+'%)';
  document.getElementById('bD').style.width = Math.max(dp, dec>0?3:0)+'%';
  document.getElementById('bD').innerHTML   = dec+' ('+dp+'%) &#9660;';

  document.getElementById('stTotal').textContent = total;
  document.getElementById('stAdv').textContent   = adv;
  document.getElementById('stDec').textContent   = dec;
  document.getElementById('stNeu').textContent   = neu;

  // Build cards
  grid.innerHTML = '';
  const sorted = [...allStocks];

  // Top 5 gainers/losers index
  const gainers = sorted.filter(s=>s['Change %']>0).slice(0,5).map(s=>s.Symbol);
  const losers  = sorted.filter(s=>s['Change %']<0).slice(-5).map(s=>s.Symbol);
  const topGain = new Set(gainers);
  const topLoss = new Set(losers);

  sorted.forEach(stock => {
    const sym    = stock.Symbol;
    const ltp    = stock.LTP;
    const pct    = stock['Change %'] || 0;
    const status = (stock.Status||'').toUpperCase();
    const isN50  = nifty50Set.has(sym);

    const dir    = status==='ADV'?'adv':status==='DEC'?'dec':'nt';
    const h      = Math.min(Math.abs(pct),5)/5*50;
    const sign   = pct>0?'+':'';
    const arrow  = pct>0?'&#9650;':pct<0?'&#9660;':'&mdash;';
    const ndot   = isN50?'<span class="ndot"></span>':'';
    let extra    = topGain.has(sym)?'top-gain':topLoss.has(sym)?'top-loss':'';

    const card = document.createElement('div');
    card.className = `card ${dir} ${extra}`;
    card.dataset.sym    = sym;
    card.dataset.nifty  = isN50?'1':'0';
    card.dataset.status = status;
    card.dataset.pct    = pct;
    card.innerHTML = `
      <div class="cf" style="height:${h.toFixed(1)}%"></div>
      <div class="ct">
        <div class="cs">${ndot}${sym}</div>
        <div class="cp">${arrow} ${sign}${pct.toFixed(2)}%</div>
        <div class="cl">${Number(ltp).toFixed(2)}</div>
      </div>`;

    card.addEventListener('click',  e => onCardClick(e, sym));
    card.addEventListener('touchstart', e => onTouchStart(e, sym), {passive:true});
    card.addEventListener('touchend',   e => onTouchEnd(e, sym));
    card.addEventListener('touchmove',  onTouchCancel);
    grid.appendChild(card);
  });

  renderTop5(sorted, topGain, topLoss);
  doFilter();
}

// ══════════════════════════════════════════════════════
// TOP 5
// ══════════════════════════════════════════════════════
function renderTop5(sorted, topGain, topLoss){
  const gainBox = document.getElementById('gainBox');
  const lossBox = document.getElementById('lossBox');

  // Keep title
  gainBox.innerHTML = '<div class="top5-title g">▲ Top 5 Gainers</div>';
  lossBox.innerHTML = '<div class="top5-title r">▼ Top 5 Losers</div>';

  const gainers = sorted.filter(s=>s['Change %']>0).slice(0,5);
  const losers  = sorted.filter(s=>s['Change %']<0).reverse().slice(0,5);

  gainers.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'top5-row';
    row.innerHTML = `<span class="top5-sym">${s.Symbol}</span><span class="top5-pct g">+${s['Change %'].toFixed(2)}%</span>`;
    row.onclick = ()=>openMiniChart(s.Symbol, s.LTP, s['Change %']);
    gainBox.appendChild(row);
  });

  losers.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'top5-row';
    row.innerHTML = `<span class="top5-sym">${s.Symbol}</span><span class="top5-pct r">${s['Change %'].toFixed(2)}%</span>`;
    row.onclick = ()=>openMiniChart(s.Symbol, s.LTP, s['Change %']);
    lossBox.appendChild(row);
  });
}

// ══════════════════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════════════════
function setF(f){
  currentFilter = f;
  document.getElementById('bAll').className  = 'fb'+(f==='all'?' on-all':'');
  document.getElementById('bN50').className  = 'fb'+(f==='nifty'?' on-n50':'');
  doFilter();
}

function getColumns(count){
  const w=window.innerWidth;
  if(w<=480) return Math.min(count,3);
  if(w<=768) return Math.min(count,5);
  if(w<=1024)return Math.min(count,12);
  if(count<=50)  return Math.min(count,10);
  if(count<=100) return Math.min(count,14);
  return 21;
}

function doFilter(){
  const s    = document.getElementById('srch').value.toLowerCase();
  const grid = document.getElementById('grid');
  const nodes= grid.querySelectorAll('.card');
  let adv=0,dec=0,neu=0,tot=0;

  nodes.forEach(c=>{
    const ok=(currentFilter==='all'||c.dataset.nifty==='1')&&(!s||c.dataset.sym.toLowerCase().includes(s));
    c.style.display=ok?'':'none';
    if(ok){
      tot++;
      const st=c.dataset.status;
      if(st==='ADV')adv++;else if(st==='DEC')dec++;else neu++;
    }
  });

  const cols = getColumns(tot);
  const scroll = window.innerWidth<=768 || !!s;
  grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  grid.style.gridAutoRows  = scroll?'auto':'1fr';
  grid.style.overflowY     = scroll?'auto':'hidden';

  const ap = tot?+(adv/tot*100).toFixed(1):0;
  const dp = tot?+(dec/tot*100).toFixed(1):0;
  document.getElementById('bA').style.width = Math.max(ap,adv>0?3:0)+'%';
  document.getElementById('bA').innerHTML   = '&#9650; '+adv+' ('+ap+'%)';
  document.getElementById('bD').style.width = Math.max(dp,dec>0?3:0)+'%';
  document.getElementById('bD').innerHTML   = dec+' ('+dp+'%) &#9660;';
  document.getElementById('stTotal').textContent=tot;
  document.getElementById('stAdv').textContent=adv;
  document.getElementById('stDec').textContent=dec;
  document.getElementById('stNeu').textContent=neu;
}

window.addEventListener('resize',doFilter);

// ══════════════════════════════════════════════════════
// GRAPH VIEW
// ══════════════════════════════════════════════════════
function toggleGraph(){
  graphMode = !graphMode;
  document.getElementById('grid').style.display      = graphMode?'none':'grid';
  document.getElementById('top5Panel').style.display = graphMode?'none':'flex';
  document.getElementById('graphView').classList.toggle('active', graphMode);
  document.getElementById('bGraph').classList.toggle('on-graph', graphMode);

  if(graphMode) loadAndRenderGraph();
}

async function loadAndRenderGraph(){
  graphData = await fetchGraph();
  drawGraph(graphData);
}

function drawGraph(data){
  const canvas = document.getElementById('graphCanvas');
  if(!canvas) return;

  const dpr = window.devicePixelRatio||1;
  const W   = canvas.parentElement.clientWidth - 32;
  const H   = canvas.parentElement.clientHeight - 60;

  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);

  if(!data || data.length<2){
    ctx.fillStyle='#333';
    ctx.font='12px Segoe UI';
    ctx.textAlign='center';
    ctx.fillText('No graph data yet...', W/2, H/2);
    return;
  }

  const pad = {t:10, r:10, b:30, l:36};
  const cw  = W - pad.l - pad.r;
  const ch  = H - pad.t - pad.b;

  const maxVal = Math.max(...data.map(d=>Math.max(d.adv,d.dec,d.neutral||0)), 1);
  const n      = data.length;

  function xp(i){ return pad.l + (i/(n-1))*cw; }
  function yp(v){ return pad.t + ch - (v/maxVal)*ch; }

  // Grid lines
  ctx.strokeStyle='#1a1a1a';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = pad.t + (ch/4)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    const val = Math.round(maxVal*(1-i/4));
    ctx.fillStyle='#333';ctx.font='9px Segoe UI';ctx.textAlign='right';
    ctx.fillText(val, pad.l-4, y+3);
  }

  // Draw filled area — neutral
  if(data.some(d=>d.neutral>0)){
    ctx.beginPath();
    ctx.moveTo(xp(0), yp(0));
    data.forEach((d,i)=>ctx.lineTo(xp(i),yp(d.neutral||0)));
    ctx.lineTo(xp(n-1),yp(0));ctx.closePath();
    ctx.fillStyle='rgba(204,136,0,0.2)';ctx.fill();
  }

  // Draw filled area — dec
  ctx.beginPath();
  ctx.moveTo(xp(0), yp(0));
  data.forEach((d,i)=>ctx.lineTo(xp(i),yp(d.dec)));
  ctx.lineTo(xp(n-1),yp(0));ctx.closePath();
  ctx.fillStyle='rgba(221,17,17,0.35)';ctx.fill();

  // Draw filled area — adv
  ctx.beginPath();
  ctx.moveTo(xp(0), yp(0));
  data.forEach((d,i)=>ctx.lineTo(xp(i),yp(d.adv)));
  ctx.lineTo(xp(n-1),yp(0));ctx.closePath();
  ctx.fillStyle='rgba(0,204,68,0.25)';ctx.fill();

  // Lines
  function drawLine(key, color){
    ctx.beginPath();
    ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.lineJoin='round';
    data.forEach((d,i)=>{
      if(i===0)ctx.moveTo(xp(i),yp(d[key]||0));
      else ctx.lineTo(xp(i),yp(d[key]||0));
    });
    ctx.stroke();

    // Dots
    ctx.fillStyle=color;
    data.forEach((d,i)=>{
      ctx.beginPath();
      ctx.arc(xp(i),yp(d[key]||0),2.5,0,Math.PI*2);
      ctx.fill();
    });
  }

  drawLine('neutral','#cc8800');
  drawLine('dec',    '#dd1111');
  drawLine('adv',    '#00cc44');

  // X axis labels
  ctx.fillStyle='#444';ctx.font='8px Segoe UI';ctx.textAlign='center';
  const step = Math.max(1, Math.floor(n/10));
  data.forEach((d,i)=>{
    if(i%step===0){
      ctx.fillText(d.time, xp(i), H-pad.b+14);
    }
  });

  // Last value labels
  const last = data[n-1];
  ctx.font='9px Segoe UI';ctx.textAlign='left';
  ctx.fillStyle='#00cc44';ctx.fillText('▲ '+last.adv,    pad.l+cw+4, yp(last.adv)+3);
  ctx.fillStyle='#dd1111';ctx.fillText('▼ '+last.dec,    pad.l+cw+4, yp(last.dec)+3);
  if(last.neutral){
    ctx.fillStyle='#cc8800';ctx.fillText('— '+last.neutral, pad.l+cw+4, yp(last.neutral)+3);
  }
}

// ══════════════════════════════════════════════════════
// MINI CHART
// ══════════════════════════════════════════════════════
async function openMiniChart(sym, ltp, pct){
  currentSym = sym;
  document.getElementById('miniSym').textContent = sym;
  document.getElementById('miniLtp').textContent = Number(ltp).toFixed(2);
  const pc = document.getElementById('miniPct');
  pc.textContent = (pct>=0?'+':'')+Number(pct).toFixed(2)+'%';
  pc.className   = 'mini-pct '+(pct>=0?'g':'r');
  document.getElementById('miniOverlay').classList.add('show');

  const history = await fetchSymbolHistory(sym);
  drawMiniChart(history, pct>=0?'#00cc44':'#dd1111');
}

function drawMiniChart(history, color){
  const canvas = document.getElementById('miniCanvas');
  const dpr    = window.devicePixelRatio||1;
  const W      = canvas.parentElement.clientWidth;
  const H      = 160;
  canvas.width  = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  if(!history||history.length<2){
    ctx.fillStyle='#333';ctx.font='11px Segoe UI';
    ctx.textAlign='center';
    ctx.fillText('No history data', W/2, H/2);
    return;
  }

  const prices = history.map(h=>h.ltp);
  const times  = history.map(h=>h.time);
  const n      = prices.length;
  const minP   = Math.min(...prices);
  const maxP   = Math.max(...prices);
  const range  = maxP-minP || 1;

  const pad = {t:8,r:8,b:24,l:52};
  const cw  = W-pad.l-pad.r;
  const ch  = H-pad.t-pad.b;

  function xp(i){ return pad.l + (i/(n-1))*cw; }
  function yp(v){ return pad.t + ch - ((v-minP)/range)*ch; }

  // Grid
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){
    const y = pad.t+(ch/3)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    const v = maxP - (range/3)*i;
    ctx.fillStyle='#333';ctx.font='8px Segoe UI';ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),pad.l-4,y+3);
  }

  // Fill
  const grad = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0, color==='#00cc44'?'rgba(0,204,68,0.3)':'rgba(221,17,17,0.3)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.moveTo(xp(0),yp(prices[0]));
  prices.forEach((p,i)=>ctx.lineTo(xp(i),yp(p)));
  ctx.lineTo(xp(n-1),pad.t+ch);
  ctx.lineTo(xp(0),pad.t+ch);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';
  prices.forEach((p,i)=>{
    if(i===0)ctx.moveTo(xp(i),yp(p));
    else ctx.lineTo(xp(i),yp(p));
  });
  ctx.stroke();

  // Last dot
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(xp(n-1),yp(prices[n-1]),4,0,Math.PI*2);ctx.fill();

  // X labels
  ctx.fillStyle='#444';ctx.font='8px Segoe UI';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(n/6));
  times.forEach((t,i)=>{
    if(i%step===0) ctx.fillText(t,xp(i),H-pad.b+12);
  });
}

function closeMini(e){
  if(e.target===document.getElementById('miniOverlay'))
    document.getElementById('miniOverlay').classList.remove('show');
}
function closeMiniBtn(){
  document.getElementById('miniOverlay').classList.remove('show');
}

// ══════════════════════════════════════════════════════
// CARD EVENTS
// ══════════════════════════════════════════════════════
let lpTimer=null, lpDone=false;
let popupSym=null;

function onCardClick(e, sym){
  if(!window.matchMedia('(pointer:fine)').matches) return;
  e.stopPropagation();
  popupSym = sym;
  showDeskPopup(e, sym);
}

function onTouchStart(e, sym){
  lpDone=false;
  lpTimer=setTimeout(()=>{
    lpDone=true;
    const tf=TFS.find(t=>t.id===getLastTf())||TFS[1];
    window.open('https://www.tradingview.com/chart/?symbol=NSE:'+sym+'&interval='+tf.tv+'&theme=dark','_blank');
    if(navigator.vibrate)navigator.vibrate(40);
  },600);
}

function onTouchEnd(e, sym){
  clearTimeout(lpTimer);
  if(lpDone) return;
  e.preventDefault();
  const stock = allStocks.find(s=>s.Symbol===sym);
  if(stock){
    document.getElementById('sheetSym').textContent='NSE: '+sym;
    popupSym = sym;
    buildSheetBtns(sym);
    const overlay=document.getElementById('tvOverlay');
    const sheet=document.getElementById('tvSheet');
    overlay.style.display='block';sheet.style.display='block';
    requestAnimationFrame(()=>sheet.classList.add('open'));
  }
}

function onTouchCancel(){ clearTimeout(lpTimer);lpDone=false; }

// Desktop popup
function showDeskPopup(e, sym){
  const popup = document.getElementById('deskPopup');
  document.getElementById('dpSym').textContent = sym;
  buildDpBtns(sym);
  popup.style.display='block';
  const x=Math.min(e.clientX+10, window.innerWidth-270);
  const y=Math.min(e.clientY+10, window.innerHeight-180);
  popup.style.left=x+'px';popup.style.top=y+'px';
}

function buildDpBtns(sym){
  const btns = document.getElementById('dpBtns');
  btns.innerHTML='';
  const last=getLastTf();
  TFS.forEach(tf=>{
    const btn=document.createElement('button');
    btn.className='dp-btn'+(tf.id===last?' active':'');
    btn.textContent=tf.label;
    btn.onclick=()=>{
      setLastTf(tf.id);
      window.open('https://www.tradingview.com/chart/?symbol=NSE:'+sym+'&interval='+tf.tv+'&theme=dark','_blank');
      closeDeskPopup();
    };
    btns.appendChild(btn);
  });
}

function buildSheetBtns(sym){
  const btns=document.getElementById('sheetBtns');
  btns.innerHTML='';
  const last=getLastTf();
  TFS.forEach(tf=>{
    const btn=document.createElement('button');
    btn.className='stf'+(tf.id===last?' active':'');
    btn.textContent=tf.label;
    btn.onclick=()=>{
      setLastTf(tf.id);
      window.open('https://www.tradingview.com/chart/?symbol=NSE:'+sym+'&interval='+tf.tv+'&theme=dark','_blank');
      closeSheet();
    };
    btns.appendChild(btn);
  });
}

function closeDeskPopup(){document.getElementById('deskPopup').style.display='none';}
document.addEventListener('click',e=>{
  if(!document.getElementById('deskPopup').contains(e.target))
    closeDeskPopup();
});

function openMiniFromPopup(){
  closeDeskPopup();
  if(!popupSym) return;
  const stock=allStocks.find(s=>s.Symbol===popupSym);
  if(stock) openMiniChart(stock.Symbol, stock.LTP, stock['Change %']);
}

function openMiniFromSheet(){
  closeSheet();
  if(!popupSym) return;
  const stock=allStocks.find(s=>s.Symbol===popupSym);
  if(stock) openMiniChart(stock.Symbol, stock.LTP, stock['Change %']);
}

function closeSheet(){
  const sheet=document.getElementById('tvSheet');
  sheet.classList.remove('open');
  setTimeout(()=>{
    sheet.style.display='none';
    document.getElementById('tvOverlay').style.display='none';
  },300);
}

// Swipe down
let swipeY=0;
document.getElementById('sheetDrag').addEventListener('touchstart',e=>{swipeY=e.touches[0].clientY;},{passive:true});
document.getElementById('tvSheet').addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-swipeY;
  if(dy>0)document.getElementById('tvSheet').style.transform='translateY('+dy+'px)';
},{passive:true});
document.getElementById('tvSheet').addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-swipeY;
  document.getElementById('tvSheet').style.transform='';
  if(dy>80)closeSheet();
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDeskPopup();closeMiniBtn();}});

// AUTO REFRESH
// ══════════════════════════════════════════════════════
async function refresh(){
  try{
    const data = await fetchLatest();
    if(data.scan_time !== lastScanTime){
      renderHeatmap(data);
      if(graphMode){
        graphData = await fetchGraph();
        drawGraph(graphData);
      }
    }
  }catch(e){
    console.warn('Refresh error:', e);
  }
}

// Random card shimmer
setInterval(()=>{
  const nodes=[...document.getElementById('grid').querySelectorAll('.card')].filter(n=>n.style.display!=='none');
  if(!nodes.length)return;
  const c=nodes[Math.floor(Math.random()*nodes.length)];
  c.style.filter='brightness(1.5)';
  setTimeout(()=>c.style.filter='',350);
},2500);

// INIT
// ══════════════════════════════════════════════════════
async function init(){
  try{
    const data = await fetchLatest();
    renderHeatmap(data);
    document.getElementById('loader').style.display='none';
  }catch(e){
    document.getElementById('loader').innerHTML='<p style="color:#ff4444">Failed to load data.<br>Check R2_BASE URL in config.</p>';
  }
}

init();
setInterval(refresh, 30000);
