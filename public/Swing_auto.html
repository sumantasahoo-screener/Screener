    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* Theme 3 (Retro Soft Brutalism) */
            --bg: #F4F1DE; 
            --card-bg: #FFFFFF; 
            --border: #3D405B; 
            --text: #3D405B; 
            --accent: #E07A5F; 
            --th-bg: #F2CC8F; 
            --box-shadow: 10px 10px 0 #E07A5F;
            --font-main: 'Inter', sans-serif;
            
            --success: #008000;
            --danger: #dc2626;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            background: var(--card-bg);
            border: 4px solid var(--border);
            box-shadow: var(--box-shadow);
        }

        .header-nav {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
            padding: 20px 24px; border-bottom: 4px solid var(--border);
        }
        
        .logo { display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
        .brand-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; }

        .stats-row { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; border-bottom: 4px solid var(--border); }
        .stat-card {
            flex: 1; min-width: 150px; border: 3px solid var(--border); background: var(--card-bg); display: flex; flex-direction: column;
        }
        .stat-head {
            padding: 6px 10px; font-weight: 900; font-size: 0.7rem; text-transform: uppercase;
            border-bottom: 2px solid var(--border); background: #000; color: #fff;
        }
        .stat-body { padding: 8px 10px; }
        .stat-val { font-size: 1.3rem; font-weight: 900; margin-bottom: 2px; }

        .admin-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-weight: 700; }
        .admin-controls p { margin: 0; font-size: 12px; }

        .controls-container { padding: 20px 24px; border-bottom: 4px solid var(--border); display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; }
        
        select, input {
            padding: 6px 10px; border: 2px solid var(--border); font-size: 12px; font-family: inherit; font-weight: 700;
            background-color: #fff; outline: none; cursor: pointer; text-transform: uppercase;
        }
        select:focus, input:focus { background-color: #fffde7; }
        
        .toggle-group { display: flex; border: 2px solid var(--border); background: #fff; }
        .toggle-btn { 
            background: transparent; border: none; border-right: 2px solid var(--border); 
            padding: 6px 12px; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; color: var(--text);
        }
        .toggle-btn:last-child { border-right: none; }
        .toggle-btn.active { background: var(--border); color: #fff; }

        button {
            background-color: var(--border); color: white; border: 2px solid var(--border);
            padding: 8px 14px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        button:hover:not(:disabled) { background-color: var(--accent); color: #fff; border-color: var(--border); }
        button:disabled { background-color: #ccc; cursor: not-allowed; border-color: #999; color: #666; }
        
        .primary-btn { background-color: var(--accent); color: #fff; margin-left: auto; }
        .primary-btn:hover:not(:disabled) { background-color: #000; border-color: #000; }
        
        .table-container { padding: 24px; }
        .results-wrapper { border: 3px solid var(--border); overflow-x: auto; max-height: 75vh; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            padding: 10px 14px; background: var(--th-bg); border-bottom: 3px solid var(--border);
            font-weight: 900; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
            position: sticky; top: 0; z-index: 10;
        }
        td { padding: 8px 14px; font-weight: 700; font-size: 12px; border-bottom: 1px solid var(--border); }
        tbody tr:hover td { background: rgba(0,0,0,0.05); }

        .green, .buy { color: var(--success) !important; font-weight: 900 !important; }
        .red, .sell { color: var(--danger) !important; font-weight: 900 !important; }
        
        .symbol-cell { font-weight: 900; text-decoration: underline; font-size: 13px; color: var(--text); }
        .price-cell { font-weight: 800; font-size: 13px; }
        
        .badge {
            display: inline-block; padding: 2px 6px; font-size: 0.65rem; font-weight: 900; 
            border-radius: 4px; border: 1px solid var(--border); background: var(--card-bg); margin-right: 4px;
        }

        #loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--border); 
            border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
                gap: 0.5rem !important;
            }
            .header > div:nth-child(2) > div {
                flex: 1 1 30%;
                padding: 0.5rem !important;
            }
            /* Top right controls fix */
            .header > div:nth-child(3) button {
                width: 100%;
                margin-bottom: 0.5rem !important;
            }
            
            .controls-container {
                padding: 1rem;
                flex-direction: column;
                align-items: stretch !important;
                gap: 1rem;
            }
            .controls-container > div {
                width: 100%;
                border-left: none !important;
                padding-left: 0 !important;
                flex-direction: column;
                align-items: stretch !important;
            }
            .filter-group select, .filter-group input {
                width: 100%;
                box-sizing: border-box;
            }
            .toggle-group {
                display: flex;
                width: 100%;
                box-sizing: border-box;
            }
            .toggle-btn {
                flex: 1;
                padding: 0.8rem;
                font-size: 0.85rem;
            }
            .primary-btn {
                width: 100%;
                margin: 1rem 0 0 0;
            }
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 1rem;
            }
            table {
                min-width: 1000px; /* Forces scroll on mobile */
            }
            td {
                padding: 1rem 0.75rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <script>
        function manualSync() {
            const pwd = prompt("Enter Admin Password for Manual Sync:");
            if (pwd !== "9605") {

                return;

            // Open the worker directly in a new tab so the user can read the exact output (e.g. NOT_READY)
            // This also bypasses any CORS issues natively.
            window.open("https://swing-daily-worker.teletechcare-b71.workers.dev/run", "_blank");
        }

        const BASE_URL = "https://pub-62be4c3290c44e0d996c0e8514fbeead.r2.dev";
        
        // NSE F&O List (Top Stocks)
        const FNO_STOCKS = new Set([
            "AARTIIND", "ABB", "ABBOTINDIA", "ABCAPITAL", "ABFRL", "ACC", "ADANIENT", "ADANIPORTS", "ALKEM",

            "M&M", "M&MFIN", "MANAPPURAM", "MARICO", "MARUTI", "MCDOWELL-N", "MCX", "METROPOLIS", "MFSL", "MGL", 
            "MOTHERSON", "MPHASIS", "MRF", "MUTHOOTFIN", "NATIONALUM", "NAUKRI", "NAVINFLUOR", "NESTLEIND", "NMDC", 
            "NTPC", "OBEROIRLTY", "OFSS", "ONGC", "PAGEIND", "PEL", "PERSISTENT", "PETRONET", "PFC", "PIDILITIND", 
            "PIIND", "PNB", "POLYCAB", "POWERGRID", "PVRINOX", "RAMCOCEM", "RBLBANK", "RECLTD", "RELIANCE", "SAIL", 
            "SBICARD", "SBILIFE", "SBIN", "SHREECEM", "SIEMENS", "SRF", "SUNTV", "SYNGENE", "TATACHEM", "TATACOMM",

            "TVSMOTOR", "UBL", "ULTRACEMCO", "UPL", "VEDL", "VOLTAS", "WIPRO", "ZEEL", "ZYDUSLIFE"
        ]);

        let currentSegment = 'all';
        let cachedData = null; // Store fetched data so changing filters doesn't re-download 78MB

        function setSegment(seg) {
            currentSegment = seg;
            document.getElementById('btn-all').classList.remove('active');
            document.getElementById('btn-fno').classList.remove('active');
            document.getElementById(`btn-${seg}`).classList.add('active');
        }

        async function fetchMarketData() {
            if (cachedData) return cachedData; // Return if already downloaded

            const overlay = document.getElementById('loading-overlay');
            const text = document.getElementById('loading-text');
            overlay.style.display = 'flex';

            try {
                // 1. Fetch Status
                text.innerText = 'Checking Cloud Status...';
                let status = { file_path: null, last_updated: 'Base' };
                try {
                    const statRes = await fetch(`${BASE_URL}/status.json?t=${Date.now()}`);
                    if (statRes.ok) status = await statRes.json();
                } catch(e) {}
                
                document.getElementById('data-date').innerText = status.last_updated;
                
                // Check if data is updated today (IST)
                let nowIST = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"}));
                let todayStr = nowIST.getFullYear() + "-" + String(nowIST.getMonth()+1).padStart(2, '0') + "-" + String(nowIST.getDate()).padStart(2, '0');
                
                let syncMsg = document.getElementById('sync-message');
                let syncBtn = document.getElementById('sync-btn');
                
                if (status.last_updated === todayStr) {
                    syncMsg.innerHTML = "✅ DATA UP TO DATE";
                    syncMsg.style.color = "var(--success)";
                    syncBtn.style.display = "none";
                } else {
                    syncMsg.innerHTML = "⚠️ DATA NOT UPDATED TODAY";
                    syncMsg.style.color = "var(--danger)";
                    syncBtn.style.display = "inline-block";
                }

                // 2. Fetch Base Historical Data
                text.innerText = 'Downloading Market Data (Please wait)...';
                const baseRes = await fetch(`${BASE_URL}/historical_data.json`);
                if (!baseRes.ok) throw new Error("CORS or Fetch error on historical_data.json");
                const data = await baseRes.json();

                // 3. Fetch Daily
                if (status.file_path) {
                    text.innerText = `Merging Latest Prices...`;
                    try {
                        const dailyRes = await fetch(`${BASE_URL}/${status.file_path}?t=${Date.now()}`);
                        if (dailyRes.ok) {
                            const dailyData = await dailyRes.json();
                            for (const sym in dailyData) {
                                if (data[sym]) {
                                    const lastBaseDate = data[sym][data[sym].length - 1].date;
                                    if (lastBaseDate !== dailyData[sym].date) {
                                        data[sym].push(dailyData[sym]);
                                    }
                                }
                            }
                        }
                    } catch(e) { console.error("Error fetching daily", e); }
                }
                
                cachedData = data;
                return data;
            } finally {
                overlay.style.display = 'none';
            }
        }

        async function runScreener() {
            const selectedDate = document.getElementById('date-select').value;
            const overlay = document.getElementById('loading-overlay');
            const text = document.getElementById('loading-text');
            overlay.style.display = 'flex';
            
            try {
                text.innerText = `Fetching Signals for ${selectedDate}...`;
                let precalc = null;
                try {
                    const res = await fetch(`${BASE_URL}/signals_${selectedDate}.json?t=${Date.now()}`);
                    if (res.ok) precalc = await res.json();
                } catch(e) {}
                
                if (precalc) {
                    renderPrecalcTable(precalc);
                    return;
                }
                
                const latestDate = document.getElementById('date-select').options[0].value;
                if (selectedDate !== latestDate) {
                    alert(`Historical signals for ${selectedDate} are not available yet. System will start saving from today onwards.`);
                    return;
                }
                
                const data = await fetchMarketData();
                if (!data) return;
                
                text.innerText = "Calculating All Strategies... Please Wait";
                const calculatedSignals = computeAllStrategies(data);
                
                text.innerText = "Saving Signals to Cloud...";
                try {
                    await fetch("https://swing-daily-worker.teletechcare-b71.workers.dev/save-signals", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: "9605", date: selectedDate, signals: calculatedSignals })
                    });
                } catch(e) { console.error("Cloud Save Failed", e); }
                
                renderPrecalcTable(calculatedSignals);
                
            } catch (err) {
                alert(err.message);
            } finally {
                overlay.style.display = 'none';
            }
        }

        function computeAllStrategies(data) {
            const results = {};
            for (const sym in data) {
                const quotes = data[sym];
                if (quotes.length < 50) continue; 

                const closes = quotes.map(q => q.Close);
                const highs = quotes.map(q => q.High);
                const lows = quotes.map(q => q.Low);
                const vols = quotes.map(q => q.Volume);
                
                const ltp = closes[closes.length - 1];
                const rsi = calculateRSI(closes, 14);
                const ema21 = calculateSMA(closes, 21);
                const volRatio = calculateVolumeRatio(vols, 20);
                const dmi = calculateADX(highs, lows, closes, 14);
                const sma20 = calculateSMA(closes, 20);
                const sma50 = calculateSMA(closes, 50);
                const sma200 = calculateSMA(closes, 200);
                const candlePattern = detectCandlePattern(quotes.slice(-2), sma20);
                
                const last10 = quotes.slice(-10);
                let trendHtml = `<div style="display: flex; gap: 3px; align-items: center; justify-content: center;" title="Last 10 Days Trend">`;
                last10.forEach(q => {
                    const isGreen = q.Close >= q.Open;
                    const color = isGreen ? 'var(--success)' : 'var(--danger)';
                    trendHtml += `<div style="width: 5px; height: 16px; background: ${color}; border-radius: 2px; opacity: 0.85;"></div>`;
                });
                trendHtml += `</div>`;

                let signals = { breakout: 'neutral', squeeze: 'neutral', pullback: 'neutral' };
                let tags = { breakout: '', squeeze: '', pullback: '' };

                if (ltp > ema21 && volRatio > 2.0 && closes[closes.length-1] > closes[closes.length-2] && dmi.adx > 20 && dmi.pdi > dmi.mdi) {
                    signals.breakout = 'buy'; tags.breakout = 'Breakout';
                } else if (ltp < ema21 && volRatio > 2.0 && closes[closes.length-1] < closes[closes.length-2] && dmi.adx > 20 && dmi.mdi > dmi.pdi) {
                    signals.breakout = 'sell'; tags.breakout = 'Breakdown';
                }

                const stdDev = calculateStdDev(closes, 20, sma20);
                const bbUpper = sma20 + (2 * stdDev);
                const bbLower = sma20 - (2 * stdDev);
                if (sma20 > 0 && (bbUpper - bbLower) / sma20 < 0.05) { 
                    if (ltp > sma20 && dmi.pdi > dmi.mdi) {
                        signals.squeeze = 'buy'; tags.squeeze = 'Squeeze Buy';
                    } else if (ltp < sma20 && dmi.mdi > dmi.pdi) {
                        signals.squeeze = 'sell'; tags.squeeze = 'Squeeze Sell';
                    }
                }

                if (closes.length > 200) {
                    if (ltp > sma200 && rsi < 35 && rsi > 20 && dmi.adx > 25) {
                        signals.pullback = 'buy'; tags.pullback = 'Pullback';
                    } else if (ltp < sma200 && rsi > 65 && rsi < 80 && dmi.adx > 25) {
                        signals.pullback = 'sell'; tags.pullback = 'Pullback';
                    }
                }
                
                const isBearishCandle = candlePattern ? (candlePattern.includes('Shooting Star') || candlePattern.includes('Hanging Man') || candlePattern.includes('Bear Engulfing')) : false;
                const isBullishCandle = candlePattern ? (candlePattern.includes('Hammer') || candlePattern.includes('Bull Engulfing')) : false;

                ['breakout', 'squeeze', 'pullback'].forEach(s => {
                    if (signals[s] === 'buy' && isBearishCandle) signals[s] = 'neutral';
                    if (signals[s] === 'sell' && isBullishCandle) signals[s] = 'neutral';
                    if (signals[s] !== 'neutral' && candlePattern) tags[s] += ` + ${candlePattern}`;
                });

                results[sym] = {
                    ltp, rsi, volRatio, ema21, sma50, sma200, adx: dmi.adx, pdi: dmi.pdi, mdi: dmi.mdi, 
                    trendHtml, candlePattern, signals, tags
                };
            }
            return results;
        }

        function renderPrecalcTable(precalc) {
            const strategy = document.getElementById('strategy-select').value;
            const direction = document.getElementById('direction-select').value;
            const searchQ = document.getElementById('symbol-search').value.trim().toUpperCase();
            const candleFilter = document.getElementById('candle-select').value;
            const tbody = document.getElementById('results-table');
            
            let buyCount = 0;
            let sellCount = 0;
            let totalScanned = Object.keys(precalc).length;
            const finalResults = [];

            for (const sym in precalc) {
                if (currentSegment === 'fno' && !FNO_STOCKS.has(sym)) continue;
                if (searchQ && !sym.includes(searchQ)) continue;

                const r = precalc[sym];
                let signal = r.signals[strategy] || 'neutral';
                let tag = r.tags[strategy] || '';
                
                let keep = false;
                if (searchQ) {
                    keep = true;
                } else {
                    if (direction === 'everything') keep = true;
                    else if (direction === 'all' && (signal === 'buy' || signal === 'sell')) keep = true;
                    else if (direction === 'bullish' && signal === 'buy') keep = true;
                    else if (direction === 'bearish' && signal === 'sell') keep = true;
                    else if (direction === 'neutral' && signal === 'neutral') keep = true;
                    
                    if (candleFilter !== 'all') {
                        if (!r.candlePattern) keep = false;
                        else {
                            if (candleFilter === 'any') keep = true;
                            else if (candleFilter === 'bullish' && (r.candlePattern.includes('Hammer') || r.candlePattern.includes('Bull'))) keep = true;
                            else if (candleFilter === 'bearish' && (r.candlePattern.includes('Shooting Star') || r.candlePattern.includes('Hanging Man') || r.candlePattern.includes('Bear'))) keep = true;
                            else keep = false;
                        }
                    }
                }

                if (keep) {
                    if (signal === 'buy') buyCount++;
                    if (signal === 'sell') sellCount++;
                    if (signal === 'neutral' && !tag) tag = r.candlePattern || 'Neutral';
                    finalResults.push({ sym, signal, tag, ...r });
                }
            }

            document.getElementById('stat-scanned').innerText = totalScanned;
            document.getElementById('stat-buy').innerText = buyCount;
            document.getElementById('stat-sell').innerText = sellCount;

            tbody.innerHTML = '';
            if (finalResults.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align: center; padding: 3rem; color: var(--text-muted);">No setups found for the selected criteria.</td></tr>`;
            } else {
                let strategyName = document.getElementById('strategy-select').options[document.getElementById('strategy-select').selectedIndex].text;
                
                finalResults.forEach(r => {
                    const tr = document.createElement('tr');
                    let badgeClass = 'neutral';
                    let badgeText = 'NEUTRAL';
                    if (r.signal === 'buy') { badgeClass = 'buy'; badgeText = 'BUY SETUP'; }
                    if (r.signal === 'sell') { badgeClass = 'sell'; badgeText = 'SELL SETUP'; }

                    tr.innerHTML = `
                        <td class="symbol-cell" style="text-align: left;">${r.sym}</td>
                        <td class="price-cell" style="text-align: right;">₹${r.ltp.toFixed(2)}</td>
                        <td style="text-align: center;"><span class="badge ${badgeClass}">${badgeText}</span></td>
                        <td style="text-align: left; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">${r.tag || strategyName}</td>
                        <td style="text-align: center;">${r.trendHtml}</td>
                        <td style="text-align: center; font-weight: 500;">${r.volRatio.toFixed(2)}x</td>
                        <td style="text-align: center;">${r.rsi.toFixed(2)}</td>
                        <td style="text-align: center; font-weight: 600; color: ${r.adx > 20 ? 'var(--accent)' : 'var(--text-muted)'}">${r.adx.toFixed(2)}</td>
                        <td style="text-align: center; font-size: 0.85rem; font-weight: 600;"><span style="color: var(--success);">${r.pdi.toFixed(1)}</span> <span style="color: #cbd5e1;">/</span> <span style="color: var(--danger);">${r.mdi.toFixed(1)}</span></td>
                        <td style="text-align: right; color: ${r.ltp > r.ema21 ? 'var(--success)' : 'var(--danger)'};">₹${r.ema21.toFixed(1)}</td>
                        <td style="text-align: right; color: ${r.ltp > r.sma50 ? 'var(--success)' : 'var(--danger)'};">₹${r.sma50.toFixed(1)}</td>
                        <td style="text-align: right; color: ${r.ltp > r.sma200 ? 'var(--success)' : 'var(--danger)'};">₹${r.sma200.toFixed(1)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // --- Math Helpers ---
        function calculateSMA(prices, period) {
            if (prices.length < period) return 0;
            let sum = 0;
            for (let i = prices.length - period; i < prices.length; i++) {
                sum += prices[i];
            }
            return sum / period;
        }

        function calculateStdDev(prices, period, sma) {
            if (prices.length < period) return 0;
            let sum = 0;
            for (let i = prices.length - period; i < prices.length; i++) {
                sum += Math.pow(prices[i] - sma, 2);
            }
            return Math.sqrt(sum / period);
        }

        function calculateRSI(prices, period) {
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                const diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i - 1];
                let gain = diff >= 0 ? diff : 0;
                let loss = diff < 0 ? -diff : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
            }
            if (avgLoss === 0) return 100;
            return 100 - (100 / (1 + (avgGain / avgLoss)));
        }

        function calculateVolumeRatio(volumes, period) {
            if (volumes.length < period + 1) return 0;
            const currentVol = volumes[volumes.length - 1];
            let sum = 0;
            for (let i = volumes.length - 1 - period; i < volumes.length - 1; i++) {
                sum += volumes[i];
            }
            const avgVol = sum / period;
            return avgVol > 0 ? (currentVol / avgVol) : 0;
        }

        // --- ADX / DMI Calculation ---
        function ewm(arr, alpha) {
            if (arr.length === 0) return [];
            let res = [arr[0]];
            for (let i = 1; i < arr.length; i++) {
                res.push((arr[i] * alpha) + (res[i-1] * (1 - alpha)));
            }
            return res;
        }

        function calculateADX(highs, lows, closes, period) {
            if (closes.length < period * 2) return { adx: 0, pdi: 0, mdi: 0 };
            
            let tr = [0], pdm = [0], mdm = [0];
            for (let i = 1; i < closes.length; i++) {
                let upMove = highs[i] - highs[i-1];
                let downMove = lows[i-1] - lows[i];
                
                pdm.push((upMove > downMove && upMove > 0) ? upMove : 0);
                mdm.push((downMove > upMove && downMove > 0) ? downMove : 0);
                
                let hl = highs[i] - lows[i];
                let hc = Math.abs(highs[i] - closes[i-1]);
                let lc = Math.abs(lows[i] - closes[i-1]);
                tr.push(Math.max(hl, hc, lc));
            }
            
            const alpha = 1 / period;
            const atr = ewm(tr, alpha);
            const pdi_ewm = ewm(pdm, alpha);
            const mdi_ewm = ewm(mdm, alpha);
            
            let pdi = [], mdi = [], dx = [];
            for (let i = 0; i < atr.length; i++) {
                let p = atr[i] === 0 ? 0 : 100 * (pdi_ewm[i] / atr[i]);
                let m = atr[i] === 0 ? 0 : 100 * (mdi_ewm[i] / atr[i]);
                pdi.push(p);
                mdi.push(m);
                dx.push(p + m === 0 ? 0 : 100 * Math.abs(p - m) / (p + m));
            }
            
            const adx = ewm(dx, alpha);
            
            return {
                adx: adx[adx.length - 1],
                pdi: pdi[pdi.length - 1],
                mdi: mdi[mdi.length - 1]
            };
        }

        // --- Candlestick Pattern Detection (Deep Context) ---
        function detectCandlePattern(lastTwoDays, trendSma) {
            if (lastTwoDays.length < 2) return null;
            
            const prev = lastTwoDays[0];
            const curr = lastTwoDays[1];
            
            const body = Math.abs(curr.Open - curr.Close);
            const range = curr.High - curr.Low;
            const upperWick = curr.High - Math.max(curr.Open, curr.Close);
            const lowerWick = Math.min(curr.Open, curr.Close) - curr.Low;
            
            const isUptrend = curr.Close > trendSma;
            
            // 1. Long Lower Wick (Hammer / Hanging Man)
            if (lowerWick >= (2 * body) && upperWick <= (0.2 * range) && range > 0) {
                if (!isUptrend) return '🔨 Hammer'; // Bullish at bottom
                else return '🩸 Hanging Man'; // Bearish at top
            }
            
            // 2. Long Upper Wick (Shooting Star / Inverted Hammer)
            if (upperWick >= (2 * body) && lowerWick <= (0.2 * range) && range > 0) {
                if (isUptrend) return '🌠 Shooting Star'; // Bearish at top
                else return '🔨 Inverted Hammer'; // Bullish at bottom
            }
            
            // 3. Bullish Engulfing
            const prevBody = Math.abs(prev.Open - prev.Close);
            const isPrevBearish = prev.Close < prev.Open;
            const isCurrBullish = curr.Close > curr.Open;
            if (isPrevBearish && isCurrBullish && curr.Close > prev.Open && curr.Open < prev.Close && body > prevBody) {
                return '🚀 Bull Engulfing';
            }
            
            // 4. Bearish Engulfing
            const isPrevBullish = prev.Close > prev.Open;
            const isCurrBearish = curr.Close < curr.Open;
            if (isPrevBullish && isCurrBearish && curr.Close < prev.Open && curr.Open > prev.Close && body > prevBody) {
                return '🩸 Bear Engulfing';
            }
            
            return null;
        }

        // Initialize status on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let status = { file_path: null, last_updated: 'Base' };
                const statRes = await fetch(`${BASE_URL}/status.json?t=${Date.now()}`);
                if (statRes.ok) status = await statRes.json();
                
                document.getElementById('data-date').innerText = status.last_updated;
                
                let nowIST = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Kolkata"}));
                let todayStr = nowIST.getFullYear() + "-" + String(nowIST.getMonth()+1).padStart(2, '0') + "-" + String(nowIST.getDate()).padStart(2, '0');
                
                let syncMsg = document.getElementById('sync-message');
                let syncBtn = document.getElementById('sync-btn');
                
                if (status.last_updated === todayStr) {
                    syncMsg.innerHTML = "✅ DATA UP TO DATE";
                    syncMsg.style.color = "var(--success)";
                    syncBtn.style.display = "none";
                } else {
                    syncMsg.innerHTML = "⚠️ DATA NOT UPDATED TODAY";
                    syncMsg.style.color = "var(--danger)";
                    syncBtn.style.display = "inline-block";
                }

                // Populate Date Selector with last 15 weekdays starting from the latest data date
                let dateSelect = document.getElementById('date-select');
                dateSelect.options[0].value = status.last_updated;
                dateSelect.options[0].text = `Latest (${status.last_updated})`;

                let d = status.last_updated && status.last_updated !== 'Base' ? new Date(status.last_updated) : new Date();
                let added = 0;
                while(added < 15) {
                    if(d.getDay() !== 0 && d.getDay() !== 6) {
                        let y = d.getFullYear();
                        let m = String(d.getMonth()+1).padStart(2,'0');
                        let dd = String(d.getDate()).padStart(2,'0');
                        let dateStr = `${y}-${m}-${dd}`;
                        
                        if (dateStr !== status.last_updated) {
                            let opt = document.createElement('option');
                            opt.value = dateStr;
                            opt.text = dateStr;
                            dateSelect.appendChild(opt);
                            added++;
                        }
                    }
                    d.setDate(d.getDate() - 1);
                }

            } catch(e) {
                document.getElementById('sync-message').innerText = "Status Check Failed";
                document.getElementById('sync-message').style.color = "var(--danger)";
                document.getElementById('sync-btn').style.display = "inline-block";
            }
        });
    </script>
