<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Chat — Live Signal Board</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b7eff'/><text x='50' y='68' font-family='Arial, sans-serif' font-size='55' font-weight='bold' fill='white' text-anchor='middle'>TC</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060d1a;
            --surface: #0d1829;
            --surface2: #111e32;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.14);
            --text1: #ffffff;
            --text2: #c8d8f0;
            --text3: #7a8fad;
            --blue: #3b7eff;
            --blue-glow: rgba(59,126,255,0.2);
            --green: #00d68f;
            --green-glow: rgba(0,214,143,0.15);
            --red: #ff4d6a;
            --red-glow: rgba(255,77,106,0.15);
            --gold: #f5c842;
            --gold-glow: rgba(245,200,66,0.15);
            --purple: #a855f7;
            --shadow: rgba(0,0,0,0.5);
        }
        
        body.light-mode {
            --bg: #f3f5f8;
            --surface: #ffffff;
            --surface2: #f9fafb;
            --border: rgba(0,0,0,0.08);
            --border-bright: rgba(0,0,0,0.12);
            --text1: #1a1f2e;
            --text2: #4a5568;
            --text3: #718096;
            --blue-glow: rgba(59,126,255,0.1);
            --green-glow: rgba(0,214,143,0.08);
            --red-glow: rgba(255,77,106,0.08);
            --gold-glow: rgba(245,200,66,0.08);
            --shadow: rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
            transition: background 0.3s, color 0.3s;
        }
        body:not(.light-mode) {
            background: radial-gradient(ellipse at top left, #0d1f3c 0%, #060d1a 60%);
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(13,24,41,0.95);
            border-bottom: 1px solid var(--border-bright);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .header::before {
            content:'';
            position:absolute;
            top:-40px;left:-60px;
            width:220px;height:120px;
            background:radial-gradient(ellipse,#2250cc44,transparent 70%);
            pointer-events:none;
        }
        .header-brand { display:flex;align-items:center;gap:10px; }
        .header-logo {
            width:34px;height:34px;
            background:linear-gradient(135deg,#3b7eff,#7c3aed);
            border-radius:9px;
            display:flex;align-items:center;justify-content:center;
            font-size:17px;
            box-shadow:0 0 14px rgba(59,126,255,0.38);
        }
        .header h1 {
            font-size:1.15rem;font-weight:800;
            background:linear-gradient(90deg,#ffffff,#7eb3ff);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .header-sub { font-size:0.68rem;color:var(--text3); }
        .live-badge {
            display:flex;align-items:center;gap:6px;
            background:rgba(0,214,143,0.1);
            border:1px solid rgba(0,214,143,0.25);
            padding:5px 12px;border-radius:20px;
            font-size:0.73rem;font-weight:700;color:var(--green);letter-spacing:0.5px;
        }
        .live-dot { width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.65)} }

        /* ===== MAIN LAYOUT ===== */
        .layout {
            display:flex;flex:1;overflow:hidden;
            width:100%;
        }

        /* ===== FEED WRAPPER ===== */
        .feed-wrapper {
            flex:1;display:flex;flex-direction:column;overflow:hidden;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display:flex;align-items:center;gap:10px;
            padding:10px 18px;
            background:rgba(13,24,41,0.5);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
            flex-wrap:wrap;
            justify-content:space-between;
        }
        .filter-btns { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
        .view-date-wrapper { display:flex; align-items:center; gap:8px; font-size:0.75rem; font-weight:700; color:var(--text3); }
        .view-date-input {
            background:rgba(255,255,255,0.05); border:1px solid var(--border-bright);
            color:#fff; padding:5px 10px; border-radius:6px; font-size:0.8rem; outline:none;
        }
        body.light-mode .view-date-input { background:rgba(0,0,0,0.05); color:var(--text1); }
        .fbtn {
            display:flex;align-items:center;gap:5px;
            padding:5px 12px;
            border:1px solid var(--border-bright);
            border-radius:20px;
            background:rgba(255,255,255,0.04);
            color:var(--text2);
            font-size:0.73rem;font-weight:600;
            cursor:pointer;transition:all 0.18s;white-space:nowrap;
        }
        .fbtn:hover { background:rgba(255,255,255,0.08);color:#fff; }
        .fbtn.active { background:var(--blue-glow);border-color:rgba(59,126,255,0.45);color:#fff; }
        .fbtn.active-open     { background:var(--gold-glow); border-color:rgba(245,200,66,0.4);  color:var(--gold); }
        .fbtn.active-achieved { background:var(--green-glow);border-color:rgba(0,214,143,0.4);   color:var(--green); }
        .fbtn.active-failed   { background:var(--red-glow);  border-color:rgba(255,77,106,0.4);  color:var(--red); }
        .fbtn.active-closed   { background:rgba(55,65,81,0.4);border-color:#374151;              color:var(--text2); }
        .cnt {
            background:rgba(255,255,255,0.1);
            border-radius:10px;padding:1px 6px;
            font-size:0.67rem;font-weight:700;
        }

        /* ===== FEED PANEL ===== */
        .feed-panel {
            flex:1;overflow-y:auto;
            padding:14px 16px;
            display:flex;flex-direction:column;gap:12px;
        }
        .feed-panel::-webkit-scrollbar{width:4px}
        .feed-panel::-webkit-scrollbar-track{background:transparent}
        .feed-panel::-webkit-scrollbar-thumb{background:#1e2e45;border-radius:4px}

        .empty-state {
            display:flex;flex-direction:column;align-items:center;
            justify-content:center;flex:1;
            color:var(--text3);gap:8px;font-size:0.88rem;padding:40px;text-align:center;
        }
        .empty-state .icon{font-size:2.2rem;opacity:0.35}

        /* ===== CARDS ===== */
        .card {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:10px;
            padding:5px 12px;
            transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s,background 0.2s;
            animation:fadeUp 0.3s ease forwards;
            position:relative;overflow:hidden;
        }
        .card::before {
            content:'';position:absolute;top:0;left:0;
            width:3px;height:100%;border-radius:10px 0 0 10px;
            z-index: 5;
        }
        .card.bullish {
            border-color: rgba(0,214,143,0.15);
            background: linear-gradient(135deg, var(--surface) 80%, rgba(0,214,143,0.03) 100%);
        }
        .card.bearish {
            border-color: rgba(255,77,106,0.15);
            background: linear-gradient(135deg, var(--surface) 80%, rgba(255,77,106,0.03) 100%);
        }
        .card.bullish::before{background:var(--green)}
        .card.bearish::before{background:var(--red)}
        .card:hover{transform:translateY(-1px);border-color:var(--border-bright)}
        .card.bullish:hover{box-shadow:0 4px 16px var(--green-glow); border-color: rgba(0,214,143,0.4);}
        .card.bearish:hover{box-shadow:0 4px 16px var(--red-glow); border-color: rgba(255,77,106,0.4);}

        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;gap:6px}
        .card-user{display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;color:var(--text2)}
        .avatar{
            width:24px;height:24px;
            background:linear-gradient(135deg,#3b7eff,#7c3aed);
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:0.6rem;font-weight:700;color:#fff;flex-shrink:0;
        }
        .card-right{display:flex;align-items:center;gap:6px}
        .card-time{font-size:0.7rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
        .del-btn, .edit-btn{
            background:rgba(255,255,255,0.06);border:none;color:var(--text3);
            width:26px;height:26px;border-radius:6px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:all 0.2s;font-size:0.85rem;
        }
        .del-btn:hover{background:rgba(255,77,106,0.15);color:var(--red)}
        .edit-btn:hover{background:var(--blue-glow);color:var(--blue)}

        .card-main{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
        .symbol{
            font-family:'JetBrains Mono',monospace;font-size:0.9rem;font-weight:700;
            color:#fff;background:rgba(255,255,255,0.05);
            padding:3px 9px;border-radius:5px;
            border:1px solid var(--border-bright);letter-spacing:0.5px;
            transition: all 0.2s;
        }
        .bullish .symbol { border-color: rgba(0,214,143,0.4); background: rgba(0,214,143,0.08); color: var(--green); }
        .bearish .symbol { border-color: rgba(255,77,106,0.4); background: rgba(255,77,106,0.08); color: var(--red); }
        .pill{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px}
        .pill-bull{color:var(--green);background:var(--green-glow);border:1px solid rgba(0,214,143,0.3)}
        .pill-bear{color:var(--red);background:var(--red-glow);border:1px solid rgba(255,77,106,0.3)}
        .pill-type{color:var(--blue);background:var(--blue-glow);border:1px solid rgba(59,126,255,0.3)}
        .date-chip{
            font-size:0.68rem;color:var(--text3);
            font-family:'JetBrains Mono',monospace;
            background:rgba(255,255,255,0.04);
            padding:3px 7px;border-radius:5px;border:1px solid var(--border);
        }

        /* Compact inline stat chips */
        .info-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;align-items:center;}
        .stat-chip{font-family:'JetBrains Mono',monospace;font-size:0.71rem;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,0.04);white-space:nowrap;}
        .stat-chip.sl{color:var(--red);border-color:rgba(255,77,106,0.22);}
        .stat-chip.tgt{color:var(--green);border-color:rgba(0,214,143,0.22);}
        .stat-chip.entry{color:var(--purple);border-color:rgba(168,85,247,0.22);}
        .src-tag{font-size:0.7rem;color:var(--text3);padding:2px 7px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:4px;white-space:nowrap;}
        .ltp-badge{font-family:'JetBrains Mono',monospace;font-size:0.71rem;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(59,126,255,0.1);color:var(--blue);border:1px solid rgba(59,126,255,0.3);animation:pulse 2s infinite;}
        .footer-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
        .card-notes{font-size:0.76rem;color:var(--text2);line-height:1.4;margin-bottom:5px;padding:0 2px;opacity:0.85;}

        /* Card Image Thumbnail */
        .card-img{
            margin-bottom:7px;cursor:pointer;
            border-radius:7px;overflow:hidden;
            border:1px solid var(--border-bright);
            display:inline-block;
        }
        .card-img img{
            max-height:120px;max-width:100%;display:block;
            transition:opacity 0.2s;
        }
        .card-img:hover img{opacity:0.85}
        .card-img-label{
            font-size:0.68rem;color:var(--text3);
            padding:3px 6px;background:rgba(0,0,0,0.3);
            text-align:center;
        }

        /* Card Footer */
        .card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
        .status-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-open    {color:var(--gold);background:var(--gold-glow);border:1px solid rgba(245,200,66,0.3)}
        .status-achieved{color:var(--green);background:var(--green-glow);border:1px solid rgba(0,214,143,0.3)}
        .status-failed  {color:var(--red);background:var(--red-glow);border:1px solid rgba(255,77,106,0.3)}
        .status-closed  {color:var(--text2);background:rgba(55,65,81,0.4);border:1px solid #374151}

        /* ===== DIAGONAL STATUS STAMP (SOLID RUBBER STAMP STYLE) ===== */
        .status-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.5;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            white-space: nowrap;
            width: fit-content;
            padding: 5px 15px;
            border: 5px solid currentColor;
            border-radius: 8px;
            text-align: center;
        }
        body.light-mode .status-stamp { 
            opacity: 0.35; 
        }
        .card.status-Open .status-stamp { color: #f5c842; border-color: #f5c842; }
        .card.status-Achieved .status-stamp { color: #00d68f; border-color: #00d68f; opacity: 0.6; }
        .card.status-Failed .status-stamp { color: #ff4d6a; border-color: #ff4d6a; opacity: 0.6; }
        .card.status-Closed .status-stamp { color: #7a8fad; border-color: #7a8fad; }

        /* Light Mode Specific Stamp Colors (Darker/Saturated) */
        body.light-mode .card.status-Open .status-stamp { color: #b48900; border-color: #b48900; }
        body.light-mode .card.status-Achieved .status-stamp { color: #008f5e; border-color: #008f5e; }
        body.light-mode .card.status-Failed .status-stamp { color: #cc0022; border-color: #cc0022; }
        body.light-mode .card.status-Closed .status-stamp { color: #4a5568; border-color: #4a5568; }

        body.light-mode .card.status-Closed .status-stamp { color: #4a5568; border-color: #4a5568; }

        /* ===== STATUS AUDIT LOG ===== */
        .status-audit-log {
            margin-top: 4px; padding: 4px 6px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.62rem; color: var(--text3);
            display: flex; flex-direction: column; gap: 2px;
        }
        body.light-mode .status-audit-log { background: rgba(0,0,0,0.02); }
        .audit-entry { display: flex; align-items: center; gap: 6px; }
        .audit-st { font-weight: 700; color: var(--text2); }
        .audit-user { color: var(--blue); font-weight: 600; }
        .audit-time { font-family: 'JetBrains Mono', monospace; opacity: 0.6; }

        /* ===== REMARKS SECTION ===== */
        .remarks-section {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .remark-list { display: flex; flex-wrap: wrap; gap: 4px; }
        .remark-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .remark-user { font-weight: 700; color: var(--blue); font-size: 0.65rem; }
        .add-remark-trigger {
            background: transparent;
            border: 1px dashed var(--text3);
            color: var(--text3);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-remark-trigger:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-glow); }

        .status-btns{display:flex;gap:4px;flex-wrap:wrap}
        .sbtn{
            font-size:0.65rem;font-weight:600;padding:3px 8px;
            border-radius:5px;cursor:pointer;
            border:1px solid var(--border);
            background:rgba(255,255,255,0.04);color:var(--text2);
            transition:all 0.15s;
        }
        .sbtn:hover{border-color:var(--border-bright);color:#fff;background:rgba(255,255,255,0.09)}
        .sbtn.a-open    {background:var(--gold-glow);border-color:rgba(245,200,66,0.4);color:var(--gold)}
        .sbtn.a-achieved{background:var(--green-glow);border-color:rgba(0,214,143,0.4);color:var(--green)}
        .sbtn.a-failed  {background:var(--red-glow);border-color:rgba(255,77,106,0.4);color:var(--red)}
        .sbtn.a-closed  {background:rgba(55,65,81,0.4);border-color:#374151;color:var(--text2)}

        /* ===== OPTION FIELDS ===== */
        .option-fields { display:none;flex-direction:column;gap:9px; }
        .sig-label.ce-lbl:has(input:checked){background:rgba(59,126,255,0.15);border-color:rgba(59,126,255,0.5);color:var(--blue)}
        .sig-label.pe-lbl:has(input:checked){background:var(--red-glow);border-color:rgba(255,77,106,0.5);color:var(--red)}
        .sig-label.ce-lbl:hover{border-color:rgba(59,126,255,0.3)}
        .sig-label.pe-lbl:hover{border-color:rgba(255,77,106,0.3)}
        .source-other{margin-top:5px;display:none}

        /* ===== INPUT PANEL (Fixed Slide-over Overlay) ===== */
        .input-panel{
            position:fixed;right:0;top:56px;
            height:calc(100vh - 56px);
            width:340px;
            background:var(--surface);
            border-left:1px solid var(--border-bright);
            display:flex;flex-direction:column;overflow-y:auto;
            padding:14px 14px;gap:9px;
            transform:translateX(110%);
            transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);
            z-index:500;
            box-shadow:-10px 0 50px rgba(0,0,0,0.6);
        }
        .input-panel.panel-open{transform:translateX(0);}
        .panel-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
        .panel-header h2 { font-size:0.8rem;color:var(--text3);letter-spacing:1px; }
        .panel-close { background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.2rem; }
        .panel-backdrop{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.55);
            backdrop-filter:blur(3px);
            z-index:499;
            opacity:0;pointer-events:none;
            transition:opacity 0.3s;
        }
        .panel-backdrop.open{opacity:1;pointer-events:all;}
        .theme-toggle{
            background:rgba(255,255,255,0.06);
            border:1px solid var(--border-bright);
            color:var(--text2);
            padding:7px 12px;border-radius:8px;
            cursor:pointer;transition:all 0.2s;font-size:0.9rem;
            display:flex;align-items:center;justify-content:center;
        }
        .theme-toggle:hover{background:rgba(255,255,255,0.12);color:#fff}
        body.light-mode .theme-toggle{background:rgba(0,0,0,0.05);color:var(--text2)}
        
        .post-signal-btn{
            display:flex;align-items:center;gap:7px;
            padding:7px 14px;
            background:linear-gradient(135deg,#3b7eff,#7c3aed);
            border:none;border-radius:8px;color:#fff;
            font-size:0.78rem;font-weight:700;cursor:pointer;
            letter-spacing:0.3px;transition:all 0.2s;white-space:nowrap;
            box-shadow:0 2px 12px rgba(59,126,255,0.3);
            font-family:'Inter',sans-serif;
        }
        .post-signal-btn:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(59,126,255,0.5);}
        .post-signal-btn:active{transform:translateY(0);}
        .input-panel::-webkit-scrollbar{width:4px}
        .input-panel::-webkit-scrollbar-track{background:transparent}
        .input-panel::-webkit-scrollbar-thumb{background:#1e2e45;border-radius:4px}

        .panel-title{font-size:0.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;}
        .panel-close-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border-bright);color:var(--text3);border-radius:5px;padding:3px 9px;font-size:0.73rem;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;}
        .panel-close-btn:hover{background:rgba(255,77,106,0.15);border-color:rgba(255,77,106,0.35);color:var(--red);}
        #signal-form{display:flex;flex-direction:column;gap:9px;}
        .form-group{display:flex;flex-direction:column;gap:5px}
        .form-row{display:flex;gap:7px}
        .form-row .form-group{flex:1}
        label.field-label{font-size:0.67rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}

        input[type=text],input[type=number],input[type=date],textarea,select{
            background:rgba(255,255,255,0.05);
            border:1px solid var(--border-bright);
            color:#fff;padding:8px 10px;border-radius:7px;
            font-size:0.82rem;outline:none;width:100%;
            transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
        }
        input[type=number]{font-family:'JetBrains Mono',monospace;font-size:0.8rem}
        input[type=date]{color-scheme:dark}
        select{cursor:pointer}
        select option{background:#0d1829 !important;color:#fff !important;padding:6px 10px;}
        input::placeholder,textarea::placeholder{color:var(--text3)}
        input:focus,textarea:focus,select:focus{
            border-color:var(--blue);
            background:rgba(59,126,255,0.07);
            box-shadow:0 0 0 3px rgba(59,126,255,0.1);
        }
        textarea{resize:none;min-height:52px;line-height:1.5}
        
        .date-error {
            font-size: 0.68rem;
            color: var(--red);
            font-weight: 600;
            display: none;
            margin-top: -3px;
        }

        .signal-row{display:flex;gap:7px}
        .sig-label{
            flex:1;display:flex;align-items:center;justify-content:center;
            padding:8px 6px;border:1px solid var(--border-bright);
            border-radius:7px;cursor:pointer;font-weight:700;font-size:0.8rem;
            transition:all 0.2s;background:rgba(255,255,255,0.03);user-select:none;
            color:var(--text2);
        }
        .sig-label input{display:none}
        .sig-label.bull:has(input:checked){background:var(--green-glow);border-color:rgba(0,214,143,0.5);color:var(--green)}
        .sig-label.bear:has(input:checked){background:var(--red-glow);border-color:rgba(255,77,106,0.5);color:var(--red)}
        .sig-label.bull:hover{border-color:rgba(0,214,143,0.3)}
        .sig-label.bear:hover{border-color:rgba(255,77,106,0.3)}

        .divider{height:1px;background:var(--border);margin:2px 0}

        /* Image Upload */
        .img-upload-box{
            border:1px dashed var(--border-bright);
            border-radius:7px;padding:10px;
            text-align:center;cursor:pointer;
            color:var(--text3);font-size:0.78rem;
            transition:border-color 0.2s,background 0.2s;
            position:relative;
        }
        .img-upload-box:hover{border-color:rgba(59,126,255,0.4);background:rgba(59,126,255,0.05);color:var(--blue)}
        .img-upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
        .img-preview{max-width:100%;max-height:80px;border-radius:5px;margin-top:6px;display:none}

        .submit-btn{
            width:100%;padding:11px;
            background:linear-gradient(135deg,#3b7eff,#2250cc);
            color:#fff;font-size:0.88rem;font-weight:700;
            border:none;border-radius:9px;cursor:pointer;
            letter-spacing:0.5px;transition:all 0.2s;
            position:relative;overflow:hidden;margin-top:2px;
        }
        .submit-btn::after{
            content:'';position:absolute;top:0;left:-100%;
            width:60%;height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
            transform:skewX(-20deg);transition:left 0.4s;
        }
        .submit-btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(59,126,255,0.38)}
        .submit-btn:hover::after{left:200%}
        .submit-btn:active{transform:translateY(0);box-shadow:none}
        .submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none}

        /* ===== MODAL (Delete) ===== */
        .modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.75);
            display:flex;align-items:center;justify-content:center;
            z-index:9999;backdrop-filter:blur(4px);
            opacity:0;pointer-events:none;transition:opacity 0.2s;
        }
        .modal-overlay.open{opacity:1;pointer-events:all}
        .modal-box{
            background:#0d1829;
            border:1px solid var(--border-bright);
            border-radius:14px;padding:26px 28px;
            width:320px;max-width:90vw;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }
        .modal-box h3{font-size:1rem;font-weight:700;margin-bottom:6px;color:#fff}
        .modal-box p{font-size:0.82rem;color:var(--text2);margin-bottom:14px}
        .modal-box input{width:100%;margin-bottom:14px}
        .modal-btns{display:flex;gap:8px}
        .modal-btns button{
            flex:1;padding:10px;border-radius:8px;
            font-size:0.85rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;
        }
        .btn-cancel{background:rgba(255,255,255,0.07);color:var(--text2)}
        .btn-cancel:hover{background:rgba(255,255,255,0.13);color:#fff}
        .btn-delete{background:linear-gradient(135deg,#ff4d6a,#cc1f3a);color:#fff}
        .btn-delete:hover{box-shadow:0 4px 14px rgba(255,77,106,0.4)}
        .modal-err{font-size:0.78rem;color:var(--red);margin-bottom:10px;display:none}

        /* ===== FULLSCREEN IMAGE ===== */
        .img-full-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.9);
            display:flex;align-items:center;justify-content:center;
            z-index:9998;cursor:zoom-out;
            opacity:0;pointer-events:none;transition:opacity 0.2s;
        }
        .img-full-overlay.open{opacity:1;pointer-events:all}
        .img-full-overlay img{max-width:90vw;max-height:90vh;border-radius:8px}

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px){
            .layout{flex-direction:column}
            .input-panel{width:100%;max-width:100%;left:0;right:0;top:54px;height:calc(100vh - 54px);transform:translateY(110%); padding-bottom:80px;}
            .input-panel.panel-open{transform:translateY(0);}
            .feed-wrapper{border-right:none}
        }
        @media(max-width:600px){
            .header{padding:8px 12px; flex-wrap:wrap; gap:8px}
            .header-brand { width:100%; justify-content:center; }
            .live-badge, .header-sub { display:none }
            .form-row{flex-wrap:wrap}
            .filter-bar{padding:8px 12px; justify-content:center}
            .fbtn { font-size: 0.65rem; padding: 4px 8px;}
            .card-top { flex-direction: column; align-items: flex-start; gap: 4px; }
            .card-right { width: 100%; justify-content: space-between; }
            .info-row { gap: 4px; }
            .stat-chip { font-size: 0.65rem; padding: 2px 5px; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-brand">
        <div class="header-logo">📈</div>
        <div>
            <h1>Trade Chat</h1>
            <div class="header-sub">Live Signal Board · Firebase Powered</div>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
        <button class="post-signal-btn" id="headerPostBtn" onclick="toggleSignalPanel()">📤 Post Signal</button>
        <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    </div>
</header>
<!-- Panel Backdrop -->
<div class="panel-backdrop" id="panelBackdrop" onclick="toggleSignalPanel()"></div>

<div class="layout">

    <!-- FEED WRAPPER -->
    <div class="feed-wrapper">

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <div class="filter-btns">
                <button class="fbtn active" data-filter="Open">🟡 Open <span class="cnt" id="cnt-open">0</span></button>
                <button class="fbtn" data-filter="Achieved">✅ Achieved <span class="cnt" id="cnt-achieved">0</span></button>
                <button class="fbtn" data-filter="Failed">❌ Failed <span class="cnt" id="cnt-failed">0</span></button>
                <button class="fbtn" data-filter="Closed">🔒 Closed <span class="cnt" id="cnt-closed">0</span></button>
                <button class="fbtn" data-filter="All">📋 All <span class="cnt" id="cnt-all">0</span></button>
            </div>
            <div class="view-date-wrapper">
                <span>View Date:</span>
                <input type="date" id="viewDateFilter" class="view-date-input" onchange="updateViewDate()">
            </div>
        </div>

        <!-- FEED -->
        <div class="feed-panel" id="feed-panel">
            <div class="empty-state"><div class="icon">📡</div><div>Connecting to live feed...</div></div>
        </div>
    </div>

    <!-- INPUT PANEL -->
    <div class="input-panel">
    <div class="panel-header">
        <h2 id="panelTitle">POST A SIGNAL</h2>
        <button class="panel-close" onclick="toggleSignalPanel()">✕</button>
    </div>
        <form id="signal-form">

            <!-- Name & Symbol -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Your Name</label>
                    <input type="text" id="userName" placeholder="Nickname" autocomplete="off">
                </div>
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label class="field-label">Symbol</label>
                        <div id="ltpFormDisplay" style="font-size:0.75rem; font-weight:700; color:var(--blue); display:none">
                            <span id="ltpLoader" style="display:none">⏳ Fetching...</span>
                            <span id="ltpPrice"></span>
                        </div>
                    </div>
                    <input type="text" id="stockSymbol" list="symbolList" placeholder="e.g. INFY, NIFTY" autocomplete="off" oninput="this.value=this.value.toUpperCase(); handleSymbolInput(this.value)">
                    <datalist id="symbolList"></datalist>
                </div>
            </div>

            <!-- Signal -->
            <div class="form-group">
                <label class="field-label">Signal</label>
                <div class="signal-row">
                    <label class="sig-label bull"><input type="radio" name="signalType" value="Bullish">🟢 Bullish</label>
                    <label class="sig-label bear"><input type="radio" name="signalType" value="Bearish">🔴 Bearish</label>
                </div>
            </div>

            <!-- Trade Type & Date -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Trade Type</label>
                    <select id="tradeType" onchange="toggleOptionFields()">
                        <option value="Stock">Stock</option>
                        <option value="Option">Option</option>
                        <option value="Index">Index</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Trade For Date</label>
                    <input type="date" id="tradeDate" onchange="validateTradeDate()">
                    <div id="dateError" class="date-error">⚠️ NSE Market Holiday</div>
                </div>
            </div>

            <!-- Option-specific fields (hidden by default) -->
            <div class="option-fields" id="optionFields">
                <div class="form-row">
                    <div class="form-group">
                        <label class="field-label">Strike Price</label>
                        <input type="number" id="strikePrice" placeholder="e.g. 23000" step="50">
                    </div>
                    <div class="form-group">
                        <label class="field-label">Option Price</label>
                        <input type="number" id="optionPrice" placeholder="e.g. 150" step="0.5">
                    </div>
                </div>
                <div class="form-group">
                    <label class="field-label">Option Type</label>
                    <div class="signal-row">
                        <label class="sig-label ce-lbl"><input type="radio" name="optionCEPE" value="CE"> 📈 CE</label>
                        <label class="sig-label pe-lbl"><input type="radio" name="optionCEPE" value="PE"> 📉 PE</label>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Entry Range -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Entry Price</label>
                    <input type="number" id="entryFrom" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Entry Upto</label>
                    <input type="number" id="entryTo" placeholder="0.00" step="0.01">
                </div>
            </div>

            <!-- SUPPORT & RESISTANCE REMOVED -->
            <div class="form-row" style="display:none">
                <div class="form-group">
                    <label class="field-label">Support</label>
                    <input type="number" id="support" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Resistance</label>
                    <input type="number" id="resistance" placeholder="0.00" step="0.01">
                </div>
            </div>

            <!-- SL & Target -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Stop Loss</label>
                    <input type="number" id="stopLoss" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Target</label>
                    <input type="number" id="target" placeholder="0.00" step="0.01">
                </div>
            </div>

            <div class="divider"></div>

            <!-- Source & Notes -->
            <div class="form-group">
                <label class="field-label">Source / Logic</label>
                <select id="sourceSelect" onchange="toggleSourceOther()">
                    <option value="">— Select Source —</option>
                    <option value="Buildup">Buildup</option>
                    <option value="Maxpain">Maxpain</option>
                    <option value="PCR">PCR</option>
                    <option value="Trap Indicator">Trap Indicator</option>
                    <option value="Personal">Personal</option>
                    <option value="News Based">News Based</option>
                    <option value="TV News">TV News</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="sourceOther" class="source-other" placeholder="Enter custom source...">
            </div>
            <div class="form-group">
                <label class="field-label">Personal View <span style="font-size:0.62rem;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(Optional)</span></label>
                <textarea id="message" placeholder="Your personal view or extra notes..."></textarea>
            </div>

            <!-- Image Upload -->
            <div class="form-group">
                <label class="field-label">Chart Image (Optional)</label>
                <div class="img-upload-box" id="uploadBox">
                    📷 Click to attach chart screenshot
                    <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
                    <img id="imgPreview" class="img-preview">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">🚀 Post Signal</button>
        </form>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <h3>🗑️ Delete Signal</h3>
        <p>Enter admin password to permanently delete this signal.</p>
        <div class="modal-err" id="modalErr">❌ Wrong password. Try again.</div>
        <input type="password" id="deletePassword" placeholder="Enter password...">
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-delete" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- FULLSCREEN IMAGE -->
<div class="img-full-overlay" id="imgFullOverlay" onclick="this.classList.remove('open')">
    <img id="imgFullSrc" src="">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, getDocs, doc, onSnapshot, query, orderBy, where, Timestamp, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

    const DELETE_PASSWORD = "trade@123";

    const firebaseConfig = {
        apiKey: "AIzaSyAj3mT2G_s0qUNNqyT6jECv7ZMIgUB2pdM",
        authDomain: "stockchatbox-6514d.firebaseapp.com",
        projectId: "stockchatbox-6514d",
        storageBucket: "stockchatbox-6514d.firebasestorage.app",
        messagingSenderId: "146099603350",
        appId: "1:146099603350:web:94707a4164cfd50d4bffb7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const colRef = collection(db, 'signals');
    const q = query(colRef, orderBy('createdAt', 'desc'));

    const feedPanel = document.getElementById('feed-panel');
    const signalForm = document.getElementById('signal-form');

    let allDocs = [];
    let activeFilter = 'Open';
    let activeViewDate = new Date().toISOString().split('T')[0];
    let pendingDeleteId = null;
    let editDocId = null; // Tracking doc being edited

    // Theme Toggle
    window.toggleTheme = () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    };
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

    // NSE Holidays 2026
    const NSE_HOLIDAYS_2026 = [
        "2026-01-26", "2026-03-03", "2026-03-26", "2026-03-31", "2026-04-03",
        "2026-04-14", "2026-05-01", "2026-05-28", "2026-06-26", "2026-09-14",
        "2026-10-02", "2026-10-20", "2026-11-10", "2026-11-24", "2026-12-25"
    ];

    window.validateTradeDate = () => {
        const dateInput = document.getElementById('tradeDate');
        const errDiv = document.getElementById('dateError');
        const submitBtn = document.getElementById('submitBtn');
        const val = dateInput.value;
        if (!val) { errDiv.style.display = 'none'; submitBtn.disabled = false; return; }

        const date = new Date(val);
        const day = date.getDay(); // 0=Sun, 6=Sat
        const isWeekend = (day === 0 || day === 6);
        const isNSEHoliday = NSE_HOLIDAYS_2026.includes(val);

        if (isWeekend || isNSEHoliday) {
            errDiv.textContent = isWeekend ? "⚠️ Market Closed (Weekend)" : "⚠️ NSE Market Holiday";
            errDiv.style.display = 'block';
            submitBtn.disabled = true;
        } else {
            errDiv.style.display = 'none';
            submitBtn.disabled = false;
        }
    };

    // Helpers
    const fmt = (ts) => {
        if (!ts) return 'Just now';
        const d = ts.toDate();
        return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}) + ' · ' + d.toLocaleDateString([], {day:'2-digit',month:'short'});
    };
    const initials = (name) => name ? name.substring(0,2).toUpperCase() : '??';
    const rupee = (v) => v && v != 0 ? '₹' + parseFloat(v).toLocaleString('en-IN', {minimumFractionDigits:2}) : null;

    const statusClass = {Open:'status-open',Achieved:'status-achieved',Failed:'status-failed',Closed:'status-closed'};
    const statusLabel = {Open:'🟡 Open',Achieved:'✅ Achieved',Failed:'❌ Failed',Closed:'🔒 Closed'};
    const sbtnClass = {Open:'a-open',Achieved:'a-achieved',Failed:'a-failed',Closed:'a-closed'};
    const statusEmoji = {Open:'🟡',Achieved:'✅',Failed:'❌',Closed:'🔒'};

    function buildStatBox(label, val, cls) {
        if (!val) return '';
        return `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-val ${cls}">${val}</div></div>`;
    }

    function buildCard(docId, data) {
        const st = data.status || 'Open';
        const isBull = data.signalType === 'Bullish';
        const cardCls = isBull ? 'bullish' : 'bearish';
        const statusCls = `status-${st}`;
        
        const sigPill = isBull
            ? `<span class="pill pill-bull">🟢 Bull</span>`
            : `<span class="pill pill-bear">🔴 Bear</span>`;
        const typePill = data.tradeType ? `<span class="pill pill-type">${data.tradeType}</span>` : '';
        const cePePill = (data.tradeType === 'Option' && data.cePe)
            ? `<span class="pill ${data.cePe === 'CE' ? 'pill-bull' : 'pill-bear'}">${data.cePe}</span>` : '';
        const dateChip = data.tradeDate ? `<span class="date-chip">📅 ${data.tradeDate}</span>` : '';

        // Compact inline stat chips
        let chips = '';
        const ef = rupee(data.entryFrom), et = rupee(data.entryTo);
        if (ef || et) {
            const range = ef && et ? `${ef}–${et}` : (ef || et);
            chips += `<span class="stat-chip entry">⬆ ${range}</span>`;
        }
        if (data.tradeType === 'Option') {
            if (data.strikePrice && data.strikePrice != 0)
                chips += `<span class="stat-chip entry">Strike ₹${parseFloat(data.strikePrice).toLocaleString('en-IN')}</span>`;
            if (data.optionPrice && data.optionPrice != 0)
                chips += `<span class="stat-chip" style="color:var(--purple);border-color:rgba(168,85,247,0.22)">Opt ₹${parseFloat(data.optionPrice).toLocaleString('en-IN')}</span>`;
        }
        if (data.stopLoss && data.stopLoss != 0) chips += `<span class="stat-chip sl">SL ${rupee(data.stopLoss)}</span>`;
        if (data.target && data.target != 0) chips += `<span class="stat-chip tgt">Tgt ${rupee(data.target)}</span>`;

        const statsHtml = chips ? `<div class="stats-line">${chips}</div>` : '';
        const srcHtml = data.source ? `<span class="src-tag">📌 ${data.source}</span>` : '';
        const msgHtml = data.message ? `<div class="card-notes">${data.message}</div>` : '';
        const imgHtml = data.imageUrl ? `
            <div class="card-img" onclick="openFullImg('${data.imageUrl}')">
                <img src="${data.imageUrl}" alt="Chart">
                <div class="card-img-label">📊 View Chart</div>
            </div>` : '';

        // Remarks logic
        let remarksHtml = '';
        if (data.remarks && data.remarks.length > 0) {
            const list = data.remarks.map(r => `
                <div class="remark-pill">
                    <span class="remark-user">${r.user}:</span>
                    <span>${r.text}</span>
                </div>
            `).join('');
            remarksHtml = `<div class="remark-list">${list}</div>`;
        }

        const isAutoClosed = data.statusUpdatedBy === 'Auto Hit';
        const btnHtml = ['Open','Achieved','Failed','Closed'].map(s => {
            const cls = s === st ? `sbtn ${sbtnClass[s]}` : 'sbtn';
            if (isAutoClosed) {
                return `<button class="${cls}" onclick="alert('🚫 Yeh trade automatically LTP check karke close ho chuka hai. Manual update allow nahi hai.')">${statusEmoji[s]} ${s}</button>`;
            }
            return `<button class="${cls}" onclick="updateStatus('${docId}','${s}')">${statusEmoji[s]} ${s}</button>`;
        }).join('');

        // Audit Log logic
        let auditHtml = '';
        if (data.statusHistory && data.statusHistory.length > 0) {
            const entries = data.statusHistory.slice(-5).map(h => {
                const hTime = h.time ? (typeof h.time === 'number' ? new Date(h.time) : h.time.toDate()) : new Date();
                const hTimeStr = hTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                return `<div class="audit-entry">
                    <span class="audit-time">${hTimeStr}</span>
                    <span class="audit-st">${h.status.toUpperCase()}</span>
                    <span class="audit-user">by ${h.user}</span>
                </div>`;
            }).join('');
            auditHtml = `<div class="status-audit-log">${entries}</div>`;
        }

    function updateCounts(docs) {
        // Stats are specific to the selected view date
        const dateSpecificDocs = docs.filter(d => (d.data().tradeDate === activeViewDate));
        const counts = {All:dateSpecificDocs.length, Open:0, Achieved:0, Failed:0, Closed:0};
        dateSpecificDocs.forEach(d => {
            const st = (d.data().status || 'Open');
            if (counts[st] !== undefined) counts[st]++;
        });
        document.getElementById('cnt-all').textContent = counts.All;
        document.getElementById('cnt-open').textContent = counts.Open;
        document.getElementById('cnt-achieved').textContent = counts.Achieved;
        document.getElementById('cnt-failed').textContent = counts.Failed;
        document.getElementById('cnt-closed').textContent = counts.Closed;
    }

    function renderFeed() {

        const dayDocs = allDocs.filter(d => (d.data().tradeDate === activeViewDate));
        
        // Step 2: Filter by Status
        const filtered = activeFilter === 'All'
            ? dayDocs
            : dayDocs.filter(d => (d.data().status || 'Open') === activeFilter);

        if (filtered.length === 0) {
            feedPanel.innerHTML = `<div class="empty-state"><div class="icon">${activeFilter === 'All' ? '📅' : '🔍'}</div><div>${activeFilter === 'All' ? `No signals posted for ${activeViewDate}.` : `No "${activeFilter}" signals for this date.`}</div></div>`;

        if (allDocs.length > 0) {
            const tenDaysAgo = Timestamp.fromDate(new Date(Date.now() - 10 * 24 * 60 * 60 * 1000));
            const oldOnes = allDocs.filter(d => {
                const created = d.data().createdAt;
                return created && created.toMillis() < tenDaysAgo.toMillis();
            });
            if (oldOnes.length > 0) {
                console.log(`Cleaning up ${oldOnes.length} old documents...`);
                oldOnes.forEach(async (d) => await deleteDoc(doc(db, 'signals', d.id)));

    // Real-Time LTP Fetching Engine (No Backend / Google Finance)
    const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
    const ltpCache = {};

    let cachedR2Data = null;
    let lastR2Fetch = 0;

    async function fetchNSEPrice(symbol) {
        if (!symbol) return null;
        const sym = symbol.toUpperCase();
        
        try {
            // STEP 1: Try the existing R2 cache first (Extremely fast & stable)
            // We fetch latest.json once every 60 seconds to save bandwidth
            const now = Date.now();
            if (!cachedR2Data || (now - lastR2Fetch) > 60000) {
                const r2Url = `https://pub-872ee524d3b44e039d5b82f78c97bbcb.r2.dev/latest.json?t=${now}`;
                const r2Resp = await fetch(r2Url);
                if (r2Resp.ok) {
                    cachedR2Data = await r2Resp.json();
                    lastR2Fetch = now;
                }
            }

            if (cachedR2Data && cachedR2Data.stocks) {
                const stock = cachedR2Data.stocks.find(s => s.Symbol === sym);
                if (stock) return parseFloat(stock.LTP);
            }

            // STEP 2: Fallback to the dedicated Worker for stocks NOT in R2 (Nifty 500)
            const workerUrl = `https://nse-proxy.susanta41012.workers.dev?symbol=${encodeURIComponent(sym)}`;
            const resp = await fetch(workerUrl);
            if (resp.ok) {
                const data = await resp.json();
                return data && data.ltp ? parseFloat(data.ltp) : null;
            }
            return null;
        } catch (e) { 
            return null; 
        }
    }

    async function updateDashboardLTPs() {
        const todayOpenDocs = allDocs.filter(d => {
            const data = d.data();
            return (data.status || 'Open') === 'Open' && data.tradeDate && data.tradeDate >= todayStr;
        });

        for (const docSnap of todayOpenDocs) {
            const data = docSnap.data();
            const symbol = data.stockSymbol;
            const docId = docSnap.id;
            
            if (symbol) {
                const price = await fetchNSEPrice(symbol);
                if (price) {
                    const card = document.getElementById(`card-${docId}`);
                    if (card) {
                        const ltpSpan = card.querySelector('.ltp-badge');
                        if (ltpSpan) {
                            ltpSpan.textContent = `LTP: ₹${price.toLocaleString('en-IN')}`;
                            ltpSpan.style.display = 'inline-block';
                        }
                    }

                    const signalType = data.signalType;
                    const target = parseFloat(data.target) || 0;
                    const sl = parseFloat(data.stopLoss) || 0;
                    
                    let newStatus = null;

                    if (signalType === 'Bullish') {
                        if (target > 0 && price >= target) newStatus = 'Achieved';
                        else if (sl > 0 && price <= sl) newStatus = 'Failed';
                    } else if (signalType === 'Bearish') {
                        if (target > 0 && price <= target) newStatus = 'Achieved';
                        else if (sl > 0 && price >= sl) newStatus = 'Failed';
                    }

                    if (newStatus) {
                        try {
                            await updateDoc(doc(db, 'signals', docId), {
                                status: newStatus,
                                statusUpdatedBy: 'Auto Hit',
                                statusUpdatedAt: serverTimestamp(),
                                statusHistory: arrayUnion({
                                    status: newStatus,
                                    user: 'System (Auto Hit)',
                                    time: Date.now()
                                })
                            });
                        } catch (err) {
                            console.error("Auto-close failed: ", err);
                        }
                    }
                }
            }
        }
    }

    function debounce(func, wait) {

        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
