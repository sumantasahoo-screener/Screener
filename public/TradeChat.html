<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Chat — Live Signal Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060d1a;
            --surface: #0d1829;
            --surface2: #111e32;
            --border: rgba(255,255,255,0.07);
            --border-bright: rgba(255,255,255,0.14);
            --text1: #ffffff;
            --text2: #c8d8f0;
            --text3: #7a8fad;
            --blue: #3b7eff;
            --blue-glow: rgba(59,126,255,0.2);
            --green: #00d68f;
            --green-glow: rgba(0,214,143,0.15);
            --red: #ff4d6a;
            --red-glow: rgba(255,77,106,0.15);
            --gold: #f5c842;
            --gold-glow: rgba(245,200,66,0.15);
            --purple: #a855f7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(ellipse at top left, #0d1f3c 0%, #060d1a 60%);
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(13,24,41,0.95);
            border-bottom: 1px solid var(--border-bright);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .header::before {
            content:'';
            position:absolute;
            top:-40px;left:-60px;
            width:220px;height:120px;
            background:radial-gradient(ellipse,#2250cc44,transparent 70%);
            pointer-events:none;
        }
        .header-brand { display:flex;align-items:center;gap:10px; }
        .header-logo {
            width:34px;height:34px;
            background:linear-gradient(135deg,#3b7eff,#7c3aed);
            border-radius:9px;
            display:flex;align-items:center;justify-content:center;
            font-size:17px;
            box-shadow:0 0 14px rgba(59,126,255,0.38);
        }
        .header h1 {
            font-size:1.15rem;font-weight:800;
            background:linear-gradient(90deg,#ffffff,#7eb3ff);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .header-sub { font-size:0.68rem;color:var(--text3); }
        .live-badge {
            display:flex;align-items:center;gap:6px;
            background:rgba(0,214,143,0.1);
            border:1px solid rgba(0,214,143,0.25);
            padding:5px 12px;border-radius:20px;
            font-size:0.73rem;font-weight:700;color:var(--green);letter-spacing:0.5px;
        }
        .live-dot { width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.65)} }

        /* ===== MAIN LAYOUT ===== */
        .layout {
            display:flex;flex:1;overflow:hidden;
            max-width:1400px;width:100%;margin:0 auto;
        }

        /* ===== FEED WRAPPER ===== */
        .feed-wrapper {
            flex:1;display:flex;flex-direction:column;overflow:hidden;
            border-right:1px solid var(--border);
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display:flex;align-items:center;gap:6px;
            padding:10px 16px;
            background:rgba(13,24,41,0.8);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
            flex-wrap:wrap;
        }
        .fbtn {
            display:flex;align-items:center;gap:5px;
            padding:5px 12px;
            border:1px solid var(--border-bright);
            border-radius:20px;
            background:rgba(255,255,255,0.04);
            color:var(--text2);
            font-size:0.73rem;font-weight:600;
            cursor:pointer;transition:all 0.18s;white-space:nowrap;
        }
        .fbtn:hover { background:rgba(255,255,255,0.08);color:#fff; }
        .fbtn.active { background:var(--blue-glow);border-color:rgba(59,126,255,0.45);color:#fff; }
        .fbtn.active-open     { background:var(--gold-glow); border-color:rgba(245,200,66,0.4);  color:var(--gold); }
        .fbtn.active-achieved { background:var(--green-glow);border-color:rgba(0,214,143,0.4);   color:var(--green); }
        .fbtn.active-failed   { background:var(--red-glow);  border-color:rgba(255,77,106,0.4);  color:var(--red); }
        .fbtn.active-closed   { background:rgba(55,65,81,0.4);border-color:#374151;              color:var(--text2); }
        .cnt {
            background:rgba(255,255,255,0.1);
            border-radius:10px;padding:1px 6px;
            font-size:0.67rem;font-weight:700;
        }

        /* ===== FEED PANEL ===== */
        .feed-panel {
            flex:1;overflow-y:auto;
            padding:14px 16px;
            display:flex;flex-direction:column;gap:8px;
        }
        .feed-panel::-webkit-scrollbar{width:4px}
        .feed-panel::-webkit-scrollbar-track{background:transparent}
        .feed-panel::-webkit-scrollbar-thumb{background:#1e2e45;border-radius:4px}

        .empty-state {
            display:flex;flex-direction:column;align-items:center;
            justify-content:center;flex:1;
            color:var(--text3);gap:8px;font-size:0.88rem;padding:40px;text-align:center;
        }
        .empty-state .icon{font-size:2.2rem;opacity:0.35}

        /* ===== CARDS ===== */
        .card {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:10px;
            padding:10px 12px;
            transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;
            animation:fadeUp 0.3s ease forwards;
            position:relative;overflow:hidden;
        }
        .card::before {
            content:'';position:absolute;top:0;left:0;
            width:3px;height:100%;border-radius:10px 0 0 10px;
        }
        .card.bullish::before{background:var(--green)}
        .card.bearish::before{background:var(--red)}
        .card:hover{transform:translateY(-1px);border-color:var(--border-bright)}
        .card.bullish:hover{box-shadow:0 4px 16px var(--green-glow)}
        .card.bearish:hover{box-shadow:0 4px 16px var(--red-glow)}

        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:6px}
        .card-user{display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;color:var(--text2)}
        .avatar{
            width:24px;height:24px;
            background:linear-gradient(135deg,#3b7eff,#7c3aed);
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:0.6rem;font-weight:700;color:#fff;flex-shrink:0;
        }
        .card-right{display:flex;align-items:center;gap:6px}
        .card-time{font-size:0.7rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
        .del-btn{
            background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.2);
            color:rgba(255,77,106,0.6);border-radius:5px;padding:3px 7px;
            font-size:0.68rem;cursor:pointer;transition:all 0.15s;
        }
        .del-btn:hover{background:rgba(255,77,106,0.25);color:var(--red);border-color:rgba(255,77,106,0.5)}

        .card-main{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
        .symbol{
            font-family:'JetBrains Mono',monospace;font-size:0.9rem;font-weight:700;
            color:#fff;background:rgba(255,255,255,0.07);
            padding:3px 9px;border-radius:5px;
            border:1px solid rgba(255,255,255,0.1);letter-spacing:0.5px;
        }
        .pill{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px}
        .pill-bull{color:var(--green);background:var(--green-glow);border:1px solid rgba(0,214,143,0.3)}
        .pill-bear{color:var(--red);background:var(--red-glow);border:1px solid rgba(255,77,106,0.3)}
        .pill-type{color:var(--blue);background:var(--blue-glow);border:1px solid rgba(59,126,255,0.3)}
        .date-chip{
            font-size:0.68rem;color:var(--text3);
            font-family:'JetBrains Mono',monospace;
            background:rgba(255,255,255,0.04);
            padding:3px 7px;border-radius:5px;border:1px solid var(--border);
        }

        /* Compact stats — only rendered when value exists */
        .card-stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
        .stat-box{
            background:rgba(255,255,255,0.03);
            border:1px solid var(--border);
            border-radius:6px;padding:5px 8px;min-width:90px;
        }
        .stat-label{font-size:0.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:1px}
        .stat-val{font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:600;color:#fff}
        .stat-val.sl{color:var(--red)}
        .stat-val.tgt{color:var(--green)}
        .stat-val.sup{color:#60a5fa}
        .stat-val.res{color:var(--gold)}
        .stat-val.entry{color:var(--purple)}

        .card-source{
            font-size:0.76rem;color:var(--text2);
            background:rgba(255,255,255,0.03);
            padding:5px 9px;border-radius:5px;margin-bottom:6px;
            border-left:2px solid var(--blue);
        }
        .card-source strong{color:var(--text3);font-weight:500}
        .card-notes{font-size:0.8rem;color:var(--text2);line-height:1.5;margin-bottom:7px;padding:0 2px}

        /* Card Image Thumbnail */
        .card-img{
            margin-bottom:7px;cursor:pointer;
            border-radius:7px;overflow:hidden;
            border:1px solid var(--border-bright);
            display:inline-block;
        }
        .card-img img{
            max-height:120px;max-width:100%;display:block;
            transition:opacity 0.2s;
        }
        .card-img:hover img{opacity:0.85}
        .card-img-label{
            font-size:0.68rem;color:var(--text3);
            padding:3px 6px;background:rgba(0,0,0,0.3);
            text-align:center;
        }

        /* Card Footer */
        .card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
        .status-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
        .status-open    {color:var(--gold);background:var(--gold-glow);border:1px solid rgba(245,200,66,0.3)}
        .status-achieved{color:var(--green);background:var(--green-glow);border:1px solid rgba(0,214,143,0.3)}
        .status-failed  {color:var(--red);background:var(--red-glow);border:1px solid rgba(255,77,106,0.3)}
        .status-closed  {color:var(--text2);background:rgba(55,65,81,0.4);border:1px solid #374151}

        .status-btns{display:flex;gap:4px;flex-wrap:wrap}
        .sbtn{
            font-size:0.65rem;font-weight:600;padding:3px 8px;
            border-radius:5px;cursor:pointer;
            border:1px solid var(--border);
            background:rgba(255,255,255,0.04);color:var(--text2);
            transition:all 0.15s;
        }
        .sbtn:hover{border-color:var(--border-bright);color:#fff;background:rgba(255,255,255,0.09)}
        .sbtn.a-open    {background:var(--gold-glow);border-color:rgba(245,200,66,0.4);color:var(--gold)}
        .sbtn.a-achieved{background:var(--green-glow);border-color:rgba(0,214,143,0.4);color:var(--green)}
        .sbtn.a-failed  {background:var(--red-glow);border-color:rgba(255,77,106,0.4);color:var(--red)}
        .sbtn.a-closed  {background:rgba(55,65,81,0.4);border-color:#374151;color:var(--text2)}

        /* ===== OPTION FIELDS ===== */
        .option-fields { display:none;flex-direction:column;gap:9px; }
        .sig-label.ce-lbl:has(input:checked){background:rgba(59,126,255,0.15);border-color:rgba(59,126,255,0.5);color:var(--blue)}
        .sig-label.pe-lbl:has(input:checked){background:var(--red-glow);border-color:rgba(255,77,106,0.5);color:var(--red)}
        .sig-label.ce-lbl:hover{border-color:rgba(59,126,255,0.3)}
        .sig-label.pe-lbl:hover{border-color:rgba(255,77,106,0.3)}
        .source-other{margin-top:5px;display:none}

        /* ===== INPUT PANEL ===== */
        .input-panel{
            width:340px;flex-shrink:0;
            background:var(--surface);
            display:flex;flex-direction:column;overflow-y:auto;
            padding:14px 14px;gap:9px;
        }
        .input-panel::-webkit-scrollbar{width:4px}
        .input-panel::-webkit-scrollbar-track{background:transparent}
        .input-panel::-webkit-scrollbar-thumb{background:#1e2e45;border-radius:4px}

        .panel-title{font-size:0.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;padding:7px 9px;margin:-7px -9px;border-radius:7px;transition:background 0.2s;}
        .panel-title:hover{background:rgba(255,255,255,0.05);color:var(--text2);}
        .panel-arrow{font-size:0.78rem;color:var(--text3);transition:transform 0.25s ease;display:inline-block;}
        .panel-arrow.open{transform:rotate(90deg);}
        #signal-form{display:none;flex-direction:column;gap:9px;}
        .form-group{display:flex;flex-direction:column;gap:5px}
        .form-row{display:flex;gap:7px}
        .form-row .form-group{flex:1}
        label.field-label{font-size:0.67rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}

        input[type=text],input[type=number],input[type=date],textarea,select{
            background:rgba(255,255,255,0.05);
            border:1px solid var(--border-bright);
            color:#fff;padding:8px 10px;border-radius:7px;
            font-size:0.82rem;outline:none;width:100%;
            transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
        }
        input[type=number]{font-family:'JetBrains Mono',monospace;font-size:0.8rem}
        input[type=date]{color-scheme:dark}
        select{cursor:pointer}
        select option{background:#0d1829 !important;color:#fff !important;padding:6px 10px;}
        input::placeholder,textarea::placeholder{color:var(--text3)}
        input:focus,textarea:focus,select:focus{
            border-color:var(--blue);
            background:rgba(59,126,255,0.07);
            box-shadow:0 0 0 3px rgba(59,126,255,0.1);
        }
        textarea{resize:none;min-height:52px;line-height:1.5}

        .signal-row{display:flex;gap:7px}
        .sig-label{
            flex:1;display:flex;align-items:center;justify-content:center;
            padding:8px 6px;border:1px solid var(--border-bright);
            border-radius:7px;cursor:pointer;font-weight:700;font-size:0.8rem;
            transition:all 0.2s;background:rgba(255,255,255,0.03);user-select:none;
            color:var(--text2);
        }
        .sig-label input{display:none}
        .sig-label.bull:has(input:checked){background:var(--green-glow);border-color:rgba(0,214,143,0.5);color:var(--green)}
        .sig-label.bear:has(input:checked){background:var(--red-glow);border-color:rgba(255,77,106,0.5);color:var(--red)}
        .sig-label.bull:hover{border-color:rgba(0,214,143,0.3)}
        .sig-label.bear:hover{border-color:rgba(255,77,106,0.3)}

        .divider{height:1px;background:var(--border);margin:2px 0}

        /* Image Upload */
        .img-upload-box{
            border:1px dashed var(--border-bright);
            border-radius:7px;padding:10px;
            text-align:center;cursor:pointer;
            color:var(--text3);font-size:0.78rem;
            transition:border-color 0.2s,background 0.2s;
            position:relative;
        }
        .img-upload-box:hover{border-color:rgba(59,126,255,0.4);background:rgba(59,126,255,0.05);color:var(--blue)}
        .img-upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
        .img-preview{max-width:100%;max-height:80px;border-radius:5px;margin-top:6px;display:none}

        .submit-btn{
            width:100%;padding:11px;
            background:linear-gradient(135deg,#3b7eff,#2250cc);
            color:#fff;font-size:0.88rem;font-weight:700;
            border:none;border-radius:9px;cursor:pointer;
            letter-spacing:0.5px;transition:all 0.2s;
            position:relative;overflow:hidden;margin-top:2px;
        }
        .submit-btn::after{
            content:'';position:absolute;top:0;left:-100%;
            width:60%;height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
            transform:skewX(-20deg);transition:left 0.4s;
        }
        .submit-btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(59,126,255,0.38)}
        .submit-btn:hover::after{left:200%}
        .submit-btn:active{transform:translateY(0);box-shadow:none}
        .submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none}

        /* ===== MODAL (Delete) ===== */
        .modal-overlay{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.75);
            display:flex;align-items:center;justify-content:center;
            z-index:9999;backdrop-filter:blur(4px);
            opacity:0;pointer-events:none;transition:opacity 0.2s;
        }
        .modal-overlay.open{opacity:1;pointer-events:all}
        .modal-box{
            background:#0d1829;
            border:1px solid var(--border-bright);
            border-radius:14px;padding:26px 28px;
            width:320px;max-width:90vw;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }
        .modal-box h3{font-size:1rem;font-weight:700;margin-bottom:6px;color:#fff}
        .modal-box p{font-size:0.82rem;color:var(--text2);margin-bottom:14px}
        .modal-box input{width:100%;margin-bottom:14px}
        .modal-btns{display:flex;gap:8px}
        .modal-btns button{
            flex:1;padding:10px;border-radius:8px;
            font-size:0.85rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;
        }
        .btn-cancel{background:rgba(255,255,255,0.07);color:var(--text2)}
        .btn-cancel:hover{background:rgba(255,255,255,0.13);color:#fff}
        .btn-delete{background:linear-gradient(135deg,#ff4d6a,#cc1f3a);color:#fff}
        .btn-delete:hover{box-shadow:0 4px 14px rgba(255,77,106,0.4)}
        .modal-err{font-size:0.78rem;color:var(--red);margin-bottom:10px;display:none}

        /* ===== FULLSCREEN IMAGE ===== */
        .img-full-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.9);
            display:flex;align-items:center;justify-content:center;
            z-index:9998;cursor:zoom-out;
            opacity:0;pointer-events:none;transition:opacity 0.2s;
        }
        .img-full-overlay.open{opacity:1;pointer-events:all}
        .img-full-overlay img{max-width:90vw;max-height:90vh;border-radius:8px}

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px){
            .layout{flex-direction:column-reverse}
            .input-panel{width:100%;flex-shrink:0;max-height:52vh;overflow-y:auto}
            .feed-wrapper{border-right:none}
        }
        @media(max-width:600px){
            .header{padding:8px 12px}
            .form-row{flex-wrap:wrap}
            .filter-bar{padding:8px 12px}
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-brand">
        <div class="header-logo">📈</div>
        <div>
            <h1>Trade Chat</h1>
            <div class="header-sub">Live Signal Board · Firebase Powered</div>
        </div>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
</header>

<div class="layout">

    <!-- FEED WRAPPER -->
    <div class="feed-wrapper">

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <button class="fbtn active" data-filter="All">📋 All <span class="cnt" id="cnt-all">0</span></button>
            <button class="fbtn" data-filter="Open">🟡 Open <span class="cnt" id="cnt-open">0</span></button>
            <button class="fbtn" data-filter="Achieved">✅ Achieved <span class="cnt" id="cnt-achieved">0</span></button>
            <button class="fbtn" data-filter="Failed">❌ Failed <span class="cnt" id="cnt-failed">0</span></button>
            <button class="fbtn" data-filter="Closed">🔒 Closed <span class="cnt" id="cnt-closed">0</span></button>
        </div>

        <!-- FEED -->
        <div class="feed-panel" id="feed-panel">
            <div class="empty-state"><div class="icon">📡</div><div>Connecting to live feed...</div></div>
        </div>
    </div>

    <!-- INPUT PANEL -->
    <div class="input-panel">
        <div class="panel-title" id="panelToggle" onclick="toggleSignalPanel()">
            <span>📤 Post a Signal</span>
            <span class="panel-arrow" id="panelArrow">▶</span>
        </div>
        <form id="signal-form" style="display:none">

            <!-- Name & Symbol -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Your Name</label>
                    <input type="text" id="userName" placeholder="Nickname" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="field-label">Symbol</label>
                    <input type="text" id="stockSymbol" placeholder="e.g. INFY, NIFTY" required autocomplete="off" oninput="this.value=this.value.toUpperCase()">
                </div>
            </div>

            <!-- Signal -->
            <div class="form-group">
                <label class="field-label">Signal</label>
                <div class="signal-row">
                    <label class="sig-label bull"><input type="radio" name="signalType" value="Bullish" required>🟢 Bullish</label>
                    <label class="sig-label bear"><input type="radio" name="signalType" value="Bearish" required>🔴 Bearish</label>
                </div>
            </div>

            <!-- Trade Type & Date -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Trade Type</label>
                    <select id="tradeType" onchange="toggleOptionFields()">
                        <option value="Stock">Stock</option>
                        <option value="Option">Option</option>
                        <option value="Index">Index</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Trade For Date</label>
                    <input type="date" id="tradeDate">
                </div>
            </div>

            <!-- Option-specific fields (hidden by default) -->
            <div class="option-fields" id="optionFields">
                <div class="form-row">
                    <div class="form-group">
                        <label class="field-label">Strike Price</label>
                        <input type="number" id="strikePrice" placeholder="e.g. 23000" step="50">
                    </div>
                    <div class="form-group">
                        <label class="field-label">Option Price</label>
                        <input type="number" id="optionPrice" placeholder="e.g. 150" step="0.5">
                    </div>
                </div>
                <div class="form-group">
                    <label class="field-label">Option Type</label>
                    <div class="signal-row">
                        <label class="sig-label ce-lbl"><input type="radio" name="optionCEPE" value="CE"> 📈 CE</label>
                        <label class="sig-label pe-lbl"><input type="radio" name="optionCEPE" value="PE"> 📉 PE</label>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Entry Range -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Entry Price</label>
                    <input type="number" id="entryFrom" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Entry Upto</label>
                    <input type="number" id="entryTo" placeholder="0.00" step="0.01">
                </div>
            </div>

            <!-- SUPPORT & RESISTANCE REMOVED -->
            <div class="form-row" style="display:none">
                <div class="form-group">
                    <label class="field-label">Support</label>
                    <input type="number" id="support" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Resistance</label>
                    <input type="number" id="resistance" placeholder="0.00" step="0.01">
                </div>
            </div>

            <!-- SL & Target -->
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Stop Loss</label>
                    <input type="number" id="stopLoss" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label class="field-label">Target</label>
                    <input type="number" id="target" placeholder="0.00" step="0.01">
                </div>
            </div>

            <div class="divider"></div>

            <!-- Source & Notes -->
            <div class="form-group">
                <label class="field-label">Source / Logic</label>
                <select id="sourceSelect" onchange="toggleSourceOther()">
                    <option value="">— Select Source —</option>
                    <option value="Buildup">Buildup</option>
                    <option value="Maxpain">Maxpain</option>
                    <option value="PCR">PCR</option>
                    <option value="Trap Indicator">Trap Indicator</option>
                    <option value="Personal">Personal</option>
                    <option value="News Based">News Based</option>
                    <option value="TV News">TV News</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="sourceOther" class="source-other" placeholder="Enter custom source...">
            </div>
            <div class="form-group">
                <label class="field-label">Personal View <span style="font-size:0.62rem;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(Optional)</span></label>
                <textarea id="message" placeholder="Your personal view or extra notes..."></textarea>
            </div>

            <!-- Image Upload -->
            <div class="form-group">
                <label class="field-label">Chart Image (Optional)</label>
                <div class="img-upload-box" id="uploadBox">
                    📷 Click to attach chart screenshot
                    <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
                    <img id="imgPreview" class="img-preview">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">🚀 Post Signal</button>
        </form>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <h3>🗑️ Delete Signal</h3>
        <p>Enter admin password to permanently delete this signal.</p>
        <div class="modal-err" id="modalErr">❌ Wrong password. Try again.</div>
        <input type="password" id="deletePassword" placeholder="Enter password...">
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-delete" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- FULLSCREEN IMAGE -->
<div class="img-full-overlay" id="imgFullOverlay" onclick="this.classList.remove('open')">
    <img id="imgFullSrc" src="">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, getDocs, doc, onSnapshot, query, orderBy, where, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

    const DELETE_PASSWORD = "trade@123";

    const firebaseConfig = {
        apiKey: "AIzaSyAj3mT2G_s0qUNNqyT6jECv7ZMIgUB2pdM",
        authDomain: "stockchatbox-6514d.firebaseapp.com",
        projectId: "stockchatbox-6514d",
        storageBucket: "stockchatbox-6514d.firebasestorage.app",
        messagingSenderId: "146099603350",
        appId: "1:146099603350:web:94707a4164cfd50d4bffb7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const colRef = collection(db, 'signals');
    const q = query(colRef, orderBy('createdAt', 'desc'));

    const feedPanel = document.getElementById('feed-panel');
    const signalForm = document.getElementById('signal-form');

    let allDocs = [];
    let activeFilter = 'All';
    let pendingDeleteId = null;

    // Helpers
    const fmt = (ts) => {
        if (!ts) return 'Just now';
        const d = ts.toDate();
        return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}) + ' · ' + d.toLocaleDateString([], {day:'2-digit',month:'short'});
    };
    const initials = (name) => name ? name.substring(0,2).toUpperCase() : '??';
    const rupee = (v) => v && v != 0 ? '₹' + parseFloat(v).toLocaleString('en-IN', {minimumFractionDigits:2}) : null;

    const statusClass = {Open:'status-open',Achieved:'status-achieved',Failed:'status-failed',Closed:'status-closed'};
    const statusLabel = {Open:'🟡 Open',Achieved:'✅ Achieved',Failed:'❌ Failed',Closed:'🔒 Closed'};
    const sbtnClass = {Open:'a-open',Achieved:'a-achieved',Failed:'a-failed',Closed:'a-closed'};
    const statusEmoji = {Open:'🟡',Achieved:'✅',Failed:'❌',Closed:'🔒'};

    function buildStatBox(label, val, cls) {
        if (!val) return '';
        return `<div class="stat-box"><div class="stat-label">${label}</div><div class="stat-val ${cls}">${val}</div></div>`;
    }

    function buildCard(docId, data) {
        const st = data.status || 'Open';
        const isBull = data.signalType === 'Bullish';
        const cardCls = isBull ? 'bullish' : 'bearish';
        const sigPill = isBull ? `<span class="pill pill-bull">🟢 Bullish</span>` : `<span class="pill pill-bear">🔴 Bearish</span>`;
        const typePill = data.tradeType ? `<span class="pill pill-type">${data.tradeType}</span>` : '';
        const cePePill = (data.tradeType === 'Option' && data.cePe)
            ? `<span class="pill ${data.cePe === 'CE' ? 'pill-bull' : 'pill-bear'}">${data.cePe}</span>` : '';
        const dateChip = data.tradeDate ? `<span class="date-chip">📅 ${data.tradeDate}</span>` : '';

        // Only show stat boxes that have values
        let statsHtml = '';
        const ef = rupee(data.entryFrom), et = rupee(data.entryTo);
        if (ef || et) {
            const range = ef && et ? `${ef} – ${et}` : (ef || et);
            statsHtml += `<div class="stat-box"><div class="stat-label">Entry</div><div class="stat-val entry">${range}</div></div>`;
        }
        if (data.tradeType === 'Option') {
            if (data.strikePrice && data.strikePrice != 0)
                statsHtml += `<div class="stat-box"><div class="stat-label">Strike</div><div class="stat-val entry">₹${parseFloat(data.strikePrice).toLocaleString('en-IN')}</div></div>`;
            if (data.optionPrice && data.optionPrice != 0)
                statsHtml += `<div class="stat-box"><div class="stat-label">Opt. Price</div><div class="stat-val" style="color:var(--purple)">₹${parseFloat(data.optionPrice).toLocaleString('en-IN')}</div></div>`;
        }
        statsHtml += buildStatBox('Stop Loss', rupee(data.stopLoss), 'sl');
        statsHtml += buildStatBox('Target', rupee(data.target), 'tgt');

        const statsSection = statsHtml ? `<div class="card-stats">${statsHtml}</div>` : '';
        const srcHtml = data.source ? `<div class="card-source"><strong>Source:</strong> ${data.source}</div>` : '';
        const msgHtml = data.message ? `<div class="card-notes">${data.message}</div>` : '';
        const imgHtml = data.imageUrl ? `
            <div class="card-img" onclick="openFullImg('${data.imageUrl}')">
                <img src="${data.imageUrl}" alt="Chart">
                <div class="card-img-label">📊 View Chart</div>
            </div>` : '';

        const btnHtml = ['Open','Achieved','Failed','Closed'].map(s => {
            const cls = s === st ? `sbtn ${sbtnClass[s]}` : 'sbtn';
            return `<button class="${cls}" onclick="updateStatus('${docId}','${s}')">${statusEmoji[s]} ${s}</button>`;
        }).join('');

        return `
            <div class="card ${cardCls}" id="card-${docId}">
                <div class="card-top">
                    <div class="card-user"><div class="avatar">${initials(data.userName)}</div>${data.userName}</div>
                    <div class="card-right">
                        <span class="card-time">${fmt(data.createdAt)}</span>
                        <button class="del-btn" onclick="openDeleteModal('${docId}')">🗑️</button>
                    </div>
                </div>
                <div class="card-main">${data.stockSymbol ? `<span class="symbol">${data.stockSymbol}</span>` : ''}${sigPill}${typePill}${cePePill}${dateChip}</div>
                ${statsSection}
                ${srcHtml}${msgHtml}${imgHtml}
                <div class="card-footer">
                    <span class="status-badge ${statusClass[st]}">${statusLabel[st]}</span>
                    <div class="status-btns">${btnHtml}</div>
                </div>
            </div>`;
    }

    function updateCounts(docs) {
        const counts = {All:docs.length, Open:0, Achieved:0, Failed:0, Closed:0};
        docs.forEach(d => {
            const st = (d.data().status || 'Open');
            if (counts[st] !== undefined) counts[st]++;
        });
        document.getElementById('cnt-all').textContent = counts.All;
        document.getElementById('cnt-open').textContent = counts.Open;
        document.getElementById('cnt-achieved').textContent = counts.Achieved;
        document.getElementById('cnt-failed').textContent = counts.Failed;
        document.getElementById('cnt-closed').textContent = counts.Closed;
    }

    function renderFeed() {
        const filtered = activeFilter === 'All'
            ? allDocs
            : allDocs.filter(d => (d.data().status || 'Open') === activeFilter);

        if (filtered.length === 0) {
            feedPanel.innerHTML = `<div class="empty-state"><div class="icon">${activeFilter === 'All' ? '📡' : '🔍'}</div><div>${activeFilter === 'All' ? 'No signals yet. Post the first one!' : `No "${activeFilter}" signals found.`}</div></div>`;
            return;
        }
        feedPanel.innerHTML = filtered.map(d => buildCard(d.id, d.data())).join('');
    }

    // Real-time listener
    onSnapshot(q, (snapshot) => {
        allDocs = snapshot.docs;
        updateCounts(allDocs);
        renderFeed();
    }, (err) => {
        feedPanel.innerHTML = `<div class="empty-state" style="color:var(--red)">⚠️ Firebase Error: ${err.message}</div>`;
        console.error(err);
    });

    // Filter buttons
    document.querySelectorAll('.fbtn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeFilter = btn.dataset.filter;
            document.querySelectorAll('.fbtn').forEach(b => {
                b.className = 'fbtn';
            });
            const clsMap = {All:'active',Open:'active-open',Achieved:'active-achieved',Failed:'active-failed',Closed:'active-closed'};
            btn.classList.add(clsMap[activeFilter] || 'active');
            renderFeed();
        });
    });

    // Update Status
    window.updateStatus = async (docId, newStatus) => {
        try {
            await updateDoc(doc(db, 'signals', docId), { status: newStatus });
        } catch (err) { alert('Update failed: ' + err.message); }
    };

    // Delete modal
    window.openDeleteModal = (docId) => {
        pendingDeleteId = docId;
        document.getElementById('deletePassword').value = '';
        document.getElementById('modalErr').style.display = 'none';
        document.getElementById('deleteModal').classList.add('open');
        setTimeout(() => document.getElementById('deletePassword').focus(), 100);
    };
    window.closeDeleteModal = () => {
        document.getElementById('deleteModal').classList.remove('open');
        pendingDeleteId = null;
    };
    window.confirmDelete = async () => {
        const pwd = document.getElementById('deletePassword').value;
        const errEl = document.getElementById('modalErr');
        if (pwd !== DELETE_PASSWORD) {
            errEl.style.display = 'block';
            document.getElementById('deletePassword').value = '';
            return;
        }
        errEl.style.display = 'none';
        try {
            await deleteDoc(doc(db, 'signals', pendingDeleteId));
            closeDeleteModal();
        } catch (err) { alert('Delete failed: ' + err.message); }
    };

    // Enter key in modal
    document.getElementById('deletePassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') window.confirmDelete();
        if (e.key === 'Escape') window.closeDeleteModal();
    });

    // Toggle Signal Panel collapse
    window.toggleSignalPanel = () => {
        const form = document.getElementById('signal-form');
        const arrow = document.getElementById('panelArrow');
        const isHidden = form.style.display === 'none' || form.style.display === '';
        if (isHidden) {
            form.style.display = 'flex';
            form.style.flexDirection = 'column';
            form.style.gap = '9px';
            arrow.classList.add('open');
        } else {
            form.style.display = 'none';
            arrow.classList.remove('open');
        }
    };

    // Toggle Option Fields
    window.toggleOptionFields = () => {
        const isOption = document.getElementById('tradeType').value === 'Option';
        const el = document.getElementById('optionFields');
        el.style.display = isOption ? 'flex' : 'none';
        el.style.flexDirection = 'column';
        el.style.gap = '9px';
        if (!isOption) {
            ['strikePrice','optionPrice'].forEach(id => { const f=document.getElementById(id); if(f) f.value=''; });
            document.querySelectorAll('input[name="optionCEPE"]').forEach(r => r.checked = false);
        }
    };

    // Toggle Source Other
    window.toggleSourceOther = () => {
        const isOther = document.getElementById('sourceSelect').value === 'Other';
        const otherEl = document.getElementById('sourceOther');
        otherEl.style.display = isOther ? 'block' : 'none';
        if (!isOther) otherEl.value = '';
    };

    // Fullscreen image
    window.openFullImg = (url) => {
        document.getElementById('imgFullSrc').src = url;
        document.getElementById('imgFullOverlay').classList.add('open');
    };

    // Form Submit
    signalForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Posting...';

        const userName = document.getElementById('userName').value.trim();
        localStorage.setItem('tradechat_name', userName);

        try {
            // Upload image if selected
            let imageUrl = '';
            const fileInput = document.getElementById('imageFile');
            if (fileInput.files.length > 0) {
                btn.textContent = '📤 Uploading image...';
                const file = fileInput.files[0];
                const imgRef = ref(storage, `charts/${Date.now()}_${file.name}`);
                await uploadBytes(imgRef, file);
                imageUrl = await getDownloadURL(imgRef);
            }

            // 10-day auto-cleanup
            const tenDaysAgo = Timestamp.fromDate(new Date(Date.now() - 10 * 24 * 60 * 60 * 1000));
            const oldQ = query(colRef, where('createdAt', '<', tenDaysAgo));
            const oldDocs = await getDocs(oldQ);
            const delPromises = oldDocs.docs.map(d => deleteDoc(doc(db, 'signals', d.id)));
            await Promise.all(delPromises);

            const tradeType = document.getElementById('tradeType').value;
            const sourceVal = document.getElementById('sourceSelect').value;
            const sourceOtherVal = document.getElementById('sourceOther').value.trim();
            const finalSource = sourceVal === 'Other' ? (sourceOtherVal || 'Other') : sourceVal;

            await addDoc(colRef, {
                userName,
                stockSymbol: document.getElementById('stockSymbol').value.trim().toUpperCase(),
                signalType: document.querySelector('input[name="signalType"]:checked')?.value || 'Bullish',
                tradeType,
                tradeDate: document.getElementById('tradeDate').value,
                entryFrom: parseFloat(document.getElementById('entryFrom').value) || 0,
                entryTo: parseFloat(document.getElementById('entryTo').value) || 0,
                ...(tradeType === 'Option' ? {
                    strikePrice: parseFloat(document.getElementById('strikePrice').value) || 0,
                    optionPrice: parseFloat(document.getElementById('optionPrice').value) || 0,
                    cePe: document.querySelector('input[name="optionCEPE"]:checked')?.value || '',
                } : {}),
                stopLoss: parseFloat(document.getElementById('stopLoss').value) || 0,
                target: parseFloat(document.getElementById('target').value) || 0,
                source: finalSource,
                message: document.getElementById('message').value.trim(),
                imageUrl,
                status: 'Open',
                createdAt: serverTimestamp()
            });

            // Reset form
            ['stockSymbol','entryFrom','entryTo','stopLoss','target','message','strikePrice','optionPrice','sourceOther'].forEach(id => {
                const el = document.getElementById(id); if (el) el.value = '';
            });
            document.querySelectorAll('input[name="signalType"]').forEach(r => r.checked = false);
            document.querySelectorAll('input[name="optionCEPE"]').forEach(r => r.checked = false);
            document.getElementById('sourceSelect').value = '';
            document.getElementById('sourceOther').style.display = 'none';
            document.getElementById('optionFields').style.display = 'none';
            document.getElementById('tradeType').value = 'Stock';
            fileInput.value = '';
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('uploadBox').querySelector('span') && (document.getElementById('uploadBox').firstChild.textContent = '📷 Click to attach chart screenshot');

        } catch (err) {
            alert('Post failed!\n' + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🚀 Post Signal';
        }
    });

    // Preview uploaded image
    window.previewImage = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const preview = document.getElementById('imgPreview');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        document.getElementById('uploadBox').style.borderColor = 'rgba(59,126,255,0.5)';
    };

    // Load saved name & set today's date
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('tradechat_name');
        if (saved) document.getElementById('userName').value = saved;
        document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
    });
</script>
</body>
</html>
