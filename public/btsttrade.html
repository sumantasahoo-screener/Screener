<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTST STBT PRO - Triple Confirmation Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c10;
            --card-bg: #111418;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --success: #00c853;
            --danger: #ff1744;
            --text: #e0e0e0;
            --border: #23262d;
            --grade-a: #7c3aed;
            --grade-b: #ff9100;
            --grade-c: #757575;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            padding: 1rem 0;
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.05) 0%, rgba(10,12,16,0) 100%);
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-left h1 { 
            font-size: 2.2rem; 
            font-weight: 700; 
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
            color: #fff;
        }

        .subtitle { color: #94a3b8; font-size: 0.95rem; }
        
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 1rem; 
        }

        .scan-meta {
            text-align: right;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1rem 0;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .tabs {
            display: flex;
            background: #1a1d23;
            padding: 0.35rem;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .tab {
            padding: 0.7rem 1.4rem;
            border-radius: 11px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .tab.active {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-scan {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-scan:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        #filter-buy.active {
            background: #10b981 !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #filter-sell.active {
            background: #ef4444 !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 0.5rem;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .card.BUY {
            border-color: rgba(63, 185, 80, 0.5);
            box-shadow: 0 0 15px rgba(63, 185, 80, 0.15);
        }

        .card.SELL {
            border-color: rgba(248, 81, 73, 0.5);
            box-shadow: 0 0 15px rgba(248, 81, 73, 0.15);
        }

        .grade-badge {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .grade-a {
            background: var(--grade-a);
            color: white;
        }

        .grade-b {
            background: var(--grade-b);
            color: white;
        }

        .grade-c {
            background: var(--grade-c);
            color: white;
        }

        .symbol {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.05rem;
            color: #fff;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 0.3rem;
            margin-bottom: 0.2rem;
        }

        .price {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .change {
            font-weight: 600;
            font-size: 0.75rem;
        }

        .plus {
            color: var(--success);
        }

        .minus {
            color: var(--danger);
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem;
            margin-top: 0.4rem;
            padding-top: 0.4rem;
            border-top: 1px solid var(--border);
        }

        .metric-item {
            display: flex;
            flex-direction: column;
        }

        .m-label {
            font-size: 0.55rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
        }

        .m-value {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }

        .warning-box {
            margin-top: 0.6rem;
            padding: 0.4rem;
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 6px;
            font-size: 0.7rem;
            color: #ffa500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(88, 166, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="header-left">
                <h1>BTST <span style="color: var(--accent);">STBT</span> PRO</h1>
                <p class="subtitle">Triple Confirmation Algorithm • Real-time Snapshot Analysis</p>
                <div id="scan-info" class="scan-meta" style="text-align: left; margin-top: 0.5rem;">Loading scan info...</div>
                <p style="color: #94a3b8; font-size: 0.85rem; font-weight: 600; margin-top: 0.4rem; border-left: 3px solid var(--accent); padding-left: 8px;">* Today's 1st report starts after 10:35 AM</p>
            </div>
            <div class="header-right" style="text-align: right;">
                <div style="display: flex; gap: 0.6rem; align-items: center; justify-content: flex-end;">
                    <input type="date" id="history-date" style="background: #1a1d23; color: white; border: 1px solid var(--border); padding: 0.4rem; border-radius: 8px; font-size: 0.8rem; outline: none;">
                    <button class="btn-scan" style="padding: 0.5rem 1.2rem; font-size: 0.8rem;" onclick="fetchHistory()">View History</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="tabs">
                <div id="tab-Intraday" class="tab active" onclick="setTab('Intraday')">9:30 V/S 10:35</div>
                <div id="tab-2nd-Session" class="tab" onclick="setTab('2nd Session')">9:30 V/S 12:35</div>
                <div id="tab-BTST-2-05" class="tab" onclick="setTab('BTST (2:05)')">9:30 V/S 2:05</div>
                <div id="tab-BTST-3-05" class="tab" onclick="setTab('BTST (3:05)')">12:30 V/S 3:05</div>
            </div>

            <div class="tabs" style="padding: 0.2rem; gap: 0.2rem;">
                <div id="filter-buy" class="tab active" onclick="setFilter('BUY')"
                    style="border-radius: 8px; padding: 0.4rem 1.2rem;">Accumulation</div>
                <div id="filter-sell" class="tab" onclick="setFilter('SELL')"
                    style="border-radius: 8px; padding: 0.4rem 1.2rem;">Distribution</div>
            </div>

            <button class="btn-scan" onclick="triggerScan()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Manual Scan
            </button>
        </div>

        <div id="loader" class="loader"></div>
        <div id="signal-grid" class="grid"></div>

        <div id="empty" class="empty-state">
            <p>No signals found for this session yet.</p>
        </div>

        </div>
</div>

<script>
        const WORKER_URL = "https://btst-scanner-worker.susanta41012.workers.dev/";
        let currentTab = "Intraday";
        let currentFilter = "BUY";
        let allSignals = [];

        async function fetchData(isScan = false) {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('signal-grid').innerHTML = '';
            document.getElementById('empty').style.display = 'none';

            try {
                const url = isScan ? `${WORKER_URL}?scan=true` : `${WORKER_URL}latest_scan.json`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.signals) {
                    allSignals = data.signals;
                    document.getElementById('scan-info').innerText = `Data for: ${data.date || 'N/A'} | Last Scan: ${data.timestamp || 'N/A'}`;
                    if (data.date) document.getElementById('history-date').value = data.date;
                    renderSignals();
                } else {
                    document.getElementById('empty').style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('empty').innerHTML = `<p style="color: var(--danger)">Error connecting to scanner.</p>`;
                document.getElementById('empty').style.display = 'block';
            }
            document.getElementById('loader').style.display = 'none';
        }

        async function fetchHistory() {
            const date = document.getElementById('history-date').value;
            if (!date) {
                alert("Please select a date first");
                return;
            }
            document.getElementById('loader').style.display = 'block';
            try {
                // Request specific historical file from worker
                const url = `${WORKER_URL}results/${date}/daily_signals.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("History not found for this date");
                const data = await res.json();
                
                if (data.signals) {
                    allSignals = data.signals;
                    document.getElementById('scan-info').innerText = `Historical Data: ${data.date} | Final Snapshot`;
                    renderSignals();
                }
            } catch (e) {
                alert(e.message);
            }
            document.getElementById('loader').style.display = 'none';
        }

        function setTab(tab) {
            currentTab = tab;
            // Get all tabs in the first tabs container (sessions)
            const sessionTabs = document.querySelectorAll('.controls .tabs:first-child .tab');
            sessionTabs.forEach(t => {
                t.classList.toggle('active', t.getAttribute('onclick').includes(`'${tab}'`));
            });
            renderSignals();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filter-buy').classList.toggle('active', filter === 'BUY');
            document.getElementById('filter-sell').classList.toggle('active', filter === 'SELL');
            renderSignals();
        }

        function renderSignals() {
            const grid = document.getElementById('signal-grid');
            grid.innerHTML = '';

            const filtered = allSignals.filter(s => s.scanType.includes(currentTab) && s.type === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('empty').style.display = 'block';
                return;
            }

            document.getElementById('empty').style.display = 'none';
            filtered.forEach(s => grid.innerHTML += createCard(s));
        }

        function createCard(s) {
            const pClass = s.pChange >= 0 ? 'plus' : 'minus';
            const sign = s.pChange >= 0 ? '+' : '';
            return `
            <div class="card ${s.type}">
                <div class="grade-badge grade-${s.grade.toLowerCase()}">GRADE ${s.grade}</div>
                <div class="symbol">
                    ${s.symbol}
                    ${s.rallyFading ? '<span style="color:#ffa500; font-size:0.6rem; vertical-align:middle; margin-left:4px;">⚠️ FADING</span>' : ''}
                </div>
                <div class="price-row">
                    <span class="price">₹${s.pScan}</span>
                    <span class="change ${pClass}">${sign}${s.pChange}%</span>
                </div>
                <div style="font-size: 0.65rem; color: #94a3b8; margin-bottom: 0.5rem;">
                    Base: ₹${s.pBase} | Scan: ₹${s.pScan}
                </div>
                <div class="metrics">
                    <div class="metric-item">
                        <span class="m-label">OI Change</span>
                        <span class="m-value">${s.oiChange}%</span>
                    </div>
                    <div class="metric-item">
                        <span class="m-label">Volume</span>
                        <span class="m-value">${s.volChange}x</span>
                    </div>
                    <div class="metric-item">
                        <span class="m-label">Day High</span>
                        <span class="m-value">₹${s.high}</span>
                    </div>
                    <div class="metric-item">
                        <span class="m-label">Day Low</span>
                        <span class="m-value">₹${s.low}</span>
                    </div>
                </div>
            </div>
        `;
        }

        function triggerScan() {
            if (confirm("Start manual triple confirmation scan? This takes a few seconds.")) {
                fetchData(true);
            }
        }

        async function viewHistory() {
            const date = document.getElementById('history-date').value;
            if (!date) return alert("Please select a date");
            alert("Fetching history for " + date + ". (Backend integration pending)");
        }

        // Initial load
        fetchData();
    </script>
</body>

</html>
