<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Terminal - Hybrid Theme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            /* Dark Theme (Default) */
            --bg-body: #0c0e15;
            --bg-wrapper: #131722;
            --bg-bar: #1E222D;
            --text-main: #D1D4DC;
            --text-headline: #E0E3EB;
            --text-meta: #787B86;
            --border-color: #2A2E39;
            --item-border: #1E222D;
            --tab-active: #2962FF;
            --hover-color: #1e222d;
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-body: #f0f2f5;
            --bg-wrapper: #ffffff;
            --bg-bar: #f8f9fb;
            --text-main: #131722;
            --text-headline: #131722;
            --text-meta: #5d606b;
            --border-color: #dee2e6;
            --item-border: #f0f3fa;
            --tab-active: #2962FF;
            --hover-color: #f0f3fa;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            overflow-y: scroll; 
        }
        
        .wrapper { 
            max-width: 1400px; 
            width: 100%; 
            margin: 0 auto; 
            background-color: var(--bg-wrapper); 
            min-height: 100vh; 
            border-left: 1px solid var(--border-color); 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- TOP BAR & THEME SWITCHER --- */
        #top-bar { 
            background-color: var(--bg-bar); 
            border-bottom: 1px solid var(--border-color); 
            padding: 12px 20px; 
            font-size: 13px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }

        .indices-wrapper {
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-grow: 1;
        }
        .indices-wrapper::-webkit-scrollbar { display: none; }

        .theme-toggle {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            background: var(--border-color);
            color: var(--text-headline);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .index-box { 
            margin-right: 25px; 
            display: inline-flex; 
            align-items: center; 
            flex-shrink: 0; 
        }
        
        .index-name { color: var(--text-meta); margin-right: 6px; }
        .val-up { color: #089981; } 
        .val-down { color: #F23645; } 
        .val-flat { color: var(--text-main); }

        /* --- TABS --- */
        #tabs { 
            display: flex; 
            border-bottom: 1px solid var(--border-color); 
            padding: 0 10px; 
            margin-top: 10px; 
            overflow-x: auto; 
            white-space: nowrap; 
            scrollbar-width: none; 
        }
        
        #tabs::-webkit-scrollbar { display: none; }
        
        .tab { 
            padding: 12px 20px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-meta); 
            border-bottom: 3px solid transparent; 
            flex-shrink: 0; 
        }
        
        .tab.active { 
            color: var(--tab-active); 
            border-bottom: 3px solid var(--tab-active); 
        }
        
        .tab:hover:not(.active) { color: var(--text-headline); }

        /* --- NEWS ITEMS --- */
        #news-container { padding: 20px; flex-grow: 1; }
        
        .news-item { 
            padding: 18px 0; 
            border-bottom: 1px solid var(--item-border); 
            animation: fadeIn 0.4s; 
            display: flex; 
            flex-direction: column; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .tag { 
            font-size: 10px; 
            font-weight: bold; 
            padding: 3px 6px; 
            border-radius: 4px; 
            margin-bottom: 8px;
            text-transform: uppercase; 
            display: inline-block;
            width: fit-content;
        }
        
        .tag-STOCKS { background: rgba(41, 98, 255, 0.15); color: #2962FF; }
        .tag-INDEX { background: rgba(156, 39, 176, 0.15); color: #E040FB; }
        .tag-GLOBAL { background: rgba(242, 54, 69, 0.15); color: #F23645; }
        .tag-RESULTS { background: rgba(8, 153, 129, 0.15); color: #089981; }
        
        .headline { 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--text-headline); 
            text-decoration: none; 
            line-height: 1.4; 
            margin-bottom: 6px; 
        }
        
        .headline:hover { color: var(--tab-active); }
        
        .meta { 
            font-size: 12px; 
            color: var(--text-meta); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .dot { height: 4px; width: 4px; background-color: var(--text-meta); border-radius: 50%; }
        
        #loading { padding: 40px; color: var(--text-meta); text-align: center; font-family: monospace; }

        @media (max-width: 768px) {
            .wrapper { border-left: none; border-right: none; }
            .headline { font-size: 15px; }
            .theme-toggle span { display: none; } /* Mobile par text hide kar do */
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="top-bar">
        <div class="indices-wrapper">
            <span class="index-name" style="color: var(--text-headline); margin-right: 15px;">MARKETS:</span>
            <div id="indices-container" style="display: flex;">Syncing...</div>
        </div>
        
        <div class="theme-toggle" onclick="toggleTheme()">
            <i id="theme-icon" class="fas fa-moon"></i>
            <span>Theme</span>
        </div>
    </div>

    <div id="tabs">
        <div class="tab active" onclick="filterNews('ALL')">ALL</div>
        <div class="tab" onclick="filterNews('STOCKS')">STOCKS (IN)</div>
        <div class="tab" onclick="filterNews('INDEX')">INDEX (IN)</div>
        <div class="tab" onclick="filterNews('GLOBAL')">GLOBAL</div>
        <div class="tab" onclick="filterNews('RESULTS')">RESULTS</div>
    </div>

    <div id="news-container">
        <div id="loading">> INITIALIZING TERMINAL...</div>
    </div>
</div>

<script>
    let allNewsData = [];
    let currentFilter = 'ALL';
    let lastNewsCount = 0;
    const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    // --- THEME LOGIC ---
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('theme-icon');
        if (theme === 'dark') {
            icon.className = 'fas fa-moon';
        } else {
            icon.className = 'fas fa-sun';
        }
    }

    // --- DATA LOGIC ---
    function timeAgo(dateString) {
        const diffMins = Math.floor((new Date() - new Date(dateString)) / 60000);
        if (diffMins < 1 || isNaN(diffMins)) return "JUST NOW";
        if (diffMins < 60) return `${diffMins} MINS AGO`;
        return `${Math.floor(diffMins / 60)} HOURS AGO`;
    }

    async function fetchTerminalData() {
        try {
            // REPLACE WITH YOUR ACTUAL WORKER URL
            const res = await fetch('https://news-fetcher.sumantasahoo.workers.dev');
            const data = await res.json();
            
            renderIndices(data.indices);
            allNewsData = data.news || [];
            
            if (lastNewsCount !== 0 && allNewsData.length > lastNewsCount) {
                alertSound.play().catch(() => {});
            }
            lastNewsCount = allNewsData.length;
            renderNews();
        } catch (e) {
            document.getElementById('loading').innerText = "> CONNECTION ERROR. RETRYING...";
        }
    }

    function renderIndices(indices) {
        const container = document.getElementById('indices-container');
        if (!indices) return;
        container.innerHTML = '';
        indices.forEach(idx => {
            const val = parseFloat(idx.change);
            const colorClass = val > 0 ? 'val-up' : (val < 0 ? 'val-down' : 'val-flat');
            container.innerHTML += `
                <div class="index-box">
                    <span class="index-name">${idx.symbol}:</span>
                    <span class="${colorClass}">${idx.price} (${val > 0 ? '+' : ''}${idx.change}%)</span>
                </div>`;
        });
    }

    function filterNews(category) {
        currentFilter = category;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        // Event detection for active tab highlight
        if(event) event.target.classList.add('active');
        renderNews();
    }

    function renderNews() {
        const container = document.getElementById('news-container');
        container.innerHTML = '';
        const filtered = currentFilter === 'ALL' ? allNewsData : allNewsData.filter(n => n.category === currentFilter);
        
        if (filtered.length === 0) {
            container.innerHTML = '<div id="loading">> NO DATA AVAILABLE IN THIS CATEGORY.</div>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'news-item';
            div.innerHTML = `
                <div class="tag-row"><span class="tag tag-${item.category}">${item.category}</span></div>
                <a href="${item.link}" target="_blank" class="headline">${item.title}</a>
                <div class="meta">
                    <span>${item.source}</span>
                    <div class="dot"></div>
                    <span>${timeAgo(item.pubDate)}</span>
                </div>`;
            container.appendChild(div);
        });
    }

    // Start
    initTheme();
    setInterval(fetchTerminalData, 60000);
    fetchTerminalData();
</script>
</body>
</html>
