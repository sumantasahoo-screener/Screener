<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Terminal · NSE/BSE News</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

/* ════════════════════════════════════
   DARK THEME (Premium Teal #055C51)
════════════════════════════════════ */
[data-theme="dark"] {
  --bg:        #055C51; /* Aapka pasandida color */
  --surface:   #044A41;
  --surface2:  #066E61;
  --surface3:  #088575;
  --card:      #044A41;
  --border:    rgba(255, 255, 255, 0.12);
  --border2:   rgba(255, 255, 255, 0.25);
  --ink:       #F0F7F6;
  --ink2:      #B3DCD6;
  --ink3:      #8BC4BD;
  --shadow:    rgba(0,0,0,.35);

  --bull:      #00FF9D;
  --bear:      #FF5252;
  --amber:     #FFC400;
  --blue:      #40C4FF;

  --tag-stock-bg:  rgba(64,196,255,.15);
  --tag-stock-c:   #80D8FF;
  --tag-index-bg:  rgba(224,64,251,.15);
  --tag-index-c:   #EA80FC;
  --tag-result-bg: rgba(0,255,157,.15);
  --tag-result-c:  #00FF9D;
  --tag-global-bg: rgba(255,82,82,.15);
  --tag-global-c:  #FF8A80;
  --tag-ipo-bg:    rgba(156,39,176,.2); /* IPO Tag */
  --tag-ipo-c:     #E1BEE7;
  --tag-div-bg:    rgba(255,196,0,.15);
  --tag-div-c:     #FFE57F;
  --tag-corp-bg:   rgba(100,181,246,.15);
  --tag-corp-c:    #90CAF9;
  --tag-bse-bg:    rgba(129,199,132,.15);
  --tag-bse-c:     #A5D6A7;

  --ticker-bg:  #044A41;
  --val-up:     #00FF9D;
  --val-dn:     #FF5252;
  --val-flat:   #B3DCD6;
}

/* ════════════════════════════════════
   LIGHT THEME (Fresh Mint)
════════════════════════════════════ */
[data-theme="light"] {
  --bg:        #F0F7F6;
  --surface:   #FFFFFF;
  --surface2:  #E0EFEC;
  --surface3:  #D1E8E4;
  --card:      #FFFFFF;
  --border:    #CCE0DC;
  --border2:   #AECFC9;
  --ink:       #03332D;
  --ink2:      #055C51;
  --ink3:      #087D6E;
  --shadow:    rgba(3, 51, 45, .08);

  --bull:      #0A9160;
  --bear:      #D42035;
  --amber:     #C07A10;
  --blue:      #1D55D0;

  --tag-stock-bg:  rgba(29,85,208,.08);
  --tag-stock-c:   #1D55D0;
  --tag-ipo-bg:    rgba(123,31,162,.08);
  --tag-ipo-c:     #7B1FA2;
  /* ... baaki colors standard rakhe hain ... */
  --ticker-bg:  #FFFFFF;
  --val-up:     #0A9160;
  --val-dn:     #D42035;
  --val-flat:   #055C51;
}

/* ════════════════════════════════════
   RESET + BASE
════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:16px; /* Text thoda bada kiya hai */
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}

/* ════════════════════════════════════
   TICKER BAR
════════════════════════════════════ */
#ticker-bar {
  background:var(--ticker-bg);
  border-bottom:1px solid var(--border);
  height:48px;
  display:flex;align-items:center;
  padding:0 24px;
  position:sticky;top:0;z-index:300;
  box-shadow:0 1px 0 var(--border), 0 2px 8px var(--shadow);
}
.ticker-label {
  font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--ink3);margin-right:20px;
}
.ticker-inner {
  display:flex;align-items:center;gap:28px;overflow-x:auto;scrollbar-width:none;
}
.ticker-inner::-webkit-scrollbar{display:none;}
.t-item {display:inline-flex;align-items:center;gap:8px;font-size:.85rem;}
.t-val.up{color:var(--val-up);} .t-val.dn{color:var(--val-dn);}
.update-time {font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ink3);margin-right:15px;}
.tbtn {
  height:32px;padding:0 12px;border-radius:6px;background:var(--surface2);
  border:1px solid var(--border2);color:var(--ink2);font-size:.8rem;cursor:pointer;
}

/* ════════════════════════════════════
   WRAPPER (Wider 1400px)
════════════════════════════════════ */
.wrapper {
  max-width:1400px; /* Width wapas 1400px kar di hai */
  margin:0 auto;
  background:var(--surface);
  min-height:calc(100vh - 48px);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  box-shadow: 0 0 20px var(--shadow);
}

/* ════════════════════════════════════
   TABS
════════════════════════════════════ */
#tab-bar {
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;
  position:sticky;top:48px;z-index:200;overflow-x:auto;scrollbar-width:none;
}
.tab {
  padding:16px 20px 14px;font-size:.9rem;font-weight:600;color:var(--ink3);
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-badge {
  font-family:'DM Mono',monospace;font-size:.7rem;padding:2px 8px;
  border-radius:10px;background:var(--surface2);margin-left:5px;
}

/* ════════════════════════════════════
   NEWS ITEMS
════════════════════════════════════ */
.news-item {padding:22px 28px;border-bottom:1px solid var(--border);transition:background .2s;}
.news-item:hover{background:var(--surface2);}
.tag {
  font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:5px;
  text-transform:uppercase;letter-spacing:.8px;
}
.tag-STOCKS {background:var(--tag-stock-bg);color:var(--tag-stock-c);}
.tag-INDEX  {background:var(--tag-index-bg);color:var(--tag-index-c);}
.tag-RESULTS{background:var(--tag-result-bg);color:var(--tag-result-c);}
.tag-GLOBAL {background:var(--tag-global-bg);color:var(--tag-global-c);}
.tag-IPO    {background:var(--tag-ipo-bg);color:var(--tag-ipo-c);} /* IPO Style */

.headline {
  font-size:1.15rem;font-weight:600;color:var(--ink);text-decoration:none;
  display:block;margin:10px 0;line-height:1.5;
}
.headline:hover{color:var(--blue);}
.news-time {font-family:'DM Mono',monospace;font-size:.75rem;color:var(--ink3);display:flex;align-items:center;gap:8px;}

/* ════════════════════════════════════
   BSE/NSE SPECIFIC
════════════════════════════════════ */
.bse-item {padding:18px 28px;border-bottom:1px solid var(--border);display:flex;gap:15px;}
.list-header {
  padding:12px 28px;font-size:.7rem;font-weight:800;text-transform:uppercase;
  background:var(--surface2);border-bottom:1px solid var(--border);
  position:sticky;top:105px;z-index:10;color:var(--ink3);
}

.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:ro .6s linear infinite;}
@keyframes ro{to{transform:rotate(360deg);}}

</style>
</head>
<body>

<div id="ticker-bar">
  <div class="ticker-label">MARKETS</div>
  <div class="ticker-scroll">
    <div class="ticker-inner" id="indices-container">—</div>
  </div>
  <div class="ticker-right">
    <span class="update-time" id="update-time">—</span>
    <button class="tbtn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <button class="tbtn" onclick="refreshData()" id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>
</div>

<div class="wrapper">
  <div id="tab-bar">
    <div class="tab active" data-tab="ALL" onclick="switchTab(this,'ALL')">All <span class="tab-badge" id="cnt-ALL">—</span></div>
    <div class="tab" data-tab="STOCKS" onclick="switchTab(this,'STOCKS')">Stocks <span class="tab-badge" id="cnt-STOCKS">—</span></div>
    <div class="tab" data-tab="INDEX" onclick="switchTab(this,'INDEX')">Index <span class="tab-badge" id="cnt-INDEX">—</span></div>
    <div class="tab" data-tab="RESULTS" onclick="switchTab(this,'RESULTS')">Results <span class="tab-badge" id="cnt-RESULTS">—</span></div>
    <div class="tab" data-tab="GLOBAL" onclick="switchTab(this,'GLOBAL')">Global <span class="tab-badge" id="cnt-GLOBAL">—</span></div>
    <div class="tab" data-tab="IPO" onclick="switchTab(this,'IPO')">IPO <span class="tab-badge" id="cnt-IPO">—</span></div>
    <div class="tab" data-tab="BSE" onclick="switchTab(this,'BSE')">BSE/NSE <span class="tab-badge" id="cnt-BSE">—</span></div>
  </div>

  <div id="news-container">
    <div class="state-msg">
      <span class="spin"></span><br>Loading terminal data...
    </div>
  </div>
</div>

<script>
'use strict';
const WORKER_URL = 'https://news-fetcher.sumantasahoo.workers.dev';
let allNews = [], bseNews = [], curTab = 'ALL';

/* Theme Logic */
(function(){
  const t = localStorage.getItem('mkt_theme_v1') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '🌙' : '☀️';
})();

function toggleTheme(){
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('mkt_theme_v1', t);
}

/* Date Safety Fix */
function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return 'JUST NOW'; 
  const diff = Math.floor((new Date() - d) / 60000);
  if (diff < 1) return 'JUST NOW';
  if (diff < 60) return diff + ' MIN AGO';
  return Math.floor(diff / 60) + ' HRS AGO';
}

function fmtTime(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata' });
}

function renderIndices(indices){
  const c = document.getElementById('indices-container');
  if (!indices?.length) return;
  c.innerHTML = indices.map(idx => {
    const v = parseFloat(idx.change);
    const cls = v > 0 ? 'up' : v < 0 ? 'dn' : 'flat';
    return `<div class="t-item"><span class="t-name">${idx.symbol}</span><span class="t-val ${cls}">${idx.price} (${idx.change}%)</span></div>`;
  }).join('');
}

function updateCounts(){
  const cats = ['STOCKS','INDEX','RESULTS','GLOBAL','IPO'];
  cats.forEach(c => {
    const n = allNews.filter(x => x.category === c).length;
    document.getElementById('cnt-' + c).textContent = n;
  });
  document.getElementById('cnt-ALL').textContent = allNews.length;
  document.getElementById('cnt-BSE').textContent = bseNews.length;
}

function switchTab(el, tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  curTab = tab;
  renderNews();
}

function tagClass(cat){
  const map = { STOCKS:'tag-STOCKS', INDEX:'tag-INDEX', RESULTS:'tag-RESULTS', GLOBAL:'tag-GLOBAL', IPO:'tag-IPO' };
  return map[cat] || 'tag-FILING';
}

function renderNews(){
  const container = document.getElementById('news-container');
  if (curTab === 'BSE') { renderBSE(container); return; }
  const list = curTab === 'ALL' ? allNews : allNews.filter(n => n.category === curTab);
  if (!list.length) { container.innerHTML = '<div class="state-msg">No news found.</div>'; return; }
  container.innerHTML = list.map(item => `
    <div class="news-item">
      <div class="news-meta-top"><span class="tag ${tagClass(item.category)}">${item.category}</span> <span class="source-chip">${item.source}</span></div>
      <a href="${item.link}" target="_blank" class="headline">${item.title}</a>
      <div class="news-time"><span>${fmtTime(item.pubDate)} IST</span> • <span>${timeAgo(item.pubDate)}</span></div>
    </div>`).join('');
}

function renderBSE(container){
  if (!bseNews.length) { container.innerHTML = '<div class="state-msg">No BSE filings.</div>'; return; }
  container.innerHTML = bseNews.map(item => `
    <div class="bse-item">
      <div class="bse-body">
        <div class="bse-title"><a href="${item.link}" target="_blank">${item.title}</a></div>
        <div class="bse-meta"><span>BSE Filing</span> • <span>${fmtTime(item.pubDate)} IST</span> • <span>${timeAgo(item.pubDate)}</span></div>
      </div>
    </div>`).join('');
}

async function refreshData(){
  try {
    const res = await fetch(WORKER_URL + '?t=' + Date.now());
    const data = await res.json();
    allNews = data.news || [];
    bseNews = data.bse || [];
    renderIndices(data.indices || []);
    updateCounts();
    renderNews();
    document.getElementById('update-time').textContent = 'Updated ' + fmtTime(data.updatedAt);
  } catch(e) { console.error("Fetch error", e); }
}

refreshData();
setInterval(refreshData, 300000);
</script>
</body>
</html>
