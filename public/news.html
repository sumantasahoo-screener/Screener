<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #131722; color: #D1D4DC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; overflow-y: scroll; }
        
        /* Center Wrapper for Big Screens - Increased Width */
        .wrapper { max-width: 1400px; width: 100%; margin: 0 auto; background-color: #131722; min-height: 100vh; border-left: 1px solid #1E222D; border-right: 1px solid #1E222D; display: flex; flex-direction: column; }

        /* Live Top Bar (Horizontal Scroll for Mobile without squishing) */
        #top-bar { background-color: #1E222D; border-bottom: 1px solid #2A2E39; padding: 12px 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        #top-bar::-webkit-scrollbar { display: none; } 
        
        /* Prevent elements from shrinking/cutting on small screens */
        .index-box { margin-right: 25px; display: inline-flex; align-items: center; flex-shrink: 0; }
        .index-name { color: #787B86; margin-right: 6px; }
        .val-up { color: #089981; } .val-down { color: #F23645; } .val-flat { color: #D1D4DC; }

        /* Tabs (Horizontal Scroll without squishing) */
        #tabs { display: flex; border-bottom: 1px solid #2A2E39; padding: 0 10px; margin-top: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        #tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #787B86; transition: 0.2s; border-bottom: 3px solid transparent; flex-shrink: 0; }
        .tab.active { color: #2962FF; border-bottom: 3px solid #2962FF; }
        .tab:hover:not(.active) { color: #D1D4DC; }

        /* News Area */
        #news-container { padding: 20px; flex-grow: 1; }
        .news-item { padding: 18px 0; border-bottom: 1px solid #1E222D; animation: fadeIn 0.4s; display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Category Tags */
        .tag-row { display: flex; align-items: center; margin-bottom: 8px; }
        .tag { font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 4px; margin-right: 10px; text-transform: uppercase; }
        .tag-STOCKS { background: rgba(41, 98, 255, 0.15); color: #2962FF; }
        .tag-INDEX { background: rgba(156, 39, 176, 0.15); color: #E040FB; }
        .tag-GLOBAL { background: rgba(242, 54, 69, 0.15); color: #F23645; }
        .tag-RESULTS { background: rgba(8, 153, 129, 0.15); color: #089981; }
        
        /* Text Styling */
        .headline { font-size: 16px; font-weight: 600; color: #E0E3EB; text-decoration: none; line-height: 1.4; margin-bottom: 6px; word-wrap: break-word; white-space: normal; }
        .headline:hover { color: #2962FF; }
        .meta { font-size: 12px; color: #787B86; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .dot { height: 4px; width: 4px; background-color: #787B86; border-radius: 50%; }
        
        #loading { padding: 20px; color: #787B86; font-family: monospace; text-align: center; margin-top: 20px; }
        
        /* Scrollbar for PC body */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #131722; }
        ::-webkit-scrollbar-thumb { background: #2A2E39; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #363A45; }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .wrapper { border-left: none; border-right: none; }
            #news-container { padding: 15px; }
            .headline { font-size: 15px; }
            .tab { padding: 12px 15px; font-size: 13px; }
            #top-bar { font-size: 12px; padding: 10px 15px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="top-bar">
        <span class="index-name" style="color: #D1D4DC; margin-right: 15px; position: sticky; left: 0; background: #1E222D; z-index: 2; padding-right: 10px; flex-shrink: 0;">LIVE DATA:</span>
        <span id="indices-container" style="display: flex; align-items: center;">Syncing via TradingView...</span>
    </div>

    <div id="tabs">
        <div class="tab active" onclick="filterNews('ALL')">ALL</div>
        <div class="tab" onclick="filterNews('STOCKS')">STOCKS (IN)</div>
        <div class="tab" onclick="filterNews('INDEX')">INDEX (IN)</div>
        <div class="tab" onclick="filterNews('GLOBAL')">GLOBAL</div>
        <div class="tab" onclick="filterNews('RESULTS')">RESULTS</div>
    </div>

    <div id="news-container">
        <div id="loading">> Connecting to server...</div>
    </div>
</div>

<script>
    let allNewsData = [];
    let currentFilter = 'ALL';
    let lastNewsCount = 0;
    const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    function timeAgo(dateString) {
        const diffMins = Math.floor((new Date() - new Date(dateString)) / 60000);
        if (diffMins < 1 || isNaN(diffMins)) return "JUST NOW";
        if (diffMins < 60) return `${diffMins} MINS AGO`;
        const diffHrs = Math.floor(diffMins / 60);
        return `${diffHrs} HOURS AGO`;
    }

    async function fetchTerminalData() {
        try {
            // APNE WORKER KA URL YAHA CONFIRM KAREIN
            const res = await fetch('https://news-fetcher.sumantasahoo.workers.dev');
            const data = await res.json();
            
            // 1. Update Live Indices
            renderIndices(data.indices);

            // 2. Update News
            allNewsData = data.news || [];
            
            // Sound Alert logic
            if (lastNewsCount !== 0 && allNewsData.length > lastNewsCount) {
                alertSound.play().catch(e => console.log("Click page to enable sound alert"));
            }
            lastNewsCount = allNewsData.length;

            renderNews();
        } catch (e) {
            document.getElementById('loading').innerText = "> CONNECTION ERROR. Retrying in 60s...";
        }
    }

    function renderIndices(indices) {
        const container = document.getElementById('indices-container');
        if (!indices || indices.length === 0) {
            container.innerHTML = '<span style="color:#F23645">Live data unavailable at the moment</span>';
            return;
        }
        
        container.innerHTML = '';
        indices.forEach(idx => {
            const numChange = parseFloat(idx.change);
            let colorClass = 'val-flat';
            let sign = '';
            if (numChange > 0) { colorClass = 'val-up'; sign = '+'; }
            else if (numChange < 0) { colorClass = 'val-down'; }

            container.innerHTML += `
                <div class="index-box">
                    <span class="index-name">${idx.symbol}:</span>
                    <span class="${colorClass}">${idx.price} (${sign}${idx.change}%)</span>
                </div>
            `;
        });
    }

    function filterNews(category) {
        currentFilter = category;
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
            if(tab.innerText.includes(category)) tab.classList.add('active');
        });
        renderNews();
    }

    function renderNews() {
        const container = document.getElementById('news-container');
        container.innerHTML = '';
        
        const filtered = currentFilter === 'ALL' ? allNewsData : allNewsData.filter(n => n.category === currentFilter);
        
        if (filtered.length === 0) {
            container.innerHTML = '<div id="loading">> No fresh data in the last 24 hours for this category.</div>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'news-item';
            div.innerHTML = `
                <div class="tag-row">
                    <span class="tag tag-${item.category}">${item.category}</span>
                </div>
                <a href="${item.link}" target="_blank" class="headline">${item.title}</a>
                <div class="meta">
                    <span>${item.source}</span>
                    <div class="dot"></div>
                    <span>${timeAgo(item.pubDate)}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // Auto-fetch har 60 seconds (1 minute) mein
    setInterval(fetchTerminalData, 60000);
    fetchTerminalData();
    
    document.body.addEventListener('click', () => { console.log("Sound Ready"); }, { once: true });
</script>
</body>
</html>
