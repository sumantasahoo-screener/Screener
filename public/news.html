<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Terminal · Premium News Feed</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ════════════════════════════════════════════════════════════
   THEME 1: TEAL (#055C51) - AAPKI PASAND
════════════════════════════════════════════════════════════ */
[data-theme="teal"] {
  --bg:        #055C51;
  --surface:   #044A41;
  --surface2:  #066E61;
  --surface3:  #088575;
  --border:    rgba(255, 255, 255, 0.12);
  --border2:   rgba(255, 255, 255, 0.25);
  --ink:       #F0F7F6;
  --ink2:      #B3DCD6;
  --ink3:      #8BC4BD;
  --shadow:    rgba(0,0,0,.35);
  --blue:      #40C4FF;

  --tag-stock-bg:  rgba(64,196,255,.15);
  --tag-stock-c:   #80D8FF;
  --tag-index-bg:  rgba(224,64,251,.15);
  --tag-index-c:   #EA80FC;
  --tag-result-bg: rgba(0,255,157,.15);
  --tag-result-c:  #00FF9D;
  --tag-global-bg: rgba(255,82,82,.15);
  --tag-global-c:  #FF8A80;
  --tag-ipo-bg:    rgba(156,39,176,.25);
  --tag-ipo-c:     #E1BEE7;
}

/* ════════════════════════════════════════════════════════════
   THEME 2: WARM WHITE (LIGHT)
════════════════════════════════════════════════════════════ */
[data-theme="light"] {
  --bg:        #fdfaf6;
  --surface:   #ffffff;
  --surface2:  #f5f1ea;
  --surface3:  #ece6d9;
  --border:    #e2ddd6;
  --border2:   #cdc8be;
  --ink:       #1a1612;
  --ink2:      #524c42;
  --ink3:      #9e9484;
  --shadow:    rgba(22,15,8,.08);
  --blue:      #1d55d0;

  --tag-stock-bg:  rgba(29,85,208,.08);
  --tag-stock-c:   #1d55d0;
  --tag-index-bg:  rgba(123,31,162,.08);
  --tag-index-c:   #7b1fa2;
  --tag-result-bg: rgba(10,145,96,.08);
  --tag-result-c:  #0a9160;
  --tag-global-bg: rgba(212,32,53,.08);
  --tag-global-c:  #d42035;
  --tag-ipo-bg:    rgba(123,31,162,.1);
  --tag-ipo-c:     #7b1fa2;
}

/* ════════════════════════════════════════════════════════════
   THEME 3: SLATE GREY (PROFESSIONAL)
════════════════════════════════════════════════════════════ */
[data-theme="grey"] {
  --bg:        #1e1e1e;
  --surface:   #252525;
  --surface2:  #2d2d2d;
  --surface3:  #383838;
  --border:    #333333;
  --border2:   #444444;
  --ink:       #e0e0e0;
  --ink2:      #aaaaaa;
  --ink3:      #777777;
  --shadow:    rgba(0,0,0,.6);
  --blue:      #2196f3;

  --tag-stock-bg:  rgba(33,150,243,.15);
  --tag-stock-c:   #90caf9;
  --tag-ipo-bg:    rgba(171,71,188,.2);
  --tag-ipo-c:     #ce93d8;
  --tag-global-bg: rgba(244,67,54,.15);
  --tag-global-c:  #ef9a9a;
}

/* ════════════════════════════════════
   BASE STYLES & LAYOUT
════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}

/* ════════════════════════════════════
   TICKER BAR
════════════════════════════════════ */
#ticker-bar {
  background:var(--surface);border-bottom:1px solid var(--border);
  height:48px;display:flex;align-items:center;padding:0 24px;
  position:sticky;top:0;z-index:300;box-shadow:0 1px 0 var(--border), 0 2px 8px var(--shadow);
}
.ticker-label {
  font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--ink3);margin-right:20px;
}
.ticker-inner {
  display:flex;align-items:center;gap:28px;overflow-x:auto;scrollbar-width:none;
}
.ticker-inner::-webkit-scrollbar{display:none;}
.t-item {display:inline-flex;align-items:center;gap:8px;font-size:.85rem;white-space:nowrap;}
.t-val.up{color:#00FF9D;} .t-val.dn{color:#FF5252;}

/* ════════════════════════════════════
   WRAPPER (WIDE 1400px)
════════════════════════════════════ */
.wrapper {
  max-width:1400px;margin:0 auto;background:var(--surface);
  min-height:calc(100vh - 48px);
  border-left:1px solid var(--border);border-right:1px solid var(--border);
  box-shadow: 0 0 20px var(--shadow);
}

/* ════════════════════════════════════
   TABS & NAVIGATION
════════════════════════════════════ */
#tab-bar {
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;
  position:sticky;top:48px;z-index:200;overflow-x:auto;scrollbar-width:none;
}
.tab {
  padding:16px 20px 14px;font-size:.9rem;font-weight:600;color:var(--ink3);
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:0.2s;
}
.tab:hover{color:var(--ink2);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-badge {
  font-family:'DM Mono',monospace;font-size:.7rem;padding:2px 8px;
  border-radius:10px;background:var(--surface2);margin-left:5px;
}

/* ════════════════════════════════════
   NEWS COMPONENTS
════════════════════════════════════ */
.news-item {padding:22px 28px;border-bottom:1px solid var(--border);transition:background .2s;}
.news-item:hover{background:var(--surface2);}

.tag {
  font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:5px;
  text-transform:uppercase;letter-spacing:.8px;display:inline-block;
}
.tag-STOCKS {background:var(--tag-stock-bg);color:var(--tag-stock-c);}
.tag-INDEX  {background:var(--tag-index-bg);color:var(--tag-index-c);}
.tag-RESULTS{background:var(--tag-result-bg);color:var(--tag-result-c);}
.tag-GLOBAL {background:var(--tag-global-bg);color:var(--tag-global-c);}
.tag-IPO    {background:var(--tag-ipo-bg);color:var(--tag-ipo-c);}

.headline {
  font-size:1.15rem;font-weight:600;color:var(--ink);text-decoration:none;
  display:block;margin:10px 0;line-height:1.5;transition:color .2s;
}
.headline:hover{color:var(--blue);}
.source-chip {
  font-size:.65rem;font-weight:500;color:var(--ink3);background:var(--surface2);
  padding:2px 8px;border-radius:4px;margin-left:8px;
}
.news-time {font-family:'DM Mono',monospace;font-size:.75rem;color:var(--ink3);display:flex;align-items:center;gap:8px;}

/* BSE FILINGS */
.list-header {
  padding:12px 28px;font-size:.7rem;font-weight:800;text-transform:uppercase;
  background:var(--surface2);border-bottom:1px solid var(--border);
  position:sticky;top:105px;z-index:10;color:var(--ink3);
}

/* BUTTONS & UTILS */
.tbtn {
  height:32px;padding:0 12px;border-radius:6px;background:var(--surface2);
  border:1px solid var(--border2);color:var(--ink2);font-size:.8rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition: all .2s;
}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:ro .6s linear infinite;vertical-align:middle;}
@keyframes ro{to{transform:rotate(360deg);}}

</style>
</head>
<body>

<div id="ticker-bar">
  <div class="ticker-label">MARKETS</div>
  <div class="ticker-scroll">
    <div class="ticker-inner" id="indices-container">—</div>
  </div>
  <div class="ticker-right" style="margin-left:auto; display:flex; align-items:center;">
    <span class="update-time" id="update-time">—</span>
    <button class="tbtn" onclick="toggleTheme()" id="theme-btn" style="margin-right:10px;">🌙</button>
    <button class="tbtn" onclick="refreshData()" id="refresh-btn"><i class="fas fa-sync-alt" id="refresh-icon"></i> Refresh</button>
  </div>
</div>

<div class="wrapper">
  <div id="tab-bar">
    <div class="tab active" data-tab="ALL" onclick="switchTab(this,'ALL')">All <span class="tab-badge" id="cnt-ALL">0</span></div>
    <div class="tab" data-tab="STOCKS" onclick="switchTab(this,'STOCKS')">Stocks <span class="tab-badge" id="cnt-STOCKS">0</span></div>
    <div class="tab" data-tab="INDEX" onclick="switchTab(this,'INDEX')">Index <span class="tab-badge" id="cnt-INDEX">0</span></div>
    <div class="tab" data-tab="RESULTS" onclick="switchTab(this,'RESULTS')">Results <span class="tab-badge" id="cnt-RESULTS">0</span></div>
    <div class="tab" data-tab="GLOBAL" onclick="switchTab(this,'GLOBAL')">Global <span class="tab-badge" id="cnt-GLOBAL">0</span></div>
    <div class="tab" data-tab="IPO" onclick="switchTab(this,'IPO')">IPO <span class="tab-badge" id="cnt-IPO">0</span></div>
    <div class="tab" data-tab="BSE" onclick="switchTab(this,'BSE')">BSE/NSE <span class="tab-badge" id="cnt-BSE">0</span></div>
  </div>

  <div id="news-container">
    <div style="padding:100px; text-align:center;">
        <span class="spin"></span><br><br>
        <p style="color:var(--ink3)">Connecting to Market Data Terminal...</p>
    </div>
  </div>
</div>

<script>
'use strict';
const WORKER_URL = 'https://news-fetcher.sumantasahoo.workers.dev';
let allNews = [], bseNews = [], curTab = 'ALL';

/* ── THEME ENGINE (3 THEMES) ── */
(function(){
  const t = localStorage.getItem('mkt_theme_v3') || 'teal';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeIcon(t);
})();

function toggleTheme(){
  const curr = document.documentElement.getAttribute('data-theme');
  let next = 'teal', icon = '🌙';

  if(curr === 'teal') { next = 'light'; icon = '☀️'; }
  else if(curr === 'light') { next = 'grey'; icon = '⬛'; }
  else { next = 'teal'; icon = '🌙'; }

  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = icon;
  localStorage.setItem('mkt_theme_v3', next);
}

function updateThemeIcon(t){
  const btn = document.getElementById('theme-btn');
  if(t === 'teal') btn.textContent = '🌙';
  else if(t === 'light') btn.textContent = '☀️';
  else btn.textContent = '⬛';
}

/* ── DATE SAFETY LOGIC ── */
function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return 'JUST NOW'; 
  const diff = Math.floor((new Date() - d) / 60000);
  if (diff < 1) return 'JUST NOW';
  if (diff < 60) return diff + ' MIN AGO';
  return Math.floor(diff / 60) + ' HRS AGO';
}

function fmtTime(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata' });
}

/* ── CORE RENDERING ── */
function renderIndices(indices){
  const c = document.getElementById('indices-container');
  if (!indices?.length) return;
  c.innerHTML = indices.map(idx => {
    const v = parseFloat(idx.change);
    const cls = v > 0 ? 'up' : v < 0 ? 'dn' : 'flat';
    return `<div class="t-item"><span class="t-name">${idx.symbol}</span><span class="t-val ${cls}">${idx.price} (${idx.change}%)</span></div>`;
  }).join('');
}

function updateCounts(){
  const cats = ['STOCKS','INDEX','RESULTS','GLOBAL','IPO'];
  cats.forEach(c => {
    const n = allNews.filter(x => x.category === c).length;
    document.getElementById('cnt-' + c).textContent = n;
  });
  document.getElementById('cnt-ALL').textContent = allNews.length;
  document.getElementById('cnt-BSE').textContent = bseNews.length;
}

function switchTab(el, tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  curTab = tab;
  renderNews();
}

function renderNews(){
  const container = document.getElementById('news-container');
  if (curTab === 'BSE') { renderBSE(container); return; }
  
  const list = curTab === 'ALL' ? allNews : allNews.filter(n => n.category === curTab);
  if (!list.length) { 
    container.innerHTML = '<div style="padding:100px; text-align:center; color:var(--ink3)">No news items found in this category.</div>'; 
    return; 
  }
  
  let html = '';
  list.forEach(item => {
    html += `
    <div class="news-item">
      <div style="display:flex; align-items:center; margin-bottom:10px;">
        <span class="tag tag-${item.category}">${item.category}</span>
        <span class="source-chip">${item.source}</span>
      </div>
      <a href="${item.link}" target="_blank" class="headline">${item.title}</a>
      <div class="news-time">
        <span>${fmtTime(item.pubDate)} IST</span>
        <span style="opacity:0.3">•</span>
        <span>${timeAgo(item.pubDate)}</span>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function renderBSE(container){
  if (!bseNews.length) { 
    container.innerHTML = '<div style="padding:100px; text-align:center; color:var(--ink3)">No BSE filings in the last 24 hours.</div>'; 
    return; 
  }
  
  const order = ['DIVIDEND','RESULTS','BOARD','CORPORATE','BUYBACK','BONUS/SPLIT','CAPITAL','FILING'];
  const groups = {};
  bseNews.forEach(x => { 
    const c = x.bseCat || 'FILING'; 
    if(!groups[c]) groups[c]=[]; 
    groups[c].push(x); 
  });

  let html = '';
  order.forEach(grp => {
    if(!groups[grp]) return;
    html += `<div class="list-header">${grp} (${groups[grp].length})</div>`;
    groups[grp].forEach(item => {
      html += `
        <div class="news-item">
          <a href="${item.link}" target="_blank" class="headline" style="font-size:1.05rem;">${item.title}</a>
          <div class="news-time">
            <span>BSE Listing</span>
            <span style="opacity:0.3">•</span>
            <span>${fmtTime(item.pubDate)} IST</span>
            <span style="opacity:0.3">•</span>
            <span>${timeAgo(item.pubDate)}</span>
          </div>
        </div>`;
    });
  });
  container.innerHTML = html;
}

/* ── FETCH & REFRESH ── */
async function refreshData(){
  const icon = document.getElementById('refresh-icon');
  if(icon) icon.style.animation = 'ro .6s linear infinite';
  
  try {
    const res = await fetch(WORKER_URL + '?t=' + Date.now());
    const data = await res.json();
    
    allNews = data.news || [];
    bseNews = data.bse || [];
    
    renderIndices(data.indices || []);
    updateCounts();
    renderNews();
    
    const upd = data.updatedAt ? fmtTime(data.updatedAt) : fmtTime(new Date());
    document.getElementById('update-time').textContent = 'Live Feed: ' + upd;
  } catch(e) { 
    console.error("Fetch error", e); 
  }
  
  if(icon) icon.style.animation = '';
}

// Start
refreshData();
setInterval(refreshData, 300000); // Auto refresh 5 mins
</script>
</body>
</html>
