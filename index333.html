<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://fnohub-portal.pages.dev/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    window.location.replace("https://fnohub-portal.pages.dev/");
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 15px;
      color: #888;
      letter-spacing: 0.05em;
    }
    a {
      color: #00d4ff;
      text-decoration: none;
      font-size: 13px;
      display: block;
      margin-top: 12px;
      opacity: 0.7;
    }
    a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Redirecting...</p>
    <a href="https://fnohub-portal.pages.dev/">Click here if not redirected</a>
  </div>
</body>
</html>
